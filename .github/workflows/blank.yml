        local function getOptionalService(name)
            return safeCall(function()
                return game:GetService(name)
            end, nil)
        end

        local function addRoot(key, name, root, scanOwnership)
            if CONFIG.SCAN_ROOTS[key] and root then
                nextRequestId += 1
                roots[#roots + 1] = {
                    Key = key,
                    Name = name,
