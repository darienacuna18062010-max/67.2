        addRoot("Lighting", "Lighting", Lighting, false)

        if CONFIG.SCAN_PLAYER_CLIENT_CONTAINERS and LocalPlayer then
            if CONFIG.SCAN_ROOTS.PlayerGui then
                local PlayerGui = safeCall(function()
                    return LocalPlayer:FindFirstChildOfClass("PlayerGui")
                end, nil)
                addRoot("PlayerGui", "PlayerGui", PlayerGui, false)
            end

            if CONFIG.SCAN_ROOTS.PlayerScripts or CONFIG.SCAN_ROOTS.PlayerScriptsWaitForChild then
