    local function inspectNetworkOwnership(instance)
        local capability = report.Environment.NetworkOwnership.Capability

        if not CONFIG.SCAN_NETWORK_OWNERSHIP then
            capability.State =
                CONFIG.DATA_PROFILE == "MINIMAL"
                and "disabled_by_profile"
                or "disabled_by_config"
            capability.Reason =
                CONFIG.DATA_PROFILE == "MINIMAL"
                and "SCAN_NETWORK_OWNERSHIP disabled by MINIMAL profile"
                or "SCAN_NETWORK_OWNERSHIP set to false in CONFIG"
            return
        end

        if not LocalPlayer then
            capability.State = "disabled"
            capability.Reason = "LocalPlayer unavailable"
            return
        end

        if report.Metadata.Performance.OutputBudgetExceeded then
            capability.State = "disabled"
            capability.Reason = "report_bytes_budget"
            return
        end

        local isBasePart = safeCall(function() return instance:IsA("BasePart") end, false)
        if not isBasePart then
            return
        end

        if capability.CircuitOpen then
            return
        end

        capability.Attempted = true
        capability.State = "probing"

        if #report.Environment.NetworkOwnership.Parts >= CONFIG.MAX_NETWORK_OWNED then
            recordDrop("NetworkOwned", "limit_reached")
            capability.State = "usable"
            return
        end

        local owner
        local ok, err = pcall(function()
            owner = instance:GetNetworkOwner()
        end)

        if not ok then
            capability.Failed += 1
            capability.ConsecutiveFailures += 1
            capability.Supported = capability.Succeeded > 0
            capability.State = "probe_failed"
            capability.Reason =
                "GetNetworkOwner failed: " .. redactError(err)

            if capability.ConsecutiveFailures
                >= capability.FailureThreshold
            then
                capability.CircuitOpen = true
                capability.State = "circuit_open"
                capability.Reason =
                    "consecutive GetNetworkOwner failures reached threshold"
            end

            return
        end

        capability.Succeeded += 1
        capability.ConsecutiveFailures = 0
        capability.CircuitOpen = false
        capability.Supported = true
        capability.State = "usable"
        capability.Reason = nil

        if owner ~= LocalPlayer then
            return
        end

        local anchored = safeCall(function() return instance.Anchored end, nil)
        if anchored == false then
            clientOwnedUnanchoredCandidates[instance] = true
        end

        local path = getInstancePath(instance)
        if append(report.Environment.NetworkOwnership.Parts, {
            Name = reportText(instance.Name),
            Class = instance.ClassName,
            Path = reportText(path),
        }, CONFIG.MAX_NETWORK_OWNED) then
            report.Metadata.Truncation.NetworkOwned.Stored =
                #report.Environment.NetworkOwnership.Parts
        else
            recordDrop("NetworkOwned", "limit_reached")
        end
    end

    local scannedInstanceCount = 0
    seenInstances = setmetatable({}, { __mode = "k" })

    local function shouldSkipCoreGuiInstance(instance)
        if currentScanRoot ~= "CoreGui"
            or not CONFIG.SKIP_EXECUTOR_COREUI
            or executorName == "Unknown"
        then
            return false
        end

        local executorToken =
            string.lower(tostring(executorName)):gsub("[^%w]+", "")

        if executorToken == "" or #executorToken < 3 then
            return false
        end

        local normalizedName =
            string.lower(tostring(instance.Name)):gsub("[^%w]+", "")

        return normalizedName:find(executorToken, 1, true) ~= nil
    end

    local activeInstanceAtomicDeadline = nil
    local toolInventoryMembership = setmetatable({}, { __mode = "k" })

    local function instanceAtomicBudgetExceeded(now)
        if activeInstanceAtomicDeadline == nil then
            return false
        end
        local current = now or os.clock()
        return current >= activeInstanceAtomicDeadline
    end

    local function markInstanceAtomicBudgetAbort(rootState)
        if not rootState then
            return
        end
        rootState.stopReason = rootState.stopReason or "instance_atomic_budget"
        report.Metadata.Truncation.TraversalInstances.Reason =
            report.Metadata.Truncation.TraversalInstances.Reason or "instance_atomic_budget"
        report.Metadata.Completeness.AbortedByAtomicBudget = true
    end

    local function recordInventoryTool(instance, path)
        if toolInventoryMembership[instance] then return end
        if #report.Instances.Tools >= CONFIG.MAX_TOOLS then
            recordDrop("Tools", "limit_reached")
