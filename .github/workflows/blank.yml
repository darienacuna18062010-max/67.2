            (report.Metadata.PhaseDurations.Compaction or 0)
            + (os.clock() - compactionStart)

        return false, nil
    end

    local function computeSchemaFingerprint()
        if schemaFingerprintCache ~= nil then
            return schemaFingerprintCache
        end
        local parts = {}

        local function walk(path, value, depth)
            if depth > CONFIG.SCHEMA_FINGERPRINT_MAX_DEPTH or type(value) ~= "table" then
                return
            end

            local keys = {}
            for key in pairs(value) do
                if type(key) == "string" then
                    keys[#keys + 1] = key
                end
            end

            table.sort(keys)
            for _, key in ipairs(keys) do
                local childPath = path .. "." .. key
                parts[#parts + 1] = childPath
                walk(childPath, value[key], depth + 1)
            end
        end

        walk("report", report, 0)
        schemaFingerprintCache = hash32(table.concat(parts, "|"))
        return schemaFingerprintCache
    end

    local function canonicalIntegrityEncode(value, depth, visited)
        depth = depth or 0
        visited = visited or {}

        if depth > CONFIG.INTEGRITY_MAX_DEPTH then
            return "<depth-limit>"
        end

        local valueType = type(value)

        if value == nil then
            return "n;"
        elseif valueType == "string" then
            local escaped = value
                :gsub("\\", "\\\\")
                :gsub("|", "\\p")
                :gsub("=", "\\e")
                :gsub(";", "\\s")
                :gsub("%[", "\\[")
                :gsub("%]", "\\]")
            return "s" .. tostring(#escaped) .. ":" .. escaped .. ";"
        elseif valueType == "number" then
            return "d" .. tostring(value) .. ";"
        elseif valueType == "boolean" then
            return value and "b1;" or "b0;"
        elseif valueType ~= "table" then
            return valueType .. ":" .. tostring(value) .. ";"
        end

        if visited[value] then
            return "<cycle>"
        end
        visited[value] = true

        local count = 0
        local isDenseArray = true
        for key in pairs(value) do
            if type(key) ~= "number" or key % 1 ~= 0 or key < 1 then
                isDenseArray = false
                break
            end
            count += 1
        end

        if isDenseArray and count > 0 then
            for i = 1, count do
                if value[i] == nil then
                    isDenseArray = false
                    break
                end
            end
        end

        if isDenseArray and count > 0 then
            local out = {"a["}
            for i = 1, count do
                out[#out + 1] = canonicalIntegrityEncode(
                    value[i],
                    depth + 1,
                    visited
                )
            end
            out[#out + 1] = "];"
            visited[value] = nil
            return table.concat(out)
        end

        local keys = {}
        for key in pairs(value) do
            keys[#keys + 1] = key
        end

        table.sort(keys, function(a, b)
            local ta, tb = type(a), type(b)
            if ta ~= tb then
                return ta < tb
            end
            if ta == "number" then
                return a < b
            end
            return tostring(a) < tostring(b)
        end)

        -- Map presence is represented by an emitted key/value pair. A present
        -- nil value is encoded as `n;`; an absent key is simply not emitted.
        -- This is intentional and avoids inventing a second "absent" value kind.
        local out = {"m{"}
        for _, key in ipairs(keys) do
            out[#out + 1] = canonicalIntegrityEncode(key, depth + 1, visited)
            out[#out + 1] = "="
            out[#out + 1] = canonicalIntegrityEncode(
                value[key],
                depth + 1,
                visited
            )
        end
        out[#out + 1] = "};"
        visited[value] = nil
        return table.concat(out)
    end

    local integrityExclusionDepth = 0

    local function withIntegrityExclusions(callback)
        -- pcall() captures callback errors and the saved fields are restored on both
        -- success and failure, preserving the report even when canonicalization fails.
        if integrityExclusionDepth > 0 then
            return pcall(callback)
        end
        integrityExclusionDepth += 1

        local metadata = report.Metadata
        local integrity = metadata and metadata.Integrity
        local output = metadata and metadata.Output
        local reportBytes = metadata
            and metadata.Truncation
            and metadata.Truncation.ReportBytes

        local savedIntegrity = integrity
        local savedActualBytes = output and output.ActualBytes or nil
        local savedWithinLimit = output and output.WithinLimit or nil
        local savedSizeConvergencePass = output and output.SizeConvergencePass or nil
        local savedSizeSelfConsistent = output and output.SizeSelfConsistent or nil
        local savedSizeHistory = output and output.SizeHistory or nil
        local savedEstimatedBytes = output and output.EstimatedBytes or nil
        local savedEstimatePhase = output and output.EstimatePhase or nil
        local savedLimitBytes = output and output.LimitBytes or nil
        local savedCompacted = output and output.Compacted or nil
        local savedEmergencyCompaction = output and output.EmergencyCompaction or nil
        local savedStored = reportBytes and reportBytes.Stored or nil

        if integrity then metadata.Integrity = nil end
        if output then
            output.ActualBytes = nil
            output.WithinLimit = nil
            output.SizeConvergencePass = nil
            output.SizeSelfConsistent = nil
            output.SizeHistory = nil
            output.EstimatedBytes = nil
            output.EstimatePhase = nil
            output.LimitBytes = nil
            output.Compacted = nil
            output.EmergencyCompaction = nil
        end
        if reportBytes then
            reportBytes.Stored = nil
        end

        local ok, result = pcall(callback)

        if metadata then metadata.Integrity = savedIntegrity end
        if output then
            output.ActualBytes = savedActualBytes
            output.WithinLimit = savedWithinLimit
            output.SizeConvergencePass = savedSizeConvergencePass
            output.SizeSelfConsistent = savedSizeSelfConsistent
            output.SizeHistory = savedSizeHistory
            output.EstimatedBytes = savedEstimatedBytes
            output.EstimatePhase = savedEstimatePhase
            output.LimitBytes = savedLimitBytes
            output.Compacted = savedCompacted
            output.EmergencyCompaction = savedEmergencyCompaction
        end
        if reportBytes then
            reportBytes.Stored = savedStored
        end

        integrityExclusionDepth = math.max(0, integrityExclusionDepth - 1)
        return ok, result
    end

    local function getIntegrityPayload()
        if cachedIntegrityPayload ~= nil then
            return cachedIntegrityPayload
        end

        local ok, payload = withIntegrityExclusions(function()
            return canonicalIntegrityEncode(report)
        end)

        if ok and type(payload) == "string" then
            cachedIntegrityPayload = payload
        end

        return cachedIntegrityPayload
    end

    local function computeReportIntegrity()
        if not CONFIG.OUTPUT_INTEGRITY then
            report.Metadata.Integrity.Enabled = false
            report.Metadata.Integrity.DigestPresent = false
            report.Metadata.Integrity.IsCryptographic = false
            report.Metadata.Integrity.SecurityLevel = "NONE"
            report.Metadata.Integrity.Status = "disabled"
            report.Metadata.Integrity.Provider = nil
            report.Metadata.Integrity.InvocationMode = nil
            return
        end

        local integrity = report.Metadata.Integrity
        if not integrity then
            return
        end

        local payload = getIntegrityPayload()

        if type(payload) ~= "string" then
            integrity.Enabled = false
            integrity.IsCryptographic = false
            integrity.SecurityLevel = "NONE"
            integrity.Status = "snapshot_encode_failed"
            integrity.Provider = nil
            integrity.InvocationMode = nil
            return
        end

        local provider = resolvePreferredHashProvider()
        if provider and provider.Usable then
            local digestOk, digest
            if provider.InvocationMode == "bound" then
                digestOk, digest = pcall(provider.Fn, payload, "sha256")
            elseif provider.InvocationMode == "owner" then
                digestOk, digest = pcall(provider.Fn, provider.Owner, payload, "sha256")
            end

            local normalized = digestOk and normalizeSha256Digest(digest) or nil
            if digestOk and type(digest) == "string" and digest ~= "" then
                integrity.Enabled = true
                integrity.DigestPresent = true
                integrity.Algorithm = normalized and "sha256" or "provider_digest"
                integrity.IsCryptographic = normalized ~= nil
                integrity.SecurityLevel = normalized and "CRYPTOGRAPHIC" or "NON_CRYPTOGRAPHIC_FALLBACK"
                integrity.Digest = digest
                integrity.Status = normalized and "verified" or "verified_provider_consistent"
                integrity.Provider = provider.Name
                integrity.InvocationMode = provider.InvocationMode
                integrity.ProviderProbeStatus = provider.Status
                integrity.ActualProvider = provider.Name
                integrity.ActualIsCryptographic = integrity.IsCryptographic
                integrity.ProviderResolutionAttempts = HASH_PROVIDER_CACHE.ResolutionAttempts
                return
            end
        end

        integrity.Enabled = true
        integrity.DigestPresent = true
        integrity.Algorithm = "hash32"
        integrity.IsCryptographic = false
        integrity.SecurityLevel = "NON_CRYPTOGRAPHIC_FALLBACK"
        integrity.Digest = hash32(payload)
        integrity.Status = provider
            and (provider.Status == "ambiguous"
                and "provider_ambiguous_fallback"
                or "provider_unverified_fallback")
            or "best_effort"
        integrity.Provider = provider and provider.Name or nil
        integrity.InvocationMode = provider and provider.InvocationMode or nil
        integrity.ProviderProbeStatus = provider and provider.Status or "unavailable"
        integrity.ProviderResolutionAttempts = HASH_PROVIDER_CACHE.ResolutionAttempts
        integrity.ActualProvider = provider and provider.Name or nil
        integrity.ActualIsCryptographic = false
    end

    local function reconcileWeakIntegritySessionStatus()
        if report.Metadata.SessionStatus == "COMPLETED" and report.Metadata.Integrity and report.Metadata.Integrity.IsCryptographic ~= true then
            report.Metadata.SessionStatus = "COMPLETED_WITH_WEAK_INTEGRITY"
            if report.Metadata.AuditCompleteness == "COMPLETE" then report.Metadata.AuditCompleteness = "COMPLETE_WITH_WEAK_INTEGRITY" end
        end
    end

    local function validateCoreReportContract()
        local failures = {}
        local function requireType(path, value, expected)
            if type(value) ~= expected then
                failures[#failures + 1] = path .. ":expected_" .. expected
            end
        end
        requireType("Metadata", report.Metadata, "table")
        requireType("Metadata.AuditorVersion", report.Metadata.AuditorVersion, "string")
        requireType("Metadata.ReportFormat", report.Metadata.ReportFormat, "number")
        requireType("Metadata.SessionId", report.Metadata.SessionId, "string")
        requireType("Metadata.AuditSessionId", report.Metadata.AuditSessionId, "string")
        requireType("Metadata.PhaseContracts", report.Metadata.PhaseContracts, "table")
        requireType("Metadata.Capabilities", report.Metadata.Capabilities, "table")
        requireType("Metadata.Preflight", report.Metadata.Preflight, "table")
        requireType("Metadata.CleanupJournal", report.Metadata.CleanupJournal, "table")
        requireType("Metadata.CoverageDenominators", report.Metadata.CoverageDenominators, "table")
        requireType("Metadata.Unknowns", report.Metadata.Unknowns, "table")
        requireType("Metadata.BlindSpots", report.Metadata.BlindSpots, "table")
        requireType("Summary", report.Summary, "table")
        requireType("Network", report.Network, "table")
        requireType("Instances", report.Instances, "table")
        requireType("Scripts", report.Scripts, "table")
        requireType("VM", report.VM, "table")
        local ok = #failures == 0
        report.Metadata.SchemaContractValidation = {
            Status = ok and "PASS" or "FAILED",
            Failures = failures,
            CheckedAtClock = os.clock(),
        }
        return ok, failures
    end

    local function publishReportWithIntegrity()
        local schemaOk, schemaFailures = validateCoreReportContract()
        if not schemaOk then
            report.Metadata.SessionStatus = "FAILED"
            report.Metadata.FailureReason = "report_schema_contract_failed"
            return false, nil
        end
        local integrityEncodeSeconds = 0
        report.Metadata = report.Metadata or {}
        report.Metadata.Truncation = report.Metadata.Truncation or {}
        report.Metadata.Truncation.ReportBytes =
            report.Metadata.Truncation.ReportBytes
            or initializeTruncation(CONFIG.MAX_REPORT_BYTES_ESTIMATE)

        -- First materialize Output/ReportBytes without a digest.
        local preflightOk, preflightJson = encodeReportWithStableSize()
        if not preflightOk or type(preflightJson) ~= "string" then
            return false, nil
        end

        -- Capture the schema fingerprint once after Output fields exist but before
        -- any byte-budget compaction. It describes the report shape constructed by
        -- the audit, not the reduced storage state used for publication.
        report.Metadata.SchemaFingerprint = computeSchemaFingerprint()
        report.Metadata.SchemaHash = hash32(
            tostring(report.Metadata.SchemaContract or "")
                .. "|" .. tostring(report.Metadata.SchemaVersion or "")
                .. "|" .. tostring(report.Metadata.SchemaContractRevision or "")
        )

        local digestStart = os.clock()
        computeReportIntegrity()
        reconcileWeakIntegritySessionStatus()
        integrityEncodeSeconds += os.clock() - digestStart

        local ok, json = encodeReportWithStableSize()

        -- Digest bytes count against the same hard limit. Compact, then rebuild the
        -- fingerprint/digest pair so the final report is self-consistent.
        if ok and #json > CONFIG.MAX_REPORT_BYTES_ESTIMATE then
            report.Metadata.Integrity.Digest = nil
            report.Metadata.Integrity.Algorithm = nil
            report.Metadata.Integrity.Status = "pending_before_compaction"

            local compactedOk, compactedJson = compactReportForOutput()
            if not compactedOk or type(compactedJson) ~= "string" then
                report.Metadata.Integrity.Status = "budget_failure"
                report.Metadata.Integrity.IsCryptographic = false
                report.Metadata.Integrity.SecurityLevel = "NONE"
                report.Metadata.Integrity.Digest = nil
                report.Metadata.Integrity.Algorithm = nil
                report.Metadata.Integrity.Enabled = false
                report.Metadata.Performance.StopReason =
                    report.Metadata.Performance.StopReason or "report_bytes_budget"
                return false, nil
            end

            report.Metadata.Integrity.Digest = nil
            report.Metadata.Integrity.Algorithm = nil
            report.Metadata.Integrity.Status = "pending"

            local compactPreflightOk, compactPreflightJson =
                encodeReportWithStableSize()
            if not compactPreflightOk or type(compactPreflightJson) ~= "string" then
                report.Metadata.Integrity.Status = "compaction_preflight_failed"
                report.Metadata.Integrity.Enabled = false
                report.Metadata.Integrity.IsCryptographic = false
                report.Metadata.Integrity.SecurityLevel = "NONE"
                report.Metadata.Integrity.Digest = nil
                report.Metadata.Integrity.Algorithm = nil
                return false, nil
            end

            cachedIntegrityPayload = nil
            schemaFingerprintCache = nil
            report.Metadata.SchemaFingerprint = computeSchemaFingerprint()
            report.Metadata.SchemaFingerprintBasis = "post_report_level_application_post_compaction"
            report.Metadata.SchemaHash = hash32(
                tostring(report.Metadata.SchemaContract or "")
                    .. "|" .. tostring(report.Metadata.SchemaVersion or "")
                    .. "|" .. tostring(report.Metadata.SchemaContractRevision or "")
            )

            local compactDigestStart = os.clock()
            computeReportIntegrity()
            reconcileWeakIntegritySessionStatus()
            integrityEncodeSeconds += os.clock() - compactDigestStart

            ok, json = encodeReportWithStableSize()
        end

        if not ok or type(json) ~= "string" then
            report.Metadata.Integrity.Enabled = false
            report.Metadata.Integrity.IsCryptographic = false
            report.Metadata.Integrity.SecurityLevel = "NONE"
            report.Metadata.Integrity.Status = "final_encode_failed"
            return false, nil
        end

        -- Output.ActualBytes and ReportBytes.Stored are excluded from the integrity
        -- scope, so final size stabilization does not invalidate the digest.
        report.Metadata.Output = report.Metadata.Output or {}
        report.Metadata.Output.ActualBytes = #json
        report.Metadata.Output.LimitBytes = CONFIG.MAX_REPORT_BYTES_ESTIMATE
        report.Metadata.Output.WithinLimit = #json <= CONFIG.MAX_REPORT_BYTES_ESTIMATE
        report.Metadata.Truncation.ReportBytes.Stored = #json

        local finalOk, finalJson = encodeReportWithStableSize()
        if not finalOk or type(finalJson) ~= "string" then
            report.Metadata.Integrity.Enabled = false
            report.Metadata.Integrity.IsCryptographic = false
            report.Metadata.Integrity.SecurityLevel = "NONE"
            report.Metadata.Integrity.Status = "final_stabilization_failed"
            return false, nil
        end

        if #finalJson > CONFIG.MAX_REPORT_BYTES_ESTIMATE then
            report.Metadata.Integrity.Digest = nil
            report.Metadata.Integrity.Algorithm = nil
            report.Metadata.Integrity.Enabled = false
            report.Metadata.Integrity.IsCryptographic = false
            report.Metadata.Integrity.SecurityLevel = "NONE"
            report.Metadata.Integrity.Status = "disabled_by_final_byte_contract"
            report.Metadata.Performance.OutputBudgetExceeded = true
            report.Metadata.Performance.StopReason =
                report.Metadata.Performance.StopReason or "report_bytes_budget"

            -- Graceful degradation: removing the digest can itself bring the report
            -- back under the hard byte contract. Re-encode before declaring failure.
            local fallbackOk, fallbackJson = encodeReportWithStableSize()
            if fallbackOk and type(fallbackJson) == "string"
                and #fallbackJson <= CONFIG.MAX_REPORT_BYTES_ESTIMATE
            then
                report.Metadata.Output.ActualBytes = #fallbackJson
                report.Metadata.Truncation.ReportBytes.Stored = #fallbackJson
                report.Metadata.PhaseDurations.IntegrityEncode =
                    integrityEncodeSeconds
                reconcileWeakIntegritySessionStatus()
                return true, fallbackJson
            end

            report.Metadata.PhaseDurations.IntegrityEncode =
                integrityEncodeSeconds
            return false, nil
        end

        report.Metadata.PhaseDurations.IntegrityEncode =
            integrityEncodeSeconds

        reconcileWeakIntegritySessionStatus()
        return true, finalJson
    end

    --------------------------------------------------------------------
    -- JSON EXPORT
    --------------------------------------------------------------------

    if auditWallExceeded() and not report.Metadata.Performance.StopReason then
        report.Metadata.Performance.StopReason = "wall_time_before_json"
    end

    report.Metadata.Performance.AuditWallMs =
        math.max(0, auditWallElapsedSeconds() * 1000)

    local jsonEncodeStart = os.clock()
    profilerBegin("DCA/JSONEncode")

    report.Metadata.Truncation.SanitizationDepthLimit.Dropped = sanitizationDepthLimitDropped
    report.Metadata.Truncation.SanitizationDepthLimit.Reason =
        sanitizationDepthLimitDropped > 0 and "sanitization_depth_limit" or nil

    setPhaseContractStatus("JSONEncode", "pending")
    local ok, json = publishReportWithIntegrity()

    setPhaseContractStatus("Compaction", report.Metadata.Output and report.Metadata.Output.Compacted
        and "complete" or "skipped_not_needed")
    setPhaseContractStatus("IntegrityEncode", ok and "complete" or "failed")
    setPhaseContractStatus("JSONEncode", ok and "complete" or "failed")
    setPhaseContractStatus("Output", ok and "complete" or "failed")

    profilerEnd()
    report.Metadata.PhaseDurations.JSONEncode = os.clock() - jsonEncodeStart

    if not ok or type(json) ~= "string" then
        report.Metadata.Completed = false
        report.Metadata.Performance.StopReason =
            report.Metadata.Performance.StopReason or "json_encode_or_byte_contract_failed"
        notify(
            "Auditor error",
            "No se pudo producir un reporte JSON dentro del límite contractual."
        )

        warn("[Deep Client Auditor] JSON export failed or exceeded byte contract.")
        return
    end

    if #json > CONFIG.MAX_REPORT_BYTES_ESTIMATE then
        -- Defensive check: never write an oversized artifact.
        notify(
            "Auditor error",
            "El reporte superó el límite de bytes y no será escrito."
        )
        warn("[Deep Client Auditor] Refusing to write oversized JSON report.")
        return
    end

    local function buildCorrelationAsciiMap()
        local lines = {}
        for _, finding in ipairs(report.Network.CorrelationEngine.Findings or {}) do
            local details = finding.Details or finding
            local fromName = details.FromRemoteName or details.RemoteChain or details.UIId or "source"
            local toName = details.ToRemoteName or details.RemoteName or details.EndpointId or "target"
            lines[#lines + 1] = string.format("[%s] -> [%s]  (%s)", reportText(fromName), reportText(toName), tostring(finding.Type or "correlation"))
            if #lines >= 50 then break end
        end
        if #lines == 0 then lines[1] = "(no temporal correlations observed)" end
        return table.concat(lines, "\n")
    end

    local function escapeMarkdown(value)
        return tostring(value or "")
            :gsub("\\", "\\\\")
            :gsub("|", "\\|")
            :gsub("#", "\\#")
            :gsub("`", "\\`")
            :gsub("%*", "\\*")
            :gsub("_", "\\_")
            :gsub("<", "\\<")
            :gsub(">", "\\>")
            :gsub("~", "\\~")
    end

    local function buildMarkdownExecutiveSummary()
        local summary = report.Summary or {}
        local lines = {
            "# DeepClientAuditor " .. escapeMarkdown(AUDITOR_VERSION),
            "",
            "## Executive summary",
            "",
            "- ReportFormat: " .. escapeMarkdown(REPORT_FORMAT),
            "- SessionStatus: " .. escapeMarkdown(report.Metadata.SessionStatus),
            "- CleanupStatus: " .. escapeMarkdown(report.Metadata.CleanupStatus),
            "- AuditCompleteness: " .. escapeMarkdown(report.Metadata.AuditCompleteness),
            "- Output.ActualBytes: " .. escapeMarkdown(report.Metadata.Output and report.Metadata.Output.ActualBytes),
            "- OverallGameRiskScore: " .. escapeMarkdown(summary.OverallGameRiskScore or 0),
            "- DensityScore: " .. escapeMarkdown(summary.DensityScore or 0),
            "- CriticalityScore: " .. escapeMarkdown(summary.CriticalityScore or 0),
            "- Known fingerprint matches: " .. tostring((function() local n=0; for _,entry in ipairs(report.VM.ScriptAnalysis or {}) do if entry.KnownFingerprint and entry.KnownFingerprint.Match then n+=1 end end return n end)()),
            "",
            "## Top remotes", "",
        }
        for i, item in ipairs(report.RiskScorecard.TopRiskRemotes or {}) do
            if i > 3 then break end
            lines[#lines + 1] = string.format("%d. %s — Criticality %s / Score %s", i, escapeMarkdown(item.Name), tostring(item.CriticalityScore or 0), tostring(item.Score or 0))
        end
        lines[#lines + 1] = ""
        lines[#lines + 1] = "## Top scripts"
        lines[#lines + 1] = ""
        for i, item in ipairs(report.RiskScorecard.TopRiskScripts or {}) do
            if i > 3 then break end
            lines[#lines + 1] = string.format("%d. %s — Criticality %s / Score %s", i, escapeMarkdown(item.Path), tostring(item.CriticalityScore or 0), tostring(item.Score or 0))
        end
        lines[#lines + 1] = ""
        lines[#lines + 1] = "## Self-tests"
        lines[#lines + 1] = ""
        local rawSelfTests = report.Metadata.SelfTests or report.Metadata.RedactionSelfTestResult or {}
        local rawCases = rawSelfTests.Cases
        local cases = type(rawCases) == "number" and rawCases or (type(rawCases) == "table" and #rawCases or (rawSelfTests.Passed or 0))
        local rawTotalCases = rawSelfTests.TotalCases
        local totalCases = type(rawTotalCases) == "number" and rawTotalCases
            or (type(rawCases) == "table" and #rawCases or ((rawSelfTests.Passed or 0) + (rawSelfTests.Failed or 0)))
        local selfTests = {
            Status = rawSelfTests.Status or ((rawSelfTests.Failed or 0) == 0 and "pass" or "fail"),
            Cases = cases,
            TotalCases = totalCases,
        }
        lines[#lines + 1] = "- Status: " .. escapeMarkdown(selfTests.Status)
        lines[#lines + 1] = "- Cases: " .. escapeMarkdown(selfTests.Cases)
        lines[#lines + 1] = "- TotalCases: " .. escapeMarkdown(selfTests.TotalCases)
        lines[#lines + 1] = ""
        lines[#lines + 1] = "## Correlation map"
        lines[#lines + 1] = ""
        lines[#lines + 1] = "```text"
        lines[#lines + 1] = buildCorrelationAsciiMap()
        lines[#lines + 1] = "```"
        lines[#lines + 1] = ""
        lines[#lines + 1] = "## Server validation required"
        lines[#lines + 1] = ""
        for kind, check in pairs(report.Metadata.ServerValidationChecklist or {}) do
            local checkText = type(check) == "table" and table.concat(check, ", ") or tostring(check)
            lines[#lines + 1] = "- **" .. escapeMarkdown(kind) .. "**: " .. escapeMarkdown(checkText)
        end
        return table.concat(lines, "\n")
    end

    local function writeMarkdownExecutiveSummary(savedJsonPath)
        if not CONFIG.GENERATE_MARKDOWN_REPORT or not WRITE_FILE then return nil end
        local md = buildMarkdownExecutiveSummary()
        local mdPath = savedJsonPath and savedJsonPath:gsub("%.json$", ".md") or (FILE_NAME:gsub("%.json$", ".md"))
        local ok, err = pcall(function() WRITE_FILE(mdPath, md) end)
        if ok then return mdPath end
        report.Metadata.MarkdownOutput = {
            Status = "write_failed",
            Error = reportText(tostring(err)),
            Path = mdPath,
        }
        warn("[Deep Client Auditor] Markdown write failed: " .. redactError(err))
        return nil
    end


