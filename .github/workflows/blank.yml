    local function runInternalTestSuite()
        local results = { Passed = 0, Failed = 0, Cases = {}, Status = "PASS" }
        local maxCases = CONFIG.SELF_TEST_MAX_CASES or 512
        local function assertEqual(actual, expected, label)
            local ok = actual == expected
            if #results.Cases >= maxCases then
                return false
            end
            results.Cases[#results.Cases + 1] = { Label = label, Passed = ok }
            if ok then results.Passed += 1 else results.Failed += 1 end
            return ok
        end
        local function assertContains(list, value, label)
            local found = false
            for _, item in ipairs(list or {}) do if item == value then found = true; break end end
            return assertEqual(found, true, label)
        end
        local function assertNotContains(list, value, label)
            local found = false
            for _, item in ipairs(list or {}) do if item == value then found = true; break end end
            return assertEqual(found, false, label)
        end
        local redaction = runRedactionSelfTests()
        assertEqual(redaction.Status, "PASS", "redaction_self_tests")
        assertEqual(classifyScriptString("AdminCommand", {}), "admin_command", "camel_admin")
        assertEqual(classifyScriptString("admin_command", {}), "admin_command", "snake_admin")
        assertEqual(classifyScriptString("admin-command", {}), "admin_command", "kebab_admin")
        assertNotContains({classifyScriptString("administrator", {})}, "admin_command", "administrator_negative")
        assertEqual(classifyScriptString("api_key", {}), "key_like", "api_key")
        assertEqual(classifyScriptString("api-key", {}), "key_like", "api-key")
        assertEqual(classifyScriptString("api.key", {}), "key_like", "api.key")
        assertEqual(hash32("stable"), hash32("stable"), "hash_determinism")
        assertEqual(hash32("stable") ~= hash32("stable2"), true, "hash_change")
        assertEqual(report.Metadata.Truncation.RemoteCallbackFindings ~= nil, true, "callback_truncation_contract")
        assertEqual(report.Metadata.Truncation.CorrelationFindings ~= nil, true, "correlation_truncation_contract")
        if type(parseLuauSerializedBytecode) == "function" then
            local bad = parseLuauSerializedBytecode("\255")
            assertEqual(bad.Status == "partial_or_invalid" or bad.Status == "invalid" or bad.Status == "rejected", true, "bytecode_invalid_blob")
        end
        results.Status = results.Failed == 0 and "PASS" or "FAILED"
        return results
    end

