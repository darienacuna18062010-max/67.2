    if CONFIG.IMPACT_POLICY ~= "TEMPORARY_HOOK"
        and CONFIG.IMPACT_POLICY ~= "AUTHORIZED_ACTIVE_TEST"
        and CONFIG.IMPACT_POLICY ~= "SERVER_VALIDATED_TEST"
