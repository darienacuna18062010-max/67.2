    local function detectMobileRuntime()
        local signals = {}
        local executorLower = string.lower(executorName or "")
        local touchEnabled = safeCall(function() return UserInputService.TouchEnabled end, false)
        local mouseEnabled = safeCall(function() return UserInputService.MouseEnabled end, false)
        local keyboardEnabled = safeCall(function() return UserInputService.KeyboardEnabled end, false)

        if executorLower:find("android", 1, true)
            or executorLower:find("ios", 1, true)
            or executorLower:find("mobile", 1, true)
        then
            signals[#signals + 1] = "executor_mobile_label"
        end

        if executorLower:find("delta", 1, true) and touchEnabled then
            signals[#signals + 1] = "delta_plus_touch"
        end

        if touchEnabled and not mouseEnabled and not keyboardEnabled then
            signals[#signals + 1] = "touch_only_input"
        elseif touchEnabled and not keyboardEnabled then
            signals[#signals + 1] = "touch_without_keyboard"
        end

        local isMobile = #signals > 0
        local confidence = #signals >= 2 and "high" or (#signals == 1 and "medium" or "low")
        local executionClass = isMobile and "MOBILE_OR_EMULATED" or "DESKTOP_OR_UNKNOWN"
        if #signals == 0 then
            executionClass = "DESKTOP_OR_UNKNOWN"
        end
        return {
            IsMobile = isMobile,
            ExecutionClass = executionClass,
            Confidence = confidence,
            Signals = signals,
            Executor = executorName,
            ExecutorVersion = executorVersion,
            TouchEnabled = touchEnabled,
            MouseEnabled = mouseEnabled,
            KeyboardEnabled = keyboardEnabled,
        }
    end

    local runtimePlatform = detectMobileRuntime()
    local appliedPerformancePreset = "NONE"

    local function applyPerformancePreset(name, source)
        local preset = PERFORMANCE_PRESETS[name]
        if not preset then
            return false
        end
        for key, value in pairs(preset) do
            CONFIG[key] = value
        end
        appliedPerformancePreset = name
        recordConfigCorrection(
            "PERFORMANCE_PRESET",
            source or CONFIG.PERFORMANCE_PRESET,
            name,
            "runtime-aware performance preset applied"
        )
        return true
    end

    if CONFIG.LIGHT_MODE then
        applyPerformancePreset("LIGHT", "LIGHT_MODE")
    elseif CONFIG.PERFORMANCE_PRESET == "DEEP_SAFE_MOBILE" then
        applyPerformancePreset("DEEP_SAFE_MOBILE", "explicit")
    elseif CONFIG.PERFORMANCE_PRESET == "MOBILE_SAFE" then
        applyPerformancePreset("MOBILE_SAFE", "explicit")
    elseif CONFIG.PERFORMANCE_PRESET == "DESKTOP_SAFE" then
        applyPerformancePreset("DESKTOP_SAFE", "explicit")
    elseif CONFIG.AUTO_TUNE_PERFORMANCE and CONFIG.PERFORMANCE_PRESET == "AUTO" then
        if runtimePlatform.IsMobile then
            applyPerformancePreset("MOBILE_SAFE", "AUTO/mobile_detection")
        else
            applyPerformancePreset("DESKTOP_SAFE", "AUTO/desktop_default")
            if CONFIG.PERFORMANCE_PROFILE == "MINIMAL" then
                CONFIG.GC_MODE = "SAMPLED"
