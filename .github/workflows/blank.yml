        if CONFIG.SCAN_ROOTS.SoundService then
            addRoot("SoundService", "SoundService", getOptionalService("SoundService"), false)
        end

        if CONFIG.SCAN_ROOTS.Teams then
            addRoot("Teams", "Teams", getOptionalService("Teams"), false)
        end

        if CONFIG.SCAN_ROOTS.StarterPack then
            addRoot("StarterPack", "StarterPack", getOptionalService("StarterPack"), false)
        end

        if CONFIG.SCAN_ROOTS.Chat then
            addRoot("Chat", "Chat", getOptionalService("Chat"), false)
        end
        if CONFIG.SCAN_ROOTS.TestService and CONFIG.DATA_PROFILE == "DETAILED" then
            addRoot("TestService", "TestService", getOptionalService("TestService"), false)
        end
        if CONFIG.SCAN_ROOTS.CorePackages and CONFIG.DATA_PROFILE == "DETAILED" then
            addRoot("CorePackages", "CorePackages", getOptionalService("CorePackages"), false)
        end
        if CONFIG.SCAN_ROOTS.WorkspaceCamera then
            addRoot("WorkspaceCamera", "Workspace.CurrentCamera",
                safeCall(function() return Workspace.CurrentCamera end, nil), false)
        end
        if CONFIG.SCAN_ROOTS.WorkspaceTerrain then
            addRoot("WorkspaceTerrain", "Workspace.Terrain",
                safeCall(function() return Workspace.Terrain end, nil), false)
        end

