    if CONFIG.EXPOSE_GLOBAL_REPORT
        and (CONFIG.DATA_PROFILE ~= "DETAILED" or CONFIG.ALLOW_GLOBAL_EXPOSURE_UNDER_AUTHORIZATION == true)
    then
        -- Keep only the latest explicit opt-in snapshot; diff history uses its own dedicated key.
        _G.DeepClientAuditReport = nil
        _G.DeepClientAuditJSON = nil
    end

    local auditOk, auditError = xpcall(function()
        if not preflightPassed then
            error("preflight_failed")
        end
        if schemaMismatchMessage and CONFIG.STRICT_SCHEMA_MATCH then
            if snifferState and snifferState.Active then
