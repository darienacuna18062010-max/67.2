    local passiveSnifferRestore = nil
    local dynamicRootRegistry = {}

    configureDynamicRootRegistry = function(entries)
        dynamicRootRegistry = {}
        for _, entry in ipairs(entries or {}) do
            if entry and entry.Root then
                local nested = false
                for _, existing in ipairs(dynamicRootRegistry) do
                    local isNested = safeCall(function()
                        return entry.Root:IsDescendantOf(existing.Root)
                    end, false)
                    if isNested or entry.Root == existing.Root then
                        nested = true
                        break
                    end
                end
                if not nested then
                    dynamicRootRegistry[#dynamicRootRegistry + 1] = {
                        Key = entry.Key,
                        Name = entry.Name,
                        Root = entry.Root,
                    }
                end
            end
        end
    end

    local dynamicRootResolutionCache = setmetatable({}, { __mode = "k" })

    local function resolveDynamicRoot(instance)
        if typeof(instance) ~= "Instance" then
            return "Unknown"
        end
        local cached = dynamicRootResolutionCache[instance]
        if cached ~= nil then
            return cached
        end
        local best = nil
        for _, entry in ipairs(dynamicRootRegistry) do
            local matches = instance == entry.Root
                or safeCall(function()
                    return instance:IsDescendantOf(entry.Root)
                end, false)
            if matches then
                if not best then
                    best = entry
                else
                    local bestIsDescendant = safeCall(function()
                        return best.Root:IsDescendantOf(entry.Root)
                    end, false)
                    if bestIsDescendant then
                        best = entry
                    end
                end
            end
        end
        local resolved = best and best.Name or "Unknown"
        dynamicRootResolutionCache[instance] = resolved
        return resolved
    end

    local function appendBoundedHistory(list, value, limit)
        if type(list) ~= "table" or value == nil then
            return
        end
        for _, existing in ipairs(list) do
            if existing == value then
                return
            end
        end
        if #list >= limit then
            table.remove(list, 1)
        end
        list[#list + 1] = value
    end

