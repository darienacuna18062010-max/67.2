            "temporary metatable hook requires IMPACT_POLICY=TEMPORARY_HOOK"
        )
        CONFIG.SNIFF_TRAFFIC = false
        CONFIG.SNIFFER_OBSERVE_ONLY = true
    end
    if CONFIG.IMPACT_POLICY ~= "READ_ONLY" and CONFIG.AUDIT_PROFILE ~= "DEEP_AUTHORIZED" then
        recordConfigCorrection("IMPACT_POLICY", CONFIG.IMPACT_POLICY, "READ_ONLY", "non-authorized profile cannot escalate impact")
        CONFIG.IMPACT_POLICY = "READ_ONLY"
        CONFIG.SNIFF_TRAFFIC = false
        CONFIG.SNIFFER_OBSERVE_ONLY = true
    end
    if CONFIG.AUDIT_PROFILE == "DEEP_AUTHORIZED"
