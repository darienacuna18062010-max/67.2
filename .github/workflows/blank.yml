    local function sampleHeapPeak(stage)
        if not COLLECT_GARBAGE then return end
        local ok, value = pcall(COLLECT_GARBAGE, "count")
        if ok and type(value) == "number" and report and report.Metadata and report.Metadata.Performance then
            report.Metadata.Performance.LuaHeapKBPeak = math.max(
                report.Metadata.Performance.LuaHeapKBPeak or value, value
            )
            report.Metadata.Performance.LuaHeapPeakStage = stage
        end
    end

    local function encodeReportWithStableSize()
        local previousOutput = report.Metadata.Output or {}
        local encoded = nil
        local size = nil
        report.Metadata.Output = report.Metadata.Output or {}
        report.Metadata.Output.SizeHistory = report.Metadata.Output.SizeHistory or {}
        local estimatePhase = previousOutput.Compacted == true and "post_compaction" or "pre_compaction"
        local stableEstimatedBytes = previousOutput.Compacted == true
            and estimateReportBytes(report)
            or report.Metadata.Performance.EstimatedOutputBytes

        for pass = 1, 4 do
            local ok, json = pcall(function()
                return HttpService:JSONEncode(report)
            end)
            if not ok or type(json) ~= "string" then
                if type(encoded) == "string" then
                    report.Metadata.Output.SizeSelfConsistent = false
                    return true, encoded
                end
                return false, nil
            end

            encoded = json
            size = #json
            local history = report.Metadata.Output.SizeHistory
            if #history < CONFIG.OUTPUT_SIZE_HISTORY_LIMIT then
                history[#history + 1] = size
            end
            sampleHeapPeak("JSONEncode_pass_" .. tostring(pass))
            local actualField = report.Metadata.Output and report.Metadata.Output.ActualBytes

            report.Metadata.Output = {
                EstimatedBytes = stableEstimatedBytes,
                EstimatePhase = estimatePhase,
                ActualBytes = size,
                LimitBytes = CONFIG.MAX_REPORT_BYTES_ESTIMATE,
                WithinLimit = size <= CONFIG.MAX_REPORT_BYTES_ESTIMATE,
                Compacted = previousOutput.Compacted == true,
                EmergencyCompaction = previousOutput.EmergencyCompaction == true,
                SizeConvergencePass = pass,
                SizeSelfConsistent = false,
                SizeHistory = history,
            }
            report.Metadata.Truncation.ReportBytes.Stored = size

            -- A final JSON is self-consistent only when the size encoded in the
            -- previous report state already equals the byte length that was just
            -- produced. One extra pass is cheap because the mutable size field is
            -- the only value intentionally changing here.
            if actualField == size then
                report.Metadata.Output.SizeSelfConsistent = true
                return true, encoded
            end
        end

        return type(encoded) == "string", encoded
    end
