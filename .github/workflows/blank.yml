            ContextActionBindCallsObserved = preservedCounts and preservedCounts.ContextActionBindCallsObserved or report.Network.ContextActionActivity.BindActionCalls or 0,
            ContextActionBindActionAtPriorityCallsObserved = preservedCounts and preservedCounts.ContextActionBindActionAtPriorityCallsObserved or report.Network.ContextActionActivity.BindActionAtPriorityCalls or 0,
            ContextActionUnbindCallsObserved = preservedCounts and preservedCounts.ContextActionUnbindCallsObserved or report.Network.ContextActionActivity.UnbindActionCalls or 0,
