    local function recordConfigCorrection(key, fromValue, toValue, reason)
        configurationDiagnostics.Status = "corrected"
        local fromType = type(fromValue)
        local safeFrom = fromValue
        if fromType ~= "number"
            and fromType ~= "string"
            and fromType ~= "boolean"
            and fromValue ~= nil
        then
            safeFrom = tostring(fromValue)
        end

        configurationDiagnostics.Corrections[#configurationDiagnostics.Corrections + 1] = {
            Key = key,
            From = safeFrom,
            To = toValue,
            Reason = reason,
        }
    end

    local function normalizePositiveInteger(key, value, fallback)
        local valid = type(value) == "number"
            and value == value
            and value < math.huge
            and value > 0
            and value == math.floor(value)

        if valid then
            return value
        end

        recordConfigCorrection(
            key,
            value,
            fallback,
            "must be a finite positive integer; fallback applied"
        )
        return fallback
    end

