    -- V4.41 operational policy normalization: no implicit escalation.
    local VALID_AUDIT_PROFILES = {
        SAFE_READ_ONLY = true,
        DEEP_AUTHORIZED = true,
        DEEP_SAFE_MOBILE = true,
    }
    local VALID_IMPACT_POLICIES = {
        READ_ONLY = true,
        OBSERVE_ONLY = true,
        TEMPORARY_HOOK = true,
        AUTHORIZED_ACTIVE_TEST = true,
        SERVER_VALIDATED_TEST = true,
