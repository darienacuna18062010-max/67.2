    local function markCapabilityProbe(name, ok, reason, probeKind)
        local capability = report.Metadata.Capabilities[name]
        if not capability then
            return
        end

        capability.Functional = ok == true
        capability.State = ok and "PASS" or "FAILED"
        capability.Probe = probeKind or "runtime"
        capability.ProbedAt = os.time()

        if ok then
            capability.Reason = nil
        else
            capability.Reason = reason or capability.Reason or "probe failed"
        end
    end

    local HASH_PROBE_INPUT = "DeepClientAuditor"
    local HASH_PROBE_EXPECTED_HEX = "2be3e149dbdc63dff081479a1daa0806f77e098e9996467f76831137c46b40f3"
    local HASH_PROVIDER_CACHE = { Providers = {}, Preferred = nil, Resolved = false, FailedAt = {}, FailedStatus = {}, FailedResolutionAt = nil, ResolutionAttempts = 0 }

    local function bytesToHex(bytes)
        if type(bytes) ~= "string" then return nil end
        local out = {}
        for i = 1, #bytes do
            out[i] = string.format("%02x", string.byte(bytes, i))
        end
        return table.concat(out)
    end

    local function normalizeSha256Digest(value)
        if type(value) ~= "string" then return nil end
        local lower = string.lower(value)
        if #lower == 64 and lower:match("^[0-9a-f]+$") then
            return lower
        end
        if (#value == 43 or #value == 44)
            and value:match("^[A-Za-z0-9+/]+={0,2}$")
        then
            local decoded = safeCall(function()
                return HttpService:Base64Decode(value)
            end, nil)
            local hex = bytesToHex(decoded)
            if hex and #hex == 64 then
                return hex
            end
        end
        return nil
    end

    local function resolveHashProvider(name, fn, owner)
        local cached = HASH_PROVIDER_CACHE.Providers[name]
        if cached and cached.Usable then
            return cached
        elseif cached then
            if HASH_PROVIDER_CACHE.FailedAt[name] and (os.clock() - HASH_PROVIDER_CACHE.FailedAt[name]) < 5 then
                return cached
            end
        end
        local boundOk, boundDigest = pcall(fn, HASH_PROBE_INPUT, "sha256")
        local boundHex = boundOk and normalizeSha256Digest(boundDigest) or nil
        local ownerOk, ownerDigest = pcall(fn, owner, HASH_PROBE_INPUT, "sha256")
        local ownerHex = ownerOk and normalizeSha256Digest(ownerDigest) or nil
        local mode, digest, status
        if boundHex == HASH_PROBE_EXPECTED_HEX then
            mode, digest, status = "bound", boundDigest, "verified"
        elseif ownerHex == HASH_PROBE_EXPECTED_HEX then
            mode, digest, status = "owner", ownerDigest, "verified"
        elseif type(boundDigest) == "string" and boundDigest ~= "" and type(ownerDigest) == "string" and ownerDigest ~= "" and boundDigest == ownerDigest then
            mode, digest, status = "bound", boundDigest, "consistent_nonhex"
        elseif type(boundDigest) == "string" and boundDigest ~= "" and not ownerOk then
            mode, digest, status = "bound", boundDigest, "bound_only_unverified"
        elseif type(ownerDigest) == "string" and ownerDigest ~= "" and not boundOk then
            mode, digest, status = "owner", ownerDigest, "owner_only_unverified"
        else
            status = "ambiguous"
        end
        cached = {
            Name = name,
            Fn = fn,
            Owner = owner,
            InvocationMode = mode,
            ProbeDigest = digest,
            Status = status,
            Usable = mode ~= nil
                and (status == "verified" or status == "consistent_nonhex"),
        }
        if cached.Usable then
            HASH_PROVIDER_CACHE.Providers[name] = cached
            HASH_PROVIDER_CACHE.FailedAt[name] = nil
            HASH_PROVIDER_CACHE.FailedStatus[name] = nil
        else
            HASH_PROVIDER_CACHE.Providers[name] = cached
            HASH_PROVIDER_CACHE.FailedAt[name] = os.clock()
            HASH_PROVIDER_CACHE.FailedStatus[name] = status
        end
        return cached
    end

    local function resolvePreferredHashProvider()
        if HASH_PROVIDER_CACHE.Resolved then
            if HASH_PROVIDER_CACHE.Preferred then
                return HASH_PROVIDER_CACHE.Preferred
            end
            if HASH_PROVIDER_CACHE.FailedResolutionAt
                and (os.clock() - HASH_PROVIDER_CACHE.FailedResolutionAt) < 30
            then
                return nil
            end
            HASH_PROVIDER_CACHE.Resolved = false
        end

        HASH_PROVIDER_CACHE.ResolutionAttempts += 1
        HASH_PROVIDER_CACHE.Preferred = nil
        if type(CRYPT_HASH) == "table" and type(CRYPT_HASH.hash) == "function" then
            local provider = resolveHashProvider("crypt.hash", CRYPT_HASH.hash, CRYPT_HASH)
            if provider.Usable then
                HASH_PROVIDER_CACHE.Preferred = provider
                HASH_PROVIDER_CACHE.Resolved = true
                HASH_PROVIDER_CACHE.FailedResolutionAt = nil
                return provider
            end
        end
        if type(SYN_TABLE) == "table" and type(SYN_TABLE.crypt) == "table" and type(SYN_TABLE.crypt.hash) == "function" then
            local provider = resolveHashProvider("syn.crypt.hash", SYN_TABLE.crypt.hash, SYN_TABLE.crypt)
            if provider.Usable then
                HASH_PROVIDER_CACHE.Preferred = provider
                HASH_PROVIDER_CACHE.Resolved = true
                HASH_PROVIDER_CACHE.FailedResolutionAt = nil
                return provider
            end
        end
        HASH_PROVIDER_CACHE.Resolved = true
        HASH_PROVIDER_CACHE.Preferred = nil
        HASH_PROVIDER_CACHE.FailedResolutionAt = os.clock()
        return nil
    end

    local function probeCapabilities()
        local probes = {}

        -- Cheap, non-mutating probes.
        probes.getgenv = function()
            if not GET_GENV then return false, "API unavailable" end
            local ok, result = pcall(GET_GENV)
            return ok and type(result) == "table", ok and "unexpected environment result" or "getgenv probe failed"
        end

        probes.getrawmetatable = function()
            if not GET_RAW_METATABLE then return false, "API unavailable" end
            local ok, result = pcall(GET_RAW_METATABLE, game)
            return ok and type(result) == "table", ok and "unexpected metatable result" or "getrawmetatable probe failed"
        end

        probes.isreadonly = function()
            if not GET_READONLY or not GET_RAW_METATABLE then return false, "API unavailable" end
            local ok, result = pcall(function()
                local mt = GET_RAW_METATABLE(game)
                return GET_READONLY(mt)
            end)
            return ok and type(result) == "boolean", ok and "unexpected readonly result" or "isreadonly probe failed"
        end

        probes.getconnections = function()
            if not GET_CONNECTIONS then return false, "API unavailable" end
            local ok, result = pcall(GET_CONNECTIONS, RunService.Heartbeat)
            return ok and type(result) == "table", ok and "unexpected connections result" or "getconnections probe failed"
        end

        probes.newcclosure = function()
            if not NEW_CLOSURE then return false, "API unavailable" end
            local ok, result = pcall(NEW_CLOSURE, function() return true end)
            return ok and type(result) == "function", ok and "unexpected closure result" or "newcclosure probe failed"
        end

        if CONFIG.PROBE_DEEP_CAPABILITIES then
            probes.getgc = function()
                if not GET_GC then return false, "API unavailable" end
                local ok, result = pcall(GET_GC, true)
                return ok and type(result) == "table", ok and "getgc returned non-table" or "getgc call failed"
            end

            probes.getconstants = function()
                if not GET_CONSTANTS then return false, "API unavailable" end
                local ok, result = pcall(GET_CONSTANTS, function() return true end)
                return ok and type(result) == "table", ok and "unexpected result" or "getconstants probe failed"
            end

            probes.getupvalues = function()
                if not GET_UPVALUES then return false, "API unavailable" end
                local ok, result = pcall(GET_UPVALUES, function() return true end)
                return ok and type(result) == "table", ok and "unexpected result" or "getupvalues probe failed"
            end
        else
            for _, name in ipairs({"getgc", "getconstants", "getupvalues"}) do
                local capability = report.Metadata.Capabilities[name]
                if capability and capability.Detected then
                    capability.State = "PARTIAL"
                    capability.Probe = "skipped_by_profile"
                    capability.Reason = "Deep probe skipped because SCAN_VM/DETAILED was not requested."
                end
            end
        end

        for name, probe in pairs(probes) do
            local ok, probeOk, reason = pcall(probe)
            if not ok then
                markCapabilityProbe(name, false, "probe wrapper failed", "startup")
            else
                markCapabilityProbe(name, probeOk, reason, "startup")
            end
        end

        if type(CRYPT_HASH) == "table" and type(CRYPT_HASH.hash) == "function" then
            local provider = resolveHashProvider("crypt.hash", CRYPT_HASH.hash, CRYPT_HASH)
            markCapabilityProbe("crypt.hash", provider.Usable, provider.Status == "ambiguous" and "crypt.hash invocation signature ambiguous" or "crypt.hash provider cached", "startup")
            local capability = report.Metadata.Capabilities["crypt.hash"]
            if capability then
                capability.Functional = provider.Usable
            end
        end

        if type(SYN_TABLE) == "table" and type(SYN_TABLE.crypt) == "table" and type(SYN_TABLE.crypt.hash) == "function" then
            local provider = resolveHashProvider("syn.crypt.hash", SYN_TABLE.crypt.hash, SYN_TABLE.crypt)
            markCapabilityProbe("syn.crypt.hash", provider.Usable, provider.Status == "ambiguous" and "syn.crypt.hash invocation signature ambiguous" or "syn.crypt.hash provider cached", "startup")
            local capability = report.Metadata.Capabilities["syn.crypt.hash"]
            if capability then
                capability.Functional = provider.Usable
            end
        end

        HASH_PROVIDER_CACHE.Resolved = false
        HASH_PROVIDER_CACHE.Preferred = nil
        resolvePreferredHashProvider()

        local jsonOk, jsonResult = pcall(function()
            local encoded = HttpService:JSONEncode({ Probe = true })
            local decoded = HttpService:JSONDecode(encoded)
            return type(decoded) == "table" and decoded.Probe == true
        end)
        markCapabilityProbe("HttpServiceJSON", jsonOk and jsonResult == true, "HttpService JSON probe failed", "startup")

        local httpCapability = report.Metadata.Capabilities.HttpServiceGetAsync
        if httpCapability and httpCapability.Detected then
            httpCapability.Functional = false
            httpCapability.State = "DETECTED_NOT_PROBED"
            httpCapability.Probe = "side_effect_guard"
            httpCapability.Reason = "Detected only; outbound HTTP probing is prohibited by the V4.41 capability contract."
            httpCapability.Callable = true
            httpCapability.Safe = true
            httpCapability.SideEffectFree = false
            httpCapability.DataReturned = false
        end

        -- Side-effecting APIs are intentionally not invoked during capability probing.
        for _, name in ipairs({"writefile", "makefolder", "setclipboard", "setreadonly"}) do
            local capability = report.Metadata.Capabilities[name]
            if capability and capability.Detected then
                capability.State = "PARTIAL"
                capability.Probe = "not_run_side_effect_guard"
                capability.Reason = "Detected; functional side-effect probe intentionally skipped."
            end
        end

        -- getnamecallmethod is context-bound and only becomes functionally probed
        -- inside the diagnostic observation path.
        local namecallCapability = report.Metadata.Capabilities.getnamecallmethod
        if namecallCapability and namecallCapability.Detected then
            namecallCapability.State = "PARTIAL"
            namecallCapability.Probe = "context_bound"
            namecallCapability.Reason = "Validated only while executing inside the namecall observation context."
        end
    end

    local function finalizeCapabilityMatrix()
        local isMobile = runtimePlatform.IsMobile == true
        for _, capability in pairs(report.Metadata.Capabilities or {}) do
            if type(capability) == "table" then
                capability.Callable = capability.Functional == true
                capability.Safe = capability.Safe ~= false
                capability.SideEffectFree = capability.SideEffectFree ~= false
                capability.ThreadSafe = capability.ThreadSafe ~= false
                capability.MobileCompatible = isMobile and (capability.MobileCompatible ~= false) or true
                capability.DataReturned = capability.Functional == true
                capability.FailureReason = capability.FailureReason
                    or (capability.Functional == false and capability.Reason)
                    or nil
                if capability.Detected ~= true then
                    capability.Callable = false
                    capability.DataReturned = false
                end
                if name == "setreadonly"
                    or name == "hookfunction"
                    or name == "hookmetamethod"
                    or name == "writefile"
                    or name == "makefolder"
                    or name == "setclipboard"
                    or name == "HttpServiceGetAsync"
                then
                    capability.Safe = false
                    capability.SideEffectFree = false
                end
            end
        end
    end

