    local function setPhaseContractStatus(name, status, reason)
        local contract = report.Metadata.PhaseContracts and report.Metadata.PhaseContracts[name]
        if not contract then return end
        contract.PhaseId = contract.PhaseId or ("PH-" .. tostring(name))
        CURRENT_PHASE_ID = contract.PhaseId
        report.Metadata.CurrentPhaseId = contract.PhaseId
        contract.Status = status
        contract.Reason = reason
        contract.Completed = status == "complete"
            or status == "complete_no_correlations"
            or status == "metadata_projection"
        contract.FinishedAtClock = os.clock()
        contract.Limitations = contract.Limitations or {}
        if reason then
            local found = false
            for _, item in ipairs(contract.Limitations) do
                if item == reason then found = true break end
            end
            if not found then contract.Limitations[#contract.Limitations + 1] = reason end
        end
    end

    local function pushPreflightCheck(name, status, details)
        report.Metadata.Preflight.Checks[#report.Metadata.Preflight.Checks + 1] = {
            Name = name,
            Status = status,
            Details = details,
        }
        return status == "pass"
    end

    local function sampleRuntimePerformance()
        local frameTimes = {}
        local maxSamples = runtimePlatform.IsMobile and 4 or 6
        local heartbeat = RunService.Heartbeat
        for _ = 1, maxSamples do
            local dt = safeCall(function()
                return heartbeat:Wait()
            end, nil)
            if type(dt) == "number" and dt > 0 and dt < 5 then
                frameTimes[#frameTimes + 1] = dt
            end
        end
        if #frameTimes == 0 then
            return {
                Samples = 0,
                FPSMean = nil,
                FrametimeP50Ms = nil,
                FrametimeP95Ms = nil,
                FrametimeP99Ms = nil,
                FrametimeMaxMs = nil,
                DataPingMs = nil,
            }
        end
        table.sort(frameTimes)
        local sum = 0
        for _, dt in ipairs(frameTimes) do sum += dt end
        local function percentile(p)
            local index = math.max(1, math.min(#frameTimes, math.ceil(#frameTimes * p)))
            return frameTimes[index] * 1000
        end
        local pingMs = safeCall(function()
            local stats = game:GetService("Stats")
            local network = stats and stats:FindFirstChild("Network")
            local serverStats = network and network:FindFirstChild("ServerStatsItem")
            local dataPing = serverStats and serverStats:FindFirstChild("Data Ping")
            if dataPing and type(dataPing.GetValue) == "function" then
                local value = dataPing:GetValue()
                if type(value) == "number" then
                    return value
                end
                local numeric = tonumber(tostring(value):match("([%d%.]+)"))
                return numeric
            end
            return nil
        end, nil)
        local avg = sum / #frameTimes
        return {
            Samples = #frameTimes,
            FPSMean = avg > 0 and (1 / avg) or nil,
            FrametimeP50Ms = percentile(0.50),
            FrametimeP95Ms = percentile(0.95),
            FrametimeP99Ms = percentile(0.99),
            FrametimeMaxMs = frameTimes[#frameTimes] * 1000,
            DataPingMs = pingMs,
        }
    end

    local function collectRuntimeIdentity()
        local runtimeVersion = safeCall(function()
            if type(version) == "function" then return version() end
            return nil
        end, nil)
        local memoryMb = safeCall(function()
            local stats = game:GetService("Stats")
            if stats and type(stats.GetTotalMemoryUsageMb) == "function" then
                return stats:GetTotalMemoryUsageMb()
            end
            return nil
        end, nil)
        local performance = sampleRuntimePerformance()
        return {
            RobloxClientVersion = runtimeVersion,
            LuauVersion = safeCall(function() return _VERSION end, nil),
            MemoryUsageMb = memoryMb,
            PerformanceSample = performance,
            Executor = executorName,
            ExecutorVersion = executorVersion,
            RuntimeArchitecture = {
                Touch = runtimePlatform.TouchEnabled == true,
                Mouse = runtimePlatform.MouseEnabled == true,
                Keyboard = runtimePlatform.KeyboardEnabled == true,
                MobileDetected = runtimePlatform.IsMobile == true,
                MobileConfidence = runtimePlatform.Confidence,
            },
        }
    end

    local function computeEffectiveConfigurationHash()
        local fields = {
            "AUDIT_PROFILE","IMPACT_POLICY","DATA_PROFILE","REPORT_LEVEL",
            "PERFORMANCE_PROFILE","PERFORMANCE_PRESET","SCAN_VM","SCAN_TAGS",
            "SCAN_VALUES","SCAN_ATTRIBUTES","SCAN_NETWORK_OWNERSHIP",
            "SNIFF_TRAFFIC","SNIFFER_OBSERVE_ONLY","GC_MODE",
            "MAX_SCANNED_INSTANCES_GLOBAL","MAX_REPORT_BYTES_ESTIMATE",
            "MAX_AUDIT_WALL_SECONDS",
        }
        local parts = {}
        for _, key in ipairs(fields) do
            parts[#parts + 1] = key .. "=" .. tostring(CONFIG[key])
        end
        return hash32(table.concat(parts, "|"))
    end

    local function runMandatoryPreflight()
        local preflight = report.Metadata.Preflight
        preflight.Status = "running"
        preflight.StartedAtClock = os.clock()
        local runtime = collectRuntimeIdentity()
        report.Metadata.RuntimeObservation.RobloxClientVersion = runtime.RobloxClientVersion
        report.Metadata.RuntimeObservation.LuauVersion = runtime.LuauVersion
        report.Metadata.RuntimeObservation.MemoryUsageMb = runtime.MemoryUsageMb
        report.Metadata.RuntimeObservation.RuntimeArchitecture = runtime.RuntimeArchitecture
        report.Metadata.RuntimeObservation.PerformanceSample = runtime.PerformanceSample
        report.Metadata.RuntimeObservation.EffectiveConfigurationHash = computeEffectiveConfigurationHash()

        local ok = true
        ok = pushPreflightCheck("schema_contract", schemaMismatchMessage == nil, schemaMismatchMessage or "ok") and ok
        ok = pushPreflightCheck("place_identity", game.PlaceId ~= nil, "PlaceId_readable") and ok
        ok = pushPreflightCheck(
            "impact_policy",
            CONFIG.IMPACT_POLICY == "READ_ONLY"
                or (CONFIG.AUDIT_PROFILE == "DEEP_AUTHORIZED"
                    and (CONFIG.IMPACT_POLICY == "OBSERVE_ONLY" or CONFIG.IMPACT_POLICY == "TEMPORARY_HOOK")),
            CONFIG.IMPACT_POLICY
        ) and ok
        ok = pushPreflightCheck(
            "authorization",
            CONFIG.IMPACT_POLICY == "READ_ONLY"
                or (CONFIG.AUTHORIZATION_REF ~= nil and tostring(CONFIG.AUTHORIZATION_REF) ~= ""),
            CONFIG.AUTHORIZATION_REF and "present" or "not_present"
        ) and ok
        ok = pushPreflightCheck(
            "sniffer_impact_scope",
            not CONFIG.SNIFF_TRAFFIC or CONFIG.IMPACT_POLICY == "TEMPORARY_HOOK",
            CONFIG.SNIFF_TRAFFIC and CONFIG.IMPACT_POLICY or "no_hook"
        ) and ok
        ok = pushPreflightCheck("network_probe_guard", true, "outbound HTTP probe disabled") and ok
        ok = pushPreflightCheck("mobile_profile", not runtimePlatform.IsMobile
            or appliedPerformancePreset == "MOBILE_SAFE"
            or appliedPerformancePreset == "DEEP_SAFE_MOBILE"
            or CONFIG.LIGHT_MODE, appliedPerformancePreset) and ok
        ok = pushPreflightCheck("capability_matrix", type(report.Metadata.Capabilities) == "table", "available") and ok

        preflight.CompletedAtClock = os.clock()
        if not ok and CONFIG.PREFLIGHT_FAIL_CLOSED then
            preflight.Status = "failed"
            preflight.FailureReason = "preflight_failed"
            report.Metadata.FailureReason = "preflight_failed"
            return false
        end
        preflight.Status = "complete"
        return true
    end

    --------------------------------------------------------------------
    -- EXECUTION
    --------------------------------------------------------------------

    notify(
        "Auditor iniciado",
        "Escaneando el cliente en modo pasivo..."
    )

    CURRENT_PHASE_ID = "PH-PREFLIGHT"
    local preflightPassed = (not CONFIG.REQUIRE_PREFLIGHT) or runMandatoryPreflight()
    if not preflightPassed then
        report.Metadata.SessionStatus = "FAILED"
        report.Metadata.Completed = false
        report.Metadata.CleanupStatus = "PREFLIGHT_BLOCKED"
        report.Metadata.AuditCompleteness = "ABORTED"
    end

    scannedInstanceCount = 0
