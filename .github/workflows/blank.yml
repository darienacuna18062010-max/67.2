    schemaFingerprintCache = nil
    reportTextInstanceHashRegistry = setmetatable({}, { __mode = "v" })
    archetypeSignalCounts = {}
    archetypeSignals = {}
    archetypeSignalSeen = {}

    --------------------------------------------------------------------
