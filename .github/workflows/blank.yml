    local function recordCorrelationSeverity(kind, details)
        if kind == "invoke_then_mutating_remote" then
            local name = string.lower(tostring((details and details.ToRemoteName) or ""))
            if name:find("admin",1,true) or name:find("permission",1,true)
                or name:find("grant",1,true) or name:find("currency",1,true)
                or name:find("purchase",1,true)
            then
                return "medium"
            end
        end
        return "low"
    end

    local function recordCorrelation(kind, details, source, confidence)
        if #report.Network.CorrelationEngine.Findings >= CONFIG.MAX_CORRELATION_FINDINGS then
            recordDrop("CorrelationFindings", "limit_reached")
            return false
        end

        local dedupeKey = tostring(kind) .. "\0"
            .. tostring(details and details.FromEndpointId or "")
            .. "\0" .. tostring(details and details.ToEndpointId or "")
            .. "\0" .. tostring(math.floor((details and details.DeltaMs or 0) / 10))
            .. "\0" .. tostring(details and details.UIId or "")
        if correlationDedupeKeys[dedupeKey] then
            report.Network.CorrelationEngine.DeduplicatedFindings =
                (report.Network.CorrelationEngine.DeduplicatedFindings or 0) + 1
            return false
        end
        correlationDedupeKeys[dedupeKey] = true
        correlationDedupeOrder[#correlationDedupeOrder + 1] = dedupeKey
        while #correlationDedupeOrder - correlationDedupeHead + 1 > CONFIG.MAX_CORRELATION_DEDUPE_KEYS do
            local evicted = correlationDedupeOrder[correlationDedupeHead]
            correlationDedupeKeys[evicted] = nil
            correlationDedupeOrder[correlationDedupeHead] = nil
            correlationDedupeHead += 1
        end

        local effectiveConfidence = confidence or recordCorrelationSeverity(kind, details)
        local finding = ensureFindingContract({
            Type = kind,
            Details = details,
            WindowMs = CONFIG.CORRELATION_WINDOW_SECONDS * 1000,
            Evidence = {
                { Source = source, Observed = true, Confidence = effectiveConfidence,
                  Limitations = { "temporal_correlation_does_not_prove_causality", "client_visible_only", "server_execution_not_observed" } }
            },
        }, "temporal_correlation", effectiveConfidence, { "temporal_window_only", "no_server_execution_visibility" })
        append(report.Network.CorrelationEngine.Findings, finding, CONFIG.MAX_CORRELATION_FINDINGS)
        report.Network.CorrelationEngine.FindingCount = #report.Network.CorrelationEngine.Findings
        return true
    end

    local function pruneCorrelationBuffers(now)
        local cutoff = now - CONFIG.CORRELATION_WINDOW_SECONDS
        local function prune(list)
            local write = 1
            for read = 1, #list do
                local item = list[read]
                if item.At >= cutoff then list[write] = item; write += 1 end
            end
            for i = write, #list do list[i] = nil end
        end
        prune(recentRemoteCalls); prune(recentUIEvents)
        -- Dedupe keys are scoped to the active temporal window; old keys must not
        -- grow across a long-running capture session.
        if #recentRemoteCalls == 0 and #recentUIEvents == 0 then
            clearTable(correlationDedupeKeys)
            clearArrayState(correlationDedupeOrder)
            correlationDedupeHead = 1
        end
    end

    local function copyArray(list)
        local out = {}
        for i, value in ipairs(list or {}) do out[i] = value end
        return out
    end

    local function updateRemoteCorrelationChains(now, current)
        local nextChains = {}
        for _, chain in ipairs(recentRemoteChains) do
            if now - chain.LastAt <= CONFIG.CORRELATION_WINDOW_SECONDS
                and #chain.EndpointIds < CONFIG.CORRELATION_MAX_HOPS
            then
                local duplicate = false
                for _, endpointId in ipairs(chain.EndpointIds) do
                    if endpointId == current.EndpointId then duplicate = true; break end
                end
                if not duplicate then
                    local endpoints = copyArray(chain.EndpointIds)
                    local names = copyArray(chain.Names)
                    endpoints[#endpoints + 1] = current.EndpointId
                    names[#names + 1] = current.Name
                    local extended = { EndpointIds = endpoints, Names = names, FirstAt = chain.FirstAt, LastAt = now }
                    if #endpoints >= 3 then
                        local repetitionKey = table.concat(endpoints, ">")
                        local repetition = correlationChainCounts[repetitionKey] or 0
                        repetition += 1
                        correlationChainCounts[repetitionKey] = repetition
                        local chainConfidence = repetition >= 10 and "medium" or "low"
                        recordCorrelation("multi_hop_remote_sequence", {
                            EndpointChain = endpoints,
                            RemoteChain = reportText(table.concat(names, " -> ")),
                            HopCount = #endpoints - 1,
                            DeltaMs = (now - chain.FirstAt) * 1000,
                            RepetitionCount = repetition,
                            ChainConfidence = chainConfidence,
                        }, "runtime_multi_hop_remote_temporal_sequence", chainConfidence)
                    end
                    nextChains[#nextChains + 1] = extended
                end
            end
        end
        nextChains[#nextChains + 1] = { EndpointIds = { current.EndpointId }, Names = { current.Name }, FirstAt = now, LastAt = now }
        -- nextChains preserves chronological insertion order, so a full sort is
        -- unnecessary on every observed remote call. Evict the oldest entries only.
        while #nextChains > CONFIG.MAX_CORRELATION_CHAINS do
            table.remove(nextChains, 1)
        end
        recentRemoteChains = nextChains
    end

    local function recordRemoteTimelineCorrelation(now, method, remoteData, shapeKeys, valueHashes)
        if not remoteData then return end
        pruneCorrelationBuffers(now)
        local current = { At=now, Method=method, EndpointId=remoteData.EndpointId, RemoteId=remoteData.InstanceId, Name=remoteData.Name, ShapeKeys=shapeKeys, ValueHashes=valueHashes }
        recentRemoteCalls[#recentRemoteCalls+1] = current
        updateRemoteCorrelationChains(now, current)

        local lower = string.lower(tostring(remoteData.Name or ""))
        local writeLike = lower:find("sell",1,true) or lower:find("buy",1,true)
            or lower:find("purchase",1,true) or lower:find("claim",1,true)
            or lower:find("trade",1,true) or lower:find("award",1,true)
            or lower:find("grant",1,true) or lower:find("equip",1,true)
        if writeLike then
            for _, prior in ipairs(recentRemoteCalls) do
                if prior ~= current and prior.At >= now-CONFIG.CORRELATION_WINDOW_SECONDS and prior.Method == "InvokeServer" then
                    recordCorrelation("invoke_then_mutating_remote", {
                        FromEndpointId=prior.EndpointId, ToEndpointId=remoteData.EndpointId,
                        FromRemoteId=prior.RemoteId, ToRemoteId=remoteData.InstanceId,
                        FromRemoteName=reportText(prior.Name), ToRemoteName=reportText(remoteData.Name),
                        DeltaMs=(now-prior.At)*1000,
                        CompatibleShape=(shapeKeys and prior.ShapeKeys and "shape_available" or "shape_not_compared"),
                    }, "runtime_remote_temporal_sequence", nil)
                end
            end
        end

        for _, uiEvent in ipairs(recentUIEvents) do
            local delta=now-uiEvent.At
            if delta>=0 and delta<=0.5 then
                recordCorrelation("ui_state_change_near_remote", {
                    UIId=uiEvent.UIId, UIState=uiEvent.State, UIProperty=uiEvent.Property,
                    EndpointId=remoteData.EndpointId, RemoteName=reportText(remoteData.Name), DeltaMs=delta*1000,
                }, "runtime_ui_then_remote_temporal_sequence", "low")
            end
        end
    end

