DeepClientAuditor V4.40.2 — PATCH9.1 MASTER

1. Código completo corregido

    --[[
        Luau Deep Client Auditor - Optimized Headless Edition
        ------------------------------------------------------
        Auditoría pasiva del cliente para una experiencia propia.

        Características:
          • Escaneo de arquitectura cliente-visible
          • Remotes / Bindables
          • ValueObjects y atributos
          • ProximityPrompts / ClickDetectors
          • LocalScripts / ModuleScripts
          • PlayerGui / PlayerScripts / Character
          • Tags de CollectionService
          • Network ownership (si el entorno lo permite)
          • Módulos cargados
          • Constantes y upvalues (si las APIs del executor existen)
          • Auditoría profunda de GC / closures (getgc)
          • Perfilado de superficie de APIs de Remotes
          • Observación del entorno getgenv
          • Exportación JSON
          • Límites + yielding para reducir congelamientos
          • Deduplicación de constantes
          • Sniffer pasivo opcional con ventana de captura limitada
          • Sin generar FireServer / FireUnreliable / InvokeServer ni cambios de estado del juego; el sniffer solo observa llamadas ya realizadas y, para InvokeServer, perfila retornos sin registrarlos en bruto.
          • El sniffer opcional modifica temporalmente la metatabla local solo durante su ventana de observación y exige restauración segura

        NOTA:
          getloadedmodules / getscriptclosure / getconstants / getupvalues /
          getnetworkownership son APIs dependientes del executor. El auditor
          simplemente omite esa sección si no están disponibles.

        ESQUEMA DEL JSON:
          • Metadata.ReportFormat identifica la versión del esquema del reporte.
          • Network.ContextActionActivity conserva contadores pasivos de BindAction/BindActionAtPriority/UnbindAction/UnbindAllActions y una entrada Evidence normalizada; bajo METADATA se conserva la forma del objeto y sus contadores se proyectan a cero.
          • Network.ExternalActivity.UrlShapeCoverage enumera los métodos HTTP cubiertos por el histograma de forma de URL (GetAsync/PostAsync/RequestAsync); nunca contiene la URL original.
          • Metadata.Architecture.Modules describe las fronteras lógicas del auditor; el bloque context_action se agrupa con el pipeline del sniffer pasivo.
          • Metadata.Truncation identifica las colecciones que alcanzaron un límite.
          • Metadata.PhaseContracts declara prerequisitos/estado de las fases; una fase con prerequisito fallido se marca skipped_prerequisite.
          • CorrelationEngine.Status final solo admite estados persistentes como complete, complete_no_correlations, waiting_for_remote_observation, partial_wall_time, disabled_light_mode; "usable" es transitorio.
          • Metadata.Truncation.<collection>.Reason conserva la primera causa observada
            (first-reason-wins); causas posteriores aumentan Dropped sin sobrescribir Reason.
          • InstanceFlagArchivableSamples y InstanceFlagRobloxLockedSamples representan
            contadores independientes porque sus listas tienen límites independientes.
          • Metadata.PhaseDurations registra el tiempo consumido por fase y root. Timeline[].Timestamp usa os.clock y Timeline[].WallTime usa os.time; no deben restarse entre sí.
          • Metadata.AuditStartTime/AuditStartClock sirven como referencia del reloj.
            SnifferStartTime/SnifferStartClock anclan específicamente el sniffer.
          • VM.Modules[].ModuleIndex identifica el índice de getloadedmodules() usado
            durante esa ejecución y permite cruzarlo con hallazgos del GC.
          • SensitiveConstants[].Match identifica la categoría heurística detectada;
            SensitiveConstants[].Severity identifica HIGH/MEDIUM/LOW.
          • SensitiveConstants[].ModuleIndex/ModuleName/ModulePath muestran el origen
            del módulo cuando el executor permite resolverlo. La identidad opaca de
            la closure se conserva solo para deduplicación interna.
          • Network.API_Schema.<Remote>.FirstSeen/LastSeen usan os.clock(); cada
            Signature mantiene sus propios FirstSeen/LastSeen. Methods es un array.
          • FirstMethod identifica explícitamente el primer método observado.
          • MethodSet y SignatureIndex son estructuras internas y se eliminan antes de JSONEncode.
          • ScreenGui.Enabled se lee en vivo; la relación GuiObject -> ScreenGui y
            el viewport se cachean solo durante un root.
          • HiddenUIByReason desglosa los motivos de los hallazgos UI reportados.
          • Remotes, Bindables, Values, HiddenUI y Scripts incluyen Root.
          • Metadata.Roots[name] unifica solicitud, canonicalización, conteo, duración, truncación y estado de cada root.
          • Metadata.Truncation cuantifica Limit/Stored/Dropped/Reason por colección.
          • Metadata.Roots[name] conserva RequestIds/Status/CanonicalRoot/Reason para cada root solicitado.
          • Metadata.DataProfile/AuthorizationRef/RetentionClass documentan el perfil operativo.
          • Metadata.Performance/Traversal declaran budgets, slices, cola, bytes y parada.
          • Metadata.Performance incluye preset/runtime, pico de heap, presión de heap y early-stop de output.
          • Metadata.DiffSummary resume cambios cuantitativos frente a un reporte previo suministrado explícitamente.
          • Network.ExternalActivity.UrlShapeHistogram publica sólo buckets de longitud/clase de caracteres; no exporta la URL original.
          • Instances.ExploitableAssets es inventario descriptivo de clases observadas; no constituye un veredicto de explotabilidad server-side.
          • Network.Sniffer incluye fingerprint/ownership state y contador de pérdidas de ownership.
          • Network.ContractAnalysis incluye frecuencia, estabilidad, aridad/shape y ReviewPriority heurístico.
          • HiddenUI distingue señales de interacción y layering de la condición realmente oculta.
          • Metadata.Streaming declara la cobertura cliente-visible cuando se puede observar.
          • Metadata.Truncation.ReportBytes cuantifica el límite estimado de salida.
          • Metadata.Integrity contiene el digest opcional del reporte excluyendo el propio campo.
          • ServerValidationRequired es un contrato global: cada finding nuevo representa evidencia cliente-side y requiere validación server-side antes de considerarse una conclusión de seguridad.
          • Network.CorrelationEngine.Status final válido: not_run, waiting_for_remote_observation, partial_ui_only_no_remote_capture, complete, complete_no_correlations, partial_wall_time, disabled_light_mode. El estado interno usable no se publica al finalizar la fase.
          • silent_remote solo se evalúa después de una ventana de captura completada; sin captura se omite para no convertir ausencia de observación en evidencia.
          • Metadata.SchemaVersion es semver independiente de ReportFormat; Metadata.SchemaHash fingerprinta la forma documentada del reporte.
          • Cada finding nuevo incluye Kind/Type, Provenance, Confidence, Evidence, ServerValidationRequired y Limitations cuando aplica.
          • Metadata.Integrity.Digest usa canonicalIntegrityEncode/ScopeVersion y no depende del
            orden de claves del JSON final. El protocolo canónico debe reproducirse exactamente:
            n; / b0; / b1; / d<number>; / sN:<escaped>; / a[...]; / m{key=value;...};
            las claves se ordenan primero por type y después numéricamente para number o por
            tostring() para tipos no numéricos. <cycle> identifica reentrada de una misma tabla;
            <depth-limit> identifica truncamiento por profundidad y no debe confundirse con ciclo.
            La codificación se ejecuta sobre el report completo después de la exclusión temporal
            de Metadata.Integrity, Metadata.Output.ActualBytes/WithinLimit/SizeConvergencePass/
            SizeSelfConsistent/EstimatedBytes/LimitBytes/Compacted/EmergencyCompaction y
            Metadata.Truncation.ReportBytes.Stored.
          • La compactación puede reducir más el contenido publicado para satisfacer
            MAX_REPORT_BYTES_ESTIMATE después del budgeting normal de registros.
          • En perfil MINIMAL, identificadores, valores, argumentos y contenido sensible no se exportan.
          • El presupuesto de slice es cooperativo: es un objetivo de tiempo activo, no un
            límite duro por frame; el mínimo configurable es 0,5 ms.
          • MAX_AUDIT_WALL_SECONDS es el límite duro de duración transcurrida de la
            sesión; incluye esperas del scheduler cuando el reloj de pared está disponible.
          • Metadata.Performance separa objetivo de slice, medición de trabajo activo y
            límite duro de pared para evitar interpretar una métrica como garantía.
          • Metadata.Roots[name] registra cada root solicitado y, si fue deduplicado,
            documenta de forma explícita el root canónico y el motivo.
          • Metadata.ConfigurationValidation registra correcciones de límites inválidos.
          • NetworkOwnership usa Capability + Parts y no representa por sí solo un control de seguridad.
          • VM.Modules[].SensitiveConstants conserva hallazgos sensibles inline por módulo.
          • GC SensitiveConstants deduplica por (constant, closure) sin concatenación con delimitador.
          • VM.GCAudit.ObjectsReturned/ObjectsVisited distinguen universo devuelto y visitado;
            FunctionsVisited cuenta solo closures Luau evaluadas.
          • MAX_ENTROPY_SAMPLE_LENGTH limita la muestra usada por Shannon entropy; los
            hallazgos de entropía siguen sujetos a GC_MIN_SEVERITY/HIGH_ENTROPY_DETECTION.
    ]]

