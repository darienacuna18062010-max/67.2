Salida: V4.40.2 / ReportFormat 51
Alcance: correcciones aplicadas sobre el maestro único.

01. RiskScorecard se ejecuta siempre en la ruta final, no solo en FAILED/ABORTED/WEAK_INTEGRITY.
02. SessionDeltas unifica PreviousSessionScope.
03. UserInputActivity acepta SetMouseBehaviorOverride y compatibilidad con SetMouseBehavior.
04. RefusedExecutorHook existe en snifferState y se marca en la negativa por hook externo.
05. StreamingIntegrityMode se normaliza por sufijo Enum; nil => unavailable.
06. SelfTests.Cases acepta número/tabla sin serializar la representación Lua.
07. PhaseDurations.RootScan se registra alrededor del xpcall del root scan.
08. Reinjection limpia Methods/Overflow/OverflowSamples/UrlShapeHistogram de ExternalActivity.
09. CompactionSteps incluye Collection y se reinicia por compactación.
10. PhaseStatus documenta disabled_by_profile y skipped_light_mode.
11. SnifferStatus cubre los estados emitidos por runtime.
