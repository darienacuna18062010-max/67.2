    local function getInstancePath(instance)
        local cached = instancePathCache[instance]
        if cached then
            local currentName = safeCall(function() return instance.Name end, nil)
            local currentParent = safeCall(function() return instance.Parent end, nil)
            if cached.Name == currentName and cached.Parent == currentParent then return cached.Path end
        end
        local ok, path = pcall(instance.GetFullName, instance)

        if ok and type(path) == "string" then
            instancePathCache[instance] = {
                Path = path,
                Name = safeCall(function() return instance.Name end, nil),
                Parent = safeCall(function() return instance.Parent end, nil),
            }
            return path
        end

        local nameOk, name = pcall(function()
            return instance.Name
        end)

        -- Fallback paths are human-readable labels only and are not unique.
        -- Callers that need identity must use getStableInstanceId/InstanceId.
        return "["
            .. tostring(currentScanRoot)
            .. "]/"
            .. tostring(nameOk and name or "?")
    end

    local report
    local truncationListKeys = setmetatable({}, { __mode = "k" })
    local recordDrop
    local recordDrops

    local reportByteEstimateCache = {}
    local reportByteEstimateCompactionNonce = 0
    local reportByteEstimateDropNonce = 0
    local function estimateReportBytes(value, depth)
        depth = depth or 0

        if value == nil then
            return 4
        end

        local valueType = type(value)
        if valueType == "string" then
            return #value + 2
        elseif valueType == "number" then
            return 16
        elseif valueType == "boolean" then
            return 5
        elseif valueType ~= "table" then
            return 16
        end

        if depth >= 2 then
            return 32
        end

        local fieldCount = 0
        local hasLongString = false
        local className = rawget(value, "ClassName") or rawget(value, "Class")
        for _, child in pairs(value) do
            fieldCount += 1
            if type(child) == "string" and #child > CONFIG.MAX_STRING_VALUE_LENGTH then
                hasLongString = true
            end
        end
        local outputCompacted = report and report.Metadata and report.Metadata.Output and report.Metadata.Output.Compacted == true or false
        local truncationNonce = reportByteEstimateDropNonce
        local cacheKey = tostring(outputCompacted)
            .. "|compact=" .. tostring(reportByteEstimateCompactionNonce)
            .. "|drops=" .. tostring(truncationNonce)
            .. "|" .. tostring(className or "table")
            .. "|" .. tostring(fieldCount)
            .. "|" .. tostring(depth)
            .. "|longstr=" .. tostring(hasLongString)
        local cached = reportByteEstimateCache[cacheKey]
        if cached then
            return cached
        end

        local total = 2
        for key, child in pairs(value) do
            total += estimateReportBytes(key, depth + 1)
            total += 1 + estimateReportBytes(child, depth + 1)
        end
        total += 1
        reportByteEstimateCache[cacheKey] = total
        return total
    end

    local function registerTruncationList(list, key)
        if type(list) == "table" and type(key) == "string" then
            truncationListKeys[list] = key
        end
    end

    local function append(list, value, max)
        if #list >= max then
            return false
        end

        if report and report.Metadata and report.Metadata.Performance then
            if report.Metadata.Performance.OutputBudgetExceeded then
                return false
            end

            local estimated = estimateReportBytes(value)
            local current = report.Metadata.Performance.EstimatedOutputBytes or 0
            local limit = CONFIG.MAX_REPORT_BYTES_ESTIMATE
            local reservedBase = math.min(CONFIG.BASE_OVERHEAD_BYTES, limit)
            local recordedBytes = math.max(0, current - reservedBase)
            local effectiveRecordLimit = math.max(0, limit - reservedBase)

            if recordedBytes + estimated > effectiveRecordLimit then
                report.Metadata.Performance.OutputBudgetExceeded = true
                report.Metadata.Performance.DroppedByOutputBudget += 1
                recordDrop("ReportBytes", "report_bytes_budget")
                return false
            end

            report.Metadata.Performance.EstimatedOutputBytes = current + estimated
        end

        list[#list + 1] = value

        local key = truncationListKeys[list]
        if key and report and report.Metadata and report.Metadata.Truncation[key] then
            report.Metadata.Truncation[key].Stored = #list
        end

        return true
    end

    local function countKeys(tbl)
        local n = 0

        for _ in pairs(tbl) do
            n += 1
        end

        return n
    end

    local function hash32(value)
        local source = tostring(value)
        local hash = 7
        local length = #source
        local i = 1

        while i <= length do
            local b1, b2, b3, b4 = string.byte(source, i, i + 3)

            if b1 then
                hash = (hash * 31 + b1) % 2147483647
            end
            if b2 then
                hash = (hash * 31 + b2) % 2147483647
            end
            if b3 then
                hash = (hash * 31 + b3) % 2147483647
            end
            if b4 then
                hash = (hash * 31 + b4) % 2147483647
            end

            i += 4
        end

        return string.format("%08x", hash)
    end

    local SESSION_ID = safeCall(function()
        return HttpService:GenerateGUID(false)
    end, "session-" .. hash32(auditStartClock))

    local AUDIT_ID_COUNTER = 0
    local CURRENT_PHASE_ID = "PH-UNASSIGNED"

    local function nextAuditId(prefix)
        AUDIT_ID_COUNTER += 1
        return tostring(prefix or "ID") .. "-"
            .. tostring(AUDIT_ID_COUNTER) .. "-"
            .. hash32(SESSION_ID .. ":" .. tostring(AUDIT_ID_COUNTER) .. ":" .. tostring(prefix or "ID"))
    end

    local function currentRootId()
        return "ROOT-" .. hash32(SESSION_ID .. ":" .. tostring(currentScanRoot or "Unknown"))
    end

    -- Instance identity is path-scoped within a session: re-created instances that
    -- occupy the same path under the same PlaceId may receive the same deterministic ID.
    -- It is therefore not a cryptographic or lifetime-unique Instance identity.
    local function getStableInstanceId(instance, prefix)
        if typeof(instance) ~= "Instance" then
            return nil
        end
        local existing = stableInstanceIds[instance]
        if existing then
            return string.format("%s_%s", prefix or "Instance", existing)
        end

        local path = safeCall(instance.GetFullName, nil)
        if type(path) ~= "string" or path == "" then
            path = tostring(instance.Name)
        end

        local debugId = safeCall(function()
            return instance:GetDebugId()
        end, nil)

        local ancestryParts = {}
        local cursor = instance
        for _ = 1, 8 do
            local parent = safeCall(function() return cursor.Parent end, nil)
            if not parent then break end
            local parentClass = safeCall(function() return parent.ClassName end, "?")
            local parentName = safeCall(function() return parent.Name end, "?")
            ancestryParts[#ancestryParts + 1] = tostring(parentClass) .. ":" .. tostring(parentName)
            cursor = parent
        end

        nextInstanceLifecycleSerial += 1
        local lifecycleSerial = nextInstanceLifecycleSerial
        instanceLifecycleSerials[instance] = lifecycleSerial

        local className = safeCall(function() return instance.ClassName end, "?")
        local name = safeCall(function() return instance.Name end, "?")
        local ancestryHash = hash32(table.concat(ancestryParts, "/"))
        local debugHash = debugId and hash32(debugId) or "no_debugid"
        local seed = SESSION_ID
            .. ":" .. tostring(game.PlaceId)
            .. ":" .. tostring(className)
            .. ":" .. tostring(name)
            .. ":" .. tostring(path)
            .. ":" .. tostring(ancestryHash)
            .. ":" .. tostring(debugHash)
            .. ":life=" .. tostring(lifecycleSerial)

        local coreId = hash32(seed)
        stableInstanceIds[instance] = coreId

        if report and report.Metadata and report.Metadata.Identity then
            report.Metadata.Identity.InstanceIdentity = report.Metadata.Identity.InstanceIdentity or {
                Contract = "session+DebugIdHash+ancestryHash+class+name+path+lifecycle_serial",
                DebugIdAvailableCount = 0,
                DebugIdUnavailableCount = 0,
            }
            local identity = report.Metadata.Identity.InstanceIdentity
            if debugId then
                identity.DebugIdAvailableCount += 1
            else
                identity.DebugIdUnavailableCount += 1
            end
        end

        return string.format("%s_%s", prefix or "Instance", coreId)
    end

    local REDACTION_PATTERNS = {
        { Pattern = "https?://[%w%p]+", Label = "url" },
        { Pattern = "%f[%w]webhooks?%f[%W]", Label = "webhook" },
        { Pattern = "bearer%s+[%w%._%-]+", Label = "bearer" },
        { Pattern = "%f[%w]api[_%s-]?key%f[%W]", Label = "apikey" },
        { Pattern = "%f[%w]aws[_%s-]?secret[_%s-]?access[_%s-]?key%f[%W]%s*[:=]?%s*[%w%/+=_-]+", Label = "aws_secret_access_key" },
        { Pattern = "%f[%w]aws[_%s-]?session[_%s-]?token%f[%W]%s*[:=]?%s*[%w%/+=_-]+", Label = "aws_session_token" },
        { Pattern = "%f[%w]akia[%w]+%f[%W]", Label = "aws_access_key" },
        { Pattern = "%f[%w]aiza[%w_-]+%f[%W]", Label = "google_api_key" },
        { Pattern = "%f[%w]ghp_[%w_-]+%f[%W]", Label = "github_pat" },
        { Pattern = "%f[%w]github_pat_[%w_-]+%f[%W]", Label = "github_pat" },
        { Pattern = "%f[%w]xox[baprs]%-%S+", Label = "slack_token" },
        { Pattern = "%f[%w]eyj[%w%-%._~+/=]+%f[%W]", Label = "jwt" },
        { Pattern = "%f[%w]password%f[%W]", Label = "password" },
        { Pattern = "%f[%w]token%f[%W]", Label = "token" },
        { Pattern = "%f[%w]secret%f[%W]", Label = "secret" },
        { Pattern = "%f[%w]sk%-ant%-api[%w_%-]+%f[%W]", Label = "anthropic_api_key" },
        { Pattern = "%f[%w]sk%-proj%-[%w_%-]+%f[%W]", Label = "openai_project_api_key" },
        { Pattern = "%f[%w]sk%-%w[%w_%-]+%f[%W]", Label = "openai_or_generic_api_key" },
        { Pattern = "%.roblosecurity%s*[:=]%s*[^%s]+", Label = "roblox_session_cookie" },
        { Pattern = "roblosecurity%s*[:=]%s*[^%s]+", Label = "roblox_session_cookie" },
        { Pattern = "%f[%w]roblosecurity%f[%W]", Label = "roblox_session_cookie_marker" },
        { Pattern = "%f[%w]cookie%f[%W]%s*[:=]", Label = "cookie_marker" },
    }

    local function detectRedactionLabel(value)
        if value == nil then
            return nil
        end
        local source = tostring(value):gsub("[\r\n\0]", " ")
        local lowered = string.lower(source)
        for _, item in ipairs(REDACTION_PATTERNS) do
            if lowered:match(item.Pattern) then
                return item.Label
            end
        end
        return nil
    end

    local function redactString(value)
        if value == nil then
            return nil
        end
        local source = tostring(value):gsub("[\r\n\0]", " ")
        local label = detectRedactionLabel(source)
        if label then
            return "[REDACTED:" .. label .. "]"
        end
        if CONFIG.DATA_PROFILE == "MINIMAL" then
            return nil
        end
        if #source > CONFIG.MAX_STRING_VALUE_LENGTH then
            return string.sub(source, 1, CONFIG.MAX_STRING_VALUE_LENGTH) .. "..."
        end
        return source
    end

    local function runRedactionSelfTests()
        local cases = {
            { Input = "Authorization: Bearer abc.def.ghi", Expected = "bearer" },
            { Input = "https://hooks.example.com/webhook/abc", Expected = "url" },
            { Input = "https://example.com/api/webhooks/abc", Expected = "url" },
            { Input = ".ROBLOSECURITY=secret_cookie_value", Expected = "roblox_session_cookie" },
            { Input = "ROBLOSECURITY: secret_cookie_value", Expected = "roblox_session_cookie" },
            { Input = "sk-ant-api123456", Expected = "anthropic_api_key" },
            { Input = "sk-proj-abc123", Expected = "openai_project_api_key" },
            { Input = "AKIA1234567890ABCD", Expected = "aws_access_key" },
            { Input = "Authorization: JWT eyJabc.def.ghi", Expected = "jwt" },
            { Input = "tokenizer", Expected = nil },
            { Input = "secretary", Expected = nil },
            { Input = "passwordless", Expected = nil },
            { Input = "topsecretroom", Expected = nil },
            { Input = "passenger", Expected = nil },
            { Input = "apikeyish", Expected = nil },
            { Input = "secretive", Expected = nil },
            { Input = "bearable", Expected = nil },
            { Input = "webhooker", Expected = nil },
            { Input = "ordinary game label", Expected = nil },
            { Input = "player health", Expected = nil },
            { Input = "damage amount", Expected = nil },
            { Input = "scoreboard", Expected = nil },
            { Input = "itemshop", Expected = nil },
            { Input = "questgiver", Expected = nil },
            { Input = "administrator", Expected = nil },
            { Input = "secret room", Expected = nil },
            { Input = "token bucket", Expected = nil },
            { Input = "random api endpoint", Expected = nil },
            { Input = "my webhooker helper", Expected = nil },
            { Input = "api-keyish", Expected = nil },
            { Input = "not_a_secret_value", Expected = nil },
            { Input = "akiabogus", Expected = nil },
            { Input = "aizabogus", Expected = nil },
            { Input = "ghp_", Expected = nil },
            { Input = "github_pat_", Expected = nil },
            { Input = "xoxb", Expected = nil },
            { Input = "eyj_", Expected = nil },
            { Input = "sk-ant-api", Expected = nil },
            { Input = "sk-proj-", Expected = nil },
            { Input = "sk-a", Expected = nil },
            { Input = "nocookie:value", Expected = nil },
            { Input = "authorization basic abc", Expected = nil },
            { Input = "aws_secret_access_key marker", Expected = "aws_secret_access_key" },
        }
        cases[#cases + 1] = { Input = "https://example.com/api?token=abc123&next=1", Expected = "url" }
        cases[#cases + 1] = { Input = "eyJhbGciOiJIUzI1NiJ9.abc-def.ghi_jkl", Expected = "jwt" }
        cases[#cases + 1] = { Input = "Cookie: foo=1; ROBLOSECURITY=secret_cookie_value;", Expected = "roblox_session_cookie" }
        for i = 1, 80 do
            cases[#cases + 1] = { Input = "ordinaryword" .. tostring(i), Expected = nil }
            cases[#cases + 1] = { Input = "administrator" .. tostring(i), Expected = nil }
            cases[#cases + 1] = { Input = "secretary" .. tostring(i), Expected = nil }
        end
        for i = 1, 40 do
            cases[#cases + 1] = { Input = "token=" .. string.rep("x", 8) .. tostring(i), Expected = "token" }
            cases[#cases + 1] = { Input = "password=" .. string.rep("y", 8) .. tostring(i), Expected = "password" }
        end
        table.sort(cases, function(a, b)
            if a.Input == b.Input then
                return tostring(a.Expected) < tostring(b.Expected)
            end
            return a.Input < b.Input
        end)
        local passed, failed = 0, 0
        local maxCases = math.min(#cases, CONFIG.SELF_TEST_MAX_CASES or 512)
        for i = 1, maxCases do
            local item = cases[i]
            if detectRedactionLabel(item.Input) == item.Expected then
                passed += 1
            else
                failed += 1
            end
        end
        return {
            Status = failed == 0 and "PASS" or "FAILED",
            Passed = passed,
            Failed = failed,
            Cases = maxCases,
            TotalCases = #cases,
            PatternModel = "structured_patterns_no_pipe_alternation",
        }
    end

    local reportTextInstanceHashRegistry = setmetatable({}, { __mode = "v" })
    local reportTextInstanceCollisionCount = 0

    local function reportText(value)
        if value == nil then
            return nil
        end

        local isInstance = typeof(value) == "Instance"
        local source = isInstance
            and getInstancePath(value)
            or tostring(value)
        local identityHash = isInstance
            and getStableInstanceId(value, "Instance")
            or hash32(source)

        if isInstance then
            local pathHash = hash32(source)
            local prior = reportTextInstanceHashRegistry[pathHash]
            if prior and prior ~= value then
                reportTextInstanceCollisionCount += 1
                identityHash = string.format(
                    "InstanceCount%s_%s",
                    tostring(reportTextInstanceCollisionCount),
                    identityHash
                )
            else
                reportTextInstanceHashRegistry[pathHash] = value
            end
        end

        local redacted = redactString(source)

        if redacted ~= nil then
            if string.sub(redacted, 1, 10) == "[REDACTED:" then
                local label = redacted:match("^%[REDACTED:([^%]]+)%]") or "value"
                if CONFIG.DATA_PROFILE == "MINIMAL" and CONFIG.MINIMAL_TEXT_MODE == "HASH_ONLY" then
                    return "[hash:" .. identityHash .. "]"
                end
                return "[REDACTED:" .. label .. ":" .. identityHash .. "]"
            end
            return redacted
        end

        if CONFIG.DATA_PROFILE == "MINIMAL" then
            return "[id:" .. identityHash .. "]"
        end

        return source
    end

    local function redactError(_)
        return "[REDACTED_RUNTIME_ERROR]"
    end

    local function initializeTruncation(limit)
        return {
            Limit = limit,
            Stored = 0,
            Dropped = 0,
            Reason = nil,
        }
    end

    local function normalizeTruncationKey(key)
        local raw = tostring(key or ""):gsub("^%s+", ""):gsub("%s+$", "")
        return raw:gsub("[^%w_]", "")
    end

    local function getTruncationEntry(key)
        local normalized = normalizeTruncationKey(key)
        local entry = report.Metadata.Truncation[normalized]
        if not entry and CONFIG.DEVELOPMENT_CHECKS then
            warn(string.format("[DCA] Unknown truncation key: %s", tostring(key)))
        end
        return entry
    end

    recordDrop = function(key, reason)
        local entry = getTruncationEntry(key)
        if not entry then
            return
        end

        entry.Dropped += 1
        reportByteEstimateDropNonce += 1
        entry.Reason = entry.Reason or reason or "limit_reached"
    end

    recordDrops = function(key, amount, reason)
        local entry = getTruncationEntry(key)
        if not entry or not amount or amount <= 0 then
            return
        end

        entry.Dropped += amount
        reportByteEstimateDropNonce += amount
        entry.Reason = entry.Reason or reason or "limit_reached"
    end

    --------------------------------------------------------------------
    -- SANITIZATION
    --------------------------------------------------------------------

    local sanitizationDepthLimitDropped = 0

    local function sanitizeForJSON(value, depth)
        depth = depth or 0

        if depth > 2 then
            sanitizationDepthLimitDropped += 1
            return "[DepthLimit]"
        end

        local valueType = typeof(value)

        if valueType == "nil"
            or valueType == "boolean"
            or valueType == "number"
        then
            if valueType == "number" then
                if value ~= value or value == math.huge or value == -math.huge then
                    return tostring(value)
                end
            end

            return value
        end

        if valueType == "string" then
            local label = detectRedactionLabel(value)
            if label then
                return "[REDACTED:" .. label .. "]"
            end
            local redacted = redactString(value)
            if redacted and #redacted > CONFIG.MAX_STRING_VALUE_LENGTH then
                redacted = string.sub(redacted, 1, CONFIG.MAX_STRING_VALUE_LENGTH) .. "..."
            end
            return redacted or "[REDACTED_STRING]"
        end

        if valueType == "Instance" then
            if CONFIG.DATA_PROFILE == "MINIMAL" then
                return "[Instance:id:" .. tostring(getStableInstanceId(value, "Instance")) .. "]"
            end
            return "[Instance] " .. reportText(getInstancePath(value))
        end

        if valueType == "function" then
            return "[Function]"
        end

        if valueType == "table" then
            local sensitiveKeys = {}
            local normalKeys = {}
            local function isSensitiveKey(key)
                local keyText = string.lower(tostring(key))
                return keyText:find("token", 1, true)
                    or keyText:find("password", 1, true)
                    or keyText:find("secret", 1, true)
                    or keyText:find("cookie", 1, true)
                    or keyText:find("authorization", 1, true)
                    or keyText:find("bearer", 1, true)
                    or keyText:find("webhook", 1, true)
                    or keyText:find("api_key", 1, true)
                    or keyText:find("apikey", 1, true)
            end
            for key in pairs(value) do
                if isSensitiveKey(key) then
                    sensitiveKeys[#sensitiveKeys + 1] = key
                else
                    normalKeys[#normalKeys + 1] = key
                end
            end
            table.sort(sensitiveKeys, function(a,b) return tostring(a) < tostring(b) end)
            table.sort(normalKeys, function(a,b) return tostring(a) < tostring(b) end)
            local selected = {}
            local selectedCount = 0
            for _, key in ipairs(sensitiveKeys) do
                if selectedCount >= 16 then break end
                selectedCount += 1
                selected[#selected + 1] = key
            end
            for _, key in ipairs(normalKeys) do
                if selectedCount >= 16 then break end
                selectedCount += 1
                selected[#selected + 1] = key
            end
            local shallow = {}
            for _, key in ipairs(selected) do
                if isSensitiveKey(key) then
                    shallow[key] = "[REDACTED_KEY]"
                else
                    shallow[key] = sanitizeForJSON(value[key], depth + 1)
                end
            end
            local truncated = (#sensitiveKeys + #normalKeys) > #selected
            if truncated then
                return {
                    __dca_truncated = true,
                    __dca_key_limit = 16,
                    values = shallow,
                }
            end
            return shallow
        end

        if valueType == "thread" then
            return "[Thread]"
        end

        if valueType == "userdata" then
            return "[Userdata]"
        end

        return "[" .. tostring(valueType) .. "]"
    end

