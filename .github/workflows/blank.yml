    if not VALID_AUDIT_PROFILES[CONFIG.AUDIT_PROFILE] then
        recordConfigCorrection("AUDIT_PROFILE", CONFIG.AUDIT_PROFILE, "SAFE_READ_ONLY", "unknown audit profile")
