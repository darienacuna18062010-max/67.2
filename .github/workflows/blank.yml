    local function scanPhysicsService()
        local physicsGroups = report.Environment.PhysicsCollisionGroups

        physicsGroups.Supported = false
        physicsGroups.State = "disabled"
        physicsGroups.Reason = nil

        for i = #physicsGroups.Groups, 1, -1 do
            physicsGroups.Groups[i] = nil
        end

        registerTruncationList(physicsGroups.Groups, "PhysicsGroups")

        if not CONFIG.SCAN_PHYSICS_SERVICE then
            physicsGroups.Reason =
                "SCAN_PHYSICS_SERVICE disabled"
            return
        end

        physicsGroups.State = "probing"

        local PhysicsService = safeCall(function()
            return game:GetService("PhysicsService")
        end, nil)

        if not PhysicsService then
            physicsGroups.State = "unavailable"
            physicsGroups.Reason = "PhysicsService unavailable"
            return
        end

        local groups = safeCall(function()
            return PhysicsService:GetRegisteredCollisionGroups()
        end, nil)

        if type(groups) ~= "table" then
            physicsGroups.Reason =
                "GetRegisteredCollisionGroups unavailable or unsupported"
            return
        end

        physicsGroups.Supported = true
        physicsGroups.State = "available"

        local limit = math.min(#groups, CONFIG.MAX_PHYSICS_GROUPS)
        local limitReached = false
        local dropReason = "limit_reached"

        for i = 1, limit do
            if report.Metadata.Performance.OutputBudgetExceeded then
                limitReached = true
                dropReason = "report_bytes_budget"
                break
            end

            local group = groups[i]
            local record = {
                Name = reportText(safeCall(function() return group.name end, nil)),
                Mask = safeCall(function() return group.mask end, nil),
            }

            if not append(
                physicsGroups.Groups,
                record,
                CONFIG.MAX_PHYSICS_GROUPS
            ) then
                limitReached = true
                dropReason = report.Metadata.Performance.OutputBudgetExceeded
                    and "report_bytes_budget"
                    or "limit_reached"
                break
            end
        end

        if #groups > CONFIG.MAX_PHYSICS_GROUPS then
            limitReached = true
            if dropReason ~= "report_bytes_budget" then
                dropReason = "limit_reached"
            end
        end

        if limitReached then
            local stored = #physicsGroups.Groups
            local dropped = math.max(0, #groups - stored)
            if dropped > 0 then
                recordDrops("PhysicsGroups", dropped, dropReason)
            end
        end
    end

