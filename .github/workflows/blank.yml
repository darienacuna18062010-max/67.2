    if not VALID_IMPACT_POLICIES[CONFIG.IMPACT_POLICY] then
        recordConfigCorrection("IMPACT_POLICY", CONFIG.IMPACT_POLICY, "READ_ONLY", "unknown impact policy")
        CONFIG.IMPACT_POLICY = "READ_ONLY"
