        clearArrayState(trustWatchConnections)
        clearArrayState(illusionWatchConnections)
        clearArrayState(recentUIEvents)
        clearArrayState(recentRemoteCalls)
        clearArrayState(recentRemoteChains)
        clearWeakMap(trustMutationAggregates)
        clearTable(correlationDedupeKeys)
        clearArrayState(correlationDedupeOrder)
        correlationDedupeHead = 1
        clearTable(correlationChainCounts)
        clearTable(recentServerActivity)
        clearArrayState(recentInvokeResponses)
        clearInstanceMembershipSet(scriptContentCandidates)
        clearInstanceMembershipSet(uiInteractionCandidates)
        clearTable(toolInventoryMembership)
        clearWeakMap(dynamicRootResolutionCache)
        trustMutationAggregateCount = 0
        uiStateWatcherCount = 0
        timelineEventCount = 0
    end

    local function pruneRecentInvokeResponses(now)
        local cutoff = now - 0.5
        local write = 1
        for read = 1, #recentInvokeResponses do
            local item = recentInvokeResponses[read]
            if item.At >= cutoff then
                recentInvokeResponses[write] = item
                write += 1
            end
        end
        for i = write, #recentInvokeResponses do
            recentInvokeResponses[i] = nil
        end
    end

    local function shapesCompatible(a, b)
        if type(a) ~= "table" or type(b) ~= "table" or #a ~= #b then
            return false
        end
        for i = 1, #a do
            if a[i] ~= b[i] then
                return false
            end
        end
        return true
    end

    local function recordDataFlowEdge(fromRemote, toRemote, deltaMs, shapeKey)
        if #report.Network.DataFlowGraph.Edges >= CONFIG.MAX_DATAFLOW_EDGES then
            recordDrop("DataFlowEdges", "limit_reached")
            return
        end
        local edge = ensureFindingContract({
            From = fromRemote.EndpointId,
            To = toRemote.EndpointId,
            FromRemoteId = fromRemote.RemoteId,
            ToRemoteId = toRemote.RemoteId,
            FromRemoteName = reportText(fromRemote.RemoteName),
            ToRemoteName = reportText(toRemote.Name),
            DeltaMs = deltaMs,
            CompatibleShape = shapeKey,
            Confidence = "low",
            Evidence = {
                {
                    Source = "runtime_invoke_then_fire_shape",
                    Observed = true,
                    Confidence = "low",
                    Limitations = { "temporal_correlation_does_not_prove_causality" },
                },
            },
        }, "runtime_dataflow", "low", {
            "less_than_500ms_temporal_window",
            "shape_compatibility_only",
            "server_execution_not_observed",
        })
        append(report.Network.DataFlowGraph.Edges, edge, CONFIG.MAX_DATAFLOW_EDGES)
        report.Network.DataFlowGraph.EdgeCount = #report.Network.DataFlowGraph.Edges
        report.Network.DataFlowGraph.Status = "collecting"
    end

    local correlateTrustMutationsWithResponse

    local function captureInvocationResults(fn)
        if type(table.pack) == "function" then
            return table.pack(fn()), nil
        end

        local function packVarargs(...)
            local packed = { n = select("#", ...) }
            for i = 1, packed.n do
                packed[i] = select(i, ...)
            end
            return packed
        end

        local packed = packVarargs(fn())
        return packed, "vararg_pack_fallback"
    end

    local function returnCapturedInvocation(packed, count)
        count = math.max(0, math.min(count or packed.n or 0, packed.n or count or 0))
        if count == 0 then return end
        return table.unpack(packed, 1, count)
    end

    injectPassiveSniffer = function()
        if CONFIG.IMPACT_POLICY ~= "TEMPORARY_HOOK"
            or CONFIG.AUDIT_PROFILE ~= "DEEP_AUTHORIZED"
            or CONFIG.AUTHORIZATION_REF == nil
            or tostring(CONFIG.AUTHORIZATION_REF) == ""
        then
            snifferState.RefusedExecutorHook = true
            snifferState.Status = "refused_by_impact_policy"
            snifferState.StopReason = "temporary_hook_authorization_required"
            snifferState.Active = false
            refreshSnifferReport()
            return
        end

        if auditWallExceeded() then
            snifferState.StopReason = "wall_time"
            snifferState.Status = "wall_time"
            snifferState.Active = false
            refreshSnifferReport()
            return
        end

        if snifferState.Active
            or (snifferState.EverInstalled
                and snifferState.RestoreStatus == "installed_pending_restore")
        then
            refreshSnifferReport()
            return
        end

        if snifferState.RestoreFailed then
            refreshSnifferReport()
            return
        end

        -- Reinstallation starts a fresh ownership transaction.
        snifferState.OwnershipState = {
            Initial = "not_installed",
            Current = "not_installed",
            LostAt = nil,
            Reason = nil,
        }
        snifferState.TransactionStage = "pending"
        snifferState.RestoreStatus = "not_installed"
        snifferState.InstallFailureReason = nil
        snifferState.RestoreFailed = false
        snifferState.RestoreConflict = false
        snifferState.OwnershipLostDuringCapture = false

        if not CONFIG.SNIFF_TRAFFIC then
            snifferState.Status = "disabled"
            refreshSnifferReport()
            return
        end

        local missingSnifferCapability = nil
        local requiredSnifferCapabilities = {
            { Name = "getrawmetatable", Present = GET_RAW_METATABLE ~= nil },
            { Name = "setreadonly", Present = SET_READONLY ~= nil },
            { Name = "getreadonly", Present = GET_READONLY ~= nil },
            { Name = "getnamecallmethod", Present = GET_NAMECALL_METHOD ~= nil },
            { Name = "newcclosure", Present = NEW_CLOSURE ~= nil },
        }
        for _, capability in ipairs(requiredSnifferCapabilities) do
            if not capability.Present then
                missingSnifferCapability = capability.Name
                break
            end
        end
        if missingSnifferCapability then
            snifferState.Status = "unavailable_capabilities"
            snifferState.StopReason = "install_error"
            snifferState.InstallFailureReason = "required_sniffer_capability_missing:" .. missingSnifferCapability
            refreshSnifferReport()
            return
        end

        report.Network.API_Schema = {}
        endpointByInstance = setmetatable({}, { __mode = "k" })
        apiSchemaCount = 0
        externalMethodKeyCount = 0
        report.Network.ExternalActivity.Methods = {}
        report.Network.ExternalActivity.OverflowMethods = 0
        report.Network.ExternalActivity.OverflowMethodSamples = {}
        report.Network.ExternalActivity.UrlShapeHistogram = {}

        local gm = safeCall(function()
            return GET_RAW_METATABLE(game)
        end, nil)

        markCapabilityProbe(
            "getrawmetatable",
            gm ~= nil,
            "getrawmetatable returned nil"
        )
        if not gm then
            snifferState.Status = "install_error"
            snifferState.StopReason = "install_error"
            refreshSnifferReport()
            return
        end

        local readonlyOk, initialReadonly = pcall(GET_READONLY, gm)

        markCapabilityProbe(
            "isreadonly",
            readonlyOk and type(initialReadonly) == "boolean",
            "isreadonly probe failed"
        )
        if not readonlyOk or type(initialReadonly) ~= "boolean" then
            snifferState.Status = "install_error"
            snifferState.StopReason = "install_error"
            refreshSnifferReport()
            return
        end

        local oldNamecall = gm.__namecall
        local originalHookFingerprint = hash32("namecall:" .. tostring(oldNamecall))
        local foreignHookDetected = false
        if IS_EXECUTOR_CLOSURE and type(oldNamecall) == "function" then
            foreignHookDetected = safeCall(function()
                return IS_EXECUTOR_CLOSURE(oldNamecall) == true
            end, false)
        end

        snifferState.OriginalHookFingerprint = originalHookFingerprint
        snifferState.HookFingerprint = nil
        snifferState.ObservedHookFingerprint = originalHookFingerprint
        snifferState.ForeignHookDetected = foreignHookDetected
        snifferState.RefusedExecutorHook = false

        if CONFIG.SNIFFER_OBSERVE_ONLY
            or (CONFIG.SNIFFER_REFUSE_EXECUTOR_HOOK and foreignHookDetected)
        then
            snifferState.Active = false
            snifferState.Status = CONFIG.SNIFFER_OBSERVE_ONLY
                and (foreignHookDetected and "observe_only_foreign_hook" or "observe_only")
                or "foreign_hook_refused"
            snifferState.RefusedExecutorHook = foreignHookDetected and (CONFIG.SNIFFER_REFUSE_EXECUTOR_HOOK == true) or false
            snifferState.StopReason = foreignHookDetected
                and "foreign_hook_detected"
                or "observe_only"
            snifferState.OwnershipState = {
                Initial = foreignHookDetected and "foreign_hook" or "observe_only",
                Current = foreignHookDetected and "foreign_hook" or "not_installed",
                LostAt = nil,
                Reason = foreignHookDetected
                    and "executor_closure_namecall_refused"
                    or "observe_only_configuration",
            }
            refreshSnifferReport()
            return
        end

        local setReadonlyOk = pcall(SET_READONLY, gm, false)

        markCapabilityProbe(
            "setreadonly",
            setReadonlyOk,
            "setreadonly probe failed"
        )

        if not setReadonlyOk then
            snifferState.Status = "install_error"
            snifferState.StopReason = "install_error"
            refreshSnifferReport()
            return
        end

        local startedAt = os.clock()
        report.Metadata.SnifferStartTime = os.time()
        report.Metadata.SnifferStartClock = startedAt

        snifferState.StartedAtClock = startedAt
        snifferState.AbsoluteDeadlineClock =
            startedAt + math.min(
                CONFIG.SNIFFER_ABSOLUTE_DEADLINE_SECONDS,
                CONFIG.MAX_AUDIT_WALL_SECONDS
            )
        snifferState.CaptureWindowTrust = "reliable"
        snifferState.CaptureWindowStatus = "active"
        snifferState.Active = true
        snifferState.Status = "active"
        snifferState.StopReason = nil
        snifferState.TimedOut = false
        snifferState.MaxCallsReached = false
        snifferState.RestoreFailed = false
        snifferState.InstallConflict = false
        snifferState.OwnershipLostDuringCapture = false
        snifferState.OwnershipLossCount = 0
        snifferState.RestoreConflict = false
        snifferState.RestoreStatus = "installed_pending_restore"
        snifferState.OwnershipState = {
            Initial = "installed_verified_pending",
            Current = "installed_verified_pending",
            LostAt = nil,
            Reason = nil,
        }
        snifferState.TransactionStage = "captured_original"
        snifferState.InstallVerifiedAt = nil
        snifferState.RestoreVerifiedAt = nil
        snifferState.EverInstalled = false
        snifferState.OwnershipVerified = false
        snifferState.CallsObserved = 0
        snifferState.RemoteEndpointsProfiled = 0
        snifferState.SignaturesDropped = 0

        local namecallMethodVerified = false
        local namecallMethodCallsSinceVerify = 0
        local namecallMethodVerifyEvery = 64

        local hookClosure
        hookClosure = NEW_CLOSURE(function(self, ...)
            if snifferState.Active then
                local hookNow = os.clock()
                if auditWallExceeded()
                    or (snifferState.AbsoluteDeadlineClock ~= nil
                        and hookNow >= snifferState.AbsoluteDeadlineClock)
                then
                    snifferState.Active = false
                    snifferState.StopReason = "wall_time"
                    snifferState.CaptureWindowTrust = "unreliable"
                    task.defer(function()
                        finalizeSniffer("wall_time")
                    end)
                end
            end

            if not snifferState.Active then
                return oldNamecall(self, ...)
            end

            local method
            namecallMethodCallsSinceVerify += 1
            local shouldVerifyNamecallMethod =
                not namecallMethodVerified
                or namecallMethodCallsSinceVerify >= namecallMethodVerifyEvery
            if shouldVerifyNamecallMethod then
                local okMethod, firstMethod = pcall(GET_NAMECALL_METHOD)

                markCapabilityProbe(
                    "getnamecallmethod",
                    okMethod,
                    "getnamecallmethod probe failed"
                )
                if not okMethod then
                    snifferState.Active = false
                    snifferState.Status = "namecall_method_error"
                    snifferState.StopReason = "install_error"
                    task.defer(function()
                        finalizeSniffer("install_error")
                    end)
                    return oldNamecall(self, ...)
                end
                namecallMethodVerified = true
                namecallMethodCallsSinceVerify = 0
                method = firstMethod or ""
            else
                method = GET_NAMECALL_METHOD() or ""
            end

            local needsSelfClass = CONFIG.SNIFF_EXTERNAL_ACTIVITY
                or method == "BindAction"
                or method == "BindActionAtPriority"
                or method == "UnbindAction"
                or method == "UnbindAllActions"
                or method == "PreloadAsync"
                or method == "GetTagged"
                or method == "GetInstanceAddedSignal"
                or method == "GetInstanceRemovedSignal"
                or method == "GetPolicyInfoForPlayerAsync"
                or method == "GetCore"
                or method == "SetCore"
                or method == "ChangeState"
                or method == "MoveTo"
                or method == "GetTranslatorForPlayerAsync"
                or method == "GetTranslatorForLocaleAsync"
                or method == "GetTextSize"
                or method == "FilterStringAsync"
                or method == "GetChatForUserAsync"
            local selfClass = ""
            if needsSelfClass then
                selfClass = typeof(self) == "Instance" and safeCall(function() return self.ClassName end, "") or ""
            end

            if CONFIG.SNIFF_EXTERNAL_ACTIVITY then
                local isHttp = selfClass == "HttpService"
                    and (method == "RequestAsync" or method == "GetAsync" or method == "PostAsync")
                local isTeleport = selfClass == "TeleportService"
                    and method == "TeleportAsync"

                if isHttp then
                    report.Network.ExternalActivity.HttpCalls += 1
                    recordExternalActivityMethod(method)
                    recordExternalUrlShape(select(1, ...))
                elseif isTeleport then
                    report.Network.ExternalActivity.Teleports += 1
                    recordExternalActivityMethod(method)
                end
                if selfClass == "ContentProvider" and method == "PreloadAsync" then
                    recordExternalActivityMethod("ContentProvider.PreloadAsync")
                    recordExternalUrlShape(select(1, ...))
                elseif (selfClass == "DataStoreService" or selfClass == "MemoryStoreService")
                    and (method == "GetAsync" or method == "SetAsync" or method == "UpdateAsync" or method == "IncrementAsync" or method == "RemoveAsync")
                then
                    recordExternalActivityMethod(selfClass .. "." .. method)
                elseif selfClass == "PolicyService" and method == "GetPolicyInfoForPlayerAsync" then
                    recordExternalActivityMethod("PolicyService.GetPolicyInfoForPlayerAsync")
                elseif selfClass == "LocalizationService"
                    and (method == "GetTranslatorForPlayerAsync" or method == "GetTranslatorForLocaleAsync")
                then
                    recordExternalActivityMethod("LocalizationService." .. method)
                    report.Environment.LocalizationTextActivity.LocalizationCalls += 1
                elseif selfClass == "TextService"
                    and (method == "GetTextSize" or method == "FilterStringAsync" or method == "GetChatForUserAsync")
                then
                    recordExternalActivityMethod("TextService." .. method)
                    report.Environment.LocalizationTextActivity.TextServiceCalls += 1
                end
            end

            if selfClass == "CollectionService"
                and (method == "GetTagged" or method == "GetInstanceAddedSignal" or method == "GetInstanceRemovedSignal")
            then
                report.Environment.TagRuntimeActivity[method] += 1
            elseif selfClass == "PolicyService" and method == "GetPolicyInfoForPlayerAsync" then
                report.Environment.PolicyActivity = report.Environment.PolicyActivity or { GetPolicyInfoForPlayerAsync = 0 }
                report.Environment.PolicyActivity.GetPolicyInfoForPlayerAsync += 1
            elseif selfClass == "StarterGui" and (method == "GetCore" or method == "SetCore") then
                report.Environment.StarterGuiCoreActivity = report.Environment.StarterGuiCoreActivity or { GetCore = 0, SetCore = 0 }
                report.Environment.StarterGuiCoreActivity[method] += 1
            elseif selfClass == "Humanoid" and (method == "ChangeState" or method == "MoveTo") then
                report.Environment.HumanoidMovementActivity = report.Environment.HumanoidMovementActivity or { ChangeState = 0, MoveTo = 0 }
                report.Environment.HumanoidMovementActivity[method] += 1
            elseif selfClass == "UserInputService" and (method == "SetMouseBehaviorOverride" or method == "SetMouseIconEnabled") then
                report.Environment.UserInputActivity = report.Environment.UserInputActivity or { SetMouseBehaviorOverride = 0, SetMouseIconEnabled = 0 }
                if method == "SetMouseBehaviorOverride" or method == "SetMouseBehavior" then report.Environment.UserInputActivity.SetMouseBehaviorOverride += 1 elseif method == "SetMouseIconEnabled" then report.Environment.UserInputActivity.SetMouseIconEnabled += 1 end
            end

            if selfClass == "ContextActionService" then
                local activity = report.Network.ContextActionActivity
                local observedMethod = false
                if method == "BindAction" then
                    activity.BindActionCalls += 1
                    observedMethod = true
                elseif method == "BindActionAtPriority" then
                    activity.BindActionAtPriorityCalls += 1
                    observedMethod = true
                elseif method == "UnbindAction" then
                    activity.UnbindActionCalls += 1
                    observedMethod = true
                elseif method == "UnbindAllActions" then
                    activity.UnbindAllActionsCalls += 1
                    observedMethod = true
                end
                if observedMethod then
                    activity.Observed = true
                    activity.Reason = "observed_via_dynamic_namecall"
                    local evidence = activity.Evidence and activity.Evidence[1]
                    if evidence then
                        evidence.Observed = true
                        evidence.Confidence = "high"
                        evidence.CollectedAt = os.time()
                    end
                end
            end

            local isRemoteCallMethod =
                method == "FireServer"
                or method == "FireUnreliable"
                or method == "InvokeServer"
                or method == "Fire"
                or method == "Invoke"
            if isRemoteCallMethod then
                if CONFIG.SNIFFER_MAX_CALLS > 0
                    and snifferState.CallsObserved >= CONFIG.SNIFFER_MAX_CALLS
                then
                    snifferState.MaxCallsReached = true
                    snifferState.Active = false
                    task.defer(function()
                        finalizeSniffer("max_calls")
                    end)
                    return oldNamecall(self, ...)
                end

                local now = os.clock()
                snifferState.CallsObserved += 1
                local path = getInstancePath(self)
                recordObservationEvent(
                    "remote_call",
                    "passive_namecall",
                    getStableInstanceId(self, "Endpoint"),
                    nil,
                    { Method = method, Observed = true }
                )
                local remoteClass = safeCall(function() return self.ClassName end, "Unknown")
                local remoteName = safeCall(function() return self.Name end, "Unknown")
                local remoteNameLower = string.lower(tostring(remoteName))
                recentServerActivity[remoteNameLower] = now
                if remoteNameLower:find("win", 1, true)
                    or remoteNameLower:find("victory", 1, true)
                    or remoteNameLower:find("complete", 1, true)
                    or remoteNameLower:find("award", 1, true)
                    or remoteNameLower:find("claim", 1, true)
                then
                    recentServerActivity["__win__"] = now
                end
                local nameHeuristic, nameHeuristicSeverity = findSensitiveWord(remoteName)
                local dynamicRoot = resolveDynamicRoot(self)
                local endpointIdentity = getStableInstanceId(self, "Endpoint")
                local remoteData = endpointByInstance[self]
                    or report.Network.API_Schema[endpointIdentity]
                local invokeResponseRemote = nil

                if method == "GetAttribute" or method == "SetAttribute" then
                    local activity = report.Network.AttributeActivity
                    if method == "GetAttribute" then
                        activity.GetAttributeCalls += 1
                    else
                        activity.SetAttributeCalls += 1
                    end
                    activity.Evidence[1].Observed = true
                    activity.Evidence[1].Confidence = "high"
                    activity.Evidence[1].CollectedAt = os.time()
                    local key = select(1, ...)
                    if type(key) == "string" and key ~= "" then
                        local keyId = reportText(key)
                        if activity.Keys[keyId] == nil then
                            if activity.KeyCount < CONFIG.MAX_ATTRIBUTE_ACTIVITY_KEYS then
                                activity.Keys[keyId] = {
                                    Count = 1,
                                    SampleInstanceId = getStableInstanceId(self, "AttributeSource"),
                                }
                                activity.KeyCount += 1
                            else
                                activity.SamplesDropped += 1
                            end
                        else
                            activity.Keys[keyId].Count += 1
                        end
                    end
                end

                if not remoteData then
                    if report.Network.API_Schema[endpointIdentity] then
                        remoteData = report.Network.API_Schema[endpointIdentity]
                        endpointByInstance[self] = remoteData
                    elseif apiSchemaCount < CONFIG.MAX_API_SCHEMAS then
                        apiSchemaCount += 1
                        local endpointId = endpointIdentity
                        remoteData = {
                            EndpointId = endpointId,
                            InstanceId = getStableInstanceId(self, "ObservedInstance"),
                            Name = reportText(remoteName),
                            Class = remoteClass,
                            Root = dynamicRoot,
                            HeuristicKeyword = nameHeuristic,
                            HeuristicSeverity = nameHeuristicSeverity,
                            ArgumentCountMin = nil,
                            ArgumentCountMax = nil,
                            ArgumentCountSet = {},
                            ShapeHistogram = {},
                            ShapeSamples = 0,
                            RootHistory = { dynamicRoot },
                            Calls = 0,
                            FirstMethod = method,
                            Methods = { method },
                            MethodSet = { [method] = true },
                            FirstSeen = now,
                            LastSeen = now,
                            CurrentPath = CONFIG.DATA_PROFILE == "DETAILED" and reportText(path) or nil,
                            PathHistory = {},
                            PathChangedCount = 0,
                            RootChangedCount = 0,
                            Signatures = {},
                            SignatureIndex = {},
                            ResponseObserved = false,
                            ResponseCallsObserved = 0,
                            ResponseArityMin = nil,
                            ResponseArityMax = nil,
                            ResponseTypeSet = {},
                            ResponseTypeSetCount = 0,
                            ResponseShapeHistogram = {},
                            ResponseShapeCount = 0,
                            ResponseSamples = 0,
                            ResponseSamplesDropped = 0,
                            Provenance = "dynamic_namecall",
                            Confidence = "high",
                            Evidence = {
                                {
                                    Source = "dynamic_namecall",
                                    Observation = "runtime namecall on exact Instance",
                                    Confidence = "high",
                                    Observed = true,
                                    CollectedAt = os.time(),
                                    Coverage = "client_visible_capture_window",
                                    Limitations = { "does_not_establish_server_side_validation" },
                                }
                            },
                        }

                        if CONFIG.DATA_PROFILE == "DETAILED" then
                            appendBoundedHistory(remoteData.PathHistory, reportText(path), CONFIG.MAX_PATH_HISTORY)
                        end

                        report.Network.API_Schema[endpointId] = remoteData
                        endpointByInstance[self] = remoteData
                        snifferState.RemoteEndpointsProfiled = apiSchemaCount
                        report.Metadata.Truncation.APIEndpoints.Stored = apiSchemaCount
                    else
                        recordDrop("APIEndpoints", "endpoint_limit_reached")
                    end
                end

                if remoteData then
                    local currentPath = CONFIG.DATA_PROFILE == "DETAILED" and reportText(path) or nil
                    if currentPath and remoteData.CurrentPath and currentPath ~= remoteData.CurrentPath then
                        remoteData.PathChangedCount += 1
                        appendBoundedHistory(remoteData.PathHistory, currentPath, CONFIG.MAX_PATH_HISTORY)
                    end
                    if currentPath then
                        remoteData.CurrentPath = currentPath
                    end
                    if dynamicRoot ~= remoteData.Root then
                        remoteData.RootChangedCount += 1
                        appendBoundedHistory(remoteData.RootHistory, dynamicRoot, CONFIG.MAX_PATH_HISTORY)
                        remoteData.Root = dynamicRoot
                    end

                    remoteData.Calls += 1
                    remoteData.LastSeen = now
                    remoteData.HeuristicKeyword = remoteData.HeuristicKeyword or nameHeuristic
                    if method == "InvokeServer" then
                        invokeResponseRemote = remoteData
                    end
                    remoteData.HeuristicSeverity = remoteData.HeuristicSeverity or nameHeuristicSeverity

                    local argumentCount = select("#", ...)
                    local callShapeKeys = nil
                    local callValueHashes = nil
                    if argumentCount <= CONFIG.SNIFFER_MAX_SIGNATURE_ARGS then
                        callShapeKeys = {}
                        callValueHashes = {}
                        for i = 1, argumentCount do
                            local arg = select(i, ...)
                            callShapeKeys[i] = argumentShapeKey(describeArgument(arg))
                            callValueHashes[i] = observationValueHash(arg)
                        end
                    end

                    recordTimeline("remote_call", "sniffer", {
                        Method = method,
                        EndpointId = remoteData.EndpointId,
                        RemoteId = getStableInstanceId(self, "Remote"),
                        Root = dynamicRoot,
                    })
                    if callShapeKeys then
                        for _, aggregate in pairs(trustMutationAggregates) do
                            if aggregate.Count > 0 and aggregate.LastAt and math.abs(now - aggregate.LastAt) <= 0.5 then
                                local exactHash = false
                                if aggregate.LastValueHash and callValueHashes then
                                    for _, remoteHash in ipairs(callValueHashes) do
                                        if remoteHash == aggregate.LastValueHash then
                                            exactHash = true
                                            break
                                        end
                                    end
                                end
                                if exactHash then
                                    aggregate.ServerConfirmation = "confirmed"
                                    aggregate.ServerConfirmationAt = now
                                    aggregate.ServerResponseCorrelation = "remote_call_exact_value_hash_match"
                                elseif aggregate.LastValueShapeKey then
                                    for _, remoteShape in ipairs(callShapeKeys) do
                                        if remoteShape == aggregate.LastValueShapeKey then
                                            aggregate.ServerConfirmation = "not_observed"
                                            aggregate.ServerConfirmationAt = now
                                            aggregate.ServerResponseCorrelation = "shape_match_without_value_confirmation"
                                            break
                                        end
                                    end
                                end
                            end
                        end
                    end
                    recordRemoteTimelineCorrelation(now, method, remoteData, callShapeKeys, callValueHashes)

                    if method == "FireServer" and callShapeKeys then
                        pruneRecentInvokeResponses(now)
                        for _, invokeEvent in ipairs(recentInvokeResponses) do
                            if now >= invokeEvent.At
                                and (now - invokeEvent.At) < 0.5
                                and shapesCompatible(invokeEvent.Shapes, callShapeKeys)
                            then
                                recordDataFlowEdge(
                                    {
                                        EndpointId = invokeEvent.EndpointId,
                                        RemoteId = invokeEvent.RemoteId,
                                        RemoteName = invokeEvent.RemoteName,
                                    },
                                    {
                                        EndpointId = remoteData.EndpointId,
                                        RemoteId = getStableInstanceId(self, "Remote"),
                                        Name = remoteData.Name,
                                    },
                                    (now - invokeEvent.At) * 1000,
                                    invokeEvent.ShapeKey
                                )
                            end
                        end
                    end
                    remoteData.ArgumentCountMin =
                        remoteData.ArgumentCountMin and math.min(remoteData.ArgumentCountMin, argumentCount)
                        or argumentCount
                    remoteData.ArgumentCountMax =
                        remoteData.ArgumentCountMax and math.max(remoteData.ArgumentCountMax, argumentCount)
                        or argumentCount
                    remoteData.ArgumentCountSet[tostring(argumentCount)] =
                        (remoteData.ArgumentCountSet[tostring(argumentCount)] or 0) + 1

                    if not remoteData.MethodSet[method] then
                        remoteData.MethodSet[method] = true
                        remoteData.Methods[#remoteData.Methods + 1] = method
                    end

                    local sampleRate = math.max(1, CONFIG.SNIFFER_SIGNATURE_SAMPLE_RATE)
                    local shouldSampleSignature =
                        ((snifferState.CallsObserved - 1) % sampleRate) == 0
                        and argumentCount <= CONFIG.SNIFFER_MAX_SIGNATURE_ARGS

                    if shouldSampleSignature then
                        local signatureParts = {}
                        local shapes = {}
                        local shapeKeys = {}
                        for i = 1, argumentCount do
                            local argument = select(i, ...)
                            signatureParts[i] = typeof(argument)
                            local shape = describeArgument(argument)
                            shapes[i] = shape
                            shapeKeys[i] = argumentShapeKey(shape)
                        end

                        local signatureTypes = table.concat(signatureParts, ", ")
                        local shapeKey = table.concat(shapeKeys, ",")
                        local signature = signatureTypes .. " | " .. shapeKey
                        remoteData.ShapeHistogram[signature] =
                            (remoteData.ShapeHistogram[signature] or 0) + 1
                        remoteData.ShapeSamples += 1
                        local existingSignature = remoteData.SignatureIndex[signature]
                        if existingSignature then
                            existingSignature.LastSeen = now
                            existingSignature.Calls += 1
                        elseif #remoteData.Signatures < CONFIG.MAX_API_SIGNATURES_PER_REMOTE then
                            local newSignature = {
                                Types = signatureTypes,
                                ShapeKey = table.concat(shapeKeys, ","),
                                Shapes = shapes,
                                ArgumentCount = argumentCount,
                                Calls = 1,
                                FirstSeen = now,
                                LastSeen = now,
                            }
                            remoteData.Signatures[#remoteData.Signatures + 1] = newSignature
                            remoteData.SignatureIndex[signature] = newSignature
                        else
                            snifferState.SignaturesDropped += 1
                        end
                    elseif argumentCount > CONFIG.SNIFFER_MAX_SIGNATURE_ARGS then
                        snifferState.SignaturesDropped += 1
                    end
                end
            end

            if invokeResponseRemote and method == "InvokeServer" then
                local packed, packFallback = captureInvocationResults(function()
                    return oldNamecall(self, ...)
                end)
                local responseCount = packed.n or 0
                if packFallback then
                    invokeResponseRemote.ResponseCaptureFallback = packFallback
                end
                invokeResponseRemote.ResponseObserved = true
                invokeResponseRemote.ResponseCallsObserved += 1
                snifferState.TotalResponseCallsObserved += 1
                invokeResponseRemote.ResponseArityMin = invokeResponseRemote.ResponseArityMin
                    and math.min(invokeResponseRemote.ResponseArityMin, responseCount)
                    or responseCount
                invokeResponseRemote.ResponseArityMax = invokeResponseRemote.ResponseArityMax
                    and math.max(invokeResponseRemote.ResponseArityMax, responseCount)
                    or responseCount

                local responseTypes = {}
                local responseShapes = {}
                for i = 1, responseCount do
                    local value = packed[i]
                    responseTypes[i] = typeof(value)
                    responseShapes[i] = argumentShapeKey(describeArgument(value))
                end
                local responseTypeKey = table.concat(responseTypes, ",")
                local responseShape = responseTypeKey .. " | " .. table.concat(responseShapes, ",")
                if invokeResponseRemote.ResponseTypeSet[responseTypeKey] ~= nil then
                    invokeResponseRemote.ResponseTypeSet[responseTypeKey] += 1
                elseif invokeResponseRemote.ResponseTypeSetCount < CONFIG.MAX_API_SIGNATURES_PER_REMOTE then
                    invokeResponseRemote.ResponseTypeSet[responseTypeKey] = 1
                    invokeResponseRemote.ResponseTypeSetCount += 1
                else
                    invokeResponseRemote.ResponseSamplesDropped += 1
                end
                if invokeResponseRemote.ResponseShapeHistogram[responseShape] ~= nil then
                    invokeResponseRemote.ResponseShapeHistogram[responseShape] += 1
                elseif invokeResponseRemote.ResponseShapeCount < CONFIG.MAX_API_SIGNATURES_PER_REMOTE then
                    invokeResponseRemote.ResponseShapeHistogram[responseShape] = 1
                    invokeResponseRemote.ResponseShapeCount += 1
                else
                    invokeResponseRemote.ResponseSamplesDropped += 1
                end
                invokeResponseRemote.ResponseSamples += 1

                local responseNow = os.clock()
                correlateTrustMutationsWithResponse(packed, responseCount, responseNow)

                recentInvokeResponses[#recentInvokeResponses + 1] = {
                    At = responseNow,
                    EndpointId = invokeResponseRemote.EndpointId,
                    RemoteId = getStableInstanceId(self, "Remote"),
                    RemoteName = invokeResponseRemote.Name,
                    Shapes = responseShapes,
                    ShapeKey = responseShape,
                }
                pruneRecentInvokeResponses(os.clock())

                local authoritativeName = string.lower(tostring(remoteName))
                if authoritativeName:find("admin", 1, true)
                    or authoritativeName:find("grant", 1, true)
                    or authoritativeName:find("purchase", 1, true)
                    or authoritativeName:find("buy", 1, true)
                    or authoritativeName:find("sell", 1, true)
                    or authoritativeName:find("trade", 1, true)
                    or authoritativeName:find("currency", 1, true)
                    or authoritativeName:find("claim", 1, true)
                    or authoritativeName:find("award", 1, true)
                    or authoritativeName:find("permission", 1, true)
                then
                    recordTrustBoundary("invoke_server_authority", {
                        RemoteId = invokeResponseRemote.EndpointId,
                        Remote = reportText(remoteName),
                        Method = "InvokeServer",
                        AuthoritySignal = "name_heuristic",
                    }, {
                        {
                            Source = "runtime_invoke_authority_heuristic",
                            Observed = true,
                            Confidence = "low",
                            Limitations = { "name_heuristic_does_not_prove_server_authority" },
                        },
                    })
                end

                return returnCapturedInvocation(packed, responseCount)
            end

            return oldNamecall(self, ...)
        end)

        markCapabilityProbe(
            "newcclosure",
            hookClosure ~= nil,
            hookClosure and nil or "newcclosure returned nil"
        )

        snifferState.HookFingerprint = hash32("namecall:" .. tostring(hookClosure))

        local installed = pcall(function()
            gm.__namecall = hookClosure
        end)
        if not installed then
            pcall(SET_READONLY, gm, initialReadonly)
            snifferState.Status = "install_error"
            snifferState.StopReason = "install_error"
            refreshSnifferReport()
            return
        end

        local readonlyRestored = pcall(SET_READONLY, gm, initialReadonly)
        if not readonlyRestored then
            local restoredImmediately = false

            pcall(function()
                SET_READONLY(gm, false)
                gm.__namecall = oldNamecall
                restoredImmediately = true
                SET_READONLY(gm, initialReadonly)
            end)

            snifferState.Status = restoredImmediately and "install_error" or "restore_failed"
            snifferState.StopReason = "install_error"
            snifferState.RestoreFailed = not restoredImmediately
            snifferState.EverInstalled = not restoredImmediately
            snifferState.RestoreStatus = restoredImmediately and "restored_immediately" or "failed"
            snifferState.TransactionStage = restoredImmediately and "restore_verified" or "restore_failed"
            snifferState.RestoreVerifiedAt = restoredImmediately and os.time() or nil
            snifferState.CaptureWindowStatus = "no_capture_window"
            snifferState.Active = false
            refreshSnifferReport()
            return
        end

        local installedHook = gm.__namecall
        snifferState.ObservedHookFingerprint = hash32("namecall:" .. tostring(installedHook))
        if installedHook ~= hookClosure then
            snifferState.Status = "install_conflict"
            snifferState.StopReason = "install_conflict"
            snifferState.InstallConflict = true
            snifferState.OwnershipState = {
                Initial = "install_conflict",
                Current = "foreign_hook",
                LostAt = os.clock(),
                Reason = "hook_changed_before_capture_start",
            }
            snifferState.EverInstalled = false
            snifferState.Active = false
            refreshSnifferReport()
            return
        end

        snifferState.EverInstalled = true
        snifferState.TransactionStage = "install_verified"
        snifferState.InstallVerifiedAt = os.time()
        snifferState.HookStillAttached = true
        snifferState.OwnershipVerified = true
        snifferState.OwnershipState.Initial = "owned"
        snifferState.OwnershipState.Current = "owned"
        snifferState.RestoreStatus = "pending"

        passiveSnifferRestore = function()
            local currentHook = gm.__namecall
            snifferState.ObservedHookFingerprint = hash32("namecall:" .. tostring(currentHook))
            if currentHook == oldNamecall then
                snifferState.HookStillAttached = false
                snifferState.OwnershipVerified = false
                return "restored"
            end
            if currentHook ~= hookClosure then
                return "conflict"
            end

            local setWritableOk = pcall(SET_READONLY, gm, false)
            local restored = pcall(function()
                gm.__namecall = oldNamecall
            end)

            if not restored and not setWritableOk then
                snifferState.RestoreConflict = true
                return "conflict"
            end

            local readonlyRestored = pcall(SET_READONLY, gm, initialReadonly)
            if restored and readonlyRestored then
                return "restored"
            end
            if restored then
                snifferState.RestoreConflict = true
                return "conflict"
            end
            return "failed"
        end

        if CONFIG.SNIFFER_WATCHDOG_SECONDS > 0 then
            task.spawn(function()
                while snifferState.Active do
                    task.wait(CONFIG.SNIFFER_WATCHDOG_SECONDS)
                    if not snifferState.Active then
                        break
                    end

                    local currentHook = safeCall(function()
                        return gm.__namecall
                    end, nil)
                    local attached = currentHook == hookClosure
                    if not attached then
                        snifferState.ObservedHookFingerprint =
                            hash32("namecall:" .. tostring(currentHook))
                    end

                    if auditWallExceeded()
                        or (snifferState.AbsoluteDeadlineClock ~= nil
                            and os.clock() >= snifferState.AbsoluteDeadlineClock)
                    then
                        snifferState.Active = false
                        snifferState.Status = "wall_time"
                        snifferState.StopReason = "wall_time"
                        snifferState.CaptureWindowTrust = "unreliable"
                        task.defer(function()
                            finalizeSniffer("wall_time")
                        end)
                        break
                    end

                    if not attached then
                        snifferState.HookStillAttached = false
                        snifferState.OwnershipVerified = false
                        snifferState.OwnershipLostDuringCapture = true
                        snifferState.OwnershipLossCount += 1
                        snifferState.Active = false
                        snifferState.Status = "ownership_lost"
                        snifferState.StopReason = "ownership_lost_during_capture"
                        snifferState.OwnershipState.Current = "foreign_hook"
                        snifferState.OwnershipState.LostAt = os.clock()
                        snifferState.OwnershipState.Reason = "watchdog_detected_foreign_namecall"
                        task.defer(function()
                            finalizeSniffer("ownership_lost_during_capture")
                        end)
                        break
                    end

                    snifferState.OwnershipState.Current = "owned"
                    snifferState.HookStillAttached = true
                end
            end)
        end

        if CONFIG.SNIFFER_TIMEOUT_SECONDS > 0 then
            task.delay(
                math.min(
                    CONFIG.SNIFFER_TIMEOUT_SECONDS,
                    CONFIG.SNIFFER_ABSOLUTE_DEADLINE_SECONDS
                ),
                function()
                    if snifferState.Active and passiveSnifferRestore then
                        if auditWallExceeded()
                            or (snifferState.AbsoluteDeadlineClock ~= nil
                                and os.clock() >= snifferState.AbsoluteDeadlineClock)
                        then
                            snifferState.CaptureWindowTrust = "unreliable"
                            finalizeSniffer("wall_time")
                        else
                            snifferState.TimedOut = true
                            finalizeSniffer("timeout")
                        end
                    end
                end
            )
        end
        if CONFIG.SNIFFER_ABSOLUTE_DEADLINE_SECONDS > CONFIG.SNIFFER_TIMEOUT_SECONDS then
            task.delay(
                CONFIG.SNIFFER_ABSOLUTE_DEADLINE_SECONDS,
                function()
                    if snifferState.Active and passiveSnifferRestore then
                        snifferState.CaptureWindowTrust = "unreliable"
                        finalizeSniffer("wall_time")
                    end
                end
            )
        end

        refreshSnifferReport()
        if CONFIG.DEVELOPMENT_CHECKS and not CONFIG.SILENT_OUTPUT then
            notify("Sniffer diagnóstico", "Captura agregada activa durante una ventana controlada.")
        end
    end


    --------------------------------------------------------------------
    -- EXECUTOR ENVIRONMENT OBSERVATION
    --------------------------------------------------------------------

    local function scanEnvironmentPollution()
        report.Environment.Pollution = {
            Supported = false,
            State = "disabled",
            Reason = nil,
            ShadowedGlobals = {},
            LocalOnlyKeys = {},
            AdditionalKeys = {},
        }

        -- Pollution is replaced as a table at scan time, so truncation references
        -- must be re-registered before append() is used.
        registerTruncationList(
            report.Environment.Pollution.ShadowedGlobals,
            "PollutionGlobals"
        )
        registerTruncationList(
            report.Environment.Pollution.LocalOnlyKeys,
            "PollutionLocalOnly"
        )
        registerTruncationList(
            report.Environment.Pollution.AdditionalKeys,
            "PollutionAdditional"
        )

        if CONFIG.DATA_PROFILE == "MINIMAL" then
            report.Environment.Pollution.Supported = false
            report.Environment.Pollution.State = "unavailable_by_profile"
            report.Environment.Pollution.Reason = "MINIMAL profile suppresses executor-environment enumeration"
            return
        end

        if not GET_GENV then
            report.Environment.Pollution.State = "absent"
            report.Environment.Pollution.Reason =
                "getgenv unavailable"
            return
        end

        local genv = safeCall(function()
            return GET_GENV()
        end, nil)

        markCapabilityProbe(
            "getgenv",
            type(genv) == "table",
            "getgenv returned unsupported data"
        )

        local currentEnv = safeCall(function()
            return getfenv()
        end, nil)

        if type(genv) ~= "table" or type(currentEnv) ~= "table" then
            report.Environment.Pollution.State = "probe_failed"
            report.Environment.Pollution.Reason =
                "environment table unavailable"
            return
        end

        report.Environment.Pollution.Supported = true
        report.Environment.Pollution.State = "usable"

        for _, key in ipairs(CONFIG.POLLUTION_OBSERVED_KEYS) do
            local genvValue = rawget(genv, key)
            local currentValue = rawget(currentEnv, key)

            if genvValue ~= nil
                and currentValue ~= nil
                and genvValue ~= currentValue
            then
                if not append(
                    report.Environment.Pollution.ShadowedGlobals,
                    {
                        Key = key,
                        CurrentType = type(currentValue),
                        GenvType = type(genvValue),
                    },
                    CONFIG.MAX_POLLUTION_KEYS
                ) then
                    recordDrop("PollutionGlobals", "limit_reached")
                end
            elseif currentValue ~= nil and genvValue == nil then
                if not append(
                    report.Environment.Pollution.LocalOnlyKeys,
                    {
                        Key = key,
                        CurrentType = type(currentValue),
                    },
                    CONFIG.MAX_POLLUTION_KEYS
                ) then
                    recordDrop("PollutionLocalOnly", "limit_reached")
                end
            end
        end

        if CONFIG.DATA_PROFILE == "DETAILED" then
            local extraCount = 0
            for key in pairs(genv) do
                if extraCount >= CONFIG.MAX_ENVIRONMENT_EXTRA_KEYS then
                    break
                end

                if type(key) == "string" and not POLLUTION_OBSERVED_SET[key] then
                    extraCount += 1
                    local appended = append(
                        report.Environment.Pollution.AdditionalKeys,
                        {
                            Key = reportText(key),
                            ValueType = type(rawget(genv, key)),
                        },
                        CONFIG.MAX_ENVIRONMENT_EXTRA_KEYS
                    )

                    if not appended then
                        recordDrop("PollutionAdditional", "limit_reached")
                        break
                    end
                end
            end
        end

        report.Environment.Pollution.Note =
            "ShadowedGlobals registra diferencias entre getgenv() y el entorno actual; no demuestra por sí sola que el juego haya realizado la modificación."
    end

    local EVIDENCE_LIMITATIONS_BY_SOURCE = {
        static_scan = { "client_visible_snapshot_only", "streaming_may_omit_unloaded_instances" },
        static_name_heuristic = { "name_heuristic_only", "not_a_server_validation_result" },
        static_ui_heuristic = { "ui_name_heuristic_only", "not_a_server_validation_result" },
        static_ui_visibility = { "layout_snapshot_only", "interaction_state_is_not_usage" },
        dynamic_namecall = { "capture_window_limited", "server_validation_unobserved", "client_visible_only" },
        gc_constant_heuristic = { "gc_universe_is_executor_dependent", "sampling_or_limits_may_apply" },
        sensitivity_heuristic = { "heuristic_classification_only" },
        ui_visibility = { "layout_snapshot_only", "streaming_may_omit_unloaded_instances" },
        ui_interaction_state = { "interaction_state_is_not_usage" },
        instance_metatable_probe = { "executor_dependent", "read_only_probe", "does_not_prove_behavior" },
        upvalue_module_instance = { "inferred_dependency_only", "does_not_prove_require_call" },
