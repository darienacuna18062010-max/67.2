    local instanceMembershipSets = setmetatable({}, { __mode = "k" })

    local function addUniqueInstance(list, instance, max)
        if not instance then
            return
        end
        local limit = max or math.huge
        if #list >= limit then
            return
        end
        local set = instanceMembershipSets[list]
        if not set then
            set = setmetatable({}, { __mode = "k" })
            instanceMembershipSets[list] = set
        end
        if set[instance] then
            return
        end
        set[instance] = true
        list[#list + 1] = instance
    end

    local function clearInstanceMembershipSet(list)
        local set = instanceMembershipSets[list]
        if set and type(table.clear) == "function" then
            table.clear(set)
        else
            instanceMembershipSets[list] = nil
        end
    end

    local function observeArchetypeName(name, source)
        local normalized = string.lower(tostring(name or ""))
        local typeKey = string.lower(tostring(source or "instance_name"))
        if normalized == "" then
            return
        end
        local uniqueSignalKey = typeKey .. "\0" .. normalized
        for archetype, descriptor in pairs(GAME_ARCHETYPES) do
            for _, token in ipairs(descriptor.Signals) do
                if normalized:find(string.lower(token), 1, true) then
                    local seenKey = archetype .. "\0" .. uniqueSignalKey
                    if not archetypeSignalSeen[seenKey] then
                        archetypeSignalSeen[seenKey] = true
                        archetypeSignalCounts[archetype] = (archetypeSignalCounts[archetype] or 0) + 1
                        archetypeSignals[archetype] = archetypeSignals[archetype] or {}
                        if #archetypeSignals[archetype] < 25 then
                            archetypeSignals[archetype][#archetypeSignals[archetype] + 1] = {
                                NameHash = hash32(normalized),
                                Token = token,
                                Source = source or "instance_name",
                            }
                        end
                    end
                    break
                end
            end
        end
    end

    local function archetypeRiskForName(name)
        local normalized = string.lower(tostring(name or ""))
        local best = nil
        local bestOrder = 0
        for archetype, descriptor in pairs(GAME_ARCHETYPES) do
            local score = archetypeSignalCounts[archetype] or 0
            if score > 0 then
                for _, token in ipairs(descriptor.Risk) do
                    if normalized:find(string.lower(token), 1, true) then
                        local level = score >= 5 and "HIGH" or "MEDIUM"
                        local order = SEVERITY_ORDER[level]
                        if order > bestOrder then
                            best = archetype
                            bestOrder = order
                        end
                        break
                    end
                end
            end
        end
        return best, best and (bestOrder >= 3 and "HIGH" or "MEDIUM") or nil
    end

    local function ensureFindingContract(finding, provenance, confidence, limitations, serverChecks, validationRelevance)
        if type(finding) ~= "table" then
            return finding
        end
        finding.FindingId = finding.FindingId or nextAuditId("FIND")
        finding.PhaseId = finding.PhaseId or CURRENT_PHASE_ID or "PH-UNASSIGNED"
        finding.RootId = finding.RootId or currentRootId()
        finding.ObservationScope = finding.ObservationScope
            or (tostring(provenance or ""):lower():find("executor", 1, true) and "executor" or "client")
        finding.Evidence = type(finding.Evidence) == "table" and finding.Evidence or {}
        local evidenceIds = {}
        for _, evidence in ipairs(finding.Evidence) do
            if type(evidence) == "table" then
                evidence.EvidenceId = evidence.EvidenceId or nextAuditId("EVID")
                evidenceIds[#evidenceIds + 1] = evidence.EvidenceId
            end
        end
        finding.EvidenceIds = evidenceIds
        finding.EvidenceFreshness = finding.EvidenceFreshness or "session"
        finding.FirstSeen = finding.FirstSeen or os.clock()
        finding.LastSeen = os.clock()
        finding.ObservationCount = (finding.ObservationCount or 0) + 1
        finding.Provenance = finding.Provenance or provenance or "analysis"
        finding.Confidence = finding.Confidence or confidence or "low"
        finding.Evidence = type(finding.Evidence) == "table" and finding.Evidence or {}
        finding.ServerValidationRequired = finding.ServerValidationRequired ~= false
        finding.ServerValidationRelevance = finding.ServerValidationRelevance
            or validationRelevance
            or (finding.ServerValidationRequired and "HIGH" or "LOW")
        finding.RequiredServerChecks = type(finding.RequiredServerChecks) == "table"
            and finding.RequiredServerChecks
            or (serverChecks or {})
        finding.Limitations = type(finding.Limitations) == "table" and finding.Limitations
            or (limitations or { "client_side_evidence_only" })
        return finding
    end

    local function recordObservationEvent(kind, source, endpoint, root, state)
        local queue = report.Metadata.ObservationQueue
        queue.LastTimestampClock = os.clock()
        if #queue.Events >= queue.MaxEvents then
            queue.Dropped += 1
            queue.Overflow = true
            return false
        end
        queue.Events[#queue.Events + 1] = {
            ObservationEventId = nextAuditId("OBS"),
            Timestamp = queue.LastTimestampClock,
            WallTime = os.time(),
            PhaseId = CURRENT_PHASE_ID or "PH-UNASSIGNED",
            RootId = root or currentRootId(),
            Kind = kind,
            Source = source,
            Endpoint = endpoint,
            State = state,
        }
        queue.Stored = #queue.Events
        return true
    end

    local FINDING_SERVER_CHECKS = {
        static_remote = { "verify_server_authorization", "verify_server_parameter_validation" },
        anti_pattern = { "verify_server_authorization", "verify_server_state_source_of_truth" },
        remote_callback = { "verify_server_callback_contract" },
        correlation = { "verify_server_transition_and_authorization" },
        metatable_hook = { "verify_server_telemetry_or_authoritative_state" },
        trust_boundary = { "verify_server_authority_boundary" },
        client_illusion = { "verify_server_rendered_state_against_server_state" },
    }

    local function createFinding(kind, details, evidence, confidence, limitations, serverChecks, validationRelevance, bucketProvenance)
        local provenance = bucketProvenance or "analysis"
        local finding = {
            Kind = kind,
            Type = kind,
            Details = details,
            Evidence = evidence or {},
            ServerValidationRequired = true,
        }
        return ensureFindingContract(
            finding,
            provenance,
            confidence or "low",
            limitations or { "client_side_evidence_only" },
            serverChecks or FINDING_SERVER_CHECKS[kind] or {},
            validationRelevance or "HIGH"
        )
    end


    local function recordTimeline(kind, source, details)
        if #report.Timeline >= CONFIG.MAX_TIMELINE_EVENTS then
            recordDrop("Timeline", "limit_reached")
            return
        end
        local event = ensureFindingContract({
            Timestamp = os.clock(),
            WallTime = os.time(),
            Kind = kind,
            Source = source,
            Details = details,
        }, "runtime_timeline", "medium", { "client_visible_timeline_only" })
        if append(report.Timeline, event, CONFIG.MAX_TIMELINE_EVENTS) then
            timelineEventCount += 1
        end
    end

    local function recordTrustBoundary(kind, details, evidence)
        if #report.TrustBoundaries >= CONFIG.MAX_TRUST_BOUNDARIES then
            recordDrop("TrustBoundaries", "limit_reached")
            return
        end
        local finding = ensureFindingContract({
            Type = kind,
            Details = details,
            Evidence = evidence or {},
            ServerValidationRequired = true,
        }, "trust_boundary_analysis", "medium", { "server_state_not_observable_client_side" })
        if append(report.TrustBoundaries, finding, CONFIG.MAX_TRUST_BOUNDARIES) then
            recordTimeline("trust_boundary", "trust_analysis", { Type = kind })
        end
