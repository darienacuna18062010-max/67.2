        addRoot("StarterCharacterScripts", "StarterPlayer.StarterCharacterScripts",
            safeCall(function() return StarterPlayer:FindFirstChild("StarterCharacterScripts") end, nil), false)
        addRoot("StarterPlayerScripts", "StarterPlayer.StarterPlayerScripts",
            safeCall(function() return StarterPlayer:FindFirstChild("StarterPlayerScripts") end, nil), false)
        addRoot("ReplicatedFirst", "ReplicatedFirst", getOptionalService("ReplicatedFirst"), false)
