    local function safeCall(fn, fallback)
        local ok, a, b, c = pcall(fn)

        if ok then
            return a, b, c
        end

        return fallback
    end

    local profilerDepth = 0

    local function profilerBegin(label)
        if not CONFIG.DEVELOPMENT_CHECKS then
            return
        end

        if debug and type(debug.profilebegin) == "function" then
            local ok = pcall(debug.profilebegin, label)
            if ok then
                profilerDepth += 1
            end
        end
    end

    local function profilerEnd()
        if not CONFIG.DEVELOPMENT_CHECKS then
            return
        end

        if profilerDepth <= 0 then
            return
        end
        if debug and type(debug.profileend) == "function" then
            local ok = pcall(debug.profileend)
            if ok then
                profilerDepth -= 1
            end
        else
            profilerDepth = 0
        end
    end

