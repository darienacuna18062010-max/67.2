    end

    local function appendAntiPatternDirect(pattern, details, evidence, confidence)
        if #report.Network.AntiPatternFindings >= CONFIG.MAX_ANTI_PATTERN_FINDINGS then
            recordDrop("AntiPatternFindings", "limit_reached")
            return false
        end
        local finding = createFinding(
            pattern,
            details,
            evidence or {},
            confidence or "low",
            { "client_side_observation", "server_validation_required" },
            FINDING_SERVER_CHECKS.anti_pattern or {},
            confidence == "high" and "HIGH" or "MEDIUM",
            "security_anti_pattern_library"
        )
        finding.Pattern = pattern
        return append(report.Network.AntiPatternFindings, finding, CONFIG.MAX_ANTI_PATTERN_FINDINGS)
    end

    local function inspectInstanceLight(instance)
        if shouldSkipCoreGuiInstance(instance) then
            return
        end

        local class = instance.ClassName
        local name = instance.Name
        local path = getInstancePath(instance)

        if class == "Tool"
            and (currentScanRoot == "Backpack" or currentScanRoot == "PlayerGui" or currentScanRoot == "Character")
        then
            recordInventoryTool(instance, path)
        end

        observeArchetypeName(name, class)
        if (currentScanRoot == "ReplicatedStorage" or currentScanRoot == "Workspace")
            and safeCall(function() return instance:IsA("ValueBase") end, false)
        then
            trustValueCandidates[instance] = true
        end
        if CONFIG.SCRIPT_CONTENT_ANALYSIS and (class == "LocalScript" or class == "ModuleScript") then
            addUniqueInstance(scriptContentCandidates, instance, CONFIG.MAX_SCRIPT_ANALYSIS)
            scriptContentCandidateRoots[instance] = currentScanRoot
        end
        if CONFIG.UI_REMOTE_ANALYSIS
            and (class == "TextButton" or class == "ImageButton" or class == "TextBox")
        then
            addUniqueInstance(uiInteractionCandidates, instance, CONFIG.MAX_UI_INTERACTION_MAP)
            uiInteractionCandidateRoots[instance] = currentScanRoot
        end

        if class == "LocalScript" then
            local disabled = safeCall(function() return instance.Disabled end, nil)
            local runContext = tostring(safeCall(function() return instance.RunContext end, "Unknown"))
            if disabled == true and runContext == "Client" then
                appendAntiPatternDirect("local_script_disabled_client",
                    { InstanceId = getStableInstanceId(instance, "Script"), Name = reportText(name), Path = reportText(path), Root = currentScanRoot },
                    { { Source = "static_local_script_properties", Observed = true, Confidence = "medium" } }, "medium")
            end
        elseif currentScanRoot == "ReplicatedStorage" and class == "ModuleScript" then
            local runContext = tostring(safeCall(function() return instance.RunContext end, "Unknown"))
            if runContext == "Server" then
                appendAntiPatternDirect("server_module_visible_in_replicated_storage",
                    { InstanceId = getStableInstanceId(instance, "Module"), Name = reportText(name), Path = reportText(path), RunContext = runContext },
                    { { Source = "replicated_storage_server_runcontext", Observed = true, Confidence = "low" } }, "low")
            end
        end

        if UI_CLASSES[class]
            and #report.Instances.HiddenUI < CONFIG.MAX_HIDDEN_UI
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            local sensitive, sensitiveSeverity = findSensitiveWord(name)
            local hidden, reasons, potentiallyInteractive, interactionSignals, layeringSignals =
                getHiddenUIState(instance)
            if hidden then
                bumpHiddenUIReasons(reasons)
                for _, layerFlag in ipairs(layeringSignals or {}) do
                    local field = layerFlag == "DisplayOrderHigh" and "HighDisplayOrder"
                        or layerFlag == "ZIndexHigh" and "HighZIndex"
                    if field then
                        report.Instances.HiddenUIByLayering[field] += 1
                    end
                end
                local interactionBucket = potentiallyInteractive
                    and "PotentiallyInteractive"
                    or "NonInteractive"
                report.Instances.HiddenUIByInteraction[interactionBucket] += 1
                report.Instances.HiddenUIByClass[class] =
                    (report.Instances.HiddenUIByClass[class] or 0) + 1
                append(report.Instances.HiddenUI, {
                    Name = reportText(name),
                    Class = class,
                    Path = reportText(path),
                    Root = currentScanRoot,
                    HiddenReasons = reasons,
                    Interaction = interactionBucket,
                    InteractionSignals = interactionSignals,
                    LayeringFlags = layeringSignals,
                    HeuristicKeyword = sensitive,
                    HeuristicSeverity = sensitiveSeverity,
                    Provenance = "static_ui_visibility",
                    Confidence = "direct",
                    Evidence = {
                        {
                            Source = "ui_visibility",
                            Observed = true,
                            Confidence = "direct",
                            Limitations = { "layout_snapshot_only" },
                        },
                    },
                }, CONFIG.MAX_HIDDEN_UI)
            end
        end

        if REMOTE_CLASSES[class]
            and #report.Network.Remotes < CONFIG.MAX_REMOTES
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            local sensitive, sensitiveSeverity = findSensitiveWord(name)
            staticRemoteMapInternal[instance] = {
                Name = name,
                Class = class,
                Path = path,
                Root = currentScanRoot,
            }
            append(report.Network.Remotes, {
                Name = reportText(name),
                Class = class,
                Path = reportText(path),
                Root = currentScanRoot,
                InstanceId = getStableInstanceId(instance, "Remote"),
                HeuristicKeyword = sensitive,
                HeuristicSeverity = sensitiveSeverity,
                Provenance = sensitive and "static_name_heuristic" or "static_scan",
                Confidence = sensitive and "low" or "direct",
                Evidence = {
                    {
                        Source = sensitive and "static_name_heuristic" or "static_scan",
                        Observed = false,
                        Confidence = sensitive and "low" or "direct",
                    },
                },
            }, CONFIG.MAX_REMOTES)
        end

        if class == "LocalScript"
            and #report.Scripts.LocalScripts < CONFIG.MAX_SCRIPTS
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            local sensitive, sensitiveSeverity = findSensitiveWord(name)
            append(report.Scripts.LocalScripts, {
                Name = reportText(name),
                Path = reportText(path),
                Root = currentScanRoot,
                Disabled = safeCall(function() return instance.Disabled end, nil),
                RunContext = reportText(safeCall(function() return tostring(instance.RunContext) end, nil)),
                DebugIdHash = (function()
                    local rawDebugId = safeCall(function() return instance:GetDebugId() end, nil)
                    return type(rawDebugId) == "string" and rawDebugId ~= "" and hash32(rawDebugId) or nil
                end)(),
                HeuristicKeyword = sensitive,
                HeuristicSeverity = sensitiveSeverity,
                Evidence = { { Source = "static_scan", Observed = true, Confidence = "direct" } },
            }, CONFIG.MAX_SCRIPTS)
        end
    end

    local function inspectInstance(instance)
        local now = os.clock()
        if instanceAtomicBudgetExceeded(now) then
            return false
        end
        if CONFIG.LIGHT_MODE then
            inspectInstanceLight(instance)
            return true
        end
        local class = instance.ClassName
        local name = instance.Name
        local path = nil

        if class == "Tool"
            and (currentScanRoot == "Backpack" or currentScanRoot == "PlayerGui" or currentScanRoot == "Character")
        then
            path = getInstancePath(instance)
            recordInventoryTool(instance, path)
        end

        observeArchetypeName(name, class)
        if (currentScanRoot == "ReplicatedStorage" or currentScanRoot == "Workspace")
            and safeCall(function() return instance:IsA("ValueBase") end, false)
        then
            trustValueCandidates[instance] = true
        end
        if CONFIG.SCRIPT_CONTENT_ANALYSIS and (class == "LocalScript" or class == "ModuleScript") then
            addUniqueInstance(scriptContentCandidates, instance, CONFIG.MAX_SCRIPT_ANALYSIS)
            scriptContentCandidateRoots[instance] = currentScanRoot
        end
        if CONFIG.UI_REMOTE_ANALYSIS
            and (class == "TextButton" or class == "ImageButton" or class == "TextBox")
        then
            addUniqueInstance(uiInteractionCandidates, instance, CONFIG.MAX_UI_INTERACTION_MAP)
            uiInteractionCandidateRoots[instance] = currentScanRoot
        end

        if CONFIG.SCAN_TEXT_CHAT_DETAILS then
            if class == "TextChannel" and #report.Environment.TextChat.Channels < CONFIG.MAX_TEXT_CHAT_CHANNELS then
                report.Environment.TextChat.Supported = true
                report.Environment.TextChat.State = "usable"
                path = path or getInstancePath(instance)
                report.Environment.TextChat.Channels[#report.Environment.TextChat.Channels + 1] = {
                    Name = reportText(name), Class = class, Path = reportText(path), Root = currentScanRoot,
                    Evidence = { { Source = "textchat_static_scan", Observed = true, Confidence = "direct" } },
                }
            elseif class == "TextSource" and #report.Environment.TextChat.Sources < CONFIG.MAX_TEXT_CHAT_SOURCES then
                report.Environment.TextChat.Supported = true
                report.Environment.TextChat.State = "usable"
                path = path or getInstancePath(instance)
                report.Environment.TextChat.Sources[#report.Environment.TextChat.Sources + 1] = {
                    Name = reportText(name), Class = class, Path = reportText(path), Root = currentScanRoot,
                    UserId = (function()
                        local userId = safeCall(function() return instance.UserId end, nil)
                        return CONFIG.DATA_PROFILE == "MINIMAL" and userId ~= nil
                            and hash32(tostring(userId))
                            or userId
                    end)(),
                    Evidence = { { Source = "textchat_static_scan", Observed = true, Confidence = "direct" } },
                }
            end
        end

        local archivable = safeCall(function() return instance.Archivable end, nil)
        if archivable == false then
            report.Instances.InstanceFlags.ArchivableFalse += 1
            if CONFIG.DATA_PROFILE == "DETAILED" then
                if #report.Instances.InstanceFlags.ArchivableFalseSamples
                    < CONFIG.MAX_INSTANCE_FLAG_SAMPLES
                then
                    if not append(
                        report.Instances.InstanceFlags.ArchivableFalseSamples,
                        reportText(getInstancePath(instance)),
                        CONFIG.MAX_INSTANCE_FLAG_SAMPLES
                    )
                    and report.Metadata.Performance.OutputBudgetExceeded
                    then
                        recordDrop("InstanceFlagArchivableSamples", "report_bytes_budget")
                    end
                else
                    recordDrop("InstanceFlagArchivableSamples", "sample_limit_reached")
                end
            end
        end

        local robloxLocked = safeCall(function() return instance.RobloxLocked end, nil)
        if robloxLocked == true then
            report.Instances.InstanceFlags.RobloxLocked += 1
            if CONFIG.DATA_PROFILE == "DETAILED" then
                if #report.Instances.InstanceFlags.RobloxLockedSamples
                    < CONFIG.MAX_INSTANCE_FLAG_SAMPLES
                then
                    if not append(
                        report.Instances.InstanceFlags.RobloxLockedSamples,
                        reportText(getInstancePath(instance)),
                        CONFIG.MAX_INSTANCE_FLAG_SAMPLES
                    )
                    and report.Metadata.Performance.OutputBudgetExceeded
                    then
                        recordDrop("InstanceFlagRobloxLockedSamples", "report_bytes_budget")
                    end
                else
                    recordDrop("InstanceFlagRobloxLockedSamples", "sample_limit_reached")
                end
            end
        end

        if instanceAtomicBudgetExceeded(now) then
            return false
        end

        if currentScanRoot == "CoreGui"
            and CONFIG.SKIP_EXECUTOR_COREUI
            and not shouldSkipCoreGuiInstance(instance)
        then
            if not append(
                report.Instances.CoreGuiNonExecutorInstances,
                {
                    Name = reportText(name),
                    Class = class,
                    Path = reportText(getInstancePath(instance)),
                },
                CONFIG.MAX_HIDDEN_UI
            ) then
                recordDrop("CoreGuiNonExecutor", "limit_reached")
            end
        end

        if shouldSkipCoreGuiInstance(instance) then
            return
        end

        if UI_CLASSES[class]
            and #report.Instances.HiddenUI < CONFIG.MAX_HIDDEN_UI
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            local sensitive, sensitiveSeverity = findSensitiveWord(name)
            local hidden, reasons, potentiallyInteractive, interactionSignals, layeringSignals =
                getHiddenUIState(instance)

            if hidden then
                bumpHiddenUIReasons(reasons)
                path = path or getInstancePath(instance)

                for _, layerFlag in ipairs(layeringSignals or {}) do
                    local field = layerFlag == "DisplayOrderHigh" and "HighDisplayOrder"
                        or layerFlag == "ZIndexHigh" and "HighZIndex"
                    if field then
                        report.Instances.HiddenUIByLayering[field] += 1
                    end
                end

                local interactionBucket = potentiallyInteractive
                    and "PotentiallyInteractive"
                    or "NonInteractive"
                report.Instances.HiddenUIByInteraction[interactionBucket] += 1
                report.Instances.HiddenUIByClass[class] =
                    (report.Instances.HiddenUIByClass[class] or 0) + 1

                if not append(report.Instances.HiddenUI, {
                    Name = reportText(name),
                    Class = class,
                    Path = reportText(path),
                    Root = currentScanRoot,
                    HiddenReasons = reasons,
                    Interaction = interactionBucket,
                    InteractionSignals = interactionSignals,
                    LayeringFlags = layeringSignals,
                    HeuristicKeyword = sensitive,
                    HeuristicSeverity = sensitiveSeverity,
                    Provenance = sensitive and "static_ui_heuristic" or "static_ui_visibility",
                    Confidence = sensitive and "low" or "direct",
                    Evidence = {
                        {
                            Source = "ui_visibility",
                            Confidence = "direct",
                            Observed = true,
                            Limitations = { "client_visible_snapshot_only" },
                        },
                        {
                            Source = "ui_interaction_state",
                            Confidence = potentiallyInteractive and "high" or "medium",
                            Observed = true,
                            Limitations = { "interaction_is_potential_not_proof_of_use" },
                        },
                    },
                }, CONFIG.MAX_HIDDEN_UI) then
                    recordDrop("HiddenUI", "limit_reached")
                end
            end
        end

        if REMOTE_CLASSES[class]
            and #report.Network.Remotes < CONFIG.MAX_REMOTES
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            if CONFIG.DATA_PROFILE == "DETAILED" then
                path = path or getInstancePath(instance)
            end
            local sensitive, sensitiveSeverity = findSensitiveWord(name)
            staticRemoteMapInternal[instance] = {
                Name = name,
                Class = class,
                Path = path,
                Root = currentScanRoot,
            }
            if not append(report.Network.Remotes, {
                Name = reportText(name),
                Class = class,
                Path = reportText(path),
                Root = currentScanRoot,
                InstanceId = getStableInstanceId(instance, "Remote"),
                HeuristicKeyword = sensitive,
                HeuristicSeverity = sensitiveSeverity,
                Provenance = sensitive and "static_name_heuristic" or "static_scan",
                Confidence = sensitive and "low" or "direct",
                Evidence = sensitive and {
                    { Source = "name_heuristic", Confidence = "low", Observed = false }
                } or nil,
            }, CONFIG.MAX_REMOTES) then
                recordDrop("Remotes", "limit_reached")
            end

        elseif BINDABLE_CLASSES[class]
            and #report.Network.Bindables < CONFIG.MAX_BINDABLES
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            if CONFIG.DATA_PROFILE == "DETAILED" then
                path = path or getInstancePath(instance)
            end
            local sensitive, sensitiveSeverity = findSensitiveWord(name)
            if not append(report.Network.Bindables, {
                Name = reportText(name),
                Class = class,
                Path = reportText(path),
                Root = currentScanRoot,
                HeuristicKeyword = sensitive,
                HeuristicSeverity = sensitiveSeverity,
                Provenance = sensitive and "static_name_heuristic" or "static_scan",
                Confidence = sensitive and "low" or "direct",
                Evidence = { { Source = "static_name_heuristic", Observed = false, Confidence = sensitive and "low" or "direct" } },
            }, CONFIG.MAX_BINDABLES) then
                recordDrop("Bindables", "limit_reached")
            end
        end

        if class == "Team"
            and #report.Environment.Teams < CONFIG.MAX_TEAMS
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            path = path or getInstancePath(instance)
            if not append(report.Environment.Teams, {
                Name = reportText(name),
                Path = reportText(path),
                TeamColor = reportText(safeCall(function() return tostring(instance.TeamColor) end, "Unknown")),
                AutoAssignable = safeCall(function() return instance.AutoAssignable end, nil),
            }, CONFIG.MAX_TEAMS) then
                recordDrop("Teams", "limit_reached")
            end
        end

        if class == "Sound"
            and #report.Instances.Sounds < CONFIG.MAX_SOUNDS
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            path = path or getInstancePath(instance)
            if not append(report.Instances.Sounds, {
                Name = reportText(name),
                Class = class,
                Path = reportText(path),
                SoundId = sanitizeForJSON(safeCall(function() return instance.SoundId end, "")),
                IsPlaying = safeCall(function() return instance.IsPlaying end, false),
                Volume = safeCall(function() return instance.Volume end, 0),
                Root = currentScanRoot,
            }, CONFIG.MAX_SOUNDS) then
                recordDrop("Sounds", "limit_reached")
            end
        end

        if EXPLOITABLE_CLASSES[class]
            and CONFIG.DATA_PROFILE == "DETAILED"
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            path = path or getInstancePath(instance)
            if not append(report.Instances.ExploitableAssets, {
                Name = reportText(name),
                Class = class,
                Path = reportText(path),
                Root = currentScanRoot,
            }, CONFIG.MAX_EXPLOITABLE_ASSETS) then
                recordDrop("ExploitableAssets", "limit_reached")
            end
        end

        if instanceAtomicBudgetExceeded(now) then
            return false
        end

        if CONFIG.SCAN_VALUES
            and class:sub(-5) == "Value"
            and #report.Instances.Values < CONFIG.MAX_VALUES
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            path = path or getInstancePath(instance)
            local value
            local ok = pcall(function()
                value = instance.Value
            end)

            local sensitive, sensitiveSeverity = findSensitiveWord(name)
            if not append(report.Instances.Values, {
                Name = reportText(name),
                Class = class,
                Path = reportText(path),
                Root = currentScanRoot,
                Readable = ok,
                Value = ok and sanitizeForJSON(value) or "[Locked]",
                HeuristicKeyword = sensitive,
                HeuristicSeverity = sensitiveSeverity,
            }, CONFIG.MAX_VALUES) then
                recordDrop("Values", "limit_reached")
            end
        end

        if class == "ProximityPrompt"
            and #report.Instances.Prompts < CONFIG.MAX_PROMPTS
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            path = path or getInstancePath(instance)
            if not append(report.Instances.Prompts, {
                Name = reportText(name),
                Class = class,
                Path = reportText(path),
                ActionText = reportText(safeCall(function() return instance.ActionText end, "")),
                ObjectText = reportText(safeCall(function() return instance.ObjectText end, "")),
                HoldDuration = safeCall(function() return instance.HoldDuration end, -1),
                MaxActivationDistance = safeCall(function() return instance.MaxActivationDistance end, -1),
                RequiresLineOfSight = safeCall(function() return instance.RequiresLineOfSight end, false),
                Enabled = safeCall(function() return instance.Enabled end, false),
            }, CONFIG.MAX_PROMPTS) then
                recordDrop("Prompts", "limit_reached")
            end
        end

        if class == "ClickDetector"
            and #report.Instances.ClickDetectors < CONFIG.MAX_CLICK_DETECTORS
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            path = path or getInstancePath(instance)
            if not append(report.Instances.ClickDetectors, {
                Name = reportText(name),
                Class = class,
                Path = reportText(path),
                MaxActivationDistance = safeCall(function() return instance.MaxActivationDistance end, -1),
                InfiniteRange = safeCall(
                    function()
                        return instance.MaxActivationDistance == 0
                    end,
                    false
                ),
            }, CONFIG.MAX_CLICK_DETECTORS) then
                recordDrop("ClickDetectors", "limit_reached")
            end
        end

        if (class == "LocalScript" or class == "ModuleScript")
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            path = path or getInstancePath(instance)
            local sensitive, sensitiveSeverity = findSensitiveWord(name)

            if class == "LocalScript"
                and #report.Scripts.LocalScripts < CONFIG.MAX_SCRIPTS
            then
                if not append(report.Scripts.LocalScripts, {
                    Name = reportText(name),
                    Path = reportText(path),
                    Root = currentScanRoot,
                    Disabled = safeCall(function() return instance.Disabled end, nil),
                    RunContext = reportText(safeCall(function() return tostring(instance.RunContext) end, nil)),
                    DebugIdHash = (function()
                        local rawDebugId = safeCall(function() return instance:GetDebugId() end, nil)
                        if type(rawDebugId) ~= "string" or rawDebugId == "" then
                            return nil
                        end
                        return hash32(rawDebugId)
                    end)(),
                    HeuristicKeyword = sensitive,
                    HeuristicSeverity = sensitiveSeverity,
                }, CONFIG.MAX_SCRIPTS) then
                    recordDrop("LocalScripts", "limit_reached")
                end
            elseif class == "ModuleScript"
                and #report.Scripts.ModuleScripts < CONFIG.MAX_SCRIPTS
            then
                if not append(report.Scripts.ModuleScripts, {
                    Name = reportText(name),
                    Path = reportText(path),
                    Root = currentScanRoot,
                    Disabled = safeCall(function() return instance.Disabled end, nil),
                    RunContext = reportText(safeCall(function() return tostring(instance.RunContext) end, nil)),
                    DebugIdHash = (function()
                        local rawDebugId = safeCall(function() return instance:GetDebugId() end, nil)
                        if type(rawDebugId) ~= "string" or rawDebugId == "" then
                            return nil
                        end
                        return hash32(rawDebugId)
                    end)(),
                    HeuristicKeyword = sensitive,
                    HeuristicSeverity = sensitiveSeverity,
                }, CONFIG.MAX_SCRIPTS) then
                    recordDrop("ModuleScripts", "limit_reached")
                end
            end
        end

        if instanceAtomicBudgetExceeded(now) then
            return false
        end

        local attributes = nil
        if CONFIG.SCAN_ATTRIBUTES
            and #report.Environment.Attributes < CONFIG.MAX_ATTRIBUTES
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            attributes = safeCall(function()
                return instance:GetAttributes()
            end, nil)
        end

        if type(attributes) == "table" then
            for attributeName, value in pairs(attributes) do
                if #report.Environment.Attributes >= CONFIG.MAX_ATTRIBUTES then
                    recordDrop("Attributes", "limit_reached")
                    break
                end

                path = path or getInstancePath(instance)
                local sensitive, sensitiveSeverity = findSensitiveWord(attributeName)
                append(report.Environment.Attributes, {
                    Path = reportText(path),
                    Instance = reportText(name),
                    Attribute = reportText(attributeName),
                    Type = typeof(value),
                    Value = sanitizeForJSON(value),
                    HeuristicKeyword = sensitive,
                    HeuristicSeverity = sensitiveSeverity,
                }, CONFIG.MAX_ATTRIBUTES)
            end
        end

        if CONFIG.SCAN_TAGS
            and #report.Environment.Tags < CONFIG.MAX_TAGS
            and not report.Metadata.Performance.OutputBudgetExceeded
        then
            local tags = safeCall(function()
                return CollectionService:GetTags(instance)
            end, nil)

            if type(tags) == "table" then
                for _, tag in ipairs(tags) do
                    if #report.Environment.Tags >= CONFIG.MAX_TAGS then
                        recordDrop("Tags", "limit_reached")
                        break
                    end

                    path = path or getInstancePath(instance)
                    local sensitive, sensitiveSeverity = findSensitiveWord(tag)
                    append(report.Environment.Tags, {
                        Path = reportText(path),
                        Instance = reportText(name),
                        Tag = reportText(tag),
                        HeuristicKeyword = sensitive,
                        HeuristicSeverity = sensitiveSeverity,
                    }, CONFIG.MAX_TAGS)
                end
            end
        end
        if CONFIG.SCAN_INSTANCE_METATABLES and CONFIG.DATA_PROFILE == "DETAILED"
            and GET_RAW_METATABLE and #report.Instances.MetatableProfiles < CONFIG.MAX_INSTANCE_METATABLES
        then
            local meta = safeCall(function() return GET_RAW_METATABLE(instance) end, nil)
            if type(meta) == "table" then
                local keyCount, hasNamecall = 0, false
                for key in pairs(meta) do
                    keyCount += 1
                    if key == "__namecall" then hasNamecall = true end
                end
                if append(report.Instances.MetatableProfiles, {
                    Name = reportText(name), Class = class, Path = reportText(path or getInstancePath(instance)),
                    KeyCount = keyCount, HasNamecall = hasNamecall,
                    Fingerprint = hash32(tostring(class) .. ":" .. tostring(keyCount) .. ":" .. tostring(hasNamecall)),
                    Evidence = { { Source = "instance_metatable_probe", Observed = true, Confidence = "direct" } },
                }, CONFIG.MAX_INSTANCE_METATABLES) then
                    report.Metadata.Truncation.InstanceMetatables.Stored = #report.Instances.MetatableProfiles
                end
            end
        end

        return true
    end

    --------------------------------------------------------------------
    -- CLIENT DEFENSE / TELEMETRY SIGNAL SCAN
    --------------------------------------------------------------------

    local function scanClientDefenses()
        report.Environment.ObservedSignalConnections = {
            Supported = false,
            Reason = nil,
            Signals = {},
        }

        registerTruncationList(
            report.Environment.ObservedSignalConnections.Signals,
            "DefenseSignals"
        )

        if not CONFIG.SCAN_CLIENT_DEFENSES then
            report.Environment.ObservedSignalConnections.Reason =
                "SCAN_CLIENT_DEFENSES disabled"
            return
        end

        if not GET_CONNECTIONS then
            report.Environment.ObservedSignalConnections.Reason =
                "getconnections unavailable"
            return
        end

        report.Environment.ObservedSignalConnections.Supported = false
        local defenseConnectionEnumerated = false

        local LogService = game:GetService("LogService")
        local ScriptContext = game:GetService("ScriptContext")
        local UserInputService = game:GetService("UserInputService")
        local GuiService = safeCall(function() return game:GetService("GuiService") end, nil)
        local PlayersService = game:GetService("Players")
        local ReplicatedStorageService = game:GetService("ReplicatedStorage")
        local ContextActionService = safeCall(function() return game:GetService("ContextActionService") end, nil)
        local MarketplaceService = safeCall(function() return game:GetService("MarketplaceService") end, nil)

        local criticalSignals = {
            { Name = "LogService.MessageOut", Signal = safeCall(function() return LogService.MessageOut end, nil) },
            { Name = "ScriptContext.Error", Signal = safeCall(function() return ScriptContext.Error end, nil) },
            { Name = "game.ItemChanged", Signal = safeCall(function() return game.ItemChanged end, nil) },
            { Name = "game.DescendantAdded", Signal = safeCall(function() return game.DescendantAdded end, nil) },
            { Name = "game.DescendantRemoving", Signal = safeCall(function() return game.DescendantRemoving end, nil) },
            { Name = "Workspace.DescendantAdded", Signal = safeCall(function() return Workspace.DescendantAdded end, nil) },
            { Name = "Workspace.DescendantRemoving", Signal = safeCall(function() return Workspace.DescendantRemoving end, nil) },
            { Name = "Players.PlayerAdded", Signal = safeCall(function() return Players.PlayerAdded end, nil) },
            { Name = "Players.PlayerRemoving", Signal = safeCall(function() return Players.PlayerRemoving end, nil) },
            { Name = "RunService.Heartbeat", Signal = safeCall(function() return RunService.Heartbeat end, nil) },
            { Name = "RunService.Stepped", Signal = safeCall(function() return RunService.Stepped end, nil) },
            { Name = "RunService.RenderStepped", Signal = safeCall(function() return RunService.RenderStepped end, nil) },
            { Name = "UserInputService.InputBegan", Signal = safeCall(function() return UserInputService.InputBegan end, nil) },
            { Name = "UserInputService.InputChanged", Signal = safeCall(function() return UserInputService.InputChanged end, nil) },
            { Name = "UserInputService.TouchTap", Signal = safeCall(function() return UserInputService.TouchTap end, nil) },
            { Name = "UserInputService.TouchLongPress", Signal = safeCall(function() return UserInputService.TouchLongPress end, nil) },
            { Name = "Players.ChildAdded", Signal = safeCall(function() return PlayersService.ChildAdded end, nil) },
            { Name = "ReplicatedStorage.ChildAdded", Signal = safeCall(function() return ReplicatedStorageService.ChildAdded end, nil) },
            {
                Name = "ContextActionService.BoundActionAdded",
                Signal = ContextActionService and safeCall(function() return ContextActionService.BoundActionAdded end, nil) or nil,
            },
            {
                Name = "ContextActionService.BoundActionChanged",
                Signal = ContextActionService and safeCall(function() return ContextActionService.BoundActionChanged end, nil) or nil,
            },
            {
                Name = "ContextActionService.BoundActionRemoved",
                Signal = ContextActionService and safeCall(function() return ContextActionService.BoundActionRemoved end, nil) or nil,
            },
            {
                Name = "ContextActionService.LocalToolEquipped",
                Signal = ContextActionService and safeCall(function() return ContextActionService.LocalToolEquipped end, nil) or nil,
            },
            {
                Name = "ContextActionService.LocalToolUnequipped",
                Signal = ContextActionService and safeCall(function() return ContextActionService.LocalToolUnequipped end, nil) or nil,
            },
            { Name = "RunService.PreRender", Signal = safeCall(function() return RunService.PreRender end, nil) },
            { Name = "RunService.PreSimulation", Signal = safeCall(function() return RunService.PreSimulation end, nil) },
            { Name = "RunService.PostSimulation", Signal = safeCall(function() return RunService.PostSimulation end, nil) },
            {
                Name = "GuiService.MenuOpened",
                Signal = GuiService and safeCall(function() return GuiService.MenuOpened end, nil) or nil,
            },
            {
                Name = "GuiService.MenuClosed",
                Signal = GuiService and safeCall(function() return GuiService.MenuClosed end, nil) or nil,
            },
            {
                Name = "LocalPlayer.CharacterAdded",
                Signal = LocalPlayer and safeCall(function()
                    return LocalPlayer.CharacterAdded
                end, nil) or nil,
            },
            {
                Name = "LocalPlayer.Idled",
                Signal = LocalPlayer and safeCall(function()
                    return LocalPlayer.Idled
                end, nil) or nil,
            },
            { Name = "MarketplaceService.PromptGamePassPurchaseFinished", Signal = MarketplaceService and safeCall(function() return MarketplaceService.PromptGamePassPurchaseFinished end, nil) or nil },
            { Name = "MarketplaceService.PromptProductPurchaseFinished", Signal = MarketplaceService and safeCall(function() return MarketplaceService.PromptProductPurchaseFinished end, nil) or nil },
            { Name = "MarketplaceService.PromptPurchaseFinished", Signal = MarketplaceService and safeCall(function() return MarketplaceService.PromptPurchaseFinished end, nil) or nil },
        }

        for _, item in ipairs(criticalSignals) do
            if #report.Environment.ObservedSignalConnections.Signals
                >= CONFIG.MAX_DEFENSE_SIGNALS
            then
                break
            end

            if item.Signal then
                local ok, connections = pcall(GET_CONNECTIONS, item.Signal)

                if ok and type(connections) == "table" then
                    defenseConnectionEnumerated = true
                    if not append(
                        report.Environment.ObservedSignalConnections.Signals,
                        {
                            Signal = item.Name,
                            ActiveConnections = #connections,
                        },
                        CONFIG.MAX_DEFENSE_SIGNALS
                    ) then
                        recordDrop("DefenseSignals", "limit_reached")
                    end
                end
            end
        end
        report.Environment.ObservedSignalConnections.Supported = defenseConnectionEnumerated
        report.Environment.ObservedSignalConnections.Reason = defenseConnectionEnumerated
            and nil
            or "no usable enumeration"
        markCapabilityProbe("getconnections", defenseConnectionEnumerated, defenseConnectionEnumerated and nil or "no usable enumeration", "defense_enumeration")
    end

    --------------------------------------------------------------------
    -- ROOT SCANNER / COOPERATIVE ROUND-ROBIN COORDINATOR
    --------------------------------------------------------------------


    local function auditWallElapsedSeconds()
        local now, source = readElapsedWallClock()
        if source == auditWallClockSource and type(now) == "number" then
            return math.max(0, now - auditStartWallClock)
        end

        -- Never subtract time() epoch from os.clock() elapsed CPU time. If the
        -- runtime source changes mid-run, lock the duration measurement to the
        -- always-available os.clock() origin and mark the mixed-source condition.
        auditWallClockMixedSource = true
        return math.max(0, os.clock() - auditStartClock)
    end

    local function auditWallExceeded()
        if CONFIG.MAX_AUDIT_WALL_SECONDS <= 0 then
            return false
        end

        return auditWallElapsedSeconds() >= CONFIG.MAX_AUDIT_WALL_SECONDS
    end

    local function calculateSliceBudget(frameDelta)
        local frameBudget = (frameDelta or (1 / 60)) * CONFIG.SLICE_FRAME_FRACTION
        return math.max(
            CONFIG.SLICE_MIN_BUDGET_SECONDS,
            math.min(CONFIG.SLICE_MAX_BUDGET_SECONDS, frameBudget)
        )
    end

    local function markTraversalStop(reason)
        report.Metadata.Traversal.StopReason =
            reason or report.Metadata.Traversal.StopReason or "stopped"
        report.Metadata.Performance.StopReason = report.Metadata.Traversal.StopReason
        report.Metadata.Consistency = "best_effort_client_visible"
    end

    local function outputBudgetNearLimit()
        if not report or not report.Metadata or not report.Metadata.Performance then
            return false
        end
        local current = report.Metadata.Performance.EstimatedOutputBytes or 0
        local limit = CONFIG.MAX_REPORT_BYTES_ESTIMATE
        if limit <= 0 then
            return false
        end
        local remaining = math.max(0, limit - current)
        return (current / limit) >= CONFIG.OUTPUT_EARLY_STOP_RATIO
            or remaining <= CONFIG.OUTPUT_EARLY_STOP_MIN_REMAINING_BYTES
    end

    local function markOutputEarlyStop()
        if not report or not report.Metadata or not report.Metadata.Performance then
            return
        end
        report.Metadata.Performance.EarlyOutputStop = true
        report.Metadata.Performance.EarlyOutputStopReason = "output_budget_near_limit"
    end

    local function queuePush(state, instance)
        local quota = state.PendingQuota or CONFIG.MAX_PENDING
        if state.size >= quota then
            return false
        end
        if state.size >= state.QueueCapacity then
            local newCapacity = math.min(quota, math.max(state.QueueCapacity * 2, 1))
            local newQueue = type(table.create) == "function" and table.create(newCapacity) or {}
            for offset = 1, state.size do
                local index = ((state.head + offset - 2) % state.QueueCapacity) + 1
                newQueue[offset] = state.queue[index]
            end
            state.queue = newQueue
            state.QueueCapacity = newCapacity
            state.head = 1
            state.tail = state.size
        end

        state.tail = (state.tail % state.QueueCapacity) + 1
        state.queue[state.tail] = instance
        state.size += 1
        state.queued += 1
        if state.size > state.maxPending then
            state.maxPending = state.size
        end
        return true
    end

    local function queuePop(state)
        if state.size <= 0 then
            return nil
        end

        local instance = state.queue[state.head]
        state.queue[state.head] = nil
        state.head = (state.head % state.QueueCapacity) + 1
        state.size -= 1
        return instance
    end

    local function initializeRootState(entry, totalPending, pendingQuota)
        local state = {
            Entry = entry,
            PendingQuota = pendingQuota or CONFIG.MAX_PENDING,
            QueueCapacity = math.min(pendingQuota or CONFIG.MAX_PENDING, 64), -- Grows geometrically up to PendingQuota.
            Initialized = false,
            Completed = false,
            queue = type(table.create) == "function" and table.create(math.min(pendingQuota or CONFIG.MAX_PENDING, 64)) or {},
            head = 1,
            tail = 0,
            size = 0,
            queued = 0,
            visited = 0,
            skippedBySeen = 0,
            droppedByPending = 0,
            droppedByTraversal = 0,
            maxPending = 0,
            maxAtomicMs = 0,
            activeMs = 0,
            waitMs = 0,
            startedAt = os.clock(),
            firstProcessedAt = nil,
            lastProcessedAt = nil,
            stopReason = nil,
        }

        resetUICaches()
        refreshUIViewportCache()

        local children = safeCall(function()
            local t0 = os.clock()
            local childrenResult = entry.Root:GetChildren()
            local atomicMs = (os.clock() - t0) * 1000
            state.maxAtomicMs = math.max(state.maxAtomicMs, atomicMs)
            state.activeMs += atomicMs
            report.Metadata.Performance.MaxAtomicOperationMs =
                math.max(report.Metadata.Performance.MaxAtomicOperationMs, atomicMs)
            return childrenResult
        end, nil)

        if type(children) ~= "table" then
            state.Completed = true
            state.stopReason = "root_children_failed"
            ensureRootMetadata(entry.Name).Mutated = true
            report.Metadata.SkippedDuringMutation += 1
            return state
        end

        state.Initialized = true

        if CONFIG.ROOT_INCLUDE_SELF and not seenInstances[entry.Root] then
            if totalPending < CONFIG.MAX_PENDING
                and state.size < state.PendingQuota
                and queuePush(state, entry.Root)
            then
                totalPending += 1
                seenInstances[entry.Root] = true
            else
                state.droppedByPending += 1
                report.Metadata.Traversal.DroppedByPendingBudget += 1
            end
        end

        for index, child in ipairs(children) do
            if outputBudgetNearLimit() then
                local remaining = #children - index + 1
                markOutputEarlyStop()
                state.stopReason = state.stopReason or "output_budget_early_stop"
                state.droppedByPending += remaining
                report.Metadata.Traversal.DroppedByOutputEarlyStop += remaining
                report.Metadata.Truncation.PendingQueue.Dropped += remaining
                report.Metadata.Truncation.PendingQueue.Reason =
                    report.Metadata.Truncation.PendingQueue.Reason or "output_budget_early_stop"
                break
            end

            if not child then
                continue
            end

            if seenInstances[child] then
                state.skippedBySeen += 1
                report.Metadata.Traversal.SkippedBySeen += 1
            elseif totalPending >= CONFIG.MAX_PENDING
                or state.size >= state.PendingQuota
            then
                local remaining = 1
                state.droppedByPending += remaining
                report.Metadata.Traversal.DroppedByPendingBudget += remaining
                report.Metadata.Truncation.PendingQueue.Dropped += remaining
                report.Metadata.Truncation.PendingQueue.Reason = "pending_budget"
                break
            elseif queuePush(state, child) then
                totalPending += 1
                seenInstances[child] = true
            end
        end

        report.Metadata.Traversal.MaxPendingObserved =
            math.max(report.Metadata.Traversal.MaxPendingObserved, totalPending)
        report.Metadata.Truncation.PendingQueue.Stored =
            math.min(CONFIG.MAX_PENDING, report.Metadata.Traversal.MaxPendingObserved)
        report.Metadata.Performance.MaxPending =
            math.max(report.Metadata.Performance.MaxPending, totalPending)

        return state, totalPending
    end

    local function enqueueChildren(state, children, totalPending)
        if type(children) ~= "table" then
            state.stopReason = "children_failed"
            ensureRootMetadata(state.Entry.Name).Mutated = true
            report.Metadata.SkippedDuringMutation += 1
            return totalPending
        end

        if state.visited >= CONFIG.MAX_SCANNED_INSTANCES_PER_ROOT
            or report.Metadata.Traversal.GlobalVisited
                >= CONFIG.MAX_SCANNED_INSTANCES_GLOBAL
        then
            state.droppedByTraversal += #children
            report.Metadata.Traversal.DroppedByTraversalBudget += #children
            report.Metadata.Truncation.TraversalInstances.Dropped += #children
            report.Metadata.Truncation.TraversalInstances.Reason =
                report.Metadata.Truncation.TraversalInstances.Reason
                or "traversal_budget"
            return totalPending
        end

        for index, child in ipairs(children) do
            if outputBudgetNearLimit() then
                local remaining = #children - index + 1
                markOutputEarlyStop()
                state.stopReason = state.stopReason or "output_budget_early_stop"
                state.droppedByPending += remaining
                report.Metadata.Traversal.DroppedByOutputEarlyStop += remaining
                report.Metadata.Truncation.PendingQueue.Dropped += remaining
                report.Metadata.Truncation.PendingQueue.Reason =
                    report.Metadata.Truncation.PendingQueue.Reason or "output_budget_early_stop"
                break
            end

            if auditWallExceeded() then
                local remaining = #children - index + 1
                state.stopReason = "wall_time"
                state.droppedByTraversal += remaining
                report.Metadata.Traversal.DroppedByTraversalBudget += remaining
                report.Metadata.Truncation.TraversalInstances.Dropped += remaining
                report.Metadata.Truncation.TraversalInstances.Reason =
                    report.Metadata.Truncation.TraversalInstances.Reason
                    or "wall_time"
                break
            end

            if seenInstances[child] then
                state.skippedBySeen += 1
                report.Metadata.Traversal.SkippedBySeen += 1
            elseif totalPending >= CONFIG.MAX_PENDING
                or state.size >= state.PendingQuota
            then
                local remaining = #children - index + 1
                state.droppedByPending += remaining
                report.Metadata.Traversal.DroppedByPendingBudget += remaining
                report.Metadata.Truncation.PendingQueue.Dropped += remaining
                report.Metadata.Truncation.PendingQueue.Reason = "pending_budget"
                break
            elseif queuePush(state, child) then
                totalPending += 1
                seenInstances[child] = true
            end
        end

        report.Metadata.Traversal.MaxPendingObserved =
            math.max(report.Metadata.Traversal.MaxPendingObserved, totalPending)
        report.Metadata.Performance.MaxPending =
            math.max(report.Metadata.Performance.MaxPending, totalPending)
        report.Metadata.Truncation.PendingQueue.Stored =
            math.min(CONFIG.MAX_PENDING, report.Metadata.Traversal.MaxPendingObserved)

        return totalPending
    end

    local function finalizeRootState(state)
        state.Completed = true
        local wallSeconds = math.max(0, (state.lastProcessedAt or os.clock()) - state.startedAt)
        local root = ensureRootMetadata(state.Entry.Name)
        root.Status = "canonical"
        root.CanonicalRoot = state.Entry.Name
        root.Visited = state.visited
        root.Queued = state.queued
        root.SkippedBySeen = state.skippedBySeen
        root.DroppedByPendingBudget = state.droppedByPending
        root.DroppedByOutputEarlyStop =
            state.stopReason == "output_budget_early_stop" and state.droppedByPending or 0
        root.DroppedByTraversalBudget = state.droppedByTraversal
        root.MaxPending = state.maxPending
        root.ActiveMs = state.activeMs
        root.WaitMs = math.max(0, wallSeconds * 1000 - state.activeMs)
        root.MaxAtomicOperationMs = state.maxAtomicMs
        root.PendingAtStop = state.size
        root.StopReason = state.stopReason or "completed"
        root.WallSeconds = wallSeconds
        clearPerRootCaches()
        clearWeakMap(seenInstances)
        -- Module provenance caches are populated in the later VM phase, but clearing
        -- them here keeps the root boundary explicit and prevents stale cross-root state.
        clearWeakMap(moduleClosureSources)
        clearWeakMap(moduleIndexByInstance)
    end

    -- scanRootsCooperative is defined before PASSIVE NETWORK SNIFFER, so these are
    -- forward-declared locals rather than accidental globals.
    local snifferState
    local configureDynamicRootRegistry
    local injectPassiveSniffer

    local function scanRootsCooperative(roots)
        local states = {}
        local totalPending = 0

        -- Canonicalize nested roots in both directions. The broadest ancestor wins;
        -- exact duplicates and descendant requests are explicitly linked to the owner.
        local canonicalRoots = {}

        for _, entry in ipairs(roots) do
            local omitted = false

            for index = #canonicalRoots, 1, -1 do
                local existing = canonicalRoots[index]
                local sameRoot = existing.Root == entry.Root
                local entryUnderExisting = safeCall(function()
                    return entry.Root:IsDescendantOf(existing.Root)
                end, false)
                local existingUnderEntry = safeCall(function()
                    return existing.Root:IsDescendantOf(entry.Root)
                end, false)

                if sameRoot or entryUnderExisting then
                    omitted = true
                    break
                elseif existingUnderEntry then
                    table.remove(canonicalRoots, index)
                    report.Metadata.Traversal.RootsDeduplicated += 1
                end
            end

            if not omitted then
                canonicalRoots[#canonicalRoots + 1] = entry
            else
                report.Metadata.Traversal.RootsDeduplicated += 1
            end
        end

        -- Export an auditable relationship for every requested root. Root labels are
        -- operational identifiers, not player/content text, so they remain visible.
        for _, requested in ipairs(roots) do
            local canonical = nil
            local reason = nil
            local status = "canonical"

            for _, candidate in ipairs(canonicalRoots) do
                if candidate.Root == requested.Root then
                    canonical = candidate
                    break
                end

                local nested = safeCall(function()
                    return requested.Root:IsDescendantOf(candidate.Root)
                end, false)

                if nested then
                    canonical = candidate
                    status = "deduplicated"
                    reason = "nested_under_canonical_root"
                    break
                end
            end

            if canonical and status == "canonical" then
                reason = "selected_as_canonical_root"
            elseif not canonical then
                status = "omitted"
                reason = "no_canonical_owner_resolved"
            end

            local requestedRootMeta = ensureRootMetadata(requested.Name)
            requestedRootMeta.RequestIds[#requestedRootMeta.RequestIds + 1] = requested.RequestId
            requestedRootMeta.Status = status
            requestedRootMeta.CanonicalRoot = canonical and canonical.Name or nil
            requestedRootMeta.Reason = reason

            if status == "deduplicated" and canonical then
                report.Metadata.Traversal.CanonicalizationRelations[#report.Metadata.Traversal.CanonicalizationRelations + 1] = {
                    OmittedRoot = requested.Name,
                    CanonicalRoot = canonical.Name,
                    Reason = reason,
                }
            end

            if status == "deduplicated" then
                local root = ensureRootMetadata(requested.Name)
                root.Status = "deduplicated"
                root.CanonicalRoot = canonical.Name
                root.StopReason = "deduplicated"
            end
        end

        if #canonicalRoots == 0 then
            return
        end

        configureDynamicRootRegistry(canonicalRoots)

        if CONFIG.SNIFF_TRAFFIC
            and not auditWallExceeded()
            and (not snifferState.EverInstalled or snifferState.RestoreStatus == "restored")
            and not snifferState.Active
        then
            injectPassiveSniffer()
        end

        -- Root states are initialized lazily and serviced one state at a time.
        -- This keeps fairness deterministic and prevents one root from consuming
        -- the entire slice before another root gets a turn.
        local activeCount = #canonicalRoots
        local nextIndex = 1

        while activeCount > 0 do
            if auditWallExceeded() then
                markTraversalStop("wall_time")
                for index = 1, #canonicalRoots do
                    local state = states[index]
                    if not state then
                        local entry = canonicalRoots[index]
                        local root = ensureRootMetadata(entry.Name)
                        root.Status = "canonical"
                        root.CanonicalRoot = entry.Name
                        root.StopReason = "wall_time_before_start"
                    elseif not state.Completed then
                        state.stopReason = "wall_time"
                        if state.size > 0 then
                            state.droppedByTraversal += state.size
                            report.Metadata.Traversal.DroppedByTraversalBudget += state.size
                            report.Metadata.Truncation.TraversalInstances.Dropped += state.size
                            report.Metadata.Truncation.TraversalInstances.Reason =
                                report.Metadata.Truncation.TraversalInstances.Reason or "wall_time"
                        end
                        finalizeRootState(state)
                    end
                end
                break
            end

            -- Reuse the previous frame delta when there is no queued work yet;
            -- otherwise sample Heartbeat so the slice budget tracks the live frame.
            local heartbeatDelta = 1 / 60
            if totalPending > 0 then
                local waitStart = os.clock()
                heartbeatDelta = safeCall(function()
                    return RunService.Heartbeat:Wait()
                end, 1 / 60)
                local waitMs = (os.clock() - waitStart) * 1000
                report.Metadata.Performance.WaitMs += waitMs

                for index = 1, #canonicalRoots do
                    local state = states[index]
                    if state and not state.Completed then
                        state.waitMs += waitMs
                    end
                end
            end

            if type(heartbeatDelta) ~= "number"
                or heartbeatDelta ~= heartbeatDelta
                or heartbeatDelta < 0
            then
                heartbeatDelta = 1 / 60
            end

            local sliceStart = os.clock()
            local sliceBudget = calculateSliceBudget(heartbeatDelta)
            local sliceDeadline = sliceStart + sliceBudget
            local budgetExhausted = false

            profilerBegin("DCA/Slice")

            while activeCount > 0 and not budgetExhausted do
                if auditWallExceeded() then
                    markTraversalStop("wall_time")
                    break
                end

                if os.clock() >= sliceDeadline then
                    budgetExhausted = true
                    break
                end

                local state = states[nextIndex]
                local entry = canonicalRoots[nextIndex]

                -- Lazy initialization: only materialize one root state when its
                -- turn arrives, avoiding eager GetChildren() bursts across roots.
                if not state then
                    local initStart = os.clock()
                    local rootCount = #canonicalRoots
                    local baseQuota = math.max(
                        CONFIG.MIN_PENDING_QUOTA_PER_ROOT,
                        math.floor(CONFIG.MAX_PENDING / math.max(1, rootCount))
                    )
                    local initializedState, initializedPending =
                        initializeRootState(entry, totalPending, baseQuota)
                    state = initializedState
                    totalPending = initializedPending or totalPending

                    states[nextIndex] = state
                    local initMs = (os.clock() - initStart) * 1000
                    state.initMs = (state.initMs or 0) + initMs

                    if state.Completed then
                        activeCount -= 1
                        finalizeRootState(state)
                    end

                    nextIndex = (nextIndex % #canonicalRoots) + 1

                    if (os.clock() - sliceStart) >= sliceBudget then
                        budgetExhausted = true
                    end
                    continue
                end

                if state.Completed then
                    activeCount -= 1
                    nextIndex = (nextIndex % #canonicalRoots) + 1
                    continue
                end

                local nextRootEntry = state.Entry
                if nextRootEntry ~= currentScanRootEntry then
                    currentScanRootEntry = nextRootEntry
                    currentScanRoot = state.Entry.Name
                end

                if state.size <= 0 then
                    state.stopReason = state.stopReason or "completed"
                    activeCount -= 1
                    finalizeRootState(state)
                    nextIndex = (nextIndex % #canonicalRoots) + 1
                    continue
                end

                local popStart = os.clock()
                local instance = queuePop(state)
                local popMs = (os.clock() - popStart) * 1000
                if instance then
                    totalPending -= 1
                end

                if popMs > 0 then
                    state.maxAtomicMs = math.max(state.maxAtomicMs, popMs)
                    report.Metadata.Performance.MaxAtomicOperationMs =
                        math.max(report.Metadata.Performance.MaxAtomicOperationMs, popMs)
                end

                if instance then
                    local unitStart = os.clock()
                    profilerBegin("DCA/RootVisit")

                    state.firstProcessedAt = state.firstProcessedAt or unitStart
                    state.lastProcessedAt = unitStart

                    if report.Metadata.Traversal.GlobalVisited
                        >= CONFIG.MAX_SCANNED_INSTANCES_GLOBAL
                    then
                        state.stopReason = "global_instance_budget"
                        state.droppedByTraversal += state.size
                        report.Metadata.Traversal.DroppedByTraversalBudget += state.size
                        report.Metadata.Truncation.TraversalInstances.Dropped += state.size
                        report.Metadata.Truncation.TraversalInstances.Reason =
                            report.Metadata.Truncation.TraversalInstances.Reason
                            or "global_instance_budget"
                        markTraversalStop("global_instance_budget")
                    elseif state.visited >= CONFIG.MAX_SCANNED_INSTANCES_PER_ROOT then
                        state.stopReason = "root_instance_budget"
                        state.droppedByTraversal += state.size
                        report.Metadata.Traversal.DroppedByTraversalBudget += state.size
                        report.Metadata.Truncation.TraversalInstances.Dropped += state.size
                        report.Metadata.Truncation.TraversalInstances.Reason =
                            report.Metadata.Truncation.TraversalInstances.Reason
                            or "root_instance_budget"
                    else
                        local inspectStart = os.clock()
                        activeInstanceAtomicDeadline =
                            inspectStart + (CONFIG.INSTANCE_ATOMIC_MAX_MS / 1000)
                        local inspectOk = pcall(function()
                            return inspectInstance(instance)
                        end)
                        activeInstanceAtomicDeadline = nil
                        local inspectMs = (os.clock() - inspectStart) * 1000
                        local instanceBudgetExceeded = inspectMs > CONFIG.INSTANCE_ATOMIC_MAX_MS
                        state.maxAtomicMs = math.max(state.maxAtomicMs, inspectMs)
                        report.Metadata.Performance.MaxAtomicOperationMs =
                            math.max(report.Metadata.Performance.MaxAtomicOperationMs, inspectMs)

                        state.visited += 1
                        report.Metadata.Traversal.GlobalVisited += 1
                        report.Metadata.Truncation.TraversalInstances.Stored =
                            report.Metadata.Traversal.GlobalVisited
                        scannedInstanceCount += 1

                        if not inspectOk then
                            report.Metadata.SkippedDuringMutation += 1
                        end

                        if instanceBudgetExceeded then
                            markInstanceAtomicBudgetAbort(state)
                        end

                        if not instanceBudgetExceeded and state.Entry.ScanOwnership then
                            local ownershipStart = os.clock()
                            pcall(function()
                                inspectNetworkOwnership(instance)
                            end)
                            local ownershipMs = (os.clock() - ownershipStart) * 1000
                            state.maxAtomicMs = math.max(state.maxAtomicMs, ownershipMs)
                            report.Metadata.Performance.MaxAtomicOperationMs =
                                math.max(report.Metadata.Performance.MaxAtomicOperationMs, ownershipMs)
                        end

                        local children = nil
                        local childrenMs = 0
                        if not instanceBudgetExceeded then
                            local childrenStart = os.clock()
                            children = safeCall(function()
                                return instance:GetChildren()
                            end, nil)
                            childrenMs = (os.clock() - childrenStart) * 1000
                            state.maxAtomicMs = math.max(state.maxAtomicMs, childrenMs)
                            report.Metadata.Performance.MaxAtomicOperationMs =
                                math.max(report.Metadata.Performance.MaxAtomicOperationMs, childrenMs)
                        end

                        if not instanceBudgetExceeded then
                            totalPending = enqueueChildren(state, children, totalPending)
                        end

                        if state.stopReason == "wall_time" or auditWallExceeded() then
                            markTraversalStop("wall_time")
                        end
                    end

                    local unitMs = (os.clock() - unitStart) * 1000
                    state.activeMs += unitMs
                    profilerEnd()

                end

                if state.size == 0 and not state.Completed then
                    state.stopReason = state.stopReason or "completed"
                    activeCount -= 1
                    finalizeRootState(state)
                elseif report.Metadata.Traversal.StopReason then
                    if not state.Completed then
                        state.stopReason = state.stopReason or report.Metadata.Traversal.StopReason
                        finalizeRootState(state)
                        activeCount -= 1
                    end
                    break
                end

                nextIndex = (nextIndex % #canonicalRoots) + 1

                if os.clock() >= sliceDeadline then
                    budgetExhausted = true
                end
            end

            profilerEnd()

            local activeMs = (os.clock() - sliceStart) * 1000
            local overshootMs = math.max(0, (os.clock() - sliceDeadline) * 1000)
            report.Metadata.Performance.Slices += 1
            report.Metadata.Performance.YieldCount += 1
            report.Metadata.Performance.ActiveMs += activeMs
            report.Metadata.Performance.OvershootMs += overshootMs
            report.Metadata.Performance.MaxPending =
                math.max(report.Metadata.Performance.MaxPending, totalPending)

            if auditWallExceeded() or report.Metadata.Traversal.StopReason then
                if not report.Metadata.Traversal.StopReason then
                    markTraversalStop("wall_time")
                end

                for index = 1, #canonicalRoots do
                    local state = states[index]
                    if not state then
                        local entry = canonicalRoots[index]
                        local root = ensureRootMetadata(entry.Name)
                        root.Status = "canonical"
                        root.CanonicalRoot = entry.Name
                        root.StopReason = report.Metadata.Traversal.StopReason .. "_before_start"
                    elseif not state.Completed then
                        state.stopReason = state.stopReason or report.Metadata.Traversal.StopReason
                        if state.size > 0 then
                            state.droppedByTraversal += state.size
                            report.Metadata.Traversal.DroppedByTraversalBudget += state.size
                            report.Metadata.Truncation.TraversalInstances.Dropped += state.size
                            report.Metadata.Truncation.TraversalInstances.Reason =
                                report.Metadata.Truncation.TraversalInstances.Reason
                                or report.Metadata.Traversal.StopReason
                        end
                        finalizeRootState(state)
                    end
                end
                break
            end
        end

        currentScanRoot = "Unknown"
    end

