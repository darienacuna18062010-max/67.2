    local function recordExternalActivityMethod(method)
        if type(method) ~= "string" or method == "" then
            return
        end

        local methods = report.Network.ExternalActivity.Methods

        if methods[method] ~= nil then
            methods[method] += 1
            return
        end

        if externalMethodKeyCount < CONFIG.MAX_EXTERNAL_METHOD_KEYS then
            methods[method] = 1
            externalMethodKeyCount += 1
        else
            report.Network.ExternalActivity.OverflowMethods =
                (report.Network.ExternalActivity.OverflowMethods or 0) + 1
            local samples = report.Network.ExternalActivity.OverflowMethodSamples
            local known = false
            for _, existing in ipairs(samples) do
                if existing == method then known = true break end
            end
            if not known and #samples < CONFIG.MAX_EXTERNAL_METHOD_KEYS then
                samples[#samples + 1] = reportText(method)
            end
        end
    end

    local function refreshSnifferReport()
        report.Network.Sniffer = {
            Enabled = snifferState.Enabled,
            Status = snifferState.Status,
            StopReason = snifferState.StopReason,
            EverInstalled = snifferState.EverInstalled,
            HookStillAttached = snifferState.HookStillAttached,
            OwnershipVerified = snifferState.OwnershipVerified,
            Active = snifferState.Active,
            TimedOut = snifferState.TimedOut,
            MaxCallsReached = snifferState.MaxCallsReached,
            RestoreFailed = snifferState.RestoreFailed,
            InstallConflict = snifferState.InstallConflict,
            OwnershipLostDuringCapture = snifferState.OwnershipLostDuringCapture,
            OwnershipLossCount = snifferState.OwnershipLossCount,
            ObserveOnly = snifferState.ObserveOnly,
            RefusedExecutorHook = snifferState.RefusedExecutorHook,
            ForeignHookDetected = snifferState.ForeignHookDetected,
            OriginalHookFingerprint = snifferState.OriginalHookFingerprint,
            HookFingerprint = snifferState.HookFingerprint,
            ObservedHookFingerprint = snifferState.ObservedHookFingerprint,
            RestoreConflict = snifferState.RestoreConflict,
            RestoreStatus = snifferState.RestoreStatus,
            InstallFailureReason = snifferState.InstallFailureReason,
            OwnershipState = snifferState.OwnershipState,
            Duration = snifferState.Duration,
            CaptureWindowTrust = snifferState.CaptureWindowTrust,
            CaptureWindowStatus = snifferState.CaptureWindowStatus,
            AbsoluteDeadlineSeconds = snifferState.AbsoluteDeadlineSeconds,
            CallsObserved = snifferState.CallsObserved,
            TotalResponseCallsObserved = snifferState.TotalResponseCallsObserved,
            RemoteEndpointsProfiled = snifferState.RemoteEndpointsProfiled,
            SignaturesDropped = snifferState.SignaturesDropped,
            TransactionStage = snifferState.TransactionStage,
            InstallVerifiedAt = snifferState.InstallVerifiedAt,
            RestoreVerifiedAt = snifferState.RestoreVerifiedAt,
            Provenance = "dynamic_observation",
            Confidence = snifferState.CallsObserved > 0 and "high" or "none",
            EvidenceModel = "observed_via_runtime_namecall_without_claiming_server_side_vulnerability",
            FingerprintMode = "hash32_function_identity_string",
        }
    end

    local function finalizeSniffer(reason)
        snifferState.StopReason = reason or snifferState.StopReason or "audit_complete"

        if snifferState.RestoreStatus == "restored"
            or snifferState.RestoreStatus == "conflict"
        then
            snifferState.Active = false
            snifferState.CaptureWindowStatus = snifferState.RestoreStatus == "conflict"
                and "cleanup_conflict" or "completed"
            refreshSnifferReport()
            return snifferState.RestoreStatus == "restored"
        end

        if not passiveSnifferRestore then
            snifferState.Active = false
            if snifferState.Status ~= "disabled" then
                snifferState.Status = "not_installed"
            end
            snifferState.CaptureWindowStatus = "not_started"
            refreshSnifferReport()
            return true
        end

        local status = safeCall(passiveSnifferRestore, "failed")
        snifferState.EndedAtClock = os.clock()
        if snifferState.StartedAtClock then
            snifferState.Duration = snifferState.EndedAtClock - snifferState.StartedAtClock
            snifferState.CaptureWindowTrust =
                (snifferState.Duration > 0 and not snifferState.OwnershipLostDuringCapture)
                    and "reliable" or "unreliable"
            if snifferState.OwnershipLostDuringCapture then
                snifferState.CaptureWindowTrust = "unreliable"
            end
        else
            snifferState.CaptureWindowTrust = "no_capture_window"
        end

        if status == "restored" then
            passiveSnifferRestore = nil
            snifferState.Active = false
            snifferState.HookStillAttached = false
            snifferState.OwnershipVerified = false
            snifferState.RestoreFailed = false
            snifferState.RestoreConflict = false
            snifferState.RestoreStatus = "restored"
            snifferState.TransactionStage = "restore_verified"
            snifferState.RestoreVerifiedAt = os.time()
            snifferState.HookFingerprint = nil
            snifferState.ObservedHookFingerprint = snifferState.OriginalHookFingerprint
            snifferState.Status = "stopped"
            snifferState.CaptureWindowStatus = "completed"
        elseif status == "conflict" then
            passiveSnifferRestore = nil
            snifferState.Active = false
            snifferState.HookStillAttached = false
            snifferState.OwnershipVerified = false
            snifferState.RestoreConflict = true
            snifferState.RestoreStatus = "conflict"
            snifferState.TransactionStage = "restore_conflict"
            snifferState.Status = "stopped_conflict"
            snifferState.CaptureWindowStatus = "cleanup_conflict"
        else
            snifferState.Active = false
            snifferState.EverInstalled = true
            snifferState.HookStillAttached = true
            snifferState.RestoreFailed = true
            snifferState.RestoreStatus = "failed"
            snifferState.TransactionStage = "restore_failed"
            snifferState.Status = "cleanup_failed"
            snifferState.CaptureWindowStatus = "cleanup_failed"
            warn("[Deep Client Auditor] ADVERTENCIA: no se pudo restaurar __namecall; limpieza manual puede ser necesaria.")
        end

        refreshSnifferReport()
        return not snifferState.RestoreFailed and not snifferState.RestoreConflict
    end

    local function restorePassiveSniffer()
        return finalizeSniffer("audit_complete")
    end

    local function bucketNumber(value)
        if type(value) ~= "number" then
            return nil
        end
        if value ~= value or value == math.huge or value == -math.huge then
            return "nonfinite"
        end
        local absolute = math.abs(value)
        if absolute == 0 then return "zero" end
        if absolute < 1 then return "fraction" end
        if absolute < 10 then return "1-9" end
        if absolute < 100 then return "10-99" end
        if absolute < 1000 then return "100-999" end
        return "1000+"
    end

    local function bucketStringLength(value)
        local length = #value
        if length == 0 then return "0" end
        if length == 1 then return "1" end
        if length <= 4 then return "2-4" end
        if length <= 16 then return "5-16" end
        if length <= 64 then return "17-64" end
        return "65+"
    end

    local function stringCharacterClass(value)
        if value == "" then return "empty" end
        if value:match("^%d+$") then return "digits" end
        if value:match("^[%a]+$") then return "alpha" end
        if value:match("^[%w]+$") then return "alnum" end
        if value:match("^https?://") or value:match("^%w+%.%w+") then return "urlish" end
        return "mixed"
    end

    local function extractExternalUrl(urlArg)
        if type(urlArg) == "string" then
            return urlArg
        end
        if type(urlArg) == "table" then
            local url = urlArg.Url or urlArg.url or urlArg.URL
            if type(url) == "string" then
                return url
            end
        end
        return nil
    end

    local function recordExternalUrlShape(urlArg)
        local url = extractExternalUrl(urlArg)
        if type(url) ~= "string" or url == "" then return end
        local histogram = report.Network.ExternalActivity.UrlShapeHistogram
        local key = tostring(bucketStringLength(url)) .. "|" .. tostring(stringCharacterClass(url))
        histogram[key] = (histogram[key] or 0) + 1
    end

    local function tableShape(value)
        local count, numericCount, maxIndex = 0, 0, 0
        local observed = 0
        for key in pairs(value) do
            count += 1
            if observed < 64 then
                observed += 1
                if type(key) == "number" and key % 1 == 0 and key >= 1 then
                    numericCount += 1
                    maxIndex = math.max(maxIndex, key)
                end
            end
        end
        local shape = (numericCount == observed and maxIndex == observed) and "array" or "map"
        return {
            Type = "table",
            Shape = shape,
            LengthBucket = count == 0 and "0"
                or count == 1 and "1"
                or count <= 4 and "2-4"
                or count <= 16 and "5-16"
                or count <= 64 and "17-64"
                or "65+",
            Truncated = count > 64,
            ObservedCount = observed,
            Count = math.min(count, 64),
        }
    end

    local function describeArgument(value)
        local valueType = typeof(value)
        if valueType == "number" then
            return {
                Type = "number",
                Finite = value == value
                    and value ~= math.huge
                    and value ~= -math.huge,
                RangeBucket = bucketNumber(value),
            }
        elseif valueType == "string" then
            return {
                Type = "string",
                LengthBucket = bucketStringLength(value),
                CharacterClass = stringCharacterClass(value),
            }
        elseif valueType == "Instance" then
            return {
                Type = "Instance",
                Class = safeCall(function() return value.ClassName end, "Unknown"),
                AncestorClass = safeCall(function()
                    local parent = value.Parent
                    return parent and parent.ClassName or nil
                end, nil),
            }
        elseif valueType == "Vector3" or valueType == "Vector2" or valueType == "Vector3int16" or valueType == "Vector2int16" then
            return {
                Type = valueType,
                X = bucketNumber(value.X),
                Y = bucketNumber(value.Y),
                Z = value.Z ~= nil and bucketNumber(value.Z) or nil,
            }
        elseif valueType == "CFrame" then
            local p = value.Position
            return {
                Type = "CFrame",
                Position = p and { X = bucketNumber(p.X), Y = bucketNumber(p.Y), Z = bucketNumber(p.Z) } or nil,
            }
        elseif valueType == "Color3" then
            return {
                Type = "Color3",
                R = bucketNumber(value.R),
                G = bucketNumber(value.G),
                B = bucketNumber(value.B),
            }
        elseif valueType == "EnumItem" then
            return {
                Type = "EnumItem",
                EnumType = reportText(tostring(value.EnumType)),
                Name = reportText(tostring(value.Name)),
                Value = bucketNumber(value.Value),
            }
        elseif valueType == "RBXScriptSignal" then
            return { Type = "RBXScriptSignal" }
        elseif valueType == "RBXScriptConnection" then
            return {
                Type = "RBXScriptConnection",
                Connected = safeCall(function() return value.Connected end, nil),
            }
        elseif valueType == "table" then
            return tableShape(value)
        end
        return { Type = valueType }
    end

    local function argumentShapeKey(shape)
        shape = shape or {}
        local parts = { tostring(shape.Type), "\0", tostring(shape.Class), "\0", tostring(shape.AncestorClass) }
        for _, key in ipairs({ "Finite", "RangeBucket", "LengthBucket", "CharacterClass", "Shape", "Truncated", "ObservedCount", "X", "Y", "Z", "Position", "R", "G", "B", "EnumType", "Name", "Value", "Connected" }) do
            parts[#parts + 1] = tostring(shape[key])
        end
        return table.concat(parts, ":")
    end

    local RuntimeState = {}
    RuntimeState.ContractVersion = 3

    local function clearTable(map)
        if type(table.clear) == "function" then table.clear(map) else for key in pairs(map) do map[key] = nil end end
    end

    local function clearWeakMap(map)
        clearTable(map)
    end

    local function clearArrayState(list)
        if type(table.clear) == "function" then
            table.clear(list)
        else
            for i = #list, 1, -1 do list[i] = nil end
        end
    end

