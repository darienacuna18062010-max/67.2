    local function resetUICaches()
        -- Reuse the existing weak-key table when table.clear is available. This
        -- avoids repeatedly allocating the cache table and reduces transient GC
        -- pressure between root scans. Fall back to replacement for compatibility.
        if type(table.clear) == "function" then
            table.clear(guiScreenCache)
        else
            guiScreenCache = setmetatable({}, { __mode = "k" })
        end
        uiViewportSize = nil
    end

    local function refreshUIViewportCache()
        uiViewportSize = nil
        if not UI_LAYOUT_READY then
            return
        end

        local camera = safeCall(function()
            return Workspace.CurrentCamera
        end, nil)

        uiViewportSize = safeCall(function()
            return camera and camera.ViewportSize or nil
        end, nil)
    end

    local function getScreenGuiForObject(instance)
        local cached = guiScreenCache[instance]
        if cached ~= nil then
            return cached
        end

        local screenGui = safeCall(function()
            return instance:FindFirstAncestorOfClass("ScreenGui")
        end, nil)

        guiScreenCache[instance] = screenGui or false
        return screenGui
    end

    local REASON_TO_COUNTER = {
        ["Visible=false"] = "VisibleFalse",
        ["ScreenGui.Enabled=false"] = "ScreenGuiDisabled",
        ["Offscreen"] = "Offscreen",
        ["AbsoluteSize=0"] = "ZeroSize",
    }

    local TRANSPARENCY_REASONS = {
        ["GroupTransparency=1"] = true,
        ["BackgroundTransparency=1"] = true,
        ["TextTransparency=1"] = true,
        ["ImageTransparency=1"] = true,
    }

    local function bumpHiddenUIReasons(reasons)
        for _, reason in ipairs(reasons) do
            local field = REASON_TO_COUNTER[reason]
            if field then
                report.Instances.HiddenUIByReason[field] += 1
            elseif TRANSPARENCY_REASONS[reason] then
                local transparencyField = reason:match("^(%w+)Transparency")
                if transparencyField and report.Instances.HiddenUIByReason[transparencyField .. "Transparency"] ~= nil then
                    report.Instances.HiddenUIByReason[transparencyField .. "Transparency"] += 1
                end
            end
        end
    end
    local function getHiddenUIState(instance)
        local class = safeCall(function() return instance.ClassName end, "Unknown")
        local reasons = {}
        local layeringSignals = {}
        local potentiallyInteractive = false
        local interactionSignals = {}

        local function noteInteraction(signal)
            potentiallyInteractive = true
            interactionSignals[#interactionSignals + 1] = signal
        end

        if class == "ScreenGui" then
            local enabled = safeCall(function() return instance.Enabled end, true)
            if not enabled then
                reasons[#reasons + 1] = "ScreenGui.Enabled=false"
            end

            local displayOrder = safeCall(function() return instance.DisplayOrder end, nil)
            local ignoreGuiInset = safeCall(function() return instance.IgnoreGuiInset end, false)
            if type(displayOrder) == "number"
                and displayOrder >= CONFIG.HIDDEN_UI_HIGH_DISPLAY_ORDER
            then
                layeringSignals[#layeringSignals + 1] = "DisplayOrderHigh"
            end
            if ignoreGuiInset and type(displayOrder) == "number"
                and displayOrder >= CONFIG.HIDDEN_UI_HIGH_DISPLAY_ORDER
            then
                layeringSignals[#layeringSignals + 1] = "OverlayHighDisplayOrder"
                interactionSignals[#interactionSignals + 1] = "IgnoreGuiInsetHighDisplayOrder"
                potentiallyInteractive = true
            end

            return #reasons > 0, reasons, potentiallyInteractive, interactionSignals, layeringSignals
        end

        local visible = safeCall(function() return instance.Visible end, true)
        if not visible then
            reasons[#reasons + 1] = "Visible=false"
        end

        local screenGui = getScreenGuiForObject(instance)
        if screenGui then
            local screenGuiEnabled = safeCall(function() return screenGui.Enabled end, true)
            if not screenGuiEnabled then
                reasons[#reasons + 1] = "ScreenGui.Enabled=false"
            end
        end

        if UI_LAYOUT_READY then
            local absoluteSize = safeCall(function() return instance.AbsoluteSize end, nil)
            if absoluteSize and (absoluteSize.X <= 0 or absoluteSize.Y <= 0) then
                reasons[#reasons + 1] = "AbsoluteSize=0"
            end

            local absolutePosition = safeCall(function() return instance.AbsolutePosition end, nil)
            local viewportSize = uiViewportSize
            if absolutePosition and absoluteSize and viewportSize then
                local outside =
                    absolutePosition.X + absoluteSize.X <= 0
                    or absolutePosition.Y + absoluteSize.Y <= 0
                    or absolutePosition.X >= viewportSize.X
                    or absolutePosition.Y >= viewportSize.Y

                if outside then
                    reasons[#reasons + 1] = "Offscreen"
                end
            end
        end

        local groupTransparency = safeCall(function() return instance.GroupTransparency end, nil)
        if type(groupTransparency) == "number" and groupTransparency >= 1 then
            reasons[#reasons + 1] = "GroupTransparency=1"
        end

        local backgroundTransparency = safeCall(function() return instance.BackgroundTransparency end, nil)
        if type(backgroundTransparency) == "number" and backgroundTransparency >= 1 then
            reasons[#reasons + 1] = "BackgroundTransparency=1"
        end

        local textTransparency = safeCall(function() return instance.TextTransparency end, nil)
        if type(textTransparency) == "number" and textTransparency >= 1 then
            reasons[#reasons + 1] = "TextTransparency=1"
        end

        local imageTransparency = safeCall(function() return instance.ImageTransparency end, nil)
        if type(imageTransparency) == "number" and imageTransparency >= 1 then
            reasons[#reasons + 1] = "ImageTransparency=1"
        end

        local zIndex = safeCall(function() return instance.ZIndex end, nil)
        if type(zIndex) == "number" and zIndex >= CONFIG.HIDDEN_UI_HIGH_ZINDEX then
            layeringSignals[#layeringSignals + 1] = "ZIndexHigh"
        end

        local active = safeCall(function() return instance.Active end, false)
        local selectable = safeCall(function() return instance.Selectable end, false)
        if active then
            noteInteraction("Active=true")
        end
        if selectable then
            noteInteraction("Selectable=true")
        end
        if class == "TextButton" or class == "ImageButton" or class == "TextBox" then
            noteInteraction("interactive_class")
        end

        local isHidden = #reasons > 0
        if isHidden and not potentiallyInteractive then
            interactionSignals[#interactionSignals + 1] = "no_interaction_signal"
        end
        return isHidden, reasons, potentiallyInteractive, interactionSignals, layeringSignals
    end

