            PerformancePreset = report.Metadata.PerformancePreset,
            RuntimeMobileDetected = report.Metadata.RuntimePlatform.IsMobile,
            PerformanceSlices = report.Metadata.Performance.Slices,
            PerformanceActiveMs = report.Metadata.Performance.ActiveMs,
            PerformanceWaitMs = report.Metadata.Performance.WaitMs,
            PerformanceMaxAtomicOperationMs = report.Metadata.Performance.MaxAtomicOperationMs,
            PerformanceOvershootMs = report.Metadata.Performance.OvershootMs,
            PerformanceMaxPending = report.Metadata.Performance.MaxPending,
            EstimatedOutputBytes = report.Metadata.Performance.EstimatedOutputBytes,
            OutputBudgetExceeded = report.Metadata.Performance.OutputBudgetExceeded,
            TraversalGlobalVisited = report.Metadata.Traversal.GlobalVisited,
            TraversalMaxPendingObserved = report.Metadata.Traversal.MaxPendingObserved,
            TraversalDroppedByPendingBudget = report.Metadata.Traversal.DroppedByPendingBudget,
            TraversalDroppedByOutputEarlyStop = report.Metadata.Traversal.DroppedByOutputEarlyStop,
            TraversalDroppedByTraversalBudget = report.Metadata.Traversal.DroppedByTraversalBudget,
            TraversalSkippedBySeen = report.Metadata.Traversal.SkippedBySeen,
            AnyTruncation = metadataProjectionWasActive
                and true
                or (preservedFlags and preservedFlags.AnyTruncation or anyTruncation),
            CompatibilityScorecard = preservedTables and preservedTables.CompatibilityScorecard or buildCompatibilityScorecard(),
            ReportLevel = EFFECTIVE_REPORT_LEVEL,
            GCMode = CONFIG.GC_MODE,
            GCDedupMode = CONFIG.GC_DEDUP_MODE,
            EvidencePolicy = "Observed/runtime evidence is distinguished from heuristic/inferred signals; no client-only finding is a server-side vulnerability verdict.",
        }

        -- METADATA projection may be followed by repeated output compaction passes.
        -- Re-propagate the pre-projection snapshots so a later createSummary() call
        -- never falls back to already-cleared collections.
        if preservedCounts then
            report.Summary.CountsBeforeMetadataProjection = preservedCounts
        end
        if preservedFlags then
            report.Summary.FlagsBeforeMetadataProjection = preservedFlags
        end
        if preservedTables then
            report.Summary.ArraysBeforeMetadataProjection = preservedTables -- legacy field name; snapshot may contain any table value
        end
