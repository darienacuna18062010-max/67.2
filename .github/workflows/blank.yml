    local executorName = "Unknown"
    local executorVersion = "Unknown"

    if IDENTIFY_EXECUTOR then
        safeCall(function()
            local a, b = IDENTIFY_EXECUTOR()

            executorName = tostring(a or "Unknown")
            executorVersion = tostring(b or "Unknown")
        end)
