    correlationChainCounts = {}
    local resolvedFingerprintRejected
    knownScriptFingerprintDatabase, resolvedFingerprintRejected = resolveKnownScriptFingerprintDatabase()
    report.Metadata.FingerprintDatabase = { Status = next(knownScriptFingerprintDatabase) and "loaded" or "empty", NumberOfEntries = 0, RejectedEntries = resolvedFingerprintRejected or 0 }
    for _ in pairs(knownScriptFingerprintDatabase) do report.Metadata.FingerprintDatabase.NumberOfEntries += 1 end
    report.Metadata.ObservationCoverage.KnownScriptFingerprinting = next(knownScriptFingerprintDatabase) and "operator_supplied_sha256_reference" or "empty_reference_database"
    timelineEventCount = 0
