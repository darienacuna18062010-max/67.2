        end
        report.Metadata.PhaseDurations.DefenseScan = os.clock() - phaseStart
        setPhaseContractStatus("DefenseScan", CONFIG.SCAN_CLIENT_DEFENSES and (auditWallExceeded() and "partial_wall_time" or "complete") or "disabled_by_profile")

        report.Metadata.SnapshotStartedAt = os.time()
        report.Metadata.SnapshotStartedClock = os.clock()

        local roots = {}
