        CONFIG.SNIFFER_OBSERVE_ONLY = true
    elseif CONFIG.SNIFF_TRAFFIC and CONFIG.IMPACT_POLICY ~= "TEMPORARY_HOOK" then
        -- This auditor has no active-test implementation; fail closed instead of
        -- silently treating an unsupported policy as authorized activity.
        recordConfigCorrection(
            "IMPACT_POLICY",
            CONFIG.IMPACT_POLICY,
            "TEMPORARY_HOOK",
            "current sniffer supports observation through a temporary hook only"
