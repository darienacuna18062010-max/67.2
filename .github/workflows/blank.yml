    local function resolveGlobal(name, expectedType)
        if type(name) ~= "string" or name == "" then
            return nil
        end

        local candidates = {}

        local okEnv, env = pcall(getfenv)
        if okEnv and type(env) == "table" then
            candidates[#candidates + 1] = env
        end

        local okFenv, fenv = pcall(getfenv, 0)
        if okFenv and type(fenv) == "table" then
            candidates[#candidates + 1] = fenv
        end

        local okGlobalGetgenv, globalGetgenv = pcall(function()
            return rawget(_G, "getgenv")
        end)
        if okGlobalGetgenv and type(globalGetgenv) == "function" then
            local okGenv, genv = pcall(globalGetgenv)
            if okGenv and type(genv) == "table" then
                candidates[#candidates + 1] = genv
            end
        end

        if type(_G) == "table" then
            candidates[#candidates + 1] = _G
        end

        for _, candidate in ipairs(candidates) do
            local okValue, value = pcall(rawget, candidate, name)
            if okValue and value ~= nil
                and (expectedType == nil or type(value) == expectedType)
            then
                return value
            end
        end

        return nil
    end

    local function getGlobalValue(name)
        return resolveGlobal(name, nil)
    end

    local function getGlobalFunction(name)
        return resolveGlobal(name, "function")
    end

