    local function safePrint(...)
        if CONFIG.SILENT_OUTPUT then
            return
        end
        local args = table.pack(...)
        if args.n == 0 then
            print("[DCA]")
            return
        end
        local rendered = {}
        for i = 1, args.n do
            rendered[i] = tostring(args[i])
        end
        print("[DCA] " .. table.concat(rendered, " "))
    end

    local function notify(title, text)
        if CONFIG.SILENT_OUTPUT then
            return
        end

        local payloadTitle = tostring(title)
        local payloadText = tostring(text)
        task.spawn(function()
            local ok = pcall(function()
                StarterGui:SetCore("SendNotification", {
                    Title = payloadTitle,
                    Text = payloadText,
                    Duration = 5,
                })
            end)

            if not ok then
                safePrint(
                    string.format(
                        "%s: %s",
                        payloadTitle,
                        payloadText
                    )
                )
            end
        end)
    end

