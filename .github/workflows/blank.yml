        toolInventoryMembership[instance] = true
        local tool = {
            Name = reportText(instance.Name),
            Class = instance.ClassName,
            Path = reportText(path),
            Root = currentScanRoot,
            CanBeDropped = safeCall(function() return instance.CanBeDropped end, nil),
            RequiresHandle = safeCall(function() return instance.RequiresHandle end, nil),
            ToolTip = reportText(safeCall(function() return instance.ToolTip end, nil)),
            Evidence = {
                {
                    Source = "tool_inventory_static_scan",
