        remote_invoke_response = { "capture_window_limited", "server_response_shape_only", "does_not_prove_server_validation" },
    }

    local function normalizeConfidence(value, fallback)
        local lower = string.lower(tostring(value or fallback or "low"))
        if lower == "high" or lower == "direct" or lower == "medium" or lower == "low" or lower == "none" then
            return lower
        end
        return fallback or "low"
    end

    local function fixedEvidenceLimitations(source, explicit)
        local base = EVIDENCE_LIMITATIONS_BY_SOURCE[source]
        local result = {}
        if base then
            for _, item in ipairs(base) do
                result[#result + 1] = item
            end
        end
        if type(explicit) == "table" then
            for _, item in ipairs(explicit) do
                local value = tostring(item)
                local duplicate = false
                for _, existing in ipairs(result) do
                    if existing == value then
                        duplicate = true
                        break
                    end
                end
                if not duplicate then
                    result[#result + 1] = value
                end
            end
        end
        if #result == 0 then
            result[1] = "client_side_observation_only"
        end
        return result
    end


    local function hasWholeWord(text, word)
        return text:match("%f[%w_]" .. word .. "%f[^%w_]") ~= nil
    end

    local function classifyScriptString(raw, remoteNameSet)
        local s = string.lower(tostring(raw))
        if s:match("https?://") then return "url" end
        if s:find("discord.com/api/webhooks/", 1, true) or s:find("webhook", 1, true) then return "webhook" end
        if s:find("rbxassetid://", 1, true) or s:find("rbxassetid", 1, true) then return "rbxassetid" end
        if remoteNameSet and remoteNameSet[hash32(string.lower(tostring(raw)))] then return "remote_name" end
        local normalizedKeySeparators = s:gsub("[%._%-]", "_")
        local compactKeyForm = normalizedKeySeparators:gsub("_", "")
        if hasWholeWord(s, "key") or hasWholeWord(s, "token") or hasWholeWord(s, "secret")
            or hasWholeWord(s, "password") or hasWholeWord(s, "apikey")
            or s:find("api_key", 1, true) or s:find("api-key", 1, true)
            or s:find("api.key", 1, true) or compactKeyForm:find("apikey", 1, true)
        then
            return "key_like"
        end
        if hasWholeWord(s, "admin") or hasWholeWord(s, "ban") or hasWholeWord(s, "kick")
            or hasWholeWord(s, "give") or hasWholeWord(s, "grant")
            or hasWholeWord(s, "rank") or hasWholeWord(s, "command")
        then
            return "admin_command"
        end
        return "other"
    end

    local function collectClosureConstants(closure, depth, outStrings, outNumbers, outGlobals, outInstances, seen)
        if depth > 3 or typeof(closure) ~= "function" then
            return
        end
        seen = seen or {}
        if seen[closure] then return end
        seen[closure] = true

        local constants = safeCall(function()
            return GET_CONSTANTS and GET_CONSTANTS(closure) or nil
        end, nil)
        if type(constants) == "table" then
            for _, value in pairs(constants) do
                if type(value) == "string" then
                    if #outStrings < CONFIG.MAX_SCRIPT_ANALYSIS_STRINGS then
                        outStrings[#outStrings + 1] = value
                    end
                    local lower = string.lower(value)
                    if lower:match("^[%a_][%w_]*$") and #value <= 64 then
                        local globals = {
                            game=true, workspace=true, script=true, math=true, string=true, table=true,
                            task=true, coroutine=true, debug=true, Players=true, ReplicatedStorage=true,
                            RunService=true, UserInputService=true, HttpService=true, require=true,
                            getgenv=true, getfenv=true, loadstring=true,
                        }
                        if globals[lower] and #outGlobals < 64 then
                            outGlobals[#outGlobals + 1] = lower
                        end
                    end
                elseif type(value) == "number" and #outNumbers < CONFIG.MAX_SCRIPT_ANALYSIS_NUMBERS then
                    outNumbers[#outNumbers + 1] = value
                elseif typeof(value) == "Instance" and outInstances and #outInstances < 128 then
                    outInstances[#outInstances + 1] = value
                end
            end
        end

        local protos = safeCall(function()
            return GET_PROTOS and GET_PROTOS(closure) or nil
        end, nil)
        if type(protos) == "table" then
            for _, proto in ipairs(protos) do
                collectClosureConstants(proto, depth + 1, outStrings, outNumbers, outGlobals, outInstances, seen)
            end
        elseif GET_PROTO then
            for index = 1, 32 do
                local proto = safeCall(function()
                    return GET_PROTO(closure, index)
                end, nil)
                if not proto then break end
                collectClosureConstants(proto, depth + 1, outStrings, outNumbers, outGlobals, outInstances, seen)
            end
        end
    end

    local BYTECODE_STRING_CACHE = { Items = {}, Order = {}, Limit = CONFIG.MAX_BYTECODE_STRING_CACHE_ENTRIES, ThreadContract = "main_thread_only" }

    local function extractPrintableBytecodeStrings(bytecode, maxItems, cooperativeCallback)
        maxItems = maxItems or CONFIG.MAX_SCRIPT_ANALYSIS_STRINGS
        local cacheKey = tostring(hash32(type(bytecode)=="string" and bytecode or "")) .. ":" .. tostring(type(bytecode)=="string" and #bytecode or 0)
        local cached = BYTECODE_STRING_CACHE.Items[cacheKey]
        if cached and cached.MaxItems == maxItems then return cached.Values end
        local result = {}
        if type(bytecode) ~= "string" then return result end
        maxItems = maxItems or CONFIG.MAX_SCRIPT_ANALYSIS_STRINGS
        local scanLimit = math.min(#bytecode, CONFIG.MAX_BYTECODE_BYTES, CONFIG.MAX_BYTECODE_STRING_SCAN_BYTES)
        local buffer = {}
        local bufferLength = 0
        local sliceStart = os.clock()
        local function flush()
            if bufferLength >= 3 and #result < maxItems then
                result[#result + 1] = table.concat(buffer)
            end
            if type(table.clear) == "function" then
                table.clear(buffer)
            else
                for i = #buffer, 1, -1 do buffer[i] = nil end
            end
            bufferLength = 0
        end
        for i = 1, scanLimit do
            if #result >= maxItems then break end
            local byte = string.byte(bytecode, i)
            if byte and byte >= 32 and byte <= 126 then
                bufferLength += 1
                buffer[bufferLength] = string.char(byte)
            else
                flush()
                if #result >= maxItems then break end
            end
            if i % 4096 == 0 and (os.clock() - sliceStart) >= CONFIG.SLICE_MIN_BUDGET_SECONDS then
                local shouldStop = type(cooperativeCallback) == "function" and cooperativeCallback(i, scanLimit)
                if shouldStop then
                    break
                end
                task.wait()
                sliceStart = os.clock()
            end
        end
        if #result < maxItems then flush() end
        BYTECODE_STRING_CACHE.Items[cacheKey] = { MaxItems = maxItems, Values = result }
        BYTECODE_STRING_CACHE.Order[#BYTECODE_STRING_CACHE.Order + 1] = cacheKey
        while #BYTECODE_STRING_CACHE.Order > BYTECODE_STRING_CACHE.Limit do
            local evict = table.remove(BYTECODE_STRING_CACHE.Order, 1)
            BYTECODE_STRING_CACHE.Items[evict] = nil
        end
        return result
    end


