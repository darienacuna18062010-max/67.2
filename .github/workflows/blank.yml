    local function findSensitiveMatchOnLowercased(raw)
        if type(raw) ~= "string" then
            raw = tostring(raw)
        end

        local length = #raw
        local tokenStart = nil
        local previousByte = nil
        local bestMatch = nil
        local bestSeverity = nil
        local bestSeverityOrder = 0

        for i = 1, length + 1 do
            local currentByte = i <= length and string.byte(raw, i) or nil
            local isLetter = currentByte ~= nil
                and ((currentByte >= 65 and currentByte <= 90)
                    or (currentByte >= 97 and currentByte <= 122))
            local isUnderscore = currentByte == 95
            local isWordChar = isLetter or isUnderscore
            local isUpper = currentByte ~= nil
                and currentByte >= 65 and currentByte <= 90
            local previousIsLower = previousByte ~= nil
                and previousByte >= 97 and previousByte <= 122
            local camelBoundary = tokenStart ~= nil
                and isLetter and previousIsLower and isUpper

            if camelBoundary or not isWordChar then
                if tokenStart ~= nil then
                    local tokenEnd = i - 1
                    if tokenEnd >= tokenStart then
                        local normalized = string.lower(string.sub(raw, tokenStart, tokenEnd))
                        local severity = CONFIG.SENSITIVE_WORDS[normalized]
                        local severityOrder = SEVERITY_ORDER[severity] or 0

                        if severity
                            and severityOrder > bestSeverityOrder
                        then
                            bestMatch = normalized
                            bestSeverity = severity
                            bestSeverityOrder = severityOrder
                        end
                    end
                end

                if camelBoundary then
                    tokenStart = i
                else
                    tokenStart = nil
                end
            elseif tokenStart == nil then
                tokenStart = i
            end

            previousByte = currentByte
        end

        return bestMatch, bestSeverity
    end

    local sensitiveWordCache = {}
    local sensitiveWordCacheSize = 0

    local function findSensitiveWord(text)
        local source = tostring(text)
        if CONFIG.CACHE_SENSITIVE_WORDS then
            local cached = sensitiveWordCache[source]
            if cached ~= nil then
                return cached.Match, cached.Severity
            end
        end

        local match, severity = findSensitiveMatchOnLowercased(source)
        if CONFIG.CACHE_SENSITIVE_WORDS
            and sensitiveWordCacheSize < CONFIG.MAX_SENSITIVE_WORD_CACHE
        then
            sensitiveWordCache[source] = { Match = match, Severity = severity }
            sensitiveWordCacheSize += 1
        end
        return match, severity
    end

    local function isRobloxURL(url)
        if url:find("rbxasset://", 1, true) then
            return true
        end

        local host = url:match("https?://([^/%s?#]+)")
        if not host then
            return false
        end

        host = string.lower(host):gsub(":%d+$", "")

        for _, entry in ipairs(ROBLOX_DOMAINS_NORMALIZED) do
            if host == entry.Exact
                or host:sub(-entry.SuffixLength) == entry.Suffix
            then
                return true
            end
        end

        return false
    end

    local function shannonEntropy(value)
        if type(value) ~= "string" or #value == 0 then return 0 end

        -- Bound the work to keep large/ofuscated constants cooperative with the
        -- audit slice budget. This is intentionally a prefix sample, not a claim
        -- that the complete string was analyzed.
        local length = math.min(#value, CONFIG.MAX_ENTROPY_SAMPLE_LENGTH)
        local counts = {}
        for i = 1, length do
            local b = string.byte(value, i)
            counts[b] = (counts[b] or 0) + 1
        end

        local entropy=0
        for _,count in pairs(counts) do
            local p=count/length
            entropy -= p*math.log(p,2)
        end
        return entropy
    end

    local function findSensitiveString(text)
        if type(text) ~= "string" then
            return nil, nil
        end

        local source = string.lower(text)

        if source:match("discord%.com/api/webhooks/")
            or source:match("discord%.gg/")
        then
            return "discord_webhook", "HIGH"
        end

        if source:match("pastebin%.com/raw/") then
            return "pastebin_raw", "MEDIUM"
        end

        if source:match("raw%.githubusercontent%.com") then
            return "github_raw", "MEDIUM"
        end

        local url = source:match("%f[%a]https?://[%w%p]+")
        if url and not isRobloxURL(url) then
            return "url", "MEDIUM"
        end

        if source:match("%f[%w]webhook%f[%W]") then
            return "webhook", "HIGH"
        end

        if source:match("%f[%a]bearer%f[%A]") then
            return "bearer", "HIGH"
        end

        local match, severity =
            findSensitiveMatchOnLowercased(text)
        local minimumSeverity =
            SEVERITY_ORDER[CONFIG.GC_MIN_SEVERITY] or SEVERITY_ORDER.HIGH

        if match and (SEVERITY_ORDER[severity] or 0) >= minimumSeverity then
            return match, severity
        end

        if CONFIG.HIGH_ENTROPY_DETECTION
            and #source >= 24
            and shannonEntropy(source) >= 4.5
            and source:match("^[%w%+%/%=_%-]+$")
        then
            return "high_entropy", "MEDIUM"
        end

        return nil, nil
    end
