        LOP_FORNLOOP,
        LOP_FORGLOOP,
        LOP_FORGPREP_INEXT,
        LOP_FASTCALL3,
        LOP_FORGPREP_NEXT,
        LOP_NATIVECALL,
        LOP_GETVARARGS,
        LOP_DUPCLOSURE,
        LOP_PREPVARARGS,
        LOP_LOADKX,
        LOP_JUMPX,
        LOP_FASTCALL,
        LOP_COVERAGE,
        LOP_CAPTURE,
        LOP_SUBRK,
        LOP_DIVRK,
        LOP_FASTCALL1,
        LOP_FASTCALL2,
        LOP_FASTCALL2K,
        LOP_FORGPREP,
        LOP_JUMPXEQKNIL,
        LOP_JUMPXEQKB,
        LOP_JUMPXEQKN,
        LOP_JUMPXEQKS,
        LOP_IDIV,
        LOP_IDIVK,
        LOP_GETUDATAKS,
        LOP_SETUDATAKS,
        LOP_NAMECALLUDATA,
        LOP_NEWCLASSMEMBER,
        LOP_CALLFB,
        LOP_CMPPROTO,
        LOP_FASTPCALL,
        LOP_NEWCLASS,
    }

    local LUAU_AUX_OPS = {
        -- Supplied Luau Bytecode.h maps LOP_CMPPROTO=88 and LOP_NEWCLASS=90; both carry AUX.
        [88] = true, -- LOP_CMPPROTO (AUX proto id)
        [90] = true, -- LOP_NEWCLASS (AUX constant index)

        [7] = true,
        [8] = true,
        [12] = true,
        [15] = true,
        [16] = true,
        [19] = true,
        [20] = true,
        [27] = true,
        [28] = true,
        [29] = true,
        [30] = true,
        [31] = true,
        [32] = true,
        [53] = true,
        [55] = true,
        [58] = true,
        [60] = true,
        [66] = true,
        [74] = true,
        [75] = true,
        [77] = true,
        [78] = true,
        [79] = true,
        [80] = true,
        [83] = true,
        [84] = true,
        [85] = true,
        [86] = true,
        [87] = true,
    }

    parseLuauSerializedBytecode = function(bytecode, options)
        local limits = {
            MaxBytes = CONFIG.MAX_BYTECODE_BYTES,
            MaxProtos = CONFIG.MAX_BYTECODE_PROTO_COUNT,
            MaxStrings = CONFIG.MAX_BYTECODE_STRING_COUNT,
            MaxInstructionsPerProto = CONFIG.MAX_BYTECODE_INSTRUCTIONS_PER_PROTO,
            MaxImports = CONFIG.MAX_BYTECODE_IMPORTS,
            MaxCallSites = CONFIG.MAX_BYTECODE_CALL_SITES,
        }
        options = options or {}
        local cooperativeCallback = options.CooperativeCallback
        local function cooperate(stage, units)
            if cooperativeCallback then cooperativeCallback(stage, units) end
        end

        if type(bytecode) ~= "string" then
            return { Status = "unavailable", Reason = "bytecode_not_string" }
        end
        if #bytecode == 0 then
            return { Status = "invalid", Reason = "empty_bytecode" }
        end
        if #bytecode > limits.MaxBytes then
            return { Status = "rejected", Reason = "bytecode_size_limit", BytecodeSize = #bytecode }
        end

        local size = #bytecode
        local offset = 1
        local function requireBytes(n)
            if n < 0 or offset + n - 1 > size then
                error("serialized_bytecode_truncated")
            end
        end
        local function readU8()
            requireBytes(1)
            local value = string.byte(bytecode, offset)
            offset += 1
            return value
        end
        local function readU32()
            requireBytes(4)
            local b1,b2,b3,b4 = string.byte(bytecode, offset, offset + 3)
            offset += 4
            return b1 + b2*256 + b3*65536 + b4*16777216
        end
        local function readVarInt()
            local result = 0
            local multiplier = 1
            for _ = 1, 10 do
                local byte = readU8()
                result += (byte % 128) * multiplier
                if byte < 128 then return result end
                multiplier *= 128
            end
            error("serialized_bytecode_varint_too_long")
        end
        local function readBytes(n)
            requireBytes(n)
            local a = offset
            offset += n
            return string.sub(bytecode, a, offset - 1)
        end
        local function readStringRef(strings)
            local id = readVarInt()
            if id == 0 then return nil end
            return strings[id] or nil
        end
        local function signed16(raw)
            return raw >= 32768 and raw - 65536 or raw
        end
        local function signed24(raw)
            return raw >= 8388608 and raw - 16777216 or raw
        end
        local function decodeInstruction(word)
            local op = word % 256
            local a = math.floor(word / 256) % 256
            local b = math.floor(word / 65536) % 256
            local c = math.floor(word / 16777216) % 256
            local dRaw = math.floor(word / 65536) % 65536
            local eRaw = math.floor(word / 256) % 16777216
            return op, a, b, c, signed16(dRaw), signed24(eRaw)
        end
        local function stringConstant(constants, index)
            local c = constants[index + 1]
            return c and c.Kind == "string" and c.Value or nil
        end
        local function importPath(constants, aux, version, onWarning)
            -- Luau's current GETIMPORT AUX layout is three 10-bit constant-string
            -- indices plus a 2-bit path-count. Version 100 / future layouts are
            -- observed conservatively rather than decoded as though they matched.
            local supportedLayout =
                version >= CONFIG.BYTECODE_PARSER_MIN_VERSION
                and version <= CONFIG.BYTECODE_PARSER_MAX_VERSION
                and version ~= 100
            if not supportedLayout then
                if onWarning then
                    onWarning("getimport_aux_layout_unverified_v" .. tostring(version))
                end
                return nil
            end

            local count = math.floor(aux / 1073741824)
            local i0 = math.floor(aux / 1048576) % 1024
            local i1 = math.floor(aux / 1024) % 1024
            local i2 = aux % 1024
            if count == 1 then return stringConstant(constants, i0) end
            if count == 2 then
                local a = stringConstant(constants, i0)
                local b = stringConstant(constants, i1)
                return a and b and (a .. "." .. b) or nil
            end
            if count == 3 then
                local a = stringConstant(constants, i0)
                local b = stringConstant(constants, i1)
                local c = stringConstant(constants, i2)
                return a and b and c and (a .. "." .. b .. "." .. c) or nil
            end
            return nil
        end

        local function readProto(version, typesVersion, strings, protoIndex)
            local protoSize = nil
            local protoStart = offset
            if version >= 12 then
                protoSize = readVarInt()
                protoStart = offset
            end

            local p = { Index = protoIndex, ProtoSize = protoSize }
            p.MaxStackSize = readU8()
            p.NumParams = readU8()
            p.Nups = readU8()
            p.IsVararg = readU8()
            p.Flags = version >= 4 and readU8() or 0

            if version >= 4 then
                local typeSize = readVarInt()
                readBytes(typeSize)
                p.TypeInfoSize = typeSize
            else
                p.TypeInfoSize = 0
            end

            local sizeCode = readVarInt()
            p.CodeSize = sizeCode
            p.Code = {}
            for i = 1, sizeCode do
                if i % 2048 == 0 then cooperate("bytecode_instruction", i) end
                p.Code[i] = readU32()
            end

            local sizeK = readVarInt()
            if sizeK > limits.MaxStrings then error("constant_table_limit") end
            p.Constants = {}
            p.ConstantKinds = {}
            p.Strings = {}
            p.Numbers = 0
            for k = 1, sizeK do
                local tag = readU8()
                local c = { Kind = "unknown" }
                if tag == 0 then
                    c.Kind = "nil"
                elseif tag == 1 then
                    c.Kind = "boolean"
                    c.Value = readU8() ~= 0
                elseif tag == 2 then
                    c.Kind = "number"
                    readBytes(8)
                    p.Numbers += 1
                elseif tag == 3 then
                    c.Kind = "string"
                    c.Value = readStringRef(strings)
                    if c.Value ~= nil and #p.Strings < limits.MaxImports * 4 then
                        p.Strings[#p.Strings + 1] = c.Value
                    end
                elseif tag == 4 then
                    c.Kind = "import"
                    c.ImportId = readU32()
                elseif tag == 5 then
                    c.Kind = "table"
                    local keys = readVarInt()
                    c.KeyCount = keys
                    for _ = 1, keys do readVarInt() end
                elseif tag == 6 then
                    c.Kind = "closure"
                    c.ProtoId = readVarInt()
                elseif tag == 7 then
                    c.Kind = "vector"
                    readBytes(16)
                elseif tag == 8 then
                    c.Kind = "table_with_constants"
                    local keys = readVarInt()
                    c.KeyCount = keys
                    for _ = 1, keys do
                        readVarInt()
                        readBytes(4)
                    end
                elseif tag == 9 then
                    c.Kind = "integer"
                    readU8()
                    readVarInt()
                elseif tag == 10 then
                    c.Kind = "class_shape"
                    c.ClassNameId = readVarInt()
                    c.PropertyCount = readVarInt()
                    c.MethodCount = readVarInt()
                    for _ = 1, c.PropertyCount + c.MethodCount do readVarInt() end
                elseif tag == 11 then
                    c.Kind = "vector_double"
                    readBytes(32)
                else
                    error("unsupported_constant_tag_" .. tostring(tag))
                end
                p.Constants[k] = c
                p.ConstantKinds[c.Kind] = (p.ConstantKinds[c.Kind] or 0) + 1
            end

            local sizeP = readVarInt()
            p.ChildProtos = {}
            for i = 1, sizeP do p.ChildProtos[i] = readVarInt() end
            p.LineDefined = readVarInt()
            p.DebugName = readStringRef(strings)

            local lineInfo = readU8()
            if lineInfo ~= 0 then
                local gap = readU8()
                local intervals = math.floor((sizeCode - 1) / (2 ^ gap)) + 1
                readBytes(sizeCode)
                readBytes(intervals * 4)
                p.LineInfo = true
            else
                p.LineInfo = false
            end

            local debugInfo = readU8()
            if debugInfo ~= 0 then
                local locals = readVarInt()
                for _ = 1, locals do
                    readStringRef(strings)
                    readVarInt(); readVarInt(); readU8()
                end
                local upvalues = readVarInt()
                for _ = 1, upvalues do readStringRef(strings) end
                p.DebugInfo = true
            else
                p.DebugInfo = false
            end

            if version >= 11 then
                local feedback = readVarInt()
                for _ = 1, feedback do
                    readU8(); readVarInt()
                end
                p.FeedbackSlots = feedback
            else
                p.FeedbackSlots = 0
            end

            if version >= 12 and math.floor(p.Flags / 8) % 2 == 1 then
                readVarInt()
            end

            if protoSize ~= nil then
                local expectedEnd = protoStart + protoSize
                if offset < expectedEnd then
                    readBytes(expectedEnd - offset)
                elseif offset > expectedEnd then
                    error("proto_size_overrun")
                end
            end
            return p
        end

        local result = {
            Status = "parsed",
            Parser = "luau_serialized_bytecode_structural_v1",
            BytecodeSize = size,
            SupportedVersionMin = CONFIG.BYTECODE_PARSER_MIN_VERSION,
            SupportedVersionMax = CONFIG.BYTECODE_PARSER_MAX_VERSION,
            ClassesVersion = 100,
            OpcodeNames = #LUAU_OPCODE_NAMES,
            Protos = {},
            ProtoCount = 0,
            TotalInstructions = 0,
            TotalNumbers = 0,
            Imports = {},
            CallSites = {},
            OpcodeHistogram = {},
            ControlFlowEdges = 0,
            BasicBlockCount = 0,
            BasicBlockModel = "edge_count_plus_entry_approximation_not_exact_cfg",
            ObfuscationSignals = {},
            RawStrings = {},
            DecodeWarnings = {},
            ImportPathUnverifiedCount = 0,
        }

        local ok, err = pcall(function()
            local version = readU8()
            result.Version = version
            if version == 0 then error("bytecode_error_message_blob") end
            local typesVersion = version >= 4 and readU8() or 0
            result.TypeVersion = typesVersion
            local versionAllowed =
                (version >= CONFIG.BYTECODE_PARSER_MIN_VERSION and version <= CONFIG.BYTECODE_PARSER_MAX_VERSION)
                or (version == 100 and CONFIG.BYTECODE_PARSER_ALLOW_CLASSES_VERSION)
            if not versionAllowed then error("unsupported_bytecode_version_" .. tostring(version)) end
            if version >= 4 and typesVersion < 1 then
                error("unsupported_type_version_" .. tostring(typesVersion))
            end

            local stringCount = readVarInt()
            result.StringCount = stringCount
            if stringCount > limits.MaxStrings then
                error("bytecode_string_table_limit")
            end
            local strings = {}
            for i = 1, stringCount do
                local length = readVarInt()
                local raw = readBytes(length)
                if length <= 4096 then
                    strings[i] = raw
                    if #result.RawStrings < CONFIG.MAX_SCRIPT_ANALYSIS_STRINGS then
                        result.RawStrings[#result.RawStrings + 1] = raw
                    end
                else
                    strings[i] = nil
                end
            end

            -- The serialized loader carries a bounded userdata/class-name map
            -- terminated by index 0. For v1/v2 the map is commonly empty, while
            -- v3 uses the same structural terminator. Future type versions are
            -- skipped under this bounded legacy shape with an explicit warning
            -- instead of aborting solely on the version number.
            local typeMapEntries = 0
            if typesVersion >= 1 then
                for _ = 1, 256 do
                    local index = readU8()
                    if index == 0 then
                        break
                    end
                    readStringRef(strings)
                    typeMapEntries += 1
                end
                if typeMapEntries >= 256 then
                    error("bytecode_type_map_limit")
                end
            end
            if typesVersion > 3 then
                result.DecodeWarnings[#result.DecodeWarnings + 1] =
                    "future_type_version_" .. tostring(typesVersion) .. "_type_block_skipped_using_legacy_bounded_shape"
            end
            result.TypeMapEntries = typeMapEntries

            local protoCount = readVarInt()
            result.ProtoCount = protoCount
            local maxProto = math.min(protoCount, limits.MaxProtos)
            result.ProtosTruncated = protoCount > maxProto
            local protos = {}
            for i = 1, protoCount do
                if i % 16 == 0 then cooperate("bytecode_proto", i) end
                local p = readProto(version, typesVersion, strings, i - 1)
                if i <= maxProto then
                    protos[i] = p
                    result.Protos[#result.Protos + 1] = {
                        Index = p.Index,
                        MaxStackSize = p.MaxStackSize,
                        NumParams = p.NumParams,
                        Nups = p.Nups,
                        IsVararg = p.IsVararg,
                        Flags = p.Flags,
                        CodeSize = p.CodeSize,
                        ConstantCount = #p.Constants,
                        TypeInfoSize = p.TypeInfoSize,
                        ChildProtoCount = #p.ChildProtos,
                        DebugName = reportText(p.DebugName),
                    }
                else
                    result.ProtosTruncated = true
                    protos[i] = nil
                end
            end
            local mainId = readVarInt()
            result.MainProtoId = mainId

            local function addOpcode(name)
                result.OpcodeHistogram[name] = (result.OpcodeHistogram[name] or 0) + 1
            end
            local function addString(value)
                if type(value) ~= "string" or #value == 0 then return end
                if #result.RawStrings < CONFIG.MAX_SCRIPT_ANALYSIS_STRINGS then
                    result.RawStrings[#result.RawStrings + 1] = value
                end
            end
            local function addCallSite(site)
                if #result.CallSites >= limits.MaxCallSites then return end
                result.CallSites[#result.CallSites + 1] = site
            end
            local function addImport(value)
                if type(value) ~= "string" or value == "" then return end
                if #result.Imports >= limits.MaxImports then return end
                local safe = reportText(value)
                result.Imports[#result.Imports + 1] = safe
            end

            for _, p in ipairs(protos) do
                local pc = 1
                local parsedInstructions = 0
                local previousWasNamecall = nil
                while pc <= #p.Code and parsedInstructions < limits.MaxInstructionsPerProto do
                    local word = p.Code[pc]
                    local op,a,b,c,d,e = decodeInstruction(word)
                    local name = LUAU_OPCODE_NAMES[op + 1] or ("OP_" .. tostring(op))
                    addOpcode(name)
                    result.TotalInstructions += 1
                    parsedInstructions += 1
                    local length = LUAU_AUX_OPS[op] and 2 or 1
                    local aux = LUAU_AUX_OPS[op] and p.Code[pc + 1] or nil
                    if LUAU_AUX_OPS[op] and aux == nil then
                        result.DecodeWarnings[#result.DecodeWarnings + 1] = "missing_aux_proto_" .. tostring(p.Index) .. "_pc_" .. tostring(pc)
                        break
                    end

                    if name == "LOP_NEWCLOSURE" then
                        local childId = d
                        local child = protos[childId + 1]
                        if child then
                            length = 1 + child.Nups
                        else
                            result.DecodeWarnings[#result.DecodeWarnings + 1] = "missing_child_proto_" .. tostring(childId)
                        end
                    end

                    if name == "LOP_GETIMPORT" and aux then
                        local path = importPath(p.Constants, aux, version, function(warning)
                            result.DecodeWarnings[#result.DecodeWarnings + 1] = warning
                            if warning and warning:find("getimport_aux_layout_unverified", 1, true) then
                                result.ImportPathUnverifiedCount += 1
                            end
                        end)
                        if path then
                            addString(path)
                            addImport(path)
                        end
                    elseif name == "LOP_GETGLOBAL" or name == "LOP_SETGLOBAL"
                        or name == "LOP_GETTABLEKS" or name == "LOP_SETTABLEKS"
                        or name == "LOP_NAMECALL" or name == "LOP_GETUDATAKS"
                        or name == "LOP_SETUDATAKS" or name == "LOP_NAMECALLUDATA"
                        or name == "LOP_NEWCLASSMEMBER" then
                        local idx = aux or 0
                        local value = stringConstant(p.Constants, idx)
                        if value then
                            addString(value)
                            if name == "LOP_NAMECALL" or name == "LOP_NAMECALLUDATA" then
                                previousWasNamecall = value
                            else
                                previousWasNamecall = nil
                            end
                        end
                    elseif name == "LOP_LOADK" then
                        local value = stringConstant(p.Constants, d)
                        if value then addString(value) end
                    elseif name == "LOP_LOADKX" then
                        local value = stringConstant(p.Constants, aux or 0)
                        if value then addString(value) end
                    elseif name == "LOP_JUMPXEQKS" and aux then
                        local value = stringConstant(p.Constants, aux % 16777216)
                        if value then addString(value) end
                    end

                    local nextWord = p.Code[pc + length]
                    local nextOp = nextWord and (nextWord % 256) or nil
                    if (name == "LOP_NAMECALL" or name == "LOP_NAMECALLUDATA") and nextOp == 21 then
                        addCallSite({ Method = previousWasNamecall, ProtoIndex = p.Index, PC = pc })
                    elseif name == "LOP_CALL" and previousWasNamecall then
                        if #result.CallSites < limits.MaxCallSites then
                            result.CallSites[#result.CallSites + 1] = { Method = previousWasNamecall, ProtoIndex = p.Index, PC = pc, CallA = a, ArgCount = b == 0 and "MULTRET" or (b - 1), ResultCount = c == 0 and "MULTRET" or (c - 1) }
                        end
                        previousWasNamecall = nil
                    elseif name ~= "LOP_MOVE" and name ~= "LOP_GETTABLE" then
                        if name ~= "LOP_CALL" then previousWasNamecall = nil end
                    end

                    if name == "LOP_GETIMPORT" then
                        local path = importPath(p.Constants, aux or 0, version, function(warning) result.DecodeWarnings[#result.DecodeWarnings + 1] = warning; if warning and warning:find("importPath",1,true) then result.ImportPathUnverifiedCount += 1 end end)
                        if path then
                            local lower = string.lower(path)
                            if lower == "loadstring" or lower:find("loadstring", 1, true) then
                                result.ObfuscationSignals.loadstring_import = true
                            end
                            if lower == "string.char" or lower == "table.concat" then
                                result.ObfuscationSignals.dynamic_string_construction = true
                            end
                            if lower == "bit32.bxor" then
                                result.ObfuscationSignals.xor_import = true
                            end
                            if lower == "debug" or lower:find("getfenv", 1, true) then
                                result.ObfuscationSignals.environment_introspection = true
                            end
                        end
                    elseif name == "LOP_GETGLOBAL" then
                        local value = stringConstant(p.Constants, aux or 0)
                        local lower = value and string.lower(value) or ""
                        if lower == "loadstring" or lower == "getfenv" then
                            result.ObfuscationSignals[lower] = true
                        end
                    end

                    local jumpOffset = nil
                    local isConditional = false
                    if name == "LOP_JUMP" or name == "LOP_JUMPBACK" or name == "LOP_JUMPX"
                        or name == "LOP_JUMPIF" or name == "LOP_JUMPIFNOT"
                        or name == "LOP_JUMPIFEQ" or name == "LOP_JUMPIFLE" or name == "LOP_JUMPIFLT"
                        or name == "LOP_JUMPIFNOTEQ" or name == "LOP_JUMPIFNOTLE" or name == "LOP_JUMPIFNOTLT"
                        or name == "LOP_JUMPXEQKNIL" or name == "LOP_JUMPXEQKB"
                        or name == "LOP_JUMPXEQKN" or name == "LOP_JUMPXEQKS"
                        or name == "LOP_FORNPREP" or name == "LOP_FORNLOOP"
                        or name == "LOP_FORGPREP" or name == "LOP_FORGPREP_INEXT"
                        or name == "LOP_FORGPREP_NEXT" then
                        jumpOffset = (name == "LOP_JUMPX") and e or d
                        isConditional = not (name == "LOP_JUMP" or name == "LOP_JUMPBACK" or name == "LOP_JUMPX" or name == "LOP_FORNLOOP" or name == "LOP_FORNPREP" or name == "LOP_FORGPREP" or name == "LOP_FORGPREP_INEXT" or name == "LOP_FORGPREP_NEXT")
                    end
                    if jumpOffset ~= nil then
                        local target = pc + 1 + jumpOffset
                        if target >= 1 and target <= #p.Code + 1 then
                            result.ControlFlowEdges += 1
                            if isConditional and pc + length <= #p.Code then
                                result.ControlFlowEdges += 1
                            end
                        end
                    end

                    if (name == "LOP_CAPTURE") then
                        -- Captures are structural companions of NEWCLOSURE and are not semantic calls.
                    end
                    pc += length
                end
                if parsedInstructions >= limits.MaxInstructionsPerProto and pc <= #p.Code then
                    result.DecodeWarnings[#result.DecodeWarnings + 1] = "instruction_limit_proto_" .. tostring(p.Index)
                end
            end

            result.BasicBlockCount = math.max(1, result.ControlFlowEdges + 1)
            result.RawStrings = result.RawStrings
            result.StructurallyParsedProtoCount = #result.Protos
        end)

        if not ok then
            result.Status = "partial_or_invalid"
            result.Error = tostring(err)
        end
        result.RawStrings = result.RawStrings or {}
        return result
    end

    local function resolveKnownScriptFingerprintDatabase()
        local database = CONFIG.KNOWN_SCRIPT_FINGERPRINTS
        if type(database) ~= "table" or next(database) == nil then
            local external = getGlobalValue(CONFIG.KNOWN_SCRIPT_FINGERPRINTS_GLOBAL_KEY)
            if type(external) == "table" then
                database = external
            end
        end
        if type(database) ~= "table" then
            return {}
        end

        local normalized = {}
        local rejected = 0
        for digest, metadata in pairs(database) do
            local key = string.lower(tostring(digest))
            local validKey = #key == 64 and key:match("^[0-9a-f]+$")
            local label = type(metadata) == "table" and metadata.Label or nil
            if validKey and type(label) == "string" and label ~= "" then
                normalized[key] = metadata
            else
                rejected += 1
            end
        end
        return normalized, rejected
    end

    local function computeScriptSha256(bytecode)
        if type(bytecode) ~= "string" then
            return nil, "bytecode_unavailable"
        end

        local provider = resolvePreferredHashProvider()
        if not provider or not provider.Usable then
            return nil, "sha256_provider_unavailable"
        end

        local ok, digest
        if provider.InvocationMode == "bound" then
            ok, digest = pcall(provider.Fn, bytecode, "sha256")
        elseif provider.InvocationMode == "owner" then
            ok, digest = pcall(provider.Fn, provider.Owner, bytecode, "sha256")
        else
            return nil, "sha256_provider_ambiguous"
        end

        local normalized = ok and normalizeSha256Digest(digest) or nil
        if not normalized then
            return nil, "sha256_digest_unusable"
        end
        return normalized, nil
    end

    local function analyzeScriptsContent()
        clearArrayInPlace(report.VM.ScriptAnalysis)
        report.VM.ScriptAnalysis.Status = "not_run"
        report.VM.ScriptAnalysis.APIAvailable = GET_SCRIPT_BYTECODE ~= nil or GET_SCRIPT_CLOSURE ~= nil
        report.VM.ScriptAnalysis.FingerprintDatabaseStatus = next(knownScriptFingerprintDatabase) and "loaded" or "empty"

        if not CONFIG.SCRIPT_CONTENT_ANALYSIS then
            report.VM.ScriptAnalysis.Status = "disabled"
            return
        end
        if not GET_SCRIPT_BYTECODE and not GET_SCRIPT_CLOSURE then
            report.VM.ScriptAnalysis.Status = "unavailable"
            report.VM.ScriptAnalysis.Limitations = { "getscriptbytecode_or_getscriptclosure_unavailable" }
            return
        end

        local analysisStatus = "complete"
        local remoteNameSet = {}
        for remote, info in pairs(staticRemoteMapInternal) do
            if info and info.Name then
                remoteNameSet[hash32(string.lower(tostring(info.Name)))] = true
            end
        end

        for _, scriptInstance in ipairs(scriptContentCandidates) do
            if #report.VM.ScriptAnalysis >= CONFIG.MAX_SCRIPT_ANALYSIS then
                analysisStatus = "partial_limit"
                recordDrop("ScriptAnalysis", "limit_reached")
                break
            end
            if auditWallExceeded() then
                analysisStatus = "partial_wall_time"
                recordDrop("ScriptAnalysis", "wall_time")
                break
            end

            local path = safeCall(scriptInstance.GetFullName, nil)
            local entry = ensureFindingContract({
                ScriptId = getStableInstanceId(scriptInstance, "Script"),
                ScriptPath = reportText(path or scriptInstance.Name),
                Class = safeCall(function() return scriptInstance.ClassName end, "Script"),
                Root = scriptContentCandidateRoots[scriptInstance] or currentScanRoot,
                Strings = {},
                Numbers = {},
                Globals = {},
                BytecodeSize = nil,
                BytecodeHash = nil,
                BytecodeSha256 = nil,
                KnownFingerprint = nil,
                KnownFingerprintDatabaseStatus = next(knownScriptFingerprintDatabase) and "loaded" or "empty",
                Status = "analyzed",
                InstanceRefs = {},
                Evidence = {},
            }, "script_content_analysis", "medium", {
                "executor_bytecode_api_dependent",
                "static_constants_do_not_prove_runtime_reachability",
                "server_side_code_is_not_observed",
            })

            local bytecode = safeCall(function()
                return GET_SCRIPT_BYTECODE and GET_SCRIPT_BYTECODE(scriptInstance) or nil
            end, nil)
            local bytecodeStringCandidates = {}
            if type(bytecode) == "string" then
                entry.BytecodeSize = #bytecode
                entry.BytecodeHash = hash32(bytecode)
                local bytecodeSha256, shaStatus = computeScriptSha256(bytecode)
                entry.BytecodeSha256 = bytecodeSha256
                entry.KnownFingerprintDatabaseStatus = bytecodeSha256 and "loaded" or (shaStatus or "empty")
                if bytecodeSha256 and knownScriptFingerprintDatabase[bytecodeSha256] then
                    local metadata = knownScriptFingerprintDatabase[bytecodeSha256]
                    entry.KnownFingerprint = {
                        Match = true,
                        Label = reportText(metadata.Label or metadata.Name or "known_reference"),
                        Source = reportText(metadata.Source or "operator_supplied_reference"),
                        Family = reportText(metadata.Family),
                        Type = reportText(metadata.Type),
                    }
                end
                local structuredBytecode = parseLuauSerializedBytecode(bytecode, { MaxStrings = CONFIG.MAX_BYTECODE_STRING_COUNT, MaxProtos = CONFIG.MAX_BYTECODE_PROTO_COUNT, CooperativeCallback = function() if shouldYieldForSlice() then task.wait() end end })
                structuredBytecode.RawStrings = nil
                entry.BytecodeStructure = {
                    Status = structuredBytecode.Status,
                    Parser = structuredBytecode.Parser,
                    Version = structuredBytecode.Version,
                    TypeVersion = structuredBytecode.TypeVersion,
                    ProtoCount = structuredBytecode.ProtoCount,
                    StructurallyParsedProtoCount = structuredBytecode.StructurallyParsedProtoCount,
                    TotalInstructions = structuredBytecode.TotalInstructions,
                    StringCount = structuredBytecode.StringCount,
                    TotalNumbers = structuredBytecode.TotalNumbers,
                    Imports = structuredBytecode.Imports,
                    CallSites = structuredBytecode.CallSites,
                    OpcodeHistogram = structuredBytecode.OpcodeHistogram,
                    ControlFlowEdges = structuredBytecode.ControlFlowEdges,
                    BasicBlockCount = structuredBytecode.BasicBlockCount,
                    ObfuscationSignals = structuredBytecode.ObfuscationSignals,
                    DecodeWarnings = structuredBytecode.DecodeWarnings,
                    Error = reportText(structuredBytecode.Error),
                }
                bytecodeStringCandidates = extractPrintableBytecodeStrings(bytecode, CONFIG.MAX_SCRIPT_ANALYSIS_STRINGS, function() return auditWallExceeded() end)
                if type(structuredBytecode.RawStrings) == "table" then
                    for _, candidate in ipairs(structuredBytecode.RawStrings) do
                        if #bytecodeStringCandidates >= CONFIG.MAX_SCRIPT_ANALYSIS_STRINGS then break end
                        bytecodeStringCandidates[#bytecodeStringCandidates + 1] = candidate
                    end
                end
                entry.BytecodeStringCandidates = #bytecodeStringCandidates
                entry.BytecodeStringExtraction = "structured_serialized_parser_plus_printable_ascii_fallback"
            end

            local closure = safeCall(function()
                return GET_SCRIPT_CLOSURE and GET_SCRIPT_CLOSURE(scriptInstance) or nil
            end, nil)

            local rawStrings, rawNumbers, rawGlobals, rawInstances = {}, {}, {}, {}
            if closure then
                collectClosureConstants(closure, 0, rawStrings, rawNumbers, rawGlobals, rawInstances)
            end
            for _, candidate in ipairs(bytecodeStringCandidates) do
                if #rawStrings < CONFIG.MAX_SCRIPT_ANALYSIS_STRINGS then
                    rawStrings[#rawStrings + 1] = candidate
                else
                    break
                end
            end

            for _, referencedInstance in ipairs(rawInstances) do
                if #entry.InstanceRefs < 128 then
                    entry.InstanceRefs[#entry.InstanceRefs + 1] = {
                        InstanceId = getStableInstanceId(referencedInstance, "Instance"),
                        Path = reportText(safeCall(referencedInstance.GetFullName, nil) or referencedInstance.Name),
                        Class = safeCall(function() return referencedInstance.ClassName end, "Instance"),
                    }
                    scriptReferencedInstances[referencedInstance] = true
                end
            end

            local seenString = {}
            local remoteHits = {}
            for _, raw in ipairs(rawStrings) do
                local key = hash32(raw)
                if not seenString[key] then
                    seenString[key] = true
                    local category = classifyScriptString(raw, remoteNameSet)
                    local item = {
                        Category = category,
                        Hash = key,
                        Text = reportText(raw),
                    }
                    if category == "remote_name" then
                        remoteHits[key] = true
                    end
                    append(entry.Strings, item, CONFIG.MAX_SCRIPT_ANALYSIS_STRINGS)
                end
            end

            for _, number in ipairs(rawNumbers) do
                append(entry.Numbers, number, CONFIG.MAX_SCRIPT_ANALYSIS_NUMBERS)
            end
            local seenGlobal = {}
            for _, globalName in ipairs(rawGlobals) do
                if not seenGlobal[globalName] then
                    seenGlobal[globalName] = true
                    append(entry.Globals, reportText(globalName), 64)
                end
            end

            entry.StaticRemoteNameHits = nil
            scriptAnalysisInternal[scriptInstance] = {
                RemoteNameHits = remoteHits,
                RawStrings = rawStrings,
                Globals = rawGlobals,
                BytecodeStructure = entry.BytecodeStructure,
            }

            append(report.VM.ScriptAnalysis, entry, CONFIG.MAX_SCRIPT_ANALYSIS)
        end

        report.VM.ScriptAnalysis.Status = analysisStatus
        report.VM.ScriptAnalysis.FindingCount = #report.VM.ScriptAnalysis
        report.VM.ScriptAnalysis.Limitations = report.VM.ScriptAnalysis.Limitations or {
            "bytecode_string_extraction_is_best_effort_printable_text_analysis",
            "Globals are known-global-name candidates derived from constants/prototypes, not a complete VM opcode trace",
            "constants_and_prototypes_depend_on_executor_api_behavior",
            "CAP-10 external known-script fingerprint database is not bundled",
        }
    end

    --------------------------------------------------------------------
    -- FINDING DISPATCHER
    -- Single path for newly-added analysis findings. It owns truncation,
    -- evidence normalization and bucket selection; individual phases do not
    -- create competing addFinding closures.
    --------------------------------------------------------------------
    local FINDING_BUCKETS = {
        static_remote = {
            get = function() return report.Network.StaticRemoteMap.Findings end,
            max = function() return CONFIG.MAX_STATIC_REMOTE_MAP end,
            truncation = "StaticRemoteMap",
            provenance = "static_remote_analysis",
        },
        anti_pattern = {
            get = function() return report.Network.AntiPatternFindings end,
            max = function() return CONFIG.MAX_ANTI_PATTERN_FINDINGS end,
            truncation = "AntiPatternFindings",
            provenance = "security_anti_pattern_library",
        },
    }

    local function addFinding(bucketName, pattern, details, evidence, confidence)
        local bucket = FINDING_BUCKETS[bucketName]
        if not bucket then
            return false
        end
        local target = bucket.get()
        local max = bucket.max()
        if #target >= max then
            recordDrop(bucket.truncation, "limit_reached")
            return false
        end
        local finding = createFinding(
            pattern,
            details,
            evidence or {},
            confidence or "low",
            { "heuristic_client_observation", "requires_server_side_review" },
            FINDING_SERVER_CHECKS[bucketName] or {},
            "HIGH",
            bucket.provenance
        )
        finding.Pattern = pattern
        return append(target, finding, max)
    end

    local function buildStaticRemoteMap()
        clearArrayInPlace(report.Network.StaticRemoteMap.Findings)
        report.Network.StaticRemoteMap.Status = "not_run"
        report.Network.StaticRemoteMap.FindingCount = 0
        if not CONFIG.SCRIPT_CONTENT_ANALYSIS then
            report.Network.StaticRemoteMap.Status = "skipped_by_config"
            return
        end
        local analysisStatus = report.VM.ScriptAnalysis.Status
        if analysisStatus == "disabled" or analysisStatus == "disabled_by_minimal_profile" then
            report.Network.StaticRemoteMap.Status = "skipped_by_profile"
            return
        end
        if analysisStatus == "unavailable" then
            report.Network.StaticRemoteMap.Status = "unavailable"
            return
        end
        if analysisStatus == "not_run" then
            report.Network.StaticRemoteMap.Status = "skipped_by_profile"
            return
        end
        local mapped = 0

        for scriptInstance, analysis in pairs(scriptAnalysisInternal) do
            if mapped >= CONFIG.MAX_STATIC_REMOTE_MAP then
                recordDrop("StaticRemoteMap", "limit_reached")
                break
            end
            local scriptId = getStableInstanceId(scriptInstance, "Script")
            for remoteInstance, remoteInfo in pairs(staticRemoteMapInternal) do
                local remoteHash = hash32(string.lower(tostring(remoteInfo.Name or "")))
                if analysis.RemoteNameHits and analysis.RemoteNameHits[remoteHash] then
                    if mapped >= CONFIG.MAX_STATIC_REMOTE_MAP then break end
                    local added = addFinding(
                        "static_remote",
                        "remote_name_constant",
                        {
                            ScriptId = scriptId,
                            ScriptPath = reportText(safeCall(scriptInstance.GetFullName, nil) or scriptInstance.Name),
                            RemoteId = getStableInstanceId(remoteInstance, "Remote"),
                            RemotePath = reportText(remoteInfo.Path),
                            RemoteClass = remoteInfo.Class,
                            Match = "remote_name_constant",
                            StaticCallSiteCandidateCount = #(analysis.BytecodeStructure and analysis.BytecodeStructure.CallSites or {}),
                            ObservedDynamically = false,
                        },
                        {
                            {
                                Source = "script_bytecode_string_match",
                                Observed = true,
                                Confidence = "medium",
                                Limitations = { "string_reference_does_not_prove_call_site_or_execution" },
                            },
                        },
                        "medium"
                    )
                    if added then
                        mapped += 1
                    end
                end
            end
        end
        report.Network.StaticRemoteMap.Status = analysisStatus == "complete" and "complete" or "partial"
        report.Network.StaticRemoteMap.FindingCount = #report.Network.StaticRemoteMap.Findings
    end

    local function scanMetatableHooks()
        local block = report.Network.MetatableHookAnalysis
        clearArrayInPlace(block.Findings)
        block.FindingCount = 0
        if not GET_RAW_METATABLE then
            block.Status = "unavailable"
            return
        end

        local services = { game, Workspace, ReplicatedStorage, Players, RunService }
        local serviceData = {}
        for _, service in ipairs(services) do
            if auditWallExceeded() then block.Status = "partial_wall_time"; break end
            local mt = safeCall(function() return GET_RAW_METATABLE(service) end, nil)
            if type(mt) == "table" then
                local name = safeCall(function() return service.Name end, "game")
                local row = { Service = name, Metamethods = {} }
                for _, metamethod in ipairs({"__namecall", "__index", "__newindex"}) do
                    local fn = mt[metamethod]
                    if type(fn) == "function" then
                        row.Metamethods[metamethod] = hash32(tostring(fn))
                        local isAuditorHook = metamethod == "__namecall"
                            and snifferState.HookFingerprint ~= nil
                            and row.Metamethods[metamethod] == snifferState.HookFingerprint
                        if not isAuditorHook and IS_EXECUTOR_CLOSURE and safeCall(function() return IS_EXECUTOR_CLOSURE(fn) end, false) then
                            append(block.Findings, ensureFindingContract({
                                Kind = "metatable_executor_context",
                                Service = reportText(name),
                                Metamethod = metamethod,
                                Fingerprint = row.Metamethods[metamethod],
                                Interpretation = "executor_context_evidence_not_proof_of_external_or_malicious_hook",
                                Evidence = {{Source="isexecutorclosure_on_metatable_method",Observed=true,Confidence="medium",Limitations={"executor_detection_is_environment_dependent","does_not_prove_installation_time_or_origin"}}},
                            }, "metatable_hook_analysis", "medium", {"client_side_only"}), CONFIG.MAX_INSTANCE_METATABLES)
                        end
                    end
                end
                serviceData[#serviceData + 1] = row
            end
        end

        local baseline = nil
        for _, row in ipairs(serviceData) do if row.Service == "game" then baseline = row; break end end
        if not baseline and serviceData[1] then baseline = serviceData[1] end
        if baseline then
            for _, row in ipairs(serviceData) do
                for _, metamethod in ipairs({"__namecall", "__index", "__newindex"}) do
                    local base = baseline.Metamethods[metamethod]
                    local current = row.Metamethods[metamethod]
                    if current and base and current ~= base then
                        append(block.Findings, ensureFindingContract({
                            Kind = "metatable_service_divergence",
                            Service = reportText(row.Service),
                            BaselineService = reportText(baseline.Service),
                            Metamethod = metamethod,
                            BaselineFingerprint = base,
                            Fingerprint = current,
                            Interpretation = "service_consistency_difference_is_not_a_canonical_Roblox_hook_baseline",
                            Evidence = {{Source="getrawmetatable_service_comparison",Observed=true,Confidence="low",Limitations={"Roblox_services_may_legitimately_use_distinct_metamethod_closures","session_baseline_is_not_server_truth"}},},
                        }, "metatable_hook_analysis", "low", {"heuristic_service_comparison","requires_manual_review"}), CONFIG.MAX_INSTANCE_METATABLES)
                    end
                end
            end
        end

        block.Baseline = baseline and reportText(baseline.Service) or "unavailable"
        block.BaselineMode = baseline and "runtime_cross_service_reference_not_canonical" or "unavailable"
        block.FindingCount = #block.Findings
        block.Status = block.Status == "partial_wall_time" and block.Status or (#block.Findings > 0 and "complete" or "complete_no_observable_hooks")
    end

    local function classifyGameArchetype()
        local primary, primaryScore = "Unknown", 0
        local scores = {}
        for archetype, count in pairs(archetypeSignalCounts) do
            scores[archetype] = count
            if count > primaryScore then
                primary = archetype
                primaryScore = count
            end
        end

        local ranked = {}
        for archetype, score in pairs(scores) do
            ranked[#ranked + 1] = { Archetype = archetype, Score = score }
        end
        table.sort(ranked, function(a,b) return a.Score > b.Score end)

        report.Metadata.GameArchetype = ensureFindingContract({
            Primary = primary,
            Score = primaryScore,
            Scores = scores,
            Signals = archetypeSignals,
            Model = "name_signal_heuristic",
        }, "game_archetype", primary == "Unknown" and "low" or "medium", {
            "names_are_heuristic_signals",
            "archetype_is_not_game_semantics_proof",
        })

        local remoteInfoById = {}
        for remoteInstance, info in pairs(staticRemoteMapInternal) do
            remoteInfoById[getStableInstanceId(remoteInstance, "Remote")] = info
        end
        for _, remote in ipairs(report.Network.Remotes) do
            local info = remoteInfoById[remote.InstanceId]
            local arch, risk = archetypeRiskForName(info and info.Name or "")
            if arch and risk then
                remote.ArchetypeSignal = arch
                remote.ArchetypeSeverity = risk
                if (SEVERITY_ORDER[risk] or 0) > (SEVERITY_ORDER[remote.HeuristicSeverity] or 0) then
                    remote.HeuristicSeverity = risk
                end
            end
        end
    end

    local function scanUIInteractions()
        clearArrayInPlace(report.UIInteractionMap)
        if not CONFIG.UI_REMOTE_ANALYSIS then return end
        if not GET_CONNECTIONS or not GET_UPVALUES then
            return
        end

        for _, ui in ipairs(uiInteractionCandidates) do
            if #report.UIInteractionMap >= CONFIG.MAX_UI_INTERACTION_MAP then
                recordDrop("UIInteractionMap", "limit_reached")
                break
            end

            local signals = {}
            local class = safeCall(function() return ui.ClassName end, "Unknown")
            local function addSignal(signalName, signal)
                if signal then
                    signals[#signals + 1] = { Name = signalName, Signal = signal }
                end
            end

            addSignal("Activated", safeCall(function() return ui.Activated end, nil))
            addSignal("MouseButton1Click", safeCall(function() return ui.MouseButton1Click end, nil))
            if class == "TextBox" then
                addSignal("FocusLost", safeCall(function() return ui.FocusLost end, nil))
            end

            local remoteSet = {}
            local connectionCount = 0
            for _, signalInfo in ipairs(signals) do
                local connections = safeCall(function()
                    return GET_CONNECTIONS(signalInfo.Signal)
                end, nil)
                if type(connections) == "table" then
                    for _, connection in ipairs(connections) do
                        local callback = safeCall(function() return connection.Function end, nil)
                        if type(callback) == "function" then
                            connectionCount += 1
                            local ups = safeCall(function() return GET_UPVALUES(callback) end, nil)
                            if type(ups) == "table" then
                                local stack = {{ ups, 0 }}
                                while #stack > 0 do
                                    local pair = stack[#stack]
                                    stack[#stack] = nil
                                    local value, depth = pair[1], pair[2]
                                    if depth <= 2 and type(value) == "table" then
                                        for _, child in pairs(value) do
                                            if typeof(child) == "Instance" and staticRemoteMapInternal[child] then
                                                remoteSet[child] = true
                                            elseif type(child) == "table" and depth < 2 then
                                                stack[#stack + 1] = { child, depth + 1 }
                                            end
                                        end
                                    elseif typeof(value) == "Instance" and staticRemoteMapInternal[value] then
                                        remoteSet[value] = true
                                    end
                                end
                            end
                        end
                    end
                end
            end

            local remotes = {}
            for remote in pairs(remoteSet) do
                remotes[#remotes + 1] = {
                    RemoteId = getStableInstanceId(remote, "Remote"),
                    RemotePath = reportText(staticRemoteMapInternal[remote].Path),
                    RemoteClass = staticRemoteMapInternal[remote].Class,
                }
            end

            local finding = ensureFindingContract({
                UIId = getStableInstanceId(ui, "UI"),
                UIPath = reportText(safeCall(ui.GetFullName, nil) or ui.Name),
                UIClass = class,
                Root = uiInteractionCandidateRoots[ui] or currentScanRoot,
                ConnectionsObserved = connectionCount,
                RemotesReferenced = remotes,
                Evidence = {
                    {
                        Source = "ui_getconnections_upvalues",
                        Observed = true,
                        Confidence = #remotes > 0 and "high" or "medium",
                        Limitations = { "upvalues_are_not_proof_of_event_execution" },
                    },
                },
            }, "ui_remote_static_analysis", #remotes > 0 and "high" or "medium", {
                "executor_getconnections_dependent",
                "upvalue_reference_only",
            })
            append(report.UIInteractionMap, finding, CONFIG.MAX_UI_INTERACTION_MAP)
        end

        -- Global input bindings can also be UI→Remote control paths. They are
        -- exported as a synthetic UI interaction entry because no single GuiObject
        -- owns UserInputService.InputBegan.
        local inputSignal = safeCall(function() return UserInputService.InputBegan end, nil)
        if inputSignal and GET_CONNECTIONS and GET_UPVALUES
            and #report.UIInteractionMap < CONFIG.MAX_UI_INTERACTION_MAP
        then
            local remoteSet = {}
            local connectionCount = 0
            local connections = safeCall(function() return GET_CONNECTIONS(inputSignal) end, nil)
            if type(connections) == "table" then
                for _, connection in ipairs(connections) do
                    local callback = safeCall(function() return connection.Function end, nil)
                    if type(callback) == "function" then
                        connectionCount += 1
                        local ups = safeCall(function() return GET_UPVALUES(callback) end, nil)
                        if type(ups) == "table" then
                            for _, child in pairs(ups) do
                                if typeof(child) == "Instance" and staticRemoteMapInternal[child] then
                                    remoteSet[child] = true
                                end
                            end
                        end
                    end
                end
            end
            local remotes = {}
            for remote in pairs(remoteSet) do
                remotes[#remotes + 1] = {
                    RemoteId = getStableInstanceId(remote, "Remote"),
                    RemotePath = reportText(staticRemoteMapInternal[remote].Path),
                    RemoteClass = staticRemoteMapInternal[remote].Class,
                }
            end
            append(report.UIInteractionMap, ensureFindingContract({
                UIId = "UserInputService.InputBegan",
                UIPath = "UserInputService.InputBegan",
                UIClass = "InputService",
                Root = "global",
                ConnectionsObserved = connectionCount,
                RemotesReferenced = remotes,
                Evidence = {
                    { Source = "input_began_getconnections_upvalues", Observed = true,
                        Confidence = #remotes > 0 and "high" or "medium",
                        Limitations = { "global_input_path_is_not_bound_to_one_gui_object" } },
                },
            }, "ui_remote_input_analysis", #remotes > 0 and "high" or "medium", {
                "executor_getconnections_dependent",
                "input_path_is_global",
                "upvalue_reference_only",
            }), CONFIG.MAX_UI_INTERACTION_MAP)
        end
    end

    local TRUST_DISPLAY_TOKENS = {
        "score", "cash", "money", "currency", "win", "health", "damage",
        "balance", "wallet", "reward", "inventory", "level", "xp", "coin", "gem",
        "stat", "state", "rank", "permission",
    }

    local function hasTrustRelevance(instance)
        if not instance then return false end
        local name = string.lower(tostring(safeCall(function() return instance.Name end, "")))
        for _, token in ipairs(TRUST_DISPLAY_TOKENS or {}) do
            if name:find(token, 1, true) then
                return true
            end
        end
        local tags = safeCall(function() return CollectionService:GetTags(instance) end, nil)
        if type(tags) == "table" then
            for _, tag in ipairs(tags) do
                if CONFIG.TRUST_RELEVANT_TAGS[string.lower(tostring(tag))] then
                    return true
                end
            end
        end
        return false
    end

    local function materializeClientOwnedUnanchoredTrustFindings()
        for instance in pairs(clientOwnedUnanchoredCandidates) do
            if #report.TrustBoundaries >= CONFIG.MAX_TRUST_BOUNDARIES then
                recordDrop("TrustBoundaries", "limit_reached")
                break
            end
            local isCharacter = LocalPlayer and LocalPlayer.Character and safeCall(function()
                return instance:IsDescendantOf(LocalPlayer.Character)
            end, false)
            local name = string.lower(tostring(safeCall(function() return instance.Name end, "")))
            local riskNamed = hasWholeWord(name, "damage") or hasWholeWord(name, "currency")
                or hasWholeWord(name, "cash") or hasWholeWord(name, "trade")
                or hasWholeWord(name, "claim") or hasWholeWord(name, "purchase")
                or hasWholeWord(name, "admin") or hasWholeWord(name, "remote")
            local scriptReferenced = scriptReferencedInstances[instance] == true
            local tagged = hasTrustRelevance(instance)
            local underWorkspace = safeCall(function()
                return instance:IsDescendantOf(Workspace)
            end, false)
            if not isCharacter and underWorkspace and (scriptReferenced or tagged or riskNamed) then
                recordTrustBoundary("client_owned_unanchored_part", {
                    InstanceId = getStableInstanceId(instance, "Part"),
                    Class = safeCall(function() return instance.ClassName end, "BasePart"),
                    Path = reportText(getInstancePath(instance)),
                    DetectionBasis = scriptReferenced and "script_reference"
                        or tagged and "relevant_collection_tag"
                        or "risk_name_heuristic",
                }, {
                    {
                        Source = "GetNetworkOwner_and_Anchored",
                        Observed = true,
                        Confidence = "high",
                        Limitations = {
                            "ownership_observation_is_client_visible_only",
                            "does_not_prove_server_acceptance_or_exploitability",
                        },
                    },
                })
            end
        end
    end

    local function observationValueHash(value, depth, seen)
        depth = depth or 0
        seen = seen or {}
        if value == nil then return hash32("nil") end
        if depth > 4 then return hash32("depth_limit:" .. typeof(value)) end

        local valueType = typeof(value)
        if valueType == "Instance" then
            return hash32("Instance:" .. tostring(getStableInstanceId(value, "ObservedValue")))
        elseif valueType == "table" then
            if seen[value] then return hash32("cycle") end
            seen[value] = true
            local parts = {}
            for key, child in pairs(value) do
                parts[#parts + 1] = observationValueHash(key, depth + 1, seen) .. "=" .. observationValueHash(child, depth + 1, seen)
            end
            table.sort(parts)
            seen[value] = nil
            return hash32("table{" .. table.concat(parts, ";") .. "}")
        end
        return hash32(valueType .. ":" .. tostring(value))
    end

    correlateTrustMutationsWithResponse = function(packed, count, now)
        if not packed or count <= 0 then return end
        local responseHashes = {}
        for i = 1, count do responseHashes[observationValueHash(packed[i])] = true end
        for _, aggregate in pairs(trustMutationAggregates) do
            if aggregate.Count > 0 and aggregate.LastAt and now - aggregate.LastAt <= 0.5 then
                if aggregate.LastValueHash and responseHashes[aggregate.LastValueHash] then
                    aggregate.ServerConfirmation = "confirmed"
                    aggregate.ServerConfirmationAt = os.clock()
                    aggregate.ServerResponseCorrelation = "response_contains_matching_observed_value_hash"
                elseif aggregate.FirstValueHash and aggregate.LastValueHash ~= aggregate.FirstValueHash
                    and responseHashes[aggregate.FirstValueHash] then
                    aggregate.ServerConfirmation = "contradicted"
                    aggregate.ServerConfirmationAt = os.clock()
                    aggregate.ServerResponseCorrelation = "response_contains_previous_value_hash"
                end
            end
        end
    end

    local function attachTrustBoundaryWatchers()
        local function connectValueWatcher(instance)
            if valueTrustWatchers[instance] then return end
            if not safeCall(function() return instance:IsA("ValueBase") end, false) then return end
            local underVisibleRoot = safeCall(function()
                return instance:IsDescendantOf(ReplicatedStorage) or instance:IsDescendantOf(Workspace)
            end, false)
            if not underVisibleRoot then return end

            if EFFECTIVE_REPORT_LEVEL == "MINIMAL" and not hasTrustRelevance(instance) then
                return
            end
            local id = getStableInstanceId(instance, "Value")
            local name = safeCall(function() return instance.Name end, "Value")
            if not trustMutationAggregates[id] and trustMutationAggregateCount >= CONFIG.MAX_CLIENT_STATE_MUTATIONS then
                return
            end
            if not trustMutationAggregates[id] then
                trustMutationAggregateCount += 1
                trustMutationAggregates[id] = {
                InstanceId=id, Name=reportText(name), Property="Value", Count=0,
                FirstAt=nil, LastAt=nil, FirstValueHash=nil, PreviousValueHash=nil, LastValueHash=nil,
                ReversionObserved=false, ServerConfirmation="not_observed", ServerConfirmationAt=nil, ServerResponseCorrelation="not_observed",
                LastValueShapeKey=nil, InterMutationMinMs=nil, InterMutationMaxMs=nil, SameFrameMutations=0,
                }
            end
            local connection=safeCall(function()
                return instance:GetPropertyChangedSignal("Value"):Connect(function()
                    local now=os.clock(); local aggregate=trustMutationAggregates[id]
                    local value=safeCall(function() return instance.Value end,nil)
                    local valueHash=observationValueHash(value)
                    local valueShapeKey = argumentShapeKey(describeArgument(value))
                    local priorLast=aggregate.LastValueHash
                    local priorPrior=aggregate.PreviousValueHash
                    aggregate.PreviousValueHash=priorLast
                    aggregate.LastValueHash=valueHash
                    aggregate.LastValueShapeKey=valueShapeKey
                    if aggregate.LastAt then
                        local deltaMs=(now-aggregate.LastAt)*1000
                        aggregate.InterMutationMinMs=aggregate.InterMutationMinMs and math.min(aggregate.InterMutationMinMs,deltaMs) or deltaMs
                        aggregate.InterMutationMaxMs=aggregate.InterMutationMaxMs and math.max(aggregate.InterMutationMaxMs,deltaMs) or deltaMs
                        if deltaMs <= 16.7 then aggregate.SameFrameMutations += 1 end
                    end
                    aggregate.Count+=1; aggregate.FirstAt=aggregate.FirstAt or now; aggregate.LastAt=now; aggregate.FirstValueHash=aggregate.FirstValueHash or valueHash
                    if priorPrior and valueHash==priorPrior then aggregate.ReversionObserved=true end
                    recordTimeline("value_mutation","trust_watch",{InstanceId=id,Count=aggregate.Count})
            if snifferState.Active then
                for _, remoteEvent in ipairs(recentRemoteCalls) do
                    local delta = remoteEvent.At - now
                    if math.abs(delta) <= 0.5 then
                        local exactHash = false
                        if aggregate.LastValueHash and remoteEvent.ValueHashes then
                            for _, remoteHash in ipairs(remoteEvent.ValueHashes) do
                                if remoteHash == aggregate.LastValueHash then
                                    exactHash = true
                                    break
                                end
                            end
                        end
                        if exactHash then
                            aggregate.ServerConfirmation = "confirmed"
                            aggregate.ServerConfirmationAt = now
                            aggregate.ServerResponseCorrelation = "remote_call_exact_value_hash_match"
                        elseif aggregate.LastValueShapeKey and remoteEvent.ShapeKeys then
                            for _, shapeKey in ipairs(remoteEvent.ShapeKeys) do
                                if shapeKey == aggregate.LastValueShapeKey then
                                    aggregate.ServerConfirmation = "not_observed"
                                    aggregate.ServerConfirmationAt = now
                                    aggregate.ServerResponseCorrelation = "shape_match_without_value_confirmation"
                                    break
                                end
                            end
                        end
                    end
                end
            end
                    local lower=string.lower(name)
                    local displayLike=lower:find("score",1,true) or lower:find("cash",1,true) or lower:find("money",1,true) or lower:find("currency",1,true) or lower:find("win",1,true)
                    if displayLike and snifferState.Active then
                        local lastServer=recentServerActivity[lower]
                        if lastServer and now-lastServer>0.5 then
                            registerIllusion("display_value_changed_without_recent_server_event",{InstanceId=id,Name=reportText(name),DeltaWindow="500ms",EvaluatedAgainstCaptureWindow=true})
                        end
                    end
                end)
            end,nil)
            if connection then valueTrustWatchers[instance]=connection; trustWatchConnections[#trustWatchConnections+1]=connection end
        end

        local ordered={}
        for instance in pairs(trustValueCandidates) do ordered[#ordered+1]=instance end
        table.sort(ordered,function(a,b)
            local aId = getStableInstanceId(a,"Value")
            local bId = getStableInstanceId(b,"Value")
            return aId < bId
        end)
        for _,instance in ipairs(ordered) do
            if #trustWatchConnections>=CONFIG.MAX_TRUST_WATCH_CONNECTIONS then break end
            connectValueWatcher(instance)
        end

        if LocalPlayer then
            local character=LocalPlayer.Character
            local humanoid=character and safeCall(function() return character:FindFirstChildOfClass("Humanoid") end,nil)
            if humanoid then
                local props={"WalkSpeed","JumpPower","Health","MaxHealth","AutoJumpEnabled"}
                for _,property in ipairs(props) do
                    local key=getStableInstanceId(humanoid,"Humanoid").."\\0"..property
                    if not trustMutationAggregates[key] and trustMutationAggregateCount >= CONFIG.MAX_CLIENT_STATE_MUTATIONS then
                        break
                    end
                    if not trustMutationAggregates[key] then
                        trustMutationAggregateCount += 1
                        trustMutationAggregates[key]={
                        InstanceId=getStableInstanceId(humanoid,"Humanoid"), Name=reportText("Humanoid"), Property=property,
                        Count=0, FirstAt=nil, LastAt=nil, FirstValueHash=nil, PreviousValueHash=nil, LastValueHash=nil,
                        ReversionObserved=false, ServerConfirmation="not_observed", ServerConfirmationAt=nil, ServerResponseCorrelation="not_observed", CriticalClientState=true,
                        LastValueShapeKey=nil, InterMutationMinMs=nil, InterMutationMaxMs=nil, SameFrameMutations=0,
                        }
                    end
                    local connection=safeCall(function()
                        return humanoid:GetPropertyChangedSignal(property):Connect(function()
                            local now=os.clock(); local aggregate=trustMutationAggregates[key]
                            local value=safeCall(function() return humanoid[property] end,nil); local valueHash=observationValueHash(value)
                            local priorLast=aggregate.LastValueHash; local priorPrior=aggregate.PreviousValueHash
                            aggregate.PreviousValueHash=priorLast; aggregate.LastValueHash=valueHash; aggregate.LastValueShapeKey=argumentShapeKey(describeArgument(value))
                            if aggregate.LastAt then
                                local deltaMs=(now-aggregate.LastAt)*1000
                                aggregate.InterMutationMinMs=aggregate.InterMutationMinMs and math.min(aggregate.InterMutationMinMs,deltaMs) or deltaMs
                                aggregate.InterMutationMaxMs=aggregate.InterMutationMaxMs and math.max(aggregate.InterMutationMaxMs,deltaMs) or deltaMs
                                if deltaMs <= 16.7 then aggregate.SameFrameMutations += 1 end
                            end
                            aggregate.Count+=1
                            aggregate.FirstAt=aggregate.FirstAt or now; aggregate.LastAt=now; aggregate.FirstValueHash=aggregate.FirstValueHash or valueHash
                            if priorPrior and valueHash==priorPrior then aggregate.ReversionObserved=true end
                            recordTimeline("critical_client_state_mutation","humanoid_watch",{InstanceId=aggregate.InstanceId,Property=property,Count=aggregate.Count})
                        end)
                    end,nil)
                    if connection then trustWatchConnections[#trustWatchConnections+1]=connection end
                end
            end
        end
    end

    local function materializeTrustMutationAggregates()
        local ordered={}
        for _,aggregate in pairs(trustMutationAggregates) do if aggregate.Count>0 then ordered[#ordered+1]=aggregate end end
        table.sort(ordered,function(a,b)
            local ka=tostring(a.InstanceId).."\0"..tostring(a.Property); local kb=tostring(b.InstanceId).."\0"..tostring(b.Property); return ka<kb
        end)
        for _,aggregate in ipairs(ordered) do
            if #report.TrustBoundaries>=CONFIG.MAX_TRUST_BOUNDARIES then recordDrop("TrustBoundaries","limit_reached"); break end
            local evidence = {
                {Source=aggregate.CriticalClientState and "humanoid_property_changed_signal" or "value_changed_signal",Observed=true,Confidence="high",Limitations={"client_side_mutation_does_not_establish_server_acceptance","reversion_does_not_prove_server_action"}},
            }
            if aggregate.ServerConfirmation == "confirmed" then
                evidence[#evidence + 1] = {Source="invoke_response_value_hash_correlation",Observed=true,Confidence="low",Limitations={"matching_response_hash_is_heuristic_and_not_server_execution_proof"}}
            elseif aggregate.ServerConfirmation == "contradicted" then
                evidence[#evidence + 1] = {Source="invoke_response_previous_value_hash_correlation",Observed=true,Confidence="low",Limitations={"previous_value_match_is_heuristic_and_not_server_reversion_proof"}}
            end
            local finding=ensureFindingContract({
                Type=aggregate.CriticalClientState and "critical_client_state_mutation" or "client_value_mutation",
                Details={InstanceId=aggregate.InstanceId,Name=aggregate.Name,Property=aggregate.Property,Count=aggregate.Count,FirstAt=aggregate.FirstAt,LastAt=aggregate.LastAt,ReversionObserved=aggregate.ReversionObserved,ServerConfirmation=aggregate.ServerConfirmation,ServerConfirmationAt=aggregate.ServerConfirmationAt,ServerResponseCorrelation=aggregate.ServerResponseCorrelation,MutationTempo=(aggregate.SameFrameMutations>0 and "instant" or "gradual"),SameFrameMutations=aggregate.SameFrameMutations,InterMutationMinMs=aggregate.InterMutationMinMs,InterMutationMaxMs=aggregate.InterMutationMaxMs},
                Evidence=evidence,
            },"trust_boundary_watch","high",{"client_visible_state_only","server_validation_required"})
            append(report.TrustBoundaries,finding,CONFIG.MAX_TRUST_BOUNDARIES)
        end
    end


    local function attachClientIllusionWatchers()
        local function attachCharacter(character)
            if #illusionWatchConnections >= CONFIG.MAX_ILLUSION_WATCHERS then return end
            if not character or cframeIllusionWatchers[character] then return end
            local rootPart = safeCall(function() return character:FindFirstChild("HumanoidRootPart") end, nil)
            if not rootPart then return end
            local lastPosition = safeCall(function() return rootPart.Position end, nil)
            local lastLargeMove = nil
            local connection = safeCall(function()
                return rootPart:GetPropertyChangedSignal("CFrame"):Connect(function()
                    local now = os.clock()
                    local pos = safeCall(function() return rootPart.Position end, nil)
                    if not pos or not lastPosition then lastPosition = pos; return end
                    local delta = (pos - lastPosition).Magnitude
                    if delta > 20 then
                        lastLargeMove = { Position = lastPosition, At = now }
                    elseif lastLargeMove and (now - lastLargeMove.At) < 0.5
                        and (pos - lastLargeMove.Position).Magnitude < 8
                    then
                        registerIllusion("teleport_local_reverted", {
                            Distance = delta,
                            WindowMs = (now - lastLargeMove.At) * 1000,
                        })
                        lastLargeMove = nil
                    end
                    lastPosition = pos
                end)
            end, nil)
            if connection then
                cframeIllusionWatchers[character] = connection
                illusionWatchConnections[#illusionWatchConnections + 1] = connection
            end
        end

        local function attachWinUI(ui)
            if #illusionWatchConnections >= CONFIG.MAX_ILLUSION_WATCHERS then return end
            if uiIllusionWatchers[ui] then return end
            local name = string.lower(tostring(safeCall(function() return ui.Name end, "")))
            local text = string.lower(tostring(safeCall(function() return ui.Text end, "")))
            local combined = name .. " " .. text
            if not (combined:find("win",1,true) or combined:find("victory",1,true)
                or combined:find("complete",1,true) or combined:find("won",1,true))
            then
                return
            end
            local signal = safeCall(function() return ui:GetPropertyChangedSignal("Text") end, nil)
            if not signal then return end
            local connection = safeCall(function()
                return signal:Connect(function()
                    local now = os.clock()
                    local current = string.lower(tostring(safeCall(function() return ui.Text end, "")))
                    if current:find("win",1,true) or current:find("victory",1,true)
                        or current:find("complete",1,true) or current:find("won",1,true)
                    then
                        if snifferState.Active
                            and now - (recentServerActivity["__win__"] or -math.huge) > 0.5
                        then
                            registerIllusion("gui_win_without_server_confirmation", {
                                UIId = getStableInstanceId(ui, "UI"),
                                Text = reportText(current),
                            })
                        end
                    end
                end)
            end, nil)
            if connection then
                uiIllusionWatchers[ui] = connection
                illusionWatchConnections[#illusionWatchConnections + 1] = connection
            end
        end

        if LocalPlayer then
            attachCharacter(LocalPlayer.Character)
        end

        local rankedUI = {}
        for _, ui in ipairs(uiInteractionCandidates) do
            local name = string.lower(tostring(safeCall(function() return ui.Name end, "")))
            local text = string.lower(tostring(safeCall(function() return ui.Text end, "")))
            local combined = name .. " " .. text
            local score = 0
            if combined:find("win", 1, true) then score += 4 end
            if combined:find("victory", 1, true) then score += 4 end
            if combined:find("complete", 1, true) then score += 3 end
            if combined:find("won", 1, true) then score += 3 end
            if combined:find("reward", 1, true) then score += 2 end
            if combined:find("claim", 1, true) then score += 2 end
            rankedUI[#rankedUI + 1] = { Instance = ui, Score = score, Id = getStableInstanceId(ui, "UI") }
        end
        table.sort(rankedUI, function(a, b)
            if a.Score == b.Score then return tostring(a.Id) < tostring(b.Id) end
            return a.Score > b.Score
        end)
        for _, item in ipairs(rankedUI) do
            if #illusionWatchConnections >= CONFIG.MAX_ILLUSION_WATCHERS then break end
            attachWinUI(item.Instance)
        end

        local function watchUIState(ui, property)
            if uiStateWatcherCount >= CONFIG.MAX_UI_STATE_WATCHERS then
                recordDrop("UIInteractionMap", "ui_state_watcher_limit")
                return
            end
            local current = safeCall(function() return ui[property] end, nil)
            uiStateHistory[ui] = uiStateHistory[ui] or {}
            uiStateHistory[ui][property] = { State = current, At = os.clock() }
            local connection = safeCall(function()
                return ui:GetPropertyChangedSignal(property):Connect(function()
                    local now=os.clock(); local state=safeCall(function() return ui[property] end,nil)
                    local history=uiStateHistory[ui] and uiStateHistory[ui][property]
                    if history and history.State ~= state and (now-history.At) < 0.1 then
                        registerIllusion("ui_flicker_under_100ms", {UIId=getStableInstanceId(ui,"UI"),Property=property,WindowMs=(now-history.At)*1000})
                    end
                    uiStateHistory[ui] = uiStateHistory[ui] or {}
                    uiStateHistory[ui][property] = {State=state,At=now}
                    recentUIEvents[#recentUIEvents+1]={At=now,UIId=getStableInstanceId(ui,"UI"),State=tostring(state),Property=property}
                    recordTimeline("ui_state_change","ui_watch",{UIId=getStableInstanceId(ui,"UI"),Property=property,State=tostring(state)})
                    pruneCorrelationBuffers(now)
                    for _,remote in ipairs(recentRemoteCalls) do
                        local delta=now-remote.At
                        if delta>=0 and delta<=0.5 then
                            recordCorrelation("remote_near_ui_state_change",{UIId=getStableInstanceId(ui,"UI"),UIProperty=property,UIState=tostring(state),EndpointId=remote.EndpointId,RemoteName=reportText(remote.Name),DeltaMs=delta*1000},"runtime_remote_then_ui_temporal_sequence","low")
                        end
                    end
                end)
            end,nil)
            if connection then
                uiStateWatcherCount += 1
                illusionWatchConnections[#illusionWatchConnections+1]=connection
            end
        end
        -- InputBegan is observed only when getconnections is available. The analyzer
        -- records only remote candidates reached through callback upvalues/constants.
        if GET_CONNECTIONS and GET_UPVALUES then
            local inputConnections = safeCall(function() return GET_CONNECTIONS(UserInputService.InputBegan) end, nil)
            local inputSamples = 0
            for _, connection in ipairs(inputConnections or {}) do
                if inputSamples >= 64 then break end
                local callback = safeCall(function() return connection.Function end, nil)
                if type(callback) == "function" then
                    inputSamples += 1
                    local foundRemote = false
                    local ups = safeCall(function() return GET_UPVALUES(callback) end, nil)
                    local stack = {}
                    if type(ups) == "table" then stack[#stack+1] = {ups,0} end
                    while #stack > 0 and not foundRemote do
                        local pair = stack[#stack]; stack[#stack] = nil
                        local value, depth = pair[1], pair[2]
                        if typeof(value) == "Instance" and staticRemoteMapInternal[value] then
                            foundRemote = true
                        elseif type(value) == "table" and depth < 2 then
                            for _, child in pairs(value) do
                                stack[#stack+1] = {child, depth+1}
                            end
                        end
                    end
                    if foundRemote then
                        local finding = ensureFindingContract({
                            Kind = "input_began_remote_candidate",
                            Source = "UserInputService.InputBegan",
                            CallbackExecutorOwned = IS_EXECUTOR_CLOSURE and safeCall(function() return IS_EXECUTOR_CLOSURE(callback) end, false) or false,
                            Evidence = {{Source="getconnections_inputbegan_upvalue_scan",Observed=true,Confidence="low",Limitations={"upvalue_reference_does_not_prove_remote_invocation","client_side_only"}}},
                        }, "input_remote_analysis", "low", {"callback_reference_only","requires_runtime_and_server_validation"})
                        append(report.Network.AntiPatternFindings, finding, CONFIG.MAX_ANTI_PATTERN_FINDINGS)
                    end
                end
            end
        end

        local watchedScreenGuis = setmetatable({}, { __mode = "k" })
        local rankedStateUI = {}
        for _, ui in ipairs(uiInteractionCandidates) do
            local name = string.lower(tostring(safeCall(function() return ui.Name end, "")))
            local score = 0
            for _, token in ipairs({ "buy", "purchase", "claim", "shop", "trade", "admin", "win", "complete", "equip", "reward" }) do
                if name:find(token, 1, true) then score += 10 end
            end
            local class=safeCall(function() return ui.ClassName end,"")
            if class == "TextBox" then score += 5 end
            if class == "TextButton" or class == "ImageButton" or class == "TextBox" then
                rankedStateUI[#rankedStateUI + 1] = { UI = ui, Score = score }
            end
        end
        table.sort(rankedStateUI, function(a,b)
            if a.Score == b.Score then
                return getStableInstanceId(a.UI, "UI") < getStableInstanceId(b.UI, "UI")
            end
            return a.Score > b.Score
        end)
        local maxCandidates = math.min(#rankedStateUI, CONFIG.MAX_UI_STATE_WATCHERS)
        for i=1,maxCandidates do
            local ui = rankedStateUI[i].UI
            watchUIState(ui,"Visible")
            watchUIState(ui,"Active")
            local screenGui = safeCall(function() return ui:FindFirstAncestorOfClass("ScreenGui") end, nil)
            if screenGui and not watchedScreenGuis[screenGui] then
                watchedScreenGuis[screenGui] = true
                watchUIState(screenGui,"Enabled")
            end
        end
    end

    local function attachCharacterReplacementObserver()
        if not LocalPlayer or characterObservationConnection then
            return
        end

        local connections = {}
        local added = safeCall(function()
            return LocalPlayer.CharacterAdded:Connect(function(character)
                report.PlayerState.CharacterReplacedDuringScan = true
                local humanoid = character and safeCall(function() return character:FindFirstChildOfClass("Humanoid") end, nil)
                if humanoid then
                    local died = safeCall(function()
                        return humanoid.Died:Connect(function()
                            report.PlayerState.HumanoidDiedObserved = true
                        end)
                    end, nil)
                    if died then connections[#connections + 1] = died end
                end
            end)
        end, nil)
        local removing = safeCall(function()
            return LocalPlayer.CharacterRemoving:Connect(function()
                report.PlayerState.CharacterRemovalObserved = true
            end)
        end, nil)
        if added then connections[#connections + 1] = added end
        if removing then connections[#connections + 1] = removing end

        local currentCharacter = LocalPlayer.Character
        local currentHumanoid = currentCharacter
            and safeCall(function() return currentCharacter:FindFirstChildOfClass("Humanoid") end, nil)
        if currentHumanoid then
            local currentDied = safeCall(function()
                return currentHumanoid.Died:Connect(function()
                    report.PlayerState.HumanoidDiedObserved = true
                end)
            end, nil)
            if currentDied then connections[#connections + 1] = currentDied end
        end

        if #connections > 0 then
            characterObservationConnection = {
                Disconnect = function()
                    for _, connection in ipairs(connections) do
                        pcall(function() connection:Disconnect() end)
                    end
                end,
            }
        end
    end

    local function disconnectAnalysisWatchers()
        -- Idempotent cleanup: disconnect first, then clear every analysis-time
        -- collection in the same function so partial cleanup cannot leave stale
        -- watcher state for the caller.
        for _, connection in ipairs(trustWatchConnections or {}) do
            pcall(function() connection:Disconnect() end)
        end
        for _, connection in ipairs(illusionWatchConnections or {}) do
            pcall(function() connection:Disconnect() end)
        end
        if characterObservationConnection then
            pcall(function() characterObservationConnection:Disconnect() end)
            characterObservationConnection = nil
        end

        clearArrayState(trustWatchConnections)
        clearArrayState(illusionWatchConnections)
        clearArrayState(recentUIEvents)
        clearArrayState(recentRemoteCalls)
        clearArrayState(recentRemoteChains)
        clearWeakMap(uiStateHistory)
        clearWeakMap(valueTrustWatchers)
        clearWeakMap(cframeIllusionWatchers)
        clearWeakMap(uiIllusionWatchers)
        clearWeakMap(trustMutationAggregates)
        trustMutationAggregateCount = 0
        uiStateWatcherCount = 0
    end

    local function appendRemoteCallbackSample(block, instance, info, callback, callbackSource)
        if type(callback) ~= "function" then return false end
        if #block.Findings >= CONFIG.MAX_REMOTE_CALLBACK_FINDINGS then
            recordDrop("RemoteCallbackFindings", "limit_reached")
            return false
        end
        local executorOwned = IS_EXECUTOR_CLOSURE and safeCall(function() return IS_EXECUTOR_CLOSURE(callback) end, false) or false
        local sample = {
            Source = callbackSource,
            ExecutorClosure = executorOwned,
            CallbackSignals = {},
            RemoteInstanceRefs = 0,
        }
        if GET_CONSTANTS then
            local constants = safeCall(function() return GET_CONSTANTS(callback) end, nil)
            sample.ConstantCount = type(constants) == "table" and #constants or 0
            local orderedConstants = {}
            if type(constants) == "table" then
                for _, v in ipairs(constants) do orderedConstants[#orderedConstants + 1] = v end
                table.sort(orderedConstants, function(a,b)
                                                local ta, tb = type(a), type(b)
                                                if ta ~= tb then return ta < tb end
                                                if ta == "number" then return a < b end
                                                return tostring(a) < tostring(b)
                                            end)
                local constantParts = {}
                for _, v in ipairs(orderedConstants) do
                    if type(v) == "string" then
                        local lower = string.lower(v)
                        if lower == "fireserver" or lower == "invokeserver" or lower == "fireunreliable" then sample.CallbackSignals[lower] = true end
                    end
                    if type(v) == "string" or type(v) == "number" or type(v) == "boolean" then
                        constantParts[#constantParts + 1] = hash32(type(v) .. ":" .. tostring(v))
                    end
                    if #constantParts >= 32 then break end
                end
                table.sort(constantParts)
                sample.ConstantHash = hash32(table.concat(constantParts, "\0"))
                sample.ConstantHashMode = "per_constant_hash_then_aggregate_sorted"
            end
        end
        if GET_UPVALUES then
            local upvalues = safeCall(function() return GET_UPVALUES(callback) end, nil)
            sample.UpvalueCount = type(upvalues) == "table" and #upvalues or 0
            if type(upvalues) == "table" then
                for _, upvalue in pairs(upvalues) do
                    if typeof(upvalue) == "Instance" and REMOTE_CLASSES[safeCall(function() return upvalue.ClassName end, "")] then sample.RemoteInstanceRefs += 1 end
                end
            end
        end
        local finding = ensureFindingContract({
            Kind = "remote_callback",
            RemoteId = getStableInstanceId(instance, "Remote"),
            RemotePath = reportText(info.Path),
            RemoteClass = info.Class,
            ConnectionCount = 1,
            SampledConnections = 1,
            CallbacksFromNonGameContext = executorOwned and 1 or 0,
            Interpretation = "executor_context_is_supporting_evidence_not_callback_origin_proof",
            CallbackSamples = { sample },
            Evidence = {{ Source=callbackSource == "OnClientInvoke" and "remote_function_onclientinvoke" or "remote_event_onclientevent", Observed=true, Confidence="medium", Limitations={"callback_introspection_is_best_effort","does_not_observe_server_code"} }},
        }, "remote_callback_analysis", executorOwned and "medium" or "direct", {"client_callback_only","does_not_prove_maliciousness"})
        return append(block.Findings, finding, CONFIG.MAX_REMOTE_CALLBACK_FINDINGS)
    end

    local function analyzeRemoteCallbacks()
        local block = report.Network.RemoteCallbackAnalysis
        clearArrayInPlace(block.Findings)
        block.FindingCount = 0
        block.RemoteFunctionOnClientInvoke = 0
        block.PersistenceNamedEndpointsObserved = 0
        block.PersistenceNameSamples = {}
        block.Status = "not_run"
        local limitationSet = {}
        local function addBlockLimitation(value)
            limitationSet[value] = true
        end

        if EFFECTIVE_REPORT_LEVEL == "METADATA" then
            block.Status = "requires_non_metadata"
            return
        end

        local ordered = {}
        for instance, info in pairs(staticRemoteMapInternal) do
            ordered[#ordered + 1] = { Instance = instance, Info = info }
        end
        table.sort(ordered, function(a,b)
            local ka = tostring(a.Info.Path or "") .. "\0" .. tostring(a.Info.Name or "")
            local kb = tostring(b.Info.Path or "") .. "\0" .. tostring(b.Info.Name or "")
            return ka < kb
        end)

        local partial = false
        for _, item in ipairs(ordered) do
            if auditWallExceeded() then partial = true; break end
            if #block.Findings >= CONFIG.MAX_REMOTE_CALLBACK_FINDINGS then
                recordDrop("RemoteCallbackFindings", "limit_reached")
                partial = true
                break
            end

            local instance = item.Instance
            local class = item.Info.Class
            local instanceName = safeCall(function() return instance.Name end, "")
            local lowerName = string.lower(tostring(instanceName))
            if lowerName:find("data", 1, true)
                or lowerName:find("store", 1, true)
                or lowerName:find("save", 1, true)
            then
                block.PersistenceNamedEndpointsObserved += 1
                if #block.PersistenceNameSamples < 64 then
                    block.PersistenceNameSamples[#block.PersistenceNameSamples + 1] = reportText(instanceName)
                end
            end

            if class == "RemoteEvent" or class == "UnreliableRemoteEvent" then
                if not GET_CONNECTIONS then
                    addBlockLimitation("getconnections_unavailable_for_RemoteEvent")
                else
                    local signal = safeCall(function() return instance.OnClientEvent end, nil)
                    if signal then
                        local connections = safeCall(function() return GET_CONNECTIONS(signal) end, nil)
                        if type(connections) == "table" and #connections > 0 then
                            local foreign = 0
                            local samples = {}
                            local limit = math.min(#connections, 16)
                            for i=1,limit do
                                local callback = safeCall(function() return connections[i].Function end, nil)
                                if type(callback) == "function" then
                                    local executorOwned = IS_EXECUTOR_CLOSURE and safeCall(function() return IS_EXECUTOR_CLOSURE(callback) end, false) or false
                                    if executorOwned then foreign += 1 end
                                    local sample = { ExecutorClosure = executorOwned, CallbackSignals = {}, RemoteInstanceRefs = 0 }
                                    if GET_CONSTANTS then
                                        local constants = safeCall(function() return GET_CONSTANTS(callback) end, nil)
                                        sample.ConstantCount = type(constants) == "table" and #constants or 0
                                        local orderedConstants = {}
                                        if type(constants) == "table" then
                                            for _, v in ipairs(constants) do orderedConstants[#orderedConstants + 1] = v end
                                            table.sort(orderedConstants, function(a,b) return tostring(a) < tostring(b) end)
                                            local constantParts = {}
                                            for _,v in ipairs(orderedConstants) do
                                                if type(v) == "string" then
                                                    local lower = string.lower(v)
                                                    if lower == "fireserver" or lower == "invokeserver" or lower == "fireunreliable" then
                                                        sample.CallbackSignals[lower] = true
                                                    end
                                                end
                                                if type(v) == "string" or type(v) == "number" or type(v) == "boolean" then
                                                    constantParts[#constantParts + 1] = hash32(type(v) .. ":" .. tostring(v))
                                                end
                                                if #constantParts >= 32 then break end
                                            end
                                            table.sort(constantParts)
                                            sample.ConstantHash = hash32(table.concat(constantParts, "\0"))
                                            sample.ConstantHashMode = "per_constant_hash_then_aggregate_sorted"
                                        end
                                    end
                                    if GET_UPVALUES then
                                        local upvalues = safeCall(function() return GET_UPVALUES(callback) end, nil)
                                        sample.UpvalueCount = type(upvalues) == "table" and #upvalues or 0
                                        if type(upvalues) == "table" then
                                            for _,upvalue in pairs(upvalues) do
                                                if typeof(upvalue) == "Instance" and REMOTE_CLASSES[safeCall(function() return upvalue.ClassName end, "")] then
                                                    sample.RemoteInstanceRefs += 1
                                                end
                                            end
                                        end
                                    end
                                    samples[#samples + 1] = sample
                                end
                            end
                            append(block.Findings, ensureFindingContract({
                                Kind = "remote_callback",
                                RemoteId = getStableInstanceId(instance, "Remote"),
                                RemotePath = reportText(item.Info.Path),
                                RemoteClass = class,
                                CallbackSource = "OnClientEvent",
                                ConnectionCount = #connections,
                                SampledConnections = limit,
                                CallbacksFromNonGameContext = foreign,
                                Interpretation = "executor_context_is_supporting_evidence_not_callback_origin_proof",
                                CallbackSamples = samples,
                                Evidence = {{ Source="getconnections_on_remote_client_event", Observed=true, Confidence="medium", Limitations={"connection_origin_is_executor_dependent","callback_introspection_is_best_effort","does_not_observe_server_code"} }},
                            }, "remote_callback_analysis", foreign>0 and "medium" or "direct", {"client_callback_only","does_not_prove_maliciousness"}), CONFIG.MAX_REMOTE_CALLBACK_FINDINGS)
                        elseif type(connections) == "table" then
                            block.NoConnectionsObserved += 1
                            if #block.NoConnectionsObservedEndpoints < 256 then
                                block.NoConnectionsObservedEndpoints[#block.NoConnectionsObservedEndpoints + 1] =
                                    getStableInstanceId(instance, "Remote")
                            end
                        end
                    end
                end
            elseif class == "RemoteFunction" then
                local callback = safeCall(function() return instance.OnClientInvoke end, nil)
                if type(callback) == "function" then
                    if appendRemoteCallbackSample(block, instance, item.Info, callback, "OnClientInvoke") then
                        block.RemoteFunctionOnClientInvoke += 1
                    end
                end
            end
        end

        block.Limitations = {}
        for limitation in pairs(limitationSet) do
            block.Limitations[#block.Limitations + 1] = limitation
        end
        table.sort(block.Limitations)
        block.FindingCount = #block.Findings
        block.Status = partial and "partial_wall_time" or (#block.Findings > 0 and "complete" or "complete_no_observable_callbacks")
    end

    local function buildAntiPatternFindings()
        clearArrayInPlace(report.Network.AntiPatternFindings)
        antiPatternInternal = {}

        -- Static remote quality/detection signals. These do not prove a backdoor.
        local endpointByInstanceId = {}
        for _, candidate in pairs(report.Network.API_Schema) do
            if candidate.InstanceId then
                endpointByInstanceId[candidate.InstanceId] = candidate
            end
        end
        for _, remote in ipairs(report.Network.Remotes) do
            local remoteName = string.lower(tostring(remote.Name or ""))
            local readable = remoteName:match("^[%w _%-]+$") ~= nil and #remoteName >= 3
            local hashLike = remoteName:match("^[0-9a-f]{24,}$") or remoteName:match("^[a-z0-9%+/=]{24,}$")
            local endpoint = endpointByInstanceId[remote.InstanceId]
            local captureEvaluable = snifferState.EverInstalled == true
                and ((snifferState.RestoreStatus == "restored" or snifferState.RestoreStatus == "conflict")
                    and (snifferState.Duration or 0) > 0)
            local observedDynamically = false
            if endpoint then observedDynamically = (endpoint.Calls or 0) > 0 end
            if captureEvaluable and not observedDynamically then
                addFinding("anti_pattern", "silent_remote", {RemoteId=remote.InstanceId, Remote=reportText(remote.Name), ObservedDynamically=false, CaptureEvaluable=true}, {{Source="static_remote_without_observed_call",Observed=true,Confidence="low",Limitations={"capture_window_limited","absence_of_observation_is_not_proof_of_hidden_server_use"}}}, "low")
            end
            if hashLike and not readable then
                addFinding("anti_pattern", "obfuscated_remote_name", {RemoteId=remote.InstanceId, Remote=reportText(remote.Name), Length=#remoteName}, {{Source="remote_name_entropy_shape",Observed=true,Confidence="low",Limitations={"random_names_are_valid_game_design","name_shape_is_heuristic"}}}, "low")
            end
        end

        for _, method in ipairs({"PostAsync"}) do
            if report.Network.ExternalActivity.Methods[method] then
                addFinding("anti_pattern", "http_post_with_client_data_candidate", {Method=method, Calls=report.Network.ExternalActivity.Methods[method] or 0, BodyPresence="not_exported"}, {{Source="passive_http_method_observation",Observed=true,Confidence="low",Limitations={"request_body_not_captured","does_not_prove_exfiltration"}}}, "low")
            end
        end


        for _, remote in ipairs(report.Network.Remotes) do
            local name = string.lower(tostring(remote.Name or ""))
            local endpoint = endpointByInstanceId[remote.InstanceId]

            if endpoint then
                local hasInstance, hasArbitraryTable = false, false
                for _, sig in ipairs(endpoint.Signatures or {}) do
                    if tostring(sig.Types):find("Instance",1,true) then hasInstance = true end
                    if tostring(sig.Types):find("table",1,true)
                        and tostring(sig.ShapeKey):find("map",1,true)
                    then
                        hasArbitraryTable = true
                    end
                end

                if hasInstance then
                    addFinding("anti_pattern", "remote_accepts_instance_unvalidated", {
                        EndpointId = endpoint.EndpointId,
                        Remote = reportText(remote.Name),
                    }, {
                        { Source="remote_signature", Observed=true, Confidence="medium", Limitations={"validation_is_server_invisible"} },
                    }, "medium")
                end
                if hasArbitraryTable then
                    addFinding("anti_pattern", "remote_accepts_arbitrary_table", {
                        EndpointId = endpoint.EndpointId,
                        Remote = reportText(remote.Name),
                    }, {
                        { Source="remote_signature", Observed=true, Confidence="low", Limitations={"table_shape_is_heuristic"} },
                    }, "low")
                end
                if endpoint.Class == "UnreliableRemoteEvent"
                    and (name:find("currency",1,true) or name:find("purchase",1,true)
                        or name:find("damage",1,true) or name:find("trade",1,true))
                then
                    addFinding("anti_pattern", "unreliable_remote_for_critical_data", {
                        EndpointId = endpoint.EndpointId,
                        Remote = reportText(remote.Name),
                    }, {
                        { Source="remote_class_and_name", Observed=true, Confidence="low", Limitations={"criticality_is_name_heuristic"} },
                    }, "low")
                end
                if name:find("cash",1,true) or name:find("currency",1,true)
                    or name:find("money",1,true) or name:find("gold",1,true)
                    or name:find("gem",1,true)
                then
                    addFinding("anti_pattern", "currency_remote_no_rate_limit", {
                        EndpointId = endpoint.EndpointId,
                        Calls = endpoint.Calls,
                        RateLimitEvidence = "not_observed",
                    }, {
                        { Source="runtime_frequency_profile", Observed=true, Confidence="low", Limitations={"absence_of_rate_limit_evidence_is_not_proof_of_absence"} },
                    }, "low")
                end
            end
        end

        for scriptInstance, analysis in pairs(scriptAnalysisInternal) do
            local hasGetfenv, hasLoadstring = false, false
            for _, globalName in ipairs(analysis.Globals or {}) do
                hasGetfenv = hasGetfenv or globalName == "getfenv"
                hasLoadstring = hasLoadstring or globalName == "loadstring"
            end
            if hasGetfenv then
                addFinding("anti_pattern", "getfenv_usage", {
                    ScriptId = getStableInstanceId(scriptInstance, "Script"),
                }, {
                    { Source="script_global_constant_analysis", Observed=true, Confidence="medium", Limitations={"constant_presence_does_not_prove_execution"} },
                }, "medium")
            end
            if hasLoadstring then
                local hasRemoteLiteral = false
                for _, raw in ipairs(analysis.RawStrings or {}) do
                    if string.lower(raw):find("remote",1,true) then
                        hasRemoteLiteral = true
                        break
                    end
                end
                if hasRemoteLiteral then
                    addFinding("anti_pattern", "loadstring_of_remote_response", {
                        ScriptId = getStableInstanceId(scriptInstance, "Script"),
                        RemoteLink = "string_level_candidate",
                    }, {
                        { Source="script_string_and_global_analysis", Observed=true, Confidence="low", Limitations={"no_execution_trace_between_loadstring_and_remote_response"} },
                    }, "low")
                end
            end
        end
    end

    local function buildStructuralDiff()
        local diff = report.StructuralDiff
        clearArrayInPlace(diff.Added)
        clearArrayInPlace(diff.Removed)
        clearArrayInPlace(diff.Changed)
        clearArrayInPlace(diff.SignificantFindings)
        diff.Status = "pending"
        diff.Comparable = nil
        local previous = nil
        if CONFIG.DATA_PROFILE == "DETAILED" then
            previous = getGlobalValue(CONFIG.DIFF_PREVIOUS_REPORT_GLOBAL_KEY)
        end
        if type(previous) ~= "table" then
            diff.Status = CONFIG.DATA_PROFILE == "DETAILED" and "no_previous_report" or "requires_detailed"
            return
        end

        local previousMetadata = type(previous.Metadata) == "table" and previous.Metadata or {}
        local previousFormat = tonumber(previousMetadata.ReportFormat)
        if previousFormat == nil or previousFormat < CONFIG.MIN_DIFF_COMPATIBLE_FORMAT then
            diff.Status = "incompatible_report_format"
            diff.PreviousReportFormat = previousMetadata.ReportFormat
            diff.RequiredMinimumFormat = CONFIG.MIN_DIFF_COMPATIBLE_FORMAT
            return
        end
        diff.PreviousReportFormat = previousFormat
        diff.Comparable = true

        local function indexCollection(collection, kind)
            local index = {}
            if type(collection) ~= "table" then return index end
            for _, item in ipairs(collection) do
                if type(item) == "table" then
                    local path = item.Path or item.ScriptPath or item.UIPath
                    if type(path) == "string" and path ~= "" then
                        index[path] = {
                            Type = kind,
                            Class = item.Class or item.UIClass,
                            Signature = hash32(
                                tostring(item.Class or item.UIClass or "")
                                .. "|" .. tostring(item.HeuristicSeverity or "")
                                .. "|" .. tostring(item.Disabled or "")
                                .. "|" .. tostring(item.BytecodeHash or "")
                                .. "|" .. tostring(item.BytecodeSha256 or "")
                            ),
                            BytecodeHash = item.BytecodeSha256 or item.BytecodeHash,
                        }
                    end
                end
            end
            return index
        end

        local cur = {}
        cur.Remotes = indexCollection(report.Network.Remotes, "Remote")
        cur.Scripts = indexCollection(report.Scripts.LocalScripts, "LocalScript")
        for path,item in pairs(indexCollection(report.Scripts.ModuleScripts, "ModuleScript")) do cur.Scripts[path]=item end
        for _, analysis in ipairs(report.VM.ScriptAnalysis or {}) do
            local path = analysis.ScriptPath
            if type(path) == "string" and path ~= "" then
                cur.Scripts[path] = cur.Scripts[path] or {Type=analysis.Class or "Script", Class=analysis.Class}
                cur.Scripts[path].BytecodeHash = analysis.BytecodeSha256 or analysis.BytecodeHash
                cur.Scripts[path].Signature = hash32(tostring(cur.Scripts[path].Signature or "") .. "|" .. tostring(cur.Scripts[path].BytecodeHash or ""))
            end
        end
        cur.Values = indexCollection(report.Instances.Values, "Value")
        cur.UI = indexCollection(report.Instances.HiddenUI, "UI")

        local prev = previous
        local old = {
            Remotes = indexCollection(prev.Network and prev.Network.Remotes, "Remote"),
            Scripts = indexCollection(prev.Scripts and prev.Scripts.LocalScripts, "LocalScript"),
            Values = indexCollection(prev.Instances and prev.Instances.Values, "Value"),
            UI = indexCollection(prev.Instances and prev.Instances.HiddenUI, "UI"),
        }
        for path,item in pairs(indexCollection(prev.Scripts and prev.Scripts.ModuleScripts, "ModuleScript")) do old.Scripts[path]=item end
        for _, analysis in ipairs((prev.VM and prev.VM.ScriptAnalysis) or {}) do
            local path = analysis.ScriptPath
            if type(path) == "string" and path ~= "" then
                old.Scripts[path] = old.Scripts[path] or {Type=analysis.Class or "Script", Class=analysis.Class}
                old.Scripts[path].BytecodeHash = analysis.BytecodeSha256 or analysis.BytecodeHash
                old.Scripts[path].Signature = hash32(tostring(old.Scripts[path].Signature or "") .. "|" .. tostring(old.Scripts[path].BytecodeHash or ""))
            end
        end

        for kind, currentIndex in pairs(cur) do
            local oldIndex = old[kind] or {}
            for path,item in pairs(currentIndex) do
                if not oldIndex[path] then
                    local finding = ensureFindingContract({
                        Type = kind, Path = reportText(path), Change = "Added",
                        Significant = kind == "Remotes",
                        Evidence = { { Source="structural_diff_getfullname", Observed=true, Confidence="high" } },
                    }, "structural_diff", "high", { "requires_same_report_visibility" })
                    append(diff.Added, finding, CONFIG.MAX_STRUCTURAL_DIFF_ADDED)
                    if kind == "Remotes" then
                        append(diff.SignificantFindings, finding, CONFIG.MAX_STRUCTURAL_DIFF_SIGNIFICANT)
                    end
                elseif oldIndex[path].Signature ~= item.Signature then
                    append(diff.Changed, ensureFindingContract({
                        Type = kind, Path = reportText(path), Change = "Changed",
                        Before = oldIndex[path].Signature, After = item.Signature,
                        BytecodeChanged = oldIndex[path].BytecodeHash ~= item.BytecodeHash,
                        Evidence = { { Source="structural_diff_signature", Observed=true, Confidence="medium" } },
                    }, "structural_diff", "medium", { "signature_excludes_sensitive_values" }), CONFIG.MAX_STRUCTURAL_DIFF_CHANGED)
                end
            end
            for path,item in pairs(oldIndex) do
                if not currentIndex[path] then
                    append(diff.Removed, ensureFindingContract({
                        Type = kind, Path = reportText(path), Change = "Removed",
                        Evidence = { { Source="structural_diff_getfullname", Observed=true, Confidence="high" } },
                    }, "structural_diff", "high", { "requires_same_report_visibility" }), CONFIG.MAX_STRUCTURAL_DIFF_REMOVED)
                end
            end
        end

        diff.Status = "complete"
    end

    local function buildRiskScorecard()
        local sessionStatus = tostring(report.Metadata.SessionStatus or "")
        if sessionStatus == "FAILED" or sessionStatus == "ABORTED" then
            report.RiskScorecard = {
                Status = "incomplete",
                OverallGameRiskScore = nil,
                DensityScore = nil,
                CriticalityScore = nil,
                Contributions = {
                    Status = "suppressed_due_to_incomplete_session",
                    Remote = 0,
                    Script = 0,
                    AntiPattern = 0,
                    RemoteCallback = 0,
                    Correlation = 0,
                    MetatableHook = 0,
                    StaticRemoteMap = 0,
                    TrustBoundary = 0,
                    ClientIllusion = 0,
                },
                TopRiskRemotes = {},
                TopRiskScripts = {},
                Method = "incomplete_session_no_overall_score",
            }
            return
        end

        local remoteRows, scriptRows = {}, {}
        local weight = {
            HIGH=5, MEDIUM=3, LOW=1
        }
        for _, remote in ipairs(report.Network.Remotes) do
            local score = weight[remote.HeuristicSeverity] or 0
            if remote.ArchetypeSeverity then score += weight[remote.ArchetypeSeverity] end
            remoteRows[#remoteRows + 1] = {
                Id = remote.InstanceId or remote.Path,
                EndpointId = type(remote.InstanceId) == "string"
                    and remote.InstanceId:gsub("^Remote_", "Endpoint_")
                    or nil,
                Name = remote.Name,
                Score = score,
            }
        end
        for _, finding in ipairs(report.Network.AntiPatternFindings) do
            if finding.Details and finding.Details.EndpointId then
                for _, row in ipairs(remoteRows) do
                    if row.EndpointId == finding.Details.EndpointId
                        or row.Id == finding.Details.EndpointId
                    then
                        row.Score += 10
                    end
                end
            end
        end

        local scriptScore = {}
        for _, finding in ipairs(report.VM.ScriptAnalysis) do
            local score = 0
            local criticality = 0
            if finding.KnownFingerprint and finding.KnownFingerprint.Match then
                local family = string.lower(tostring(finding.KnownFingerprint.Family or ""))
                if family:find("backdoor",1,true) or family:find("malicious",1,true) then
                    score += 20
                    criticality = 100
                elseif family:find("exploit",1,true) or family:find("cheat",1,true) then
                    score += 15
                    criticality = 80
                else
                    score += 5
                    criticality = 40
                end
            end
            for _, stringInfo in ipairs(finding.Strings or {}) do
                if stringInfo.Category == "webhook" or stringInfo.Category == "key_like"
                    or stringInfo.Category == "admin_command" then score += 5 end
            end
            for _, globalName in ipairs(finding.Globals or {}) do
                if globalName == "loadstring" or globalName == "getfenv" then score += 7 end
            end
            if criticality == 0 then
                criticality = math.floor(math.min(100, (score / 12) * 100))
            end
            scriptRows[#scriptRows + 1] = { Id=finding.ScriptId, Path=finding.ScriptPath, Score=score, CriticalityScore=criticality, KnownFingerprintMatch=finding.KnownFingerprint and finding.KnownFingerprint.Match or false }
        end

        for _, row in ipairs(remoteRows) do
            row.CriticalityScore = math.floor(math.min(100, (row.Score / 15) * 100))
        end
        table.sort(remoteRows, function(a,b)
            if a.CriticalityScore == b.CriticalityScore then return a.Score > b.Score end
            return a.CriticalityScore > b.CriticalityScore
        end)
        table.sort(scriptRows, function(a,b)
            if a.CriticalityScore == b.CriticalityScore then return a.Score > b.Score end
            return a.CriticalityScore > b.CriticalityScore
        end)

        local contributions = {
            Remote = 0,
            Script = 0,
            AntiPattern = 0,
            RemoteCallback = 0,
            Correlation = 0,
            MetatableHook = 0,
            StaticRemoteMap = 0,
            TrustBoundary = 0,
            ClientIllusion = 0,
        }
        for _, row in ipairs(remoteRows) do contributions.Remote += row.Score end
        for _, row in ipairs(scriptRows) do contributions.Script += row.Score end
        for _, finding in ipairs(report.Network.AntiPatternFindings) do
            contributions.AntiPattern += 10
        end
        for _, finding in ipairs(report.Network.RemoteCallbackAnalysis.Findings) do
            contributions.RemoteCallback += 6
        end
        for _, finding in ipairs(report.Network.CorrelationEngine.Findings) do
            contributions.Correlation += (finding.Confidence == "medium" and 4 or 2)
        end
        for _, finding in ipairs(report.Network.MetatableHookAnalysis.Findings) do
            contributions.MetatableHook += 4
        end
        for _, finding in ipairs(report.Network.StaticRemoteMap.Findings) do
            contributions.StaticRemoteMap += 3
        end
        for _, finding in ipairs(report.TrustBoundaries) do
            contributions.TrustBoundary += 8
        end
        for _, finding in ipairs(report.ClientIllusions) do
            contributions.ClientIllusion += 4
        end

        local total = 0
        for key, value in pairs(contributions) do total += value end
        local archetype = report.Metadata.GameArchetype and report.Metadata.GameArchetype.Primary
        local entityCount = math.max(1,
            #remoteRows + #scriptRows
            + #report.Network.AntiPatternFindings
            + #report.Network.RemoteCallbackAnalysis.Findings
            + #report.Network.CorrelationEngine.Findings
            + #report.Network.MetatableHookAnalysis.Findings
            + #report.Network.StaticRemoteMap.Findings
            + #report.TrustBoundaries
            + #report.ClientIllusions)
        local normalizedAverage = total / entityCount
        -- DensityScore preserves the existing density-oriented metric.
        local densityScore = math.floor(math.min(100, normalizedAverage * 5))
        if archetype == "Unknown" then densityScore = math.floor(densityScore * 0.75) end

        local criticalityRaw = 0
        if remoteRows[1] then criticalityRaw = math.max(criticalityRaw, remoteRows[1].CriticalityScore or 0) end
        if scriptRows[1] then criticalityRaw = math.max(criticalityRaw, scriptRows[1].CriticalityScore or 0) end
        for _,finding in ipairs(report.TrustBoundaries) do criticalityRaw = math.max(criticalityRaw, 8) end
        for _,finding in ipairs(report.ClientIllusions) do criticalityRaw = math.max(criticalityRaw, 4) end
        local criticalityScore = math.floor(math.min(100, criticalityRaw))

        report.RiskScorecard = {
            Status = "complete",
            OverallGameRiskScore = densityScore,
            DensityScore = densityScore,
            CriticalityScore = criticalityScore,
            RawRiskPoints = total,
            EntityCount = entityCount,
            Contributions = contributions,
            Normalization = "raw_points_divided_by_evidence_entity_count_then_scaled_20_average_to_100",
            TopRiskRemotes = {},
            TopRiskScripts = {},
            GameArchetype = archetype or "Unknown",
            Method = "archetype_weighted_client_evidence_priority_only",
            Provenance = "risk_scorecard_heuristic",
            Confidence = "low",
            ServerValidationRequired = true,
            Evidence = {
                { Source="remote/script/trust/client_illusion_findings", Observed=true, Confidence="low" }
            },
            Limitations = {
                "not_a_server_vulnerability_score",
                "client_visible_evidence_only",
                "archetype_and_name_weights_are_heuristic",
                "no_external_known_script_fingerprint_database_is_bundled",
                "CAP-10 fingerprinting remains local deterministic hashing unless an authorized external reference database is supplied",
            },
        }
        for i=1,math.min(CONFIG.MAX_RISK_TOP_ITEMS,#remoteRows) do
            report.RiskScorecard.TopRiskRemotes[#report.RiskScorecard.TopRiskRemotes+1]=remoteRows[i]
        end
        for i=1,math.min(CONFIG.MAX_RISK_TOP_ITEMS,#scriptRows) do
            report.RiskScorecard.TopRiskScripts[#report.RiskScorecard.TopRiskScripts+1]=scriptRows[i]
        end
    end

    local function buildDiffSummary()
        if not CONFIG.DIFF_SUMMARY_ENABLED then
            return { Status = "disabled" }
        end

        local previous = getGlobalValue(CONFIG.DIFF_PREVIOUS_REPORT_GLOBAL_KEY)
        if type(previous) ~= "table" then
            return { Status = "not_available", Source = CONFIG.DIFF_PREVIOUS_REPORT_GLOBAL_KEY }
        end

        local previousMetadata = type(previous.Metadata) == "table" and previous.Metadata or {}
        local previousSummary = type(previous.Summary) == "table" and previous.Summary or {}
        local currentPlaceId = report.Metadata.PlaceId
        local previousPlaceId = previousMetadata.PlaceId
        local placeMatch = nil
        if type(currentPlaceId) == "number" and type(previousPlaceId) == "number" then
            placeMatch = currentPlaceId == previousPlaceId
        end
        if placeMatch == false then
            return {
                Status = "place_mismatch",
                Comparable = false,
                CurrentReportFormat = REPORT_FORMAT,
                PreviousReportFormat = previousMetadata.ReportFormat,
            }
        end

        local currentSummary = report.Summary or {}
        local metrics = {
            { Key = "Remotes", Current = currentSummary.Remotes or #report.Network.Remotes, Previous = previousSummary.Remotes },
            { Key = "RemoteFunctions", Current = currentSummary.RemoteFunctions or 0, Previous = previousSummary.RemoteFunctions },
            { Key = "HiddenUI", Current = currentSummary.HiddenUI or #report.Instances.HiddenUI, Previous = previousSummary.HiddenUI },
            { Key = "LocalScripts", Current = currentSummary.LocalScripts or #report.Scripts.LocalScripts, Previous = previousSummary.LocalScripts },
            { Key = "ModuleScripts", Current = currentSummary.ModuleScripts or #report.Scripts.ModuleScripts, Previous = previousSummary.ModuleScripts },
            { Key = "APIEndpointsProfiled", Current = currentSummary.APIEndpointsProfiled or report.Network.Sniffer.RemoteEndpointsProfiled or 0, Previous = previousSummary.APIEndpointsProfiled },
            { Key = "GCObjectsVisited", Current = currentSummary.GCObjectsVisited or report.VM.GCAudit.ObjectsVisited or 0, Previous = previousSummary.GCObjectsVisited },
            { Key = "GCSensitiveConstants", Current = currentSummary.GCSensitiveConstants or #report.VM.GCAudit.SensitiveConstants, Previous = previousSummary.GCSensitiveConstants },
            { Key = "StaticRemoteMap", Current = #report.Network.StaticRemoteMap.Findings, Previous = previousSummary.StaticRemoteMap },
            { Key = "AntiPatternFindings", Current = #report.Network.AntiPatternFindings, Previous = previousSummary.AntiPatternFindings },
            { Key = "TrustBoundaries", Current = #report.TrustBoundaries, Previous = previousSummary.TrustBoundaries },
            { Key = "ClientIllusions", Current = #report.ClientIllusions, Previous = previousSummary.ClientIllusions },
        }
        local changes = {}
        local comparableMetricCount = 0
        for _, metric in ipairs(metrics) do
            if type(metric.Previous) == "number" then
                comparableMetricCount += 1
                changes[metric.Key] = {
                    Previous = metric.Previous,
                    Current = metric.Current,
                    Delta = metric.Current - metric.Previous,
                }
            end
        end

        local limitations = {
            "Counts are compared from summary-level data only.",
            "A client-visible snapshot cannot establish server-side state differences.",
        }
        if placeMatch == nil then
            limitations[#limitations + 1] = "PlaceId is unavailable in one or both reports."
        end

        return {
            Status = comparableMetricCount > 0 and "available" or "schema_or_summary_missing",
            Comparable = comparableMetricCount > 0,
            ComparisonStrength = placeMatch == true and "verified_place" or "place_unknown",
            Source = CONFIG.DIFF_PREVIOUS_REPORT_GLOBAL_KEY,
            CurrentReportFormat = REPORT_FORMAT,
            PreviousReportFormat = previousMetadata.ReportFormat,
            ReportFormatMatch = previousMetadata.ReportFormat == REPORT_FORMAT,
            PlaceIdMatch = placeMatch,
            SchemaCompatibility = previousMetadata.ReportFormat == REPORT_FORMAT and "same_report_format" or "report_format_changed",
            MetricCount = comparableMetricCount,
            Changes = changes,
            Limitations = limitations,
        }
    end

    local function normalizeFindingEvidence()
        local collections = {
            report.Network.Remotes,
            report.Network.Bindables,
            report.Instances.Values,
            report.Instances.HiddenUI,
            report.Scripts.LocalScripts,
            report.Scripts.ModuleScripts,
            report.Environment.Attributes,
            report.Environment.Tags,
            report.VM.GCAudit.SensitiveConstants,
            report.Instances.MetatableProfiles,
            report.Environment.TextChat.Channels,
            report.Environment.TextChat.Sources,
            report.VM.RequireGraph.Edges,
            report.VM.ScriptAnalysis,
            report.Network.StaticRemoteMap.Findings,
            report.Network.DataFlowGraph.Edges,
            report.Network.AntiPatternFindings,
            report.TrustBoundaries,
            report.UIInteractionMap,
            report.ClientIllusions,
            report.Timeline,
            report.StructuralDiff.Added,
            report.StructuralDiff.Removed,
            report.StructuralDiff.Changed,
            report.StructuralDiff.SignificantFindings,
        }

        local function normalizeEvidenceEntry(entry, fallbackSource, fallbackObserved, fallbackConfidence)
            entry.Source = entry.Source or fallbackSource or "unknown"
            entry.Observed = entry.Observed == true or fallbackObserved == true
            entry.CollectedAt = entry.CollectedAt or os.time()
            entry.Confidence = normalizeConfidence(entry.Confidence, fallbackConfidence)
            entry.Coverage = entry.Coverage or "client_visible_snapshot"
            entry.Limitations = fixedEvidenceLimitations(entry.Source, entry.Limitations)
        end

        local function normalizeFinding(finding, source, observed, confidence)
            if type(finding) ~= "table" then
                return
            end
            finding.Evidence = type(finding.Evidence) == "table" and finding.Evidence or {}
            finding.ServerValidationRequired = true
            finding.Limitations = type(finding.Limitations) == "table" and finding.Limitations
                or { "client_side_evidence_only", "server_validation_required" }
            if #finding.Evidence == 0 then
                finding.Evidence[1] = {
                    Source = source,
                    Observed = observed == true,
                    Confidence = confidence,
                }
            end
            for _, evidence in ipairs(finding.Evidence) do
                normalizeEvidenceEntry(evidence, source, observed, confidence)
            end

            if finding.HeuristicKeyword then
                finding.Provenance = finding.Provenance or "static_name_heuristic"
                finding.Confidence = "low"
            elseif finding.Provenance == nil then
                finding.Provenance = source or "static_scan"
                finding.Confidence = normalizeConfidence(confidence, "direct")
            else
                finding.Confidence = normalizeConfidence(finding.Confidence, confidence or "direct")
            end
        end

        for _, collection in ipairs(collections) do
            for _, finding in ipairs(collection) do
                normalizeFinding(
                    finding,
                    finding and finding.Provenance or "static_scan",
                    finding and finding.Provenance == "dynamic_namecall",
                    finding and finding.Confidence or "direct"
                )
            end
        end

        for _, endpoint in pairs(report.Network.API_Schema) do
            normalizeFinding(endpoint, "dynamic_namecall", true, "high")
        end

        for _, endpoint in pairs(report.Network.ContractAnalysis.Endpoints or {}) do
            normalizeFinding(endpoint, "dynamic_namecall", true, "high")
        end
    end

    local function endpointCaptureDuration()
        if snifferState.Duration and snifferState.Duration > 0 then
            return snifferState.Duration, snifferState.CaptureWindowTrust or "reliable"
        end
        if report.Metadata.SnifferStartClock then
            local duration = os.clock() - report.Metadata.SnifferStartClock
            if duration > 0 then
                return duration, "unreliable"
            end
        end
        return 0, "no_capture_window"
    end

    local function buildRemoteContractAnalysis()
        local analysis = report.Network.ContractAnalysis
        analysis.Endpoints = {}
        local count = 0
        local duration, captureWindowTrust = endpointCaptureDuration()
        local orderedEndpoints = {}
        for endpointId, endpoint in pairs(report.Network.API_Schema) do
            orderedEndpoints[#orderedEndpoints + 1] = { Id = endpointId, Data = endpoint }
        end
        table.sort(orderedEndpoints, function(a, b)
            local callsA = a.Data.Calls or 0
            local callsB = b.Data.Calls or 0
            if callsA ~= callsB then
                return callsA > callsB
            end
            return tostring(a.Id) < tostring(b.Id)
        end)

        for _, item in ipairs(orderedEndpoints) do
            if count >= CONFIG.MAX_CONTRACT_ENDPOINTS then
                break
            end
            local endpointId = item.Id
            local endpoint = item.Data
            count += 1

            local signatures = {}
            for _, signature in ipairs(endpoint.Signatures or {}) do
                if #signatures >= CONFIG.MAX_CONTRACT_SHAPES_PER_ENDPOINT then
                    break
                end
                signatures[#signatures + 1] = {
                    Types = signature.Types,
                    ShapeKey = signature.ShapeKey,
                    Shapes = signature.Shapes,
                    Calls = signature.Calls,
                    ArgumentCount = signature.ArgumentCount,
                    FirstSeen = signature.FirstSeen,
                    LastSeen = signature.LastSeen,
                }
            end

            local variableArity = endpoint.ArgumentCountMin ~= nil
                and endpoint.ArgumentCountMax ~= nil
                and endpoint.ArgumentCountMin ~= endpoint.ArgumentCountMax
            local shapeDistribution = {}
            local shapeKeys = {}
            for shapeKey in pairs(endpoint.ShapeHistogram or {}) do
                shapeKeys[#shapeKeys + 1] = shapeKey
            end
            table.sort(shapeKeys)
            for _, shapeKey in ipairs(shapeKeys) do
                shapeDistribution[#shapeDistribution + 1] = {
                    ShapeKey = shapeKey,
                    Samples = endpoint.ShapeHistogram[shapeKey],
                }
            end

            local responseShapeHistogram = endpoint.ResponseShapeHistogram or {}
            local responseShapeBins = 0
            local responseShapeTotal = 0
            local responseShapeEntropy = 0
            for _, responseCount in pairs(responseShapeHistogram) do
                if type(responseCount) == "number" and responseCount > 0 then
                    responseShapeBins += 1
                    responseShapeTotal += responseCount
                end
            end
            if responseShapeTotal > 0 and responseShapeBins > 1 then
                for _, responseCount in pairs(responseShapeHistogram) do
                    if type(responseCount) == "number" and responseCount > 0 then
                        local p = responseCount / responseShapeTotal
                        responseShapeEntropy -= p * math.log(p, 2)
                    end
                end
                responseShapeEntropy = math.min(1, math.max(0, responseShapeEntropy / math.log(responseShapeBins, 2)))
            end

            local observedCalls = endpoint.Calls or 0
            local frequency = duration > 0
                and math.min(observedCalls / duration, 100)
                or 0
            local heuristicSeverity = endpoint.HeuristicSeverity
            local highHeuristic = heuristicSeverity == "HIGH"
            local mediumHeuristic = heuristicSeverity == "MEDIUM"
            local shapeVariation = #shapeDistribution > 1

            local reviewPriority = "Informational"
            if highHeuristic and (frequency >= 1 or variableArity or shapeVariation) then
                reviewPriority = "HighInterest"
            elseif highHeuristic or mediumHeuristic or frequency >= 0.5 or variableArity or shapeVariation then
                reviewPriority = "WorthReview"
            end

            local endpointEvidence = {
                {
                    Source = "dynamic_namecall",
                    Observation = "runtime client invocation shape",
                    Observed = true,
                    CollectedAt = os.time(),
                    Confidence = "high",
                    Coverage = "client_visible_capture_window",
                    Limitations = {
                        "does_not_observe_server_validation",
                        "does_not_prove_server_vulnerability",
                    },
                },
            }
            if endpoint.ResponseObserved then
                endpointEvidence[#endpointEvidence + 1] = {
                    Source = "remote_invoke_response",
                    Observation = "observed RemoteFunction response shape without recording raw response values",
                    Observed = true,
                    CollectedAt = os.time(),
                    Confidence = "direct",
                    Coverage = "client_visible_capture_window",
                    Limitations = {
                        "response_values_not_recorded",
                        "does_not_observe_server_validation",
                        "does_not_prove_server_vulnerability",
                    },
                }
            end

            analysis.Endpoints[endpointId] = {
                EndpointId = endpointId,
                Name = endpoint.Name,
                RemoteClass = endpoint.Class,
                Direction = "Client->Server",
                ObservedCalls = observedCalls,
                CallsPerSecondApprox = frequency,
                CaptureWindowSeconds = duration,
                CaptureWindowTrust = captureWindowTrust,
                CaptureWindowStatus = snifferState.CaptureWindowStatus,
                ObservedMethods = endpoint.Methods or {},
                PathStability = {
                    Stable = (endpoint.PathChangedCount or 0) == 0,
                    Changes = endpoint.PathChangedCount or 0,
                },
                RootStability = {
                    Stable = (endpoint.RootChangedCount or 0) == 0,
                    Changes = endpoint.RootChangedCount or 0,
                    CurrentRoot = endpoint.Root,
                },
                HasVariableArity = variableArity,
                ArgumentArityDistribution = endpoint.ArgumentCountSet or {},
                ShapeDistribution = shapeDistribution,
                ShapeSamples = endpoint.ShapeSamples or 0,
                Signatures = signatures,
                HeuristicSignal = {
                    Keyword = endpoint.HeuristicKeyword,
                    Severity = endpoint.HeuristicSeverity,
                },
                ReviewPriority = reviewPriority,
                ExecutionCharacteristics = {
                    TwoWay = endpoint.Class == "RemoteFunction",
                    SenderYields = endpoint.Class == "RemoteFunction",
                    ResponseObserved = endpoint.ResponseObserved == true,
                    ResponseCallsObserved = endpoint.ResponseCallsObserved or 0,
                    ResponseArityMin = endpoint.ResponseArityMin,
                    ResponseArityMax = endpoint.ResponseArityMax,
                    ResponseReturnType = endpoint.ResponseTypeSet or {},
                    ResponseValuesObserved = endpoint.ResponseShapeHistogram or {},
                    ResponseTypeDistribution = endpoint.ResponseTypeSet or {},
                    ResponseShapeDistribution = endpoint.ResponseShapeHistogram or {},
                    ResponseShapeVariability = responseShapeEntropy,
                },
                ValidationDimensions = {
                    TypeConsistency = "OBSERVED_SHAPE",
                    NumericFinite = "NOT_OBSERVED_CLIENT_SIDE",
                    NumericRange = "NOT_OBSERVED_CLIENT_SIDE",
                    Permission = "NOT_OBSERVED_CLIENT_SIDE",
                    ServerState = "NOT_OBSERVED_CLIENT_SIDE",
                    ProximityContext = "NOT_OBSERVED_CLIENT_SIDE",
                    InstanceClass = "OBSERVED_SHAPE_ONLY",
                    InstanceAncestry = "NOT_OBSERVED_CLIENT_SIDE",
                    RateLimit = "NOT_OBSERVED_CLIENT_SIDE",
                    ReplayResistance = "NOT_OBSERVED_CLIENT_SIDE",
                    ServerAuthority = "REQUIRES_SERVER_VERIFICATION",
                },
                Interpretation = "evidence_and_review_requirements_only",
                Provenance = "dynamic_namecall",
                Confidence = "high",
                Evidence = endpointEvidence,
            }
        end

        analysis.EndpointCount = countKeys(analysis.Endpoints)
        analysis.CaptureWindowSeconds = duration
        analysis.Policy = "ReviewPriority is an analyst triage heuristic based only on observed frequency, name heuristics, argument arity and shape variation; it is not a vulnerability verdict."
    end

    local SERVER_VALIDATION_CHECKLIST_BY_KIND = {
        remote_callback = "Review client callback provenance and validate any server-side assumptions independently.",
        trust_boundary_watch = "Reproduce the state transition with server-side logging/validation and confirm whether the server accepts or rejects it.",
        structural_diff = "Verify that both snapshots have equivalent server/client visibility before treating the change as security-relevant.",
        client_illusion = "Confirm authoritative server state and replication outcome before treating a UI/state mismatch as a security issue.",
        correlation = "Replay or inspect the server-side transaction chain and validate causality/rate-limit/authorization behavior.",
    }

    local function finalizeMetadataAnalysisContracts()
        local metadata = report.Metadata
        metadata.ServerValidationChecklist = SERVER_VALIDATION_CHECKLIST_BY_KIND
        if report.Metadata.PhaseContracts and report.Metadata.PhaseContracts.ServerValidationChecklist then
            report.Metadata.PhaseContracts.ServerValidationChecklist.Status = "complete"
            report.Metadata.PhaseContracts.ServerValidationChecklist.Reason = "materialized during final metadata contract assembly"
        end
        metadata.KnownLimitations = {}
        local seen = {}
        local function addLimit(value)
            value = tostring(value)
            if value ~= "" and not seen[value] then seen[value] = true; metadata.KnownLimitations[#metadata.KnownLimitations + 1] = value end
        end
        for _, value in ipairs(metadata.CoverageContract.NotCovered or {}) do addLimit(value) end
        for _, value in ipairs(metadata.Streaming and {metadata.Streaming.Coverage} or {}) do addLimit(value) end
        table.sort(metadata.KnownLimitations)
        if metadata.BytecodeParserContract then
            for _, value in ipairs(metadata.BytecodeParserContract.Limitations or {}) do
                local textValue = tostring(value)
                if textValue ~= "" and not seen[textValue] then
                    seen[textValue] = true
                    metadata.KnownLimitations[#metadata.KnownLimitations + 1] = textValue
                end
            end
            table.sort(metadata.KnownLimitations)
        end

        local trustSummary = {}
        for _, finding in ipairs(report.TrustBoundaries or {}) do
            local kind = tostring(finding.Type or "unknown")
            trustSummary[kind] = (trustSummary[kind] or 0) + 1
        end
        metadata.TrustBoundariesSummary = trustSummary

        local findingSummary = {
            trust = #report.TrustBoundaries,
            correlation = #report.Network.CorrelationEngine.Findings,
            illusion = #report.ClientIllusions,
            anti_pattern = #report.Network.AntiPatternFindings,
            callbacks = #report.Network.RemoteCallbackAnalysis.Findings,
        }

        local byProvenance, byConfidence = {}, {}
        local findingCollections = {
            report.TrustBoundaries,
            report.ClientIllusions,
            report.Network and report.Network.StaticRemoteMap and report.Network.StaticRemoteMap.Findings,
            report.Network and report.Network.RemoteCallbackAnalysis and report.Network.RemoteCallbackAnalysis.Findings,
            report.Network and report.Network.CorrelationEngine and report.Network.CorrelationEngine.Findings,
            report.Network and report.Network.MetatableHookAnalysis and report.Network.MetatableHookAnalysis.Findings,
            report.Network and report.Network.AntiPatternFindings,
        }
        for _, collection in ipairs(findingCollections) do
            if type(collection) == "table" then
                for _, finding in ipairs(collection) do
                    if type(finding) == "table" then
                        local provenance = tostring(finding.Provenance or "unknown")
                        local confidence = tostring(finding.Confidence or "unknown")
                        byProvenance[provenance] = (byProvenance[provenance] or 0) + 1
                        byConfidence[confidence] = (byConfidence[confidence] or 0) + 1
                    end
                end
            end
        end

        metadata.FindingsSummary = {
            ByCategory = findingSummary,
            ByProvenance = byProvenance,
            ByConfidence = byConfidence,
        }

        local sessionDeltas = metadata.SessionDeltas or {}
        sessionDeltas.DurationSeconds = metadata.DurationSeconds
        sessionDeltas.Completed = metadata.Completed
        sessionDeltas.Status = metadata.SessionStatus
        sessionDeltas.TruncatedByBudget = metadata.Completeness and metadata.Completeness.TruncatedByBudget or false
        sessionDeltas.FindingsBeforeProjection = findingSummary
        sessionDeltas.PreviousSessionScope = sessionDeltas.PreviousSessionScope or "DETAILED_only"
        sessionDeltas.PreviousReportAvailable = sessionDeltas.PreviousReportAvailable == true
        metadata.SessionDeltas = sessionDeltas
    end

    local function finalizeSnapshotCoverage()
        report.Metadata.CoverageDenominators = report.Metadata.CoverageDenominators or {}
        report.Metadata.Unknowns = report.Metadata.Unknowns or {}
        report.Metadata.BlindSpots = report.Metadata.BlindSpots or {}
        local snapshot = report.Metadata.Snapshot
        local coverage = snapshot.Coverage
        local limitationSet = {}
        local allComplete = true
        local anyScanned = false

        for rootName, stats in pairs(report.Metadata.Roots) do
            local stopReason = stats.StopReason
            local partial = stopReason ~= nil
                and stopReason ~= "completed"
                and stopReason ~= "exhausted"
                and stopReason ~= "deduplicated"

            coverage[rootName] = {
                Status = partial and "PARTIAL" or "COMPLETE",
                Visited = stats.Visited or 0,
                PendingAtStop = stats.PendingAtStop or 0,
                StopReason = stopReason,
            }

            report.Metadata.CoverageDenominators[rootName] = {
                ExpectedKnown = false,
                Expected = nil,
                VisibleObserved = (stats.Visited or 0) + (stats.PendingAtStop or 0),
                Visited = stats.Visited or 0,
                Omitted = stats.PendingAtStop or 0,
                NotAccessible = 0,
                UnknownUniverse = true,
            }

            anyScanned = anyScanned or (stats.Visited or 0) > 0
            if partial then
                allComplete = false
                if stopReason then
                    limitationSet[stopReason] = true
                end
            end
        end

        if report.Metadata.Traversal.StopReason then
            allComplete = false
            limitationSet[report.Metadata.Traversal.StopReason] = true
        end

        if report.Metadata.Performance.OutputBudgetExceeded then
            allComplete = false
            limitationSet.report_bytes_budget = true
        end

        snapshot.CoverageStatus =
            not anyScanned and "UNAVAILABLE"
            or allComplete and "COMPLETE"
            or "PARTIAL"

        local limitations = {}
        for reason in pairs(limitationSet) do
            limitations[#limitations + 1] = reason
        end
        table.sort(limitations)
        snapshot.Limitations = limitations

        local unknowns = report.Metadata.Unknowns
        local blindSpots = report.Metadata.BlindSpots
        local function addUnique(target, value)
            for _, item in ipairs(target) do
                if item == value then return end
            end
            target[#target + 1] = value
        end

        addUnique(unknowns, "server_side_validation_not_observed")
        if report.Metadata.Streaming.Enabled == true then
            addUnique(blindSpots, "streaming_client_unloaded_universe")
        end
        if not CONFIG.SNIFF_TRAFFIC then
            addUnique(blindSpots, "remote_activity_outside_capture_not_observed")
        end
        if CONFIG.SCAN_VM ~= true then
            addUnique(blindSpots, "vm_analysis_disabled_by_effective_profile")
        end
        if not report.Metadata.Capabilities.getgc
            or report.Metadata.Capabilities.getgc.Functional ~= true
        then
            addUnique(blindSpots, "gc_api_unavailable_or_unprobed")
        end
        table.sort(unknowns)
        table.sort(blindSpots)
    end

