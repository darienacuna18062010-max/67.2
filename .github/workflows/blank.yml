            SnifferDuration = report.Network.Sniffer.Duration,
            SnifferSignaturesDropped = report.Network.Sniffer.SignaturesDropped,
            SnifferOwnershipLossCount = report.Network.Sniffer.OwnershipLossCount,
            AttributeGetCallsObserved = report.Network.AttributeActivity.GetAttributeCalls,
