    --------------------------------------------------------------------
    -- LOADED MODULE / VM AUDIT
    --------------------------------------------------------------------

    local NUMERIC_PATTERNS = {
        "^%s*[+-]?%d+%.?%d*%s*$",
        "^%s*[+-]?%.%d+%s*$",
        "^%s*[+-]?%d+%.?%d*[eE][+-]?%d+%s*$",
        "^%s*[+-]?%.%d+[eE][+-]?%d+%s*$",
        "^%s*[+-]?0[xX]%x+%s*$",
    }

    local function isNumericLiteral(value)
        for _, pattern in ipairs(NUMERIC_PATTERNS) do
            if string.match(value, pattern) then
                return true
            end
        end

        return false
    end
    local function addUniqueString(list, seen, value, max)
        if type(value) ~= "string" or #list >= max or seen[value] then return end
        seen[value] = true
        local exportValue = value
        if #exportValue > CONFIG.MAX_STRING_CONSTANT_LENGTH then
            exportValue = string.sub(exportValue, 1, CONFIG.MAX_STRING_CONSTANT_LENGTH) .. "..."
        end
        local safeValue = reportText(exportValue)
        if safeValue then list[#list + 1] = safeValue end
    end

    local function createCooperativePhaseState()
        -- Start immediately; phaseShouldYield() performs the real cooperative wait.
        return {
            PhaseSliceStart = os.clock(),
            Budget = CONFIG.SLICE_MAX_BUDGET_SECONDS,
            ActiveMs = 0,
            WaitMs = 0,
        }
    end

    local function phaseShouldYield(state)
        if auditWallExceeded() then
            return true, "wall_time"
        end

        if os.clock() - state.PhaseSliceStart < state.Budget then
            return false, nil
        end

        local activeMs = (os.clock() - state.PhaseSliceStart) * 1000
        state.ActiveMs += activeMs
        report.Metadata.Performance.Slices += 1
        report.Metadata.Performance.YieldCount += 1
        report.Metadata.Performance.ActiveMs += activeMs

        local waitStart = os.clock()
        task.wait()
        local frameDelta = 1 / 60
        local waitMs = (os.clock() - waitStart) * 1000
        state.WaitMs += waitMs
        report.Metadata.Performance.WaitMs += waitMs
        state.PhaseSliceStart = os.clock()
        state.Budget = calculateSliceBudget(frameDelta)
        return false, nil
    end

    local function scanLoadedModules()
        if not CONFIG.SCAN_VM then
            return
        end

        if not GET_LOADED_MODULES then
            report.VM.Supported = false
            report.VM.Reason = "getloadedmodules unavailable"
            return
        end

        if auditWallExceeded() then
            report.VM.Reason = "wall_time"
            return
        end

        report.VM.Supported = true

        local modulesStart = os.clock()
        local modules = safeCall(function()
            return GET_LOADED_MODULES()
        end, nil)

        markCapabilityProbe(
            "getloadedmodules",
            type(modules) == "table",
            "getloadedmodules returned unsupported data"
        )
        local modulesAtomicMs = (os.clock() - modulesStart) * 1000
        report.Metadata.Performance.MaxAtomicOperationMs =
            math.max(report.Metadata.Performance.MaxAtomicOperationMs, modulesAtomicMs)

        if type(modules) ~= "table" then
            report.VM.Supported = false
            report.VM.Reason = "getloadedmodules returned unsupported data"
            return
        end

        local moduleCount = math.min(#modules, CONFIG.MAX_MODULES)

        for i = 1, moduleCount do
            local candidate = modules[i]
            if typeof(candidate) == "Instance" and candidate:IsA("ModuleScript") then
                moduleIndexByInstance[candidate] = i
                report.VM.RequireGraph.Nodes[tostring(i)] = {
                    ModuleIndex = i,
                    Name = reportText(candidate.Name),
                    Path = reportText(getInstancePath(candidate)),
                }
            end
        end
        report.VM.RequireGraph.Status = "partial_inferred"
        if moduleCount < #modules then
            recordDrops("Modules", #modules - moduleCount, "limit_reached")
        end

        local phaseState = createCooperativePhaseState()

        for i = 1, moduleCount do
            local stopped, reason = phaseShouldYield(phaseState)
            if stopped then
                report.VM.Reason = reason
                local remaining = moduleCount - (i - 1)
                if remaining > 0 then
                    recordDrops(
                        "Modules",
                        remaining,
                        reason == "wall_time" and "wall_time" or "cooperative_yield"
                    )
                end
                break
            end

            local mod = modules[i]

            if typeof(mod) == "Instance" and mod:IsA("ModuleScript") then
                local modulePath = getInstancePath(mod)

                local moduleData = {
                    -- Stable only within this report; used to cross-reference GC findings.
                    ModuleIndex = i,
                    Name = reportText(mod.Name),
                    Path = reportText(modulePath),
                    Constants = {},
                    SensitiveConstants = {},
                    Upvalues = {},
                    ConstantCount = 0,
                    UpvalueCount = 0,
                }

                local seenConstants = {}

                --------------------------------------------------------
                -- CLOSURE
                --------------------------------------------------------

                if GET_SCRIPT_CLOSURE then
                    local closure = safeCall(function()
                        return GET_SCRIPT_CLOSURE(mod)
                    end, nil)

                    markCapabilityProbe(
                        "getscriptclosure",
                        closure ~= nil,
                        closure and nil or "getscriptclosure returned nil"
                    )

                    if closure then
                        -- Keep the real closure only in the weak-key source map.
                        -- Do not serialize tostring(closure): it is merely an opaque
                        -- runtime identifier and is not useful to report readers.
                        moduleClosureSources[closure] = {
                            ModuleIndex = i,
                            Name = reportText(mod.Name),
                            Path = reportText(modulePath),
                        }

                        ------------------------------------------------
                        -- CONSTANTS
                        ------------------------------------------------

                        if GET_CONSTANTS then
                            local constants = safeCall(function()
                                return GET_CONSTANTS(closure)
                            end, nil)

                            markCapabilityProbe(
                                "getconstants",
                                type(constants) == "table",
                                "getconstants returned unsupported data"
                            )

                            if type(constants) == "table" then
                                moduleData.ConstantCount = #constants

                                for _, constant in ipairs(constants) do
                                    if #moduleData.Constants
                                        >= CONFIG.MAX_CONSTANTS_PER_MODULE
                                    then
                                        break
                                    end

                                    if type(constant) == "string" then
                                        addUniqueString(
                                            moduleData.Constants,
                                            seenConstants,
                                            constant,
                                            CONFIG.MAX_CONSTANTS_PER_MODULE
                                        )

                                        local sensitive, severity =
                                            findSensitiveString(constant)

                                        if sensitive
                                            and #moduleData.SensitiveConstants
                                                < CONFIG.MAX_SENSITIVE_CONSTANTS_PER_MODULE
                                        then
                                            moduleData.SensitiveConstants[
                                                #moduleData.SensitiveConstants + 1
                                            ] = {
                                                Value = sanitizeForJSON(constant),
                                                Match = sensitive,
                                                Severity = severity,
                                            }
                                        end
                                    end
                                end
                            end
                        end

                        ------------------------------------------------
                        -- UPVALUES
                        ------------------------------------------------

                        if GET_UPVALUES then
                            local upvalues = safeCall(function()
                                return GET_UPVALUES(closure)
                            end, nil)

                            markCapabilityProbe(
                                "getupvalues",
                                type(upvalues) == "table",
                                "getupvalues returned unsupported data"
                            )

                            if type(upvalues) == "table" then
                                local upvalueCount = 0
        for _ in pairs(upvalues) do
            upvalueCount += 1
        end
        moduleData.UpvalueCount = upvalueCount

                                local used = 0

                                for index, value in pairs(upvalues) do
                                    if used >= CONFIG.MAX_UPVALUES_PER_MODULE then
                                        break
                                    end

                                    used += 1

                                    moduleData.Upvalues[tostring(index)] =
                                        sanitizeForJSON(value)

                                    if CONFIG.DATA_PROFILE == "DETAILED"
                                        and type(value) == "string"
                                        and #moduleData.SensitiveConstants
                                            < CONFIG.MAX_SENSITIVE_CONSTANTS_PER_MODULE
                                    then
                                        local sensitive, severity =
                                            findSensitiveString(value)

                                        if sensitive then
                                            moduleData.SensitiveConstants[
                                                #moduleData.SensitiveConstants + 1
                                            ] = {
                                                Value = sanitizeForJSON(value),
                                                Match = sensitive,
                                                Severity = severity,
                                                Source = "upvalue",
                                                UpvalueIndex = tostring(index),
                                            }
                                        end
                                    end
                                end
                            end
                        end
                    end
                end

                if GET_UPVALUES and GET_SCRIPT_CLOSURE then
                    local graphClosure = safeCall(function() return GET_SCRIPT_CLOSURE(mod) end, nil)
                    local graphUpvalues = graphClosure and safeCall(function() return GET_UPVALUES(graphClosure) end, nil) or nil
                    if type(graphUpvalues) == "table" then
                        for upvalueIndex, value in pairs(graphUpvalues) do
                            if typeof(value) == "Instance" and value:IsA("ModuleScript") then
                                if #report.VM.RequireGraph.Edges >= CONFIG.MAX_MODULES * 2 then break end
                                local toModuleIndex = moduleIndexByInstance[value]
                                local toPath = reportText(getInstancePath(value))
                                local edgeKey = tostring(i) .. "->" .. tostring(toModuleIndex or toPath or getStableInstanceId(value, "Module"))
                                if not requireGraphEdgeIndex[edgeKey] then
                                    requireGraphEdgeIndex[edgeKey] = true
                                    report.VM.RequireGraph.Edges[#report.VM.RequireGraph.Edges + 1] = {
                                        FromModuleIndex = i,
                                        ToModuleIndex = toModuleIndex,
                                        ToName = reportText(value.Name),
                                        ToPath = toPath,
                                        Source = "upvalue_module_instance",
                                        Observed = true,
                                        Confidence = "medium",
                                        UpvalueIndex = tostring(upvalueIndex),
                                        Evidence = { { Source = "upvalue_module_instance", Observed = true, Confidence = "medium", CollectedAt = os.time(), Coverage = "loaded_modules_only" } },
                                    }
                                    report.VM.RequireGraph.EdgeCount += 1
                                end
                            end
                        end
                    end
                end

                local appended = append(
                    report.VM.Modules,
                    moduleData,
                    CONFIG.MAX_MODULES
                )

                if not appended
                    and report.Metadata.Performance.OutputBudgetExceeded
                then
                    local remaining = moduleCount - i
                    if remaining > 0 then
                        recordDrops("Modules", remaining, "report_bytes_budget")
                    end
                    report.VM.Reason = "report_bytes_budget"
                    break
                end
            end
        end

        local remainingActiveMs = (os.clock() - phaseState.PhaseSliceStart) * 1000
        phaseState.ActiveMs += remainingActiveMs
        report.Metadata.Performance.ActiveMs += remainingActiveMs
    end

    --------------------------------------------------------------------
    -- DEEP GC / MEMORY AUDIT
    --------------------------------------------------------------------

    local function getLuaHeapKB()
        if not COLLECT_GARBAGE then
            return nil
        end
        local value = safeCall(function()
            return COLLECT_GARBAGE("count")
        end, nil)
        if type(value) == "number" and value == value and value >= 0 then
            if report and report.Metadata and report.Metadata.Performance then
                local peak = report.Metadata.Performance.LuaHeapKBPeak
                if type(peak) ~= "number" or value > peak then
                    report.Metadata.Performance.LuaHeapKBPeak = value
                end
            end
            return value
        end
        return nil
    end

    local function scanGarbageCollector()
        local gcAudit = report.VM.GCAudit
        if type(table.clear) == "function" then
            table.clear(gcAudit)
        else
            for key in pairs(gcAudit) do gcAudit[key] = nil end
        end
        gcAudit.Mode = CONFIG.GC_MODE
        gcAudit.SampleRate = CONFIG.GC_SAMPLE_RATE
        gcAudit.AtomicMaxMs = CONFIG.GC_ATOMIC_MAX_MS
        gcAudit.TraversalAtomicMaxMs = CONFIG.GC_TRAVERSAL_ATOMIC_MAX_MS
        gcAudit.HeapPressureThresholdKB = getEffectiveGCHeapPressureThresholdKB()
        gcAudit.HeapPressureEnabled = COLLECT_GARBAGE ~= nil
        gcAudit.Supported = false
        gcAudit.Reason = nil
        gcAudit.ObjectsReturned = 0
        gcAudit.ObjectsVisited = 0
        gcAudit.FunctionsVisited = 0
        gcAudit.RecordsStored = 0
        gcAudit.DroppedRecords = 0
        gcAudit.ScanStoppedEarly = false
        gcAudit.StopReason = nil
        gcAudit.AtomicCallMs = 0
        gcAudit.AtomicSpike = false
        gcAudit.SampledObjects = 0
        gcAudit.TraversalMaxItemMs = 0
        gcAudit.TraversalAtomicSpike = false
        gcAudit.HeapKBBeforeTraversal = nil
        gcAudit.HeapKBPeak = nil
        gcAudit.HeapDeltaKB = nil
        gcAudit.HeapPressureDetected = false
        gcAudit.HeapPressureChecks = 0
        gcAudit.SensitiveConstants = {}
        report.VM.GCAudit = gcAudit

        registerTruncationList(
            report.VM.GCAudit.SensitiveConstants,
            "SensitiveGC"
        )

        if not CONFIG.SCAN_VM then
            report.VM.GCAudit.Reason = "SCAN_VM disabled"
            return
        end

        if CONFIG.GC_MODE == "DISABLED" then
            report.VM.GCAudit.Reason = "GC_MODE disabled"
            report.VM.GCAudit.ScanStoppedEarly = true
            report.VM.GCAudit.StopReason = "disabled"
            return
        end

        if not GET_GC or not IS_L_CLOSURE then
            report.VM.GCAudit.Reason = "getgc or islclosure unavailable"
            return
        end

        if auditWallExceeded() then
            report.VM.GCAudit.Reason = "wall_time"
            return
        end

        report.VM.GCAudit.Supported = true

        local gcStart = os.clock()
        local gcData = safeCall(function()
            return GET_GC(true)
        end, nil)

        markCapabilityProbe(
            "getgc",
            type(gcData) == "table",
            "getgc returned unsupported data"
        )
        local gcAtomicMs = (os.clock() - gcStart) * 1000
        report.Metadata.Performance.MaxAtomicOperationMs =
            math.max(report.Metadata.Performance.MaxAtomicOperationMs, gcAtomicMs)

        report.VM.GCAudit.AtomicCallMs = gcAtomicMs
        report.VM.GCAudit.AtomicSpike = gcAtomicMs > CONFIG.GC_ATOMIC_MAX_MS

        if gcAtomicMs > CONFIG.GC_ATOMIC_MAX_MS then
            report.VM.GCAudit.ScanStoppedEarly = true
            report.VM.GCAudit.StopReason = "atomic_spike"
            report.VM.GCAudit.Reason = "getgc call exceeded atomic budget; returned universe was not traversed"
            return
        end

        if type(gcData) ~= "table" then
            report.VM.GCAudit.Reason = "getgc returned unsupported data"
            return
        end

        local seenConstants = {}
        local gcLimit = CONFIG.GC_MODE == "FULL" and #gcData or math.min(CONFIG.MAX_GC_ITEMS, #gcData)
        local reachedSensitiveLimit = false

        report.VM.GCAudit.ObjectsReturned = #gcData
        if auditWallExceeded() then
            report.VM.GCAudit.ScanStoppedEarly = true
            report.VM.GCAudit.StopReason = "wall_time"
            local unvisited = gcLimit
            if unvisited > 0 then
                recordDrops("GCItems", unvisited, "wall_time")
            end
            return
        end
        if gcLimit < #gcData then
            recordDrops("GCItems", #gcData - gcLimit, "object_budget_reached")
        end

        local phaseState = createCooperativePhaseState()
        local heapBaseline = getLuaHeapKB()
        local heapPressureThreshold = getEffectiveGCHeapPressureThresholdKB()
        report.VM.GCAudit.HeapPressureThresholdKB = heapPressureThreshold
        report.VM.GCAudit.HeapKBBeforeTraversal = heapBaseline
        report.VM.GCAudit.HeapKBPeak = heapBaseline

        local sampleRate = CONFIG.GC_MODE == "SAMPLED" and math.max(1, CONFIG.GC_SAMPLE_RATE) or 1
        for index = 1, gcLimit do
            if reachedSensitiveLimit then
                break
            end

            local itemStart = os.clock()
            local traversalAtomicExceeded = false
            if report.Metadata.Performance.OutputBudgetExceeded then
                local remaining = gcLimit - report.VM.GCAudit.ObjectsVisited
                if remaining > 0 then
                    recordDrops("GCItems", remaining, "report_bytes_budget")
                end
                report.VM.GCAudit.ScanStoppedEarly = true
                report.VM.GCAudit.StopReason = "report_bytes_budget"
                break
            end

            local stopped, reason = phaseShouldYield(phaseState)
            if stopped then
                report.VM.GCAudit.ScanStoppedEarly = true
                report.VM.GCAudit.StopReason = reason

                local unvisited = gcLimit - report.VM.GCAudit.ObjectsVisited
                if unvisited > 0 then
                    recordDrops(
                        "GCItems",
                        unvisited,
                        reason == "wall_time" and "wall_time" or "cooperative_yield"
                    )
                end
                break
            end

            if ((index - 1) % sampleRate) ~= 0 then
                local skippedMs = (os.clock() - itemStart) * 1000
                report.VM.GCAudit.TraversalMaxItemMs =
                    math.max(report.VM.GCAudit.TraversalMaxItemMs, skippedMs)
                if skippedMs > CONFIG.GC_TRAVERSAL_ATOMIC_MAX_MS then
                    report.VM.GCAudit.TraversalAtomicSpike = true
                    report.VM.GCAudit.ScanStoppedEarly = true
                    report.VM.GCAudit.StopReason = "traversal_atomic_spike"
                    report.Metadata.Performance.MaxAtomicOperationMs =
                        math.max(report.Metadata.Performance.MaxAtomicOperationMs, skippedMs)
                    break
                end
                continue
            end

            local obj = gcData[index]
            report.VM.GCAudit.ObjectsVisited += 1
            report.VM.GCAudit.SampledObjects += 1

            if type(obj) == "function" then
                local okLuauClosure, isLuauClosure =
                    pcall(IS_L_CLOSURE, obj)

                markCapabilityProbe(
                    "islclosure",
                    okLuauClosure,
                    "islclosure probe failed"
                )

                if not okLuauClosure then
                    isLuauClosure = false
                end

                local isExecutorClosure = false
                if IS_EXECUTOR_CLOSURE then
                    local okExecutorClosure, value =
                        pcall(IS_EXECUTOR_CLOSURE, obj)

                    markCapabilityProbe(
                        "isexecutorclosure",
                        okExecutorClosure,
                        "isexecutorclosure probe failed"
                    )

                    isExecutorClosure =
                        okExecutorClosure and value or false
                end

                if isLuauClosure and not isExecutorClosure then
                    report.VM.GCAudit.FunctionsVisited += 1

                    if GET_CONSTANTS then
                        local constants = safeCall(function()
                            return GET_CONSTANTS(obj)
                        end, {})

                        if type(constants) == "table" then
                            for constantIndex, constant in ipairs(constants) do
                                if (os.clock() - itemStart) * 1000 > CONFIG.GC_TRAVERSAL_ATOMIC_MAX_MS then
                                    traversalAtomicExceeded = true
                                    break
                                end
                                if type(constant) == "string"
                                    and #constant >= CONFIG.MIN_STRING_CONSTANT_LENGTH
                                    and #constant <= CONFIG.MAX_STRING_CONSTANT_LENGTH
                                then
                                    local sensitive, severity = findSensitiveString(constant)

                                    if sensitive then
                                        local shouldRecord = false
                                        if CONFIG.GC_DEDUP_MODE == "CONSTANT_ONLY" then
                                            if not seenConstants[constant] then
                                                seenConstants[constant] = true
                                                shouldRecord = true
                                            end
                                        else
                                            local byConstant = seenConstants[constant]
                                            if not byConstant then
                                                byConstant = setmetatable({}, { __mode = "k" })
                                                seenConstants[constant] = byConstant
                                            end
                                            if not byConstant[obj] then
                                                byConstant[obj] = true
                                                shouldRecord = true
                                            end
                                        end

                                        if shouldRecord then
                                            local moduleSource = moduleClosureSources[obj]

                                            local appended = append(
                                                report.VM.GCAudit.SensitiveConstants,
                                                {
                                                    Value = sanitizeForJSON(constant),
                                                    Match = sensitive,
                                                    Severity = severity,
                                                    ConstantIndex = constantIndex,
                                                    ModuleIndex = moduleSource and moduleSource.ModuleIndex or nil,
                                                    ModuleName = moduleSource and reportText(moduleSource.Name) or nil,
                                                    ModulePath = moduleSource and reportText(moduleSource.Path) or nil,
                                                    Provenance = "gc_constant_heuristic",
                                                    Confidence = "medium",
                                                    Evidence = {
                                                        { Source = "gc_constant", Confidence = "direct" },
                                                        { Source = "sensitivity_heuristic", Confidence = "medium" },
                                                    },
                                                },
                                                CONFIG.MAX_GC_SENSITIVE_CONSTANTS
                                            )

                                            if appended then
                                                report.VM.GCAudit.RecordsStored += 1
                                                report.Metadata.Truncation.SensitiveGC.Stored =
                                                    #report.VM.GCAudit.SensitiveConstants
                                            else
                                                local dropReason =
                                                    report.Metadata.Performance.OutputBudgetExceeded
                                                    and "report_bytes_budget"
                                                    or "finding_limit_reached"

                                                recordDrop("SensitiveGC", dropReason)
                                                report.VM.GCAudit.DroppedRecords += 1
                                                report.VM.GCAudit.ScanStoppedEarly = true
                                                report.VM.GCAudit.StopReason = dropReason
                                                reachedSensitiveLimit = true

                                                local unvisited = gcLimit - report.VM.GCAudit.ObjectsVisited
                                                if unvisited > 0 then
                                                    recordDrops(
                                                        "GCItems",
                                                        unvisited,
                                                        dropReason
                                                    )
                                                end
                                                break
                                            end
                                        end
                                    end

                                    if #report.VM.GCAudit.SensitiveConstants
                                        >= CONFIG.MAX_GC_SENSITIVE_CONSTANTS
                                    then
                                        report.VM.GCAudit.ScanStoppedEarly = true
                                        report.VM.GCAudit.StopReason = "sensitive_limit"
                                        reachedSensitiveLimit = true

                                        local unvisited = gcLimit - report.VM.GCAudit.ObjectsVisited
                                        if unvisited > 0 then
                                            recordDrops(
                                                "GCItems",
                                                unvisited,
                                                "sensitive_limit"
                                            )
                                        end
                                        break
                                    end
                                end
                            end
                        end
                    end
                end
            end

            local itemMs = (os.clock() - itemStart) * 1000
            report.VM.GCAudit.TraversalMaxItemMs =
                math.max(report.VM.GCAudit.TraversalMaxItemMs, itemMs)
            report.Metadata.Performance.MaxAtomicOperationMs =
                math.max(report.Metadata.Performance.MaxAtomicOperationMs, itemMs)

            if traversalAtomicExceeded then
                report.VM.GCAudit.TraversalAtomicSpike = true
                report.VM.GCAudit.ScanStoppedEarly = true
                report.VM.GCAudit.StopReason = "traversal_atomic_spike"
                break
            end

            local shouldCheckHeap =
                report.VM.GCAudit.ObjectsVisited % CONFIG.GC_HEAP_CHECK_INTERVAL == 0
            local heapNow = shouldCheckHeap and getLuaHeapKB() or nil
            if heapNow then
                report.VM.GCAudit.HeapKBPeak = math.max(
                    report.VM.GCAudit.HeapKBPeak or heapNow,
                    heapNow
                )
                report.VM.GCAudit.HeapPressureChecks += 1

                if heapBaseline then
                    local heapDelta = heapNow - heapBaseline
                    report.VM.GCAudit.HeapDeltaKB = heapDelta
                    if heapDelta >= heapPressureThreshold then
                        report.VM.GCAudit.HeapPressureDetected = true
                        report.VM.GCAudit.ScanStoppedEarly = true
                        report.VM.GCAudit.StopReason = "heap_pressure"
                        report.Metadata.Performance.HeapPressureDetected = true
                        report.Metadata.Performance.HeapPressureStopCount += 1
                        break
                    end
                end
            end

            if itemMs > CONFIG.GC_TRAVERSAL_ATOMIC_MAX_MS then
                report.VM.GCAudit.TraversalAtomicSpike = true
                report.VM.GCAudit.ScanStoppedEarly = true
                report.VM.GCAudit.StopReason = "traversal_atomic_spike"
                break
            end
        end

        local finalHeap = getLuaHeapKB()
        if finalHeap then
            report.VM.GCAudit.HeapKBPeak = math.max(report.VM.GCAudit.HeapKBPeak or finalHeap, finalHeap)
            if heapBaseline then
                report.VM.GCAudit.HeapDeltaKB = math.max(0, finalHeap - heapBaseline)
            end
        end
        report.Metadata.Performance.HeapPressureDetected =
            report.Metadata.Performance.HeapPressureDetected
            or report.VM.GCAudit.HeapPressureDetected
        report.VM.GCAudit.StopReason =
            report.VM.GCAudit.StopReason or
            (gcLimit < #gcData and "object_budget"
                or CONFIG.GC_MODE == "SAMPLED" and "sampled_complete"
                or "completed")
        report.Metadata.Truncation.GCItems.Stored =
            report.VM.GCAudit.ObjectsVisited
        local remainingActiveMs = (os.clock() - phaseState.PhaseSliceStart) * 1000
        report.Metadata.Performance.ActiveMs += remainingActiveMs
    end

