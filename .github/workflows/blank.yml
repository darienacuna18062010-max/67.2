            addRoot(
                "TextChatService",
                "TextChatService",
                getOptionalService("TextChatService"),
                false
            )
        end

        if CONFIG.SCAN_ROOTS.CoreGui then
            local CoreGui = safeCall(function()
                return game:GetService("CoreGui")
            end, nil)
            if CoreGui then
                addRoot("CoreGui", "CoreGui", CoreGui, false)
            else
                local root = ensureRootMetadata("CoreGui")
                root.RequestIds[#root.RequestIds + 1] = nextRequestId
                root.Status = "omitted"
                root.CanonicalRoot = nil
                root.Reason = "CoreGui unavailable_or_security_restricted"
            end
        end

        local streamingRescanConnections = {}
        local streamingRescanQueue = {}
        local streamingRescanQueued = setmetatable({}, { __mode = "k" })
        local streamingRescanLifecycleCount = 0

        local function queueStreamingRescan(instance, rootEntry, eventKind)
            if not CONFIG.ENABLE_STREAMING_RESCAN or not instance or not rootEntry then
                return
            end
            if streamingRescanQueued[instance] then
                return
            end
            if #streamingRescanQueue >= CONFIG.MAX_DYNAMIC_RESCAN_ITEMS then
                report.Metadata.StreamingRescan.Dropped += 1
                recordDrop("ReportBytes", "streaming_rescan_queue_full")
                return
            end
            streamingRescanQueued[instance] = true
            recordObservationEvent(
                "streaming_rescan_queued",
                eventKind,
                getStableInstanceId(instance, "Instance"),
                rootEntry.RootId,
                { Pending = #streamingRescanQueue + 1 }
            )
            streamingRescanQueue[#streamingRescanQueue + 1] = {
                Instance = instance,
                RootEntry = rootEntry,
                EventKind = eventKind,
                QueuedAtClock = os.clock(),
            }
            report.Metadata.StreamingRescan.Queued += 1
            report.Metadata.StreamingRescan.Pending = #streamingRescanQueue
        end

        if CONFIG.ENABLE_STREAMING_RESCAN then
            for _, rootEntry in ipairs(roots) do
                local root = rootEntry.Root
                local okAdded, addedConn = pcall(function()
                    return root.DescendantAdded:Connect(function(instance)
                        queueStreamingRescan(instance, rootEntry, "DescendantAdded")
                    end)
                end)
                if okAdded and addedConn then
                    streamingRescanConnections[#streamingRescanConnections + 1] = addedConn
                end
                local okRemoved, removedConn = pcall(function()
                    return root.DescendantRemoving:Connect(function(instance)
                        if not instance then return end
                        if streamingRescanLifecycleCount >= CONFIG.MAX_INSTANCE_LIFECYCLE_ENTRIES then
                            return
                        end
                        streamingRescanLifecycleCount += 1
                        recordObservationEvent(
                            "instance_removed",
                            "streaming_rescan",
                            getStableInstanceId(instance, "Lifecycle"),
                            rootEntry.RootId,
                            { Observed = true }
                        )
                        report.Metadata.InstanceLifecycle[#report.Metadata.InstanceLifecycle + 1] = {
                            InstanceId = getStableInstanceId(instance, "Lifecycle"),
                            Root = rootEntry.Name,
                            Event = "DescendantRemoving",
                            Timestamp = os.clock(),
                        }
                    end)
                end)
                if okRemoved and removedConn then
                    streamingRescanConnections[#streamingRescanConnections + 1] = removedConn
                end
            end
        end

        local function processStreamingRescanQueue()
            if not CONFIG.ENABLE_STREAMING_RESCAN or #streamingRescanQueue == 0 then
                return
            end
            local processed = 0
            local previousRoot = currentScanRoot
            local previousRootEntry = currentScanRootEntry
            while #streamingRescanQueue > 0
                and processed < CONFIG.MAX_DYNAMIC_RESCAN_ITEMS
                and not auditWallExceeded()
            do
                local item = table.remove(streamingRescanQueue, 1)
                streamingRescanQueued[item.Instance] = nil
                processed += 1
                currentScanRoot = item.RootEntry.Name
                currentScanRootEntry = item.RootEntry
                if streamingRescanLifecycleCount < CONFIG.MAX_INSTANCE_LIFECYCLE_ENTRIES then
                    streamingRescanLifecycleCount += 1
                    report.Metadata.InstanceLifecycle[#report.Metadata.InstanceLifecycle + 1] = {
                        InstanceId = getStableInstanceId(item.Instance, "Lifecycle"),
                        Root = item.RootEntry.Name,
                        Event = item.EventKind,
                        Timestamp = item.QueuedAtClock,
                        FirstObservedAt = os.clock(),
                    }
                end
                local ok = pcall(function()
                    inspectInstance(item.Instance)
                end)
                if ok then
                    report.Metadata.StreamingRescan.Processed += 1
                else
                    report.Metadata.StreamingRescan.Dropped += 1
                end
                report.Metadata.StreamingRescan.Pending = #streamingRescanQueue
                task.wait()
            end
            currentScanRoot = previousRoot
            currentScanRootEntry = previousRootEntry
            report.Metadata.StreamingRescan.Pending = #streamingRescanQueue
            if #streamingRescanQueue > 0 then
                report.Metadata.StreamingRescan.Reason = auditWallExceeded() and "wall_time" or "bounded_queue"
            end
        end

        -- Give Roblox one frame to resolve UI layout before sampling.
        task.wait()
        UI_LAYOUT_READY = true
        resetUICaches()
        refreshUIViewportCache()

        if CONFIG.DATA_PROFILE == "DETAILED" then
            attachCharacterReplacementObserver()
        end

        CURRENT_PHASE_ID = "PH-ROOTSCAN"
        safePrint("[Deep Client Auditor] Cooperative root scan...")
        local rootScanPhaseStart = os.clock()
        local rootScanOk, rootScanErr = xpcall(function()
            scanRootsCooperative(roots)
        end, debug.traceback)
        report.Metadata.PhaseDurations.RootScan = os.clock() - rootScanPhaseStart
        if rootScanOk then
            if auditWallExceeded() then
                setPhaseContractStatus("RootScan", "partial_wall_time", "wall_time_during_traversal")
            else
                setPhaseContractStatus("RootScan", "complete")
            end
        else
            setPhaseContractStatus("RootScan", "partial_runtime_error", reportText(rootScanErr))
            report.Metadata.Performance.StopReason = report.Metadata.Performance.StopReason or "root_scan_runtime_error"
        end

        processStreamingRescanQueue()
        local clientCreationConnections = {}
        if not CONFIG.LIGHT_MODE and not auditWallExceeded() then
            attachTrustBoundaryWatchers()
            attachClientIllusionWatchers()
            local creationConn = safeCall(function()
                return ReplicatedStorage.DescendantAdded:Connect(function(instance)
                    if not instance then return end
                    local finding = ensureFindingContract({
                        Kind = "client_created_replicatedstorage_candidate",
                        InstanceId = getStableInstanceId(instance, "CreatedInstance"),
                        Class = safeCall(function() return instance.ClassName end, "Instance"),
                        Name = reportText(safeCall(function() return instance.Name end, "")),
                        Evidence = {{Source="ReplicatedStorage.DescendantAdded",Observed=true,Confidence="low",Limitations={"event_does_not_prove_client_authorship_if_replication_generated_it","server_code_not_observed"}}},
                    }, "client_creation_watch", "low", {"client_event_origin_not_proven","server_validation_required"})
                    append(report.TrustBoundaries, finding, CONFIG.MAX_TRUST_BOUNDARIES)
                end)
            end, nil)
            if creationConn then clientCreationConnections[#clientCreationConnections+1]=creationConn end
        end

        phaseStart = os.clock()
        CURRENT_PHASE_ID = "PH-PLAYERSTATE"
        safePrint("[Deep Client Auditor] Player/environment scan...")
        if CONFIG.LIGHT_MODE then
            report.Metadata.PhaseDurations.PlayerStateScan = 0
        elseif not auditWallExceeded() then
            scanPlayerState()
        else
            markTraversalStop("wall_time")
        end
        report.Metadata.PhaseDurations.PlayerStateScan = os.clock() - phaseStart
        task.wait()

        phaseStart = os.clock()
        CURRENT_PHASE_ID = "PH-VMMODULE"
        safePrint("[Deep Client Auditor] Loaded module scan...")
        if CONFIG.LIGHT_MODE then
            report.Metadata.PhaseDurations.VMModuleScan = 0
        elseif not auditWallExceeded() then
            scanLoadedModules()
        else
            markTraversalStop("wall_time")
        end
        report.Metadata.PhaseDurations.VMModuleScan = os.clock() - phaseStart
        task.wait()

        phaseStart = os.clock()
        safePrint("[Deep Client Auditor] SCRIPT_CONTENT_ANALYSIS...")
        if not auditWallExceeded() then
            analyzeScriptsContent()
            setPhaseContractStatus("ScriptContentAnalysis", report.VM.ScriptAnalysis.Status or "complete")
            if report.VM.ScriptAnalysis.Status == "partial_wall_time" then
                setPhaseContractStatus("StaticRemoteMap", "skipped_prerequisite", "ScriptContentAnalysis_partial_wall_time")
            else
                buildStaticRemoteMap()
                setPhaseContractStatus("StaticRemoteMap", report.Network.StaticRemoteMap.Status or "complete")
            end
        else
            report.VM.ScriptAnalysis.Status = "wall_time"
            report.Network.StaticRemoteMap.Status = "wall_time"
        end
        report.Metadata.PhaseDurations.ScriptContentAnalysis = os.clock() - phaseStart
        if report.VM.ScriptAnalysis.Status == "partial_wall_time" then
            setPhaseContractStatus("ScriptContentAnalysis", "partial_wall_time")
            setPhaseContractStatus("StaticRemoteMap", "skipped_prerequisite", "ScriptContentAnalysis_partial_wall_time")
        else
            setPhaseContractStatus("ScriptContentAnalysis", report.VM.ScriptAnalysis.Status or "complete")
            if report.Network.StaticRemoteMap.Status then
                setPhaseContractStatus("StaticRemoteMap", report.Network.StaticRemoteMap.Status)
            end
        end
        task.wait()

        phaseStart = os.clock()
        safePrint("[Deep Client Auditor] Garbage collector audit...")
        if CONFIG.LIGHT_MODE then
            report.VM.GCAudit.Reason = "LIGHT_MODE"
            report.VM.GCAudit.StopReason = "light_mode"
        elseif not auditWallExceeded() then
            scanGarbageCollector()
        else
            markTraversalStop("wall_time")
        end
        report.Metadata.PhaseDurations.GCAudit = os.clock() - phaseStart
        setPhaseContractStatus("GCAudit", auditWallExceeded() and "partial_wall_time" or (report.VM.GCAudit.StopReason == "light_mode" and "skipped_light_mode" or "complete"))
        clearWeakMap(moduleClosureSources)
        clearWeakMap(moduleIndexByInstance)
        task.wait()

        phaseStart = os.clock()
        safePrint("[Deep Client Auditor] Environment audit...")
        if CONFIG.LIGHT_MODE then
            report.Environment.Pollution.Reason = "LIGHT_MODE"
        elseif not auditWallExceeded() then
            if CONFIG.DATA_PROFILE == "DETAILED" then
                scanEnvironmentPollution()
            else
                report.Environment.Pollution.Reason = "disabled_by_profile"
            end
        else
            markTraversalStop("wall_time")
        end
        report.Metadata.PhaseDurations.EnvironmentAudit = os.clock() - phaseStart
        task.wait()

        phaseStart = os.clock()
        safePrint("[Deep Client Auditor] UI interaction analysis...")
        if not auditWallExceeded() then
            scanUIInteractions()
            classifyGameArchetype()
        else
            report.RiskScorecard.Status = "wall_time"
        end
        report.Metadata.PhaseDurations.UIInteractionAnalysis = os.clock() - phaseStart
        setPhaseContractStatus("UIInteractionAnalysis", auditWallExceeded() and "partial_wall_time" or "complete")
        task.wait()

        phaseStart = os.clock()
        if not auditWallExceeded() then
            scanMetatableHooks()
        else
            report.Network.MetatableHookAnalysis.Status = "wall_time"
        end
        report.Metadata.PhaseDurations.MetatableHookAnalysis = os.clock() - phaseStart
        setPhaseContractStatus("MetatableHookAnalysis", report.Network.MetatableHookAnalysis.Status or "complete")
        task.wait()

        phaseStart = os.clock()
        safePrint("[Deep Client Auditor] PhysicsService scan...")
        if CONFIG.LIGHT_MODE then
            report.Environment.PhysicsCollisionGroups.Reason = "LIGHT_MODE"
        elseif not auditWallExceeded() then
            scanPhysicsService()
        else
            markTraversalStop("wall_time")
        end
        report.Metadata.PhaseDurations.PhysicsServiceScan = os.clock() - phaseStart
        task.wait()

        phaseStart = os.clock()
        if not auditWallExceeded() then
            analyzeRemoteCallbacks()
        else
            report.Network.RemoteCallbackAnalysis.Status = "wall_time"
        end
        report.Metadata.PhaseDurations.RemoteCallbackAnalysis = os.clock() - phaseStart
        setPhaseContractStatus("RemoteCallbackAnalysis", report.Network.RemoteCallbackAnalysis.Status or "complete")

        phaseStart = os.clock()
        if not auditWallExceeded() then
            materializeTrustMutationAggregates()
            if CONFIG.LIGHT_MODE then
                report.Network.CorrelationEngine.Status = "disabled_light_mode"
            elseif not CONFIG.SNIFF_TRAFFIC then
                report.Network.CorrelationEngine.Status = #report.Network.CorrelationEngine.Findings > 0
                    and "partial_ui_only_no_remote_capture" or "waiting_for_remote_observation"
            else
                report.Network.CorrelationEngine.Status = #report.Network.CorrelationEngine.Findings > 0
                    and "complete" or "complete_no_correlations"
            end
            report.Network.CorrelationEngine.FindingCount = #report.Network.CorrelationEngine.Findings
        else
            report.Network.CorrelationEngine.Status = "partial_wall_time"
        end
        report.Metadata.PhaseDurations.CorrelationAnalysis = os.clock() - phaseStart
        setPhaseContractStatus("CorrelationAnalysis", report.Network.CorrelationEngine.Status or "complete")

        if not auditWallExceeded() then
            materializeClientOwnedUnanchoredTrustFindings()
            classifyGameArchetype()
            buildAntiPatternFindings()

        end

        processStreamingRescanQueue()
        for _, connection in ipairs(streamingRescanConnections or {}) do
            pcall(function() connection:Disconnect() end)
        end
        for _, connection in ipairs(clientCreationConnections or {}) do pcall(function() connection:Disconnect() end) end
        disconnectAnalysisWatchers()
        report.Metadata.SnapshotEndedAt = os.time()
        report.Metadata.SnapshotEndedClock = os.clock()

    end, function(err)
        local message = tostring(err)

        if debug and type(debug.traceback) == "function" then
            return debug.traceback(message, 2)
        end

        return message
    end)

    local restored = true
    local cleanupJournal = report.Metadata.CleanupJournal
    cleanupJournal.Entries[#cleanupJournal.Entries + 1] = {
        Action = "restore_sniffer",
        StartedAtClock = os.clock(),
        Status = "started",
    }
    cleanupJournal.OpenEntries += 1

    if CONFIG.SNIFF_TRAFFIC and passiveSnifferRestore then
        restored = restorePassiveSniffer()
    end

    if not restored and passiveSnifferRestore then
        restored = restorePassiveSniffer()
    end

    cleanupJournal.OpenEntries = math.max(0, cleanupJournal.OpenEntries - 1)
    local lastCleanup = cleanupJournal.Entries[#cleanupJournal.Entries]
    lastCleanup.Status = restored and "complete" or "failed"
    lastCleanup.FinishedAtClock = os.clock()
    cleanupJournal.Status = restored and "clean" or "cleanup_conflict"

    buildRemoteContractAnalysis()
    normalizeFindingEvidence()

    local summaryStart = os.clock()
    createSummary()

    do
        local previousReport = CONFIG.DATA_PROFILE == "DETAILED"
            and getGlobalValue(CONFIG.DIFF_PREVIOUS_REPORT_GLOBAL_KEY)
            or nil
        local previousMetadata = type(previousReport) == "table"
            and type(previousReport.Metadata) == "table"
            and previousReport.Metadata
            or nil
        local sessionDeltas = report.Metadata.SessionDeltas or {}
        sessionDeltas.PreviousSessionId = previousMetadata and previousMetadata.SessionId or nil
        sessionDeltas.PreviousReportFormat = previousMetadata and previousMetadata.ReportFormat or nil
        sessionDeltas.PreviousReportAvailable = previousMetadata ~= nil
        sessionDeltas.PreviousSessionScope = sessionDeltas.PreviousSessionScope or "DETAILED_only"
        report.Metadata.SessionDeltas = sessionDeltas
    end

    report.Metadata.DiffSummary = buildDiffSummary()
    finalizeSnapshotCoverage()
    setPhaseContractStatus("FinalizeSnapshotCoverage", "complete")
    report.Metadata.PhaseDurations.Summary = os.clock() - summaryStart

    if auditOk then
        -- Audit completion is independent from cleanup success; CleanupStatus below
        -- carries restoration failures/conflicts without misclassifying the scan itself.
        report.Metadata.Completed = report.Metadata.Performance.StopReason ~= "wall_time"
            and report.Metadata.Traversal.StopReason ~= "wall_time"
    else
        report.Metadata.Completed = false
        report.Metadata.RuntimeErrorRedacted = redactError(auditError)
    end

    report.Metadata.Completeness.TruncatedByBudget = false
    for _, truncation in pairs(report.Metadata.Truncation) do
        if type(truncation) == "table" and (truncation.Dropped or 0) > 0 then
            report.Metadata.Completeness.TruncatedByBudget = true
            break
        end
    end

    report.Metadata.Completeness.AbortedByWallTime =
        auditWallExceeded()
        or report.Metadata.Performance.StopReason == "wall_time"
        or report.Metadata.Traversal.StopReason == "wall_time"

    report.Metadata.Completeness.AbortedByAtomicBudget =
        report.Metadata.Completeness.AbortedByAtomicBudget
        or report.Metadata.Truncation.TraversalInstances.Reason == "instance_atomic_budget"

    report.Metadata.Completeness.MissingDueToStreaming =
        report.Metadata.Streaming.Enabled == true

    report.Metadata.CleanupStatus = snifferState.RestoreFailed
        and "CLEANUP_FAILURE"
        or snifferState.RestoreConflict
            and "CLEANUP_CONFLICT"
            or "CLEANUP_OK"

    local preflightCryptoProvider = CONFIG.OUTPUT_INTEGRITY and resolvePreferredHashProvider() or nil

    report.Metadata.SessionStatus =
        not auditOk and "FAILED"
        or auditWallExceeded() and "ABORTED"
        or snifferState.RestoreFailed and "COMPLETED_WITH_CLEANUP_FAILURE"
        or snifferState.RestoreConflict and "COMPLETED_WITH_CLEANUP_FAILURE"
        or (CONFIG.OUTPUT_INTEGRITY and not preflightCryptoProvider)
            and "COMPLETED_WITH_WEAK_INTEGRITY"
        or "COMPLETED"

    buildRiskScorecard()
    setPhaseContractStatus("BuildRiskScorecard", "complete")


    report.Metadata.AuditCompleteness =
        report.Metadata.SessionStatus == "FAILED" and "ABORTED"
        or report.Metadata.Completeness.AbortedByWallTime and "PARTIAL"
        or report.Metadata.Completeness.AbortedByAtomicBudget and "PARTIAL"
        or EFFECTIVE_REPORT_LEVEL == "METADATA" and "PROFILE_LIMITED"
        or report.Metadata.Completeness.TruncatedByBudget and "PARTIAL"
        or report.Metadata.SessionStatus == "COMPLETED_WITH_CLEANUP_FAILURE" and "COMPLETE_WITH_CLEANUP_FAILURE"
        or report.Metadata.SessionStatus == "COMPLETED_WITH_WEAK_INTEGRITY" and "COMPLETE_WITH_WEAK_INTEGRITY"
        or "COMPLETE"

    for _, remoteData in pairs(report.Network.API_Schema) do
        remoteData.MethodSet = nil
        remoteData.SignatureIndex = nil
    end

    report.Metadata.SnapshotEndedAt = report.Metadata.SnapshotEndedAt or os.time()
    report.Metadata.SnapshotEndedClock = report.Metadata.SnapshotEndedClock or os.clock()
    report.Metadata.CoverageStatus = report.Metadata.Snapshot.CoverageStatus
    if report.Metadata.Streaming and report.Metadata.Streaming.CrossValidation ~= "coherent" then
        report.Metadata.Streaming.Coverage = "client_visible_may_omit_or_unknown"
        report.Metadata.CoverageStatus = report.Metadata.CoverageStatus == "COMPLETE" and "PARTIAL" or report.Metadata.CoverageStatus
    end
    report.Metadata.Performance.AuditWallMs =
        math.max(0, auditWallElapsedSeconds() * 1000)
    report.Metadata.ObservationContract.TemporaryMetatableMutation = snifferState.EverInstalled and snifferState.RestoreStatus ~= "not_installed"
    report.Metadata.ObservationContract.SnifferRefusedExecutorHook = snifferState.RefusedExecutorHook == true
    if auditWallExceeded() and not report.Metadata.Performance.StopReason then
        report.Metadata.Performance.StopReason = "wall_time"
    end

    finalizeMetadataAnalysisContracts()
    setPhaseContractStatus("FinalizeMetadataContracts", "complete")
    if report.Metadata.Output and report.Metadata.Output.EstimatePhase then
        report.Metadata.Output.EstimatePhase = report.Metadata.Output.EstimatePhase
    end
    if report.Metadata.Output and report.Metadata.Output.SizeSelfConsistent == false then
        local known = report.Metadata.KnownLimitations or {}
        local limitation = "Output.SizeSelfConsistent=false: JSON size did not converge within the bounded four-pass stabilization loop"
        local seen = false
        for _, item in ipairs(known) do if item == limitation then seen = true break end end
        if not seen then known[#known + 1] = limitation end
        table.sort(known)
        report.Metadata.KnownLimitations = known
    end
    if report.Network and report.Network.DataFlowGraph then
        local df = report.Network.DataFlowGraph
        if EFFECTIVE_REPORT_LEVEL ~= "METADATA" then
            local partialDataFlow = report.Metadata.Snapshot.CoverageStatus == "PARTIAL"
                or report.Metadata.Traversal.StopReason ~= nil
                or not auditOk
            df.Status = partialDataFlow and "partial" or "complete"
        end
    end
    report.Metadata.DurationSeconds =
        math.floor(auditWallElapsedSeconds() * 1000 + 0.5) / 1000
    report.Metadata.Performance.LuaHeapKBAfter = getLuaHeapKB()
    if type(report.Metadata.Performance.LuaHeapKBAfter) == "number" then
        report.Metadata.Performance.LuaHeapKBPeak = math.max(
            report.Metadata.Performance.LuaHeapKBPeak or report.Metadata.Performance.LuaHeapKBAfter,
            report.Metadata.Performance.LuaHeapKBAfter
        )
        if type(report.Metadata.Performance.LuaHeapKBBefore) == "number" then
            report.Metadata.Performance.AuditHeapDeltaKB = math.max(
                0,
                report.Metadata.Performance.LuaHeapKBAfter
                    - report.Metadata.Performance.LuaHeapKBBefore
            )
        end
    end
    report.Metadata.ScannedInstances = scannedInstanceCount

    if not auditOk then
        warn("[Deep Client Auditor] Auditor finalizado con un error; detalles suprimidos por el perfil de seguridad.")
        notify("Auditor detenido", "La auditoría terminó con un diagnóstico parcial seguro.")
    end

    if auditWallExceeded() then
        report.Metadata.Completed = false
        report.Metadata.Performance.StopReason =
            report.Metadata.Performance.StopReason or "wall_time_before_export"
    end

    --------------------------------------------------------------------
    -- OUTPUT BYTE CONTRACT
    --------------------------------------------------------------------

    local function clearReportCollection(parent, key, truncationKey, reason)
        local list = parent and parent[key]
        if type(list) ~= "table" or #list <= 0 then
            return 0
        end

        local dropped = #list
        clearArrayInPlace(list)
        if truncationKey then
            registerTruncationList(list, truncationKey)
            recordDrops(truncationKey, dropped, reason)
        end
        return dropped
    end

    local function clearReportDict(parent, key, truncationKey, reason)
        local dict = parent and parent[key]
        if type(dict) ~= "table" then
            return 0
        end

        local dropped = countKeys(dict)
        if dropped <= 0 then
            return 0
        end

        for entryKey in pairs(dict) do
            dict[entryKey] = nil
        end
        if truncationKey then
            recordDrops(truncationKey, dropped, reason)
        end
        return dropped
    end

    local function applyMetadataReportProjection()
        if EFFECTIVE_REPORT_LEVEL ~= "METADATA" then
            return
        end

        local summaryCounts, summaryFlags, summaryArrays = {}, {}, {}
        for key, value in pairs(report.Summary or {}) do
            if type(value) == "number" then
                summaryCounts[key] = value
            elseif type(value) == "boolean" then
                summaryFlags[key] = value
            elseif type(value) == "table" then
