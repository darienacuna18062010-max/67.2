    local function getEffectiveGCHeapPressureThresholdKB()
        local threshold = math.max(1, tonumber(CONFIG.GC_HEAP_PRESSURE_MAX_DELTA_KB) or 4096)
        local multiplier = tonumber(CONFIG.MOBILE_HEAP_PRESSURE_MULTIPLIER) or 1
        if runtimePlatform.IsMobile then
            threshold *= math.max(0.1, math.min(2, multiplier))
