    local function buildCompatibilityScorecard()
        local caps = report.Metadata.Capabilities or {}
        local function stateFor(name)
            local c = caps[name]
            if not c or not c.Detected then return "UNAVAILABLE" end
            if c.State == "PASS" or c.State == "probed_ok" then return "PASS" end
            if c.State == "FAILED" or c.State == "probed_failed" then return "FAILED" end
            return "PARTIAL"
        end

        local rows = {}
        local function row(category, capabilityName, stateOverride, capabilityLabel)
            local c = caps[capabilityName]
            rows[#rows + 1] = {
                Category = category,
                Capability = capabilityName,
                CapabilityLabel = capabilityLabel or capabilityName,
                State = stateOverride or stateFor(capabilityName),
                Detected = c and c.Detected or false,
                Functional = c and c.Functional == true or false,
                Risk = c and c.Risk or "UNKNOWN",
                Reason = c and c.Reason or "not reported",
            }
        end

        row("Core Luau", "HttpServiceJSON", "PASS")
        row("Executor identity", "identifyexecutor")
        rows[#rows + 1] = {
            Category = "Runtime telemetry",
            Capability = "collectgarbage",
            State = COLLECT_GARBAGE and (report.Metadata.Performance.HeapPressureDetected and "PARTIAL" or "PASS") or "UNAVAILABLE",
            Detected = COLLECT_GARBAGE ~= nil,
            Functional = COLLECT_GARBAGE ~= nil,
            Risk = "MEDIUM",
            Reason = report.Metadata.Performance.HeapPressureDetected and "heap pressure guard engaged" or "heap pressure guard available",
        }
        rows[#rows + 1] = {
            Category = "Runtime detection",
            Capability = "identifyexecutor / input heuristics",
            State = report.Metadata.RuntimePlatform.IsMobile and "PASS" or "PARTIAL",
            Detected = true,
            Functional = true,
            Risk = "LOW",
            Reason = report.Metadata.RuntimePlatform.IsMobile and "mobile runtime detected" or "desktop/unknown runtime",
        }
        rows[#rows + 1] = {
            Category = "Instance traversal",
            Capability = "Roblox Instances",
            State = report.Metadata.Traversal.GlobalVisited > 0 and (report.Metadata.Traversal.StopReason and "PARTIAL" or "PASS") or "FAILED",
            Detected = true,
            Functional = report.Metadata.Traversal.GlobalVisited > 0,
            Risk = "LOW",
            Reason = report.Metadata.Traversal.StopReason or "traversal completed",
        }
        row("Filesystem", "writefile")
        row("GC inspection", "getgc", CONFIG.GC_MODE == "DISABLED" and "UNAVAILABLE" or report.VM.GCAudit.ScanStoppedEarly and "PARTIAL" or nil)
        row("Function closures", "getscriptclosure")
        row("Constants", "getconstants")
        row("Upvalues", "getupvalues")
        row("Metatables", "getrawmetatable")
        row("Namecall method", "getnamecallmethod")
        row("C-closure classification", "iscclosure")
        if HOOK_METAMETHOD then
            row("Metamethod API presence", "hookmetamethod")
        end
        rows[#rows + 1] = {
            Category = "Dynamic namecall observation",
            Capability = "dynamic_namecall_observation",
            CapabilityKey = "getrawmetatable",
            CapabilityLabel = "Dynamic namecall observation",
            State = not CONFIG.SNIFF_TRAFFIC and "UNAVAILABLE"
                or report.Network.Sniffer.RestoreConflict and "PARTIAL"
                or report.Network.Sniffer.RestoreFailed and "FAILED"
                or report.Network.Sniffer.OwnershipLostDuringCapture and "PARTIAL"
                or report.Network.Sniffer.Status == "stopped" and "PASS"
                or "PARTIAL",
            Detected = caps.getrawmetatable and caps.getrawmetatable.Detected or false,
            Functional = CONFIG.SNIFF_TRAFFIC and report.Network.Sniffer.Status == "stopped",
            Risk = "HIGH",
            Reason = report.Network.Sniffer.StopReason or report.Network.Sniffer.Status or "not enabled",
        }
        rows[#rows + 1] = {
            Category = "Sniffer ownership",
            Capability = "hook ownership",
            State = not CONFIG.SNIFF_TRAFFIC and "UNAVAILABLE" or report.Network.Sniffer.RestoreFailed and "FAILED" or report.Network.Sniffer.OwnershipLostDuringCapture and "PARTIAL" or report.Network.Sniffer.RestoreConflict and "PARTIAL" or "PASS",
            Detected = CONFIG.SNIFF_TRAFFIC,
            Functional = CONFIG.SNIFF_TRAFFIC and not report.Network.Sniffer.RestoreFailed,
            Risk = "HIGH",
            Reason = report.Network.Sniffer.StopReason or report.Network.Sniffer.Status or "not enabled",
        }
        rows[#rows + 1] = { Category = "Script analysis", Capability = "getscriptbytecode", CapabilityLabel = "Script content analysis", State = report.VM.ScriptAnalysis.Status == "complete" and "PASS" or "PARTIAL", Detected = GET_SCRIPT_BYTECODE ~= nil, Functional = #report.VM.ScriptAnalysis > 0, Risk = "HIGH", Reason = report.VM.ScriptAnalysis.Status }
        row("Script analysis", "getloadedmodules", nil, "Loaded module enumeration")
        rows[#rows + 1] = { Category = "Remote callback analysis", Capability = "getconnections", CapabilityLabel = "Remote callback analysis", State = report.Network.RemoteCallbackAnalysis.Status == "complete" and "PASS" or report.Network.RemoteCallbackAnalysis.Status == "requires_non_metadata" and "PARTIAL" or "UNAVAILABLE", Detected = GET_CONNECTIONS ~= nil, Functional = #report.Network.RemoteCallbackAnalysis.Findings > 0 or report.Network.RemoteCallbackAnalysis.Status == "complete_no_observable_callbacks", Risk = "HIGH", Reason = report.Network.RemoteCallbackAnalysis.Status }
        rows[#rows + 1] = { Category = "Temporal correlation", Capability = "CorrelationEngine", CapabilityLabel = "UI ↔ Remote / multi-hop correlation", State = report.Network.CorrelationEngine.Status == "complete" and "PASS" or report.Network.CorrelationEngine.Status == "waiting_for_remote_observation" and "PARTIAL" or report.Network.CorrelationEngine.Status == "disabled_light_mode" and "UNAVAILABLE" or "PARTIAL", Detected = true, Functional = #report.Network.CorrelationEngine.Findings > 0, Risk = "MEDIUM", Reason = report.Network.CorrelationEngine.Status }
        rows[#rows + 1] = { Category = "Fingerprinting", Capability = "SHA-256 known-script DB", CapabilityLabel = "Known script fingerprint database", State = next(knownScriptFingerprintDatabase) and "PASS" or "PARTIAL", Detected = next(knownScriptFingerprintDatabase) ~= nil, Functional = next(knownScriptFingerprintDatabase) ~= nil, Risk = "MEDIUM", Reason = next(knownScriptFingerprintDatabase) and "reference_database_loaded" or "reference_database_empty" }
        row("Clipboard", "setclipboard")
        row("Cryptographic SHA-256", "crypt.hash", report.Metadata.Integrity.IsCryptographic and "PASS" or "PARTIAL")

        return rows
    end

    local function createSummary()
        local priorSummary = type(report.Summary) == "table" and report.Summary or nil
        local preservedCounts = priorSummary and priorSummary.CountsBeforeMetadataProjection or nil
        local preservedFlags = priorSummary and priorSummary.FlagsBeforeMetadataProjection or nil
        local preservedTables = priorSummary and priorSummary.ArraysBeforeMetadataProjection or nil
        local metadataProjectionWasActive = priorSummary and priorSummary.MetadataProjection == true or false
        local remoteFunctions = 0
        local sensitiveRemotes = 0
        local sensitiveRemoteEvents = 0
        local sensitiveRemoteFunctions = 0
        local sensitiveUnreliableRemoteEvents = 0
        local sensitiveByTier = { HIGH = 0, MEDIUM = 0, LOW = 0 }

        for _, remoteData in ipairs(report.Network.Remotes) do
            if remoteData.Class == "RemoteFunction" then
                remoteFunctions += 1
            end

            if remoteData.HeuristicKeyword then
                sensitiveRemotes += 1
                local tier = sensitiveByTier[remoteData.HeuristicSeverity]
                if tier ~= nil then
                    sensitiveByTier[remoteData.HeuristicSeverity] += 1
                end

                if remoteData.Class == "RemoteEvent" then
                    sensitiveRemoteEvents += 1
                elseif remoteData.Class == "RemoteFunction" then
                    sensitiveRemoteFunctions += 1
                elseif remoteData.Class == "UnreliableRemoteEvent" then
                    sensitiveUnreliableRemoteEvents += 1
                end
            end
        end

        local infiniteRangeClickDetectors = 0
        for _, clickDetector in ipairs(report.Instances.ClickDetectors) do
            if clickDetector.InfiniteRange then
                infiniteRangeClickDetectors += 1
            end
        end

        local defenseSignals = report.Environment.ObservedSignalConnections.Signals or {}
        local anyTruncation = report.Metadata.Performance.OutputBudgetExceeded
            or report.Metadata.Traversal.DroppedByPendingBudget > 0
            or report.Metadata.Traversal.DroppedByTraversalBudget > 0
        if not anyTruncation then
            for _, entry in pairs(report.Metadata.Truncation) do
                if entry.Dropped and entry.Dropped > 0 then
                    anyTruncation = true
                    break
                end
            end
        end

        report.Summary = {
            Remotes = preservedCounts and preservedCounts.Remotes or #report.Network.Remotes,
            RemoteFunctions = preservedCounts and preservedCounts.RemoteFunctions or remoteFunctions,
            SensitiveRemotes = preservedCounts and preservedCounts.SensitiveRemotes or sensitiveRemotes,
